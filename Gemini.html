<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Multi-HTML Previewer</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: #1c1c1e;
  --panel2: #2c2c2e;
  --text: #f5f5f7;
  --muted: #98989f;
  --accent: #0a84ff;
  --danger: #ff453a;
  --border: #38383c;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, textarea { font: inherit; }
button {
  border: 0;
  color: var(--text);
  background: var(--panel2);
  border-radius: 10px;
  min-height: 36px;
  padding: 0 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
button.primary { background: var(--accent); }
button.danger { background: var(--danger); color: #fff; }
button:active { transform: scale(.97); opacity: .8; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: #111113;
}
h1 { font-size: 18px; margin: 0; font-weight: 700; }

.main-layout {
  display: flex;
  flex: 1;
  height: calc(100vh - 57px);
  overflow: hidden;
}

/* 一覧（サイドバー） */
.sidebar {
  width: 320px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.sidebar-header {
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.html-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.html-item {
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 6px;
  background: var(--panel2);
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s ease;
}
.html-item:hover { background: #3a3a3c; }
.html-item.active {
  border-color: var(--accent);
  background: #2c2c30;
}
.html-item .title { font-weight: 600; font-size: 14px; margin-bottom: 4px; word-break: break-all; }
.html-item .meta { font-size: 11px; color: var(--muted); }

/* プレビュー・編集メイン領域 */
.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #0a0a0c;
  overflow: hidden;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: #111113;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.name-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 300px;
}
.name-input-wrap input {
  width: 100%;
  height: 36px;
  background: #1c1c1e;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  padding: 0 10px;
  outline: none;
}
.name-input-wrap input:focus { border-color: var(--accent); }

.view-mode-tabs {
  display: flex;
  background: #1c1c1e;
  border-radius: 8px;
  padding: 2px;
}
.view-mode-tabs button {
  min-height: 32px;
  padding: 0 12px;
  font-size: 13px;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
}
.view-mode-tabs button.active {
  background: #3a3a3c;
  color: #fff;
}

.device-selector {
  display: flex;
  gap: 4px;
  background: #1c1c1e;
  border-radius: 8px;
  padding: 2px;
}
.device-selector button {
  min-height: 32px;
  padding: 0 10px;
  font-size: 12px;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
}
.device-selector button.active {
  background: var(--accent);
  color: #fff;
}

.workspace {
  flex: 1;
  position: relative;
  overflow: auto;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px;
}

/* 編集モード */
.editor-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.editor-tools {
  display: flex;
  align-items: center;
  gap: 10px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
}
.search-box input {
  width: 100%;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #111113;
  color: #fff;
  padding: 0 10px;
  outline: none;
}
textarea#source {
  flex: 1;
  width: 100%;
  resize: none;
  background: #111113;
  color: #f5f5f7;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  outline: none;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
}
textarea#source:focus { border-color: var(--accent); }

/* デバイスステージ */
.stage {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 100%;
}

/* iPhone 17 Pro */
.device-iphone17pro {
  position: relative;
  width: 393px;
  height: 852px;
  background: #000;
  border: 7px solid #202023;
  border-radius: 48px;
  overflow: hidden;
  box-shadow: 0 18px 55px rgba(0,0,0,0.8), 0 0 0 1px #444;
  flex-shrink: 0;
}
.device-iphone17pro .island {
  position: absolute; z-index: 5; top: 11px; left: 50%; transform: translateX(-50%);
  width: 126px; height: 37px; background: #000; border-radius: 22px; pointer-events: none;
}
.device-iphone17pro .homebar {
  position: absolute; z-index: 6; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 125px; height: 5px; border-radius: 5px; background: #fff; pointer-events: none; opacity: 0.95;
}

/* iPad 7th Gen (横固定) */
.device-ipad7 {
  position: relative;
  width: 1080px;
  height: 810px;
  background: #000;
  border: 14px solid #202023;
  border-radius: 32px;
  overflow: hidden;
  box-shadow: 0 18px 55px rgba(0,0,0,0.8), 0 0 0 1px #444;
  flex-shrink: 0;
  transform-origin: top center;
}
.device-ipad7 .camera {
  position: absolute; z-index: 5; top: 50%; left: 8px; transform: translateY(-50%);
  width: 8px; height: 8px; background: #111; border-radius: 50%; pointer-events: none;
}
.device-ipad7 .homebutton {
  position: absolute; z-index: 5; top: 50%; right: 8px; transform: translateY(-50%);
  width: 16px; height: 16px; border: 1px solid #333; border-radius: 50%; pointer-events: none;
}

.device-frame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
  color-scheme: dark;
}

/* 全画面表示 Modal */
.fullscreen {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  display: none;
}
.fullscreen.show { display: block; }
.fullscreen iframe { width: 100%; height: 100%; border: 0; }
.fullscreen .exit {
  position: absolute; z-index: 10; top: max(12px, env(safe-area-inset-top)); right: 14px;
  width: 44px; height: 44px; padding: 0; border-radius: 50%;
  background: rgba(60,60,65,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: #fff; font-size: 20px;
}

@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar { width: 100%; height: 200px; }
  .device-ipad7 { transform: scale(0.6); }
}
</style>
</head>
<body>

<header>
  <h1>PWA HTML Previewer</h1>
  <button id="btnFullscreen" class="primary">全画面表示</button>
</header>

<div class="main-layout">
  <!-- 左側：HTML一覧リスト -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span style="font-weight:600; font-size:14px;">HTML一覧</span>
      <button id="btnNew" class="primary">+ 新規作成</button>
    </div>
    <div id="htmlList" class="html-list"></div>
  </aside>

  <!-- 右側：メイン操作・プレビュー領域 -->
  <main class="content-area">
    <div class="toolbar">
      <div class="name-input-wrap">
        <input id="docName" type="text" placeholder="HTMLの名前">
      </div>

      <div class="view-mode-tabs">
        <button id="tabPreview" class="active">プレビュー</button>
        <button id="tabEdit">編集</button>
      </div>

      <div id="deviceSelector" class="device-selector">
        <button id="devIphone" class="active">iPhone 17 Pro</button>
        <button id="devIpad">iPad 7th (横)</button>
      </div>

      <div>
        <button id="btnDuplicate">複製</button>
        <button id="btnDelete" class="danger">削除</button>
      </div>
    </div>

    <div class="workspace">
      <!-- エディタ表示領域 -->
      <div id="editorWrap" class="editor-wrap" style="display:none;">
        <div class="editor-tools">
          <span id="charCount" style="font-size:12px; color:var(--muted);">0文字</span>
          <div class="search-box">
            <input id="search" type="search" placeholder="コード内検索" autocomplete="off">
            <span id="searchResult" style="font-size:11px; color:var(--muted);"></span>
          </div>
          <button id="btnClear">クリア</button>
        </div>
        <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html>..."></textarea>
      </div>

      <!-- プレビュー表示領域（端末枠） -->
      <div id="stageWrap" class="stage">
        <!-- iPhone 17 Pro 枠 -->
        <div id="iphoneFrame" class="device-iphone17pro">
          <div class="island"></div>
          <iframe id="frameIphone" class="device-frame" title="iPhone Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          <div class="homebar"></div>
        </div>

        <!-- iPad 第7世代 (横向き) 枠 -->
        <div id="ipadFrame" class="device-ipad7" style="display:none;">
          <div class="camera"></div>
          <iframe id="frameIpad" class="device-frame" title="iPad Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          <div class="homebutton"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- 全画面モーダル -->
<div id="fullscreen" class="fullscreen">
  <button class="exit" id="btnExitFull">×</button>
  <iframe id="frameFull" title="Full Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<script>
const STORAGE_KEY = "pwa_multi_html_docs_v1";

// 初期データ設定
let docs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
  {
    id: "default_1",
    name: "サンプル HTML",
    content: "<!doctype html>\n<html>\n<head>\n<style>\n body { font-family: sans-serif; background: #121212; color: #fff; display: grid; place-items: center; height: 100vh; margin: 0; }\n h1 { color: #0a84ff; }\n</style>\n</head>\n<body>\n <div>\n  <h1>Hello World!</h1>\n  <p>一覧から切り替えてサクサク確認できます。</p>\n </div>\n</body>\n</html>",
    updatedAt: Date.now()
  }
];

let activeId = docs[0]?.id || null;
let currentMode = "preview"; // "preview" | "edit"
let currentDevice = "iphone"; // "iphone" | "ipad"

const $ = id => document.getElementById(id);

// --- ストレージ操作 ---
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
}

function getActiveDoc() {
  return docs.find(d => d.id === activeId);
}

// --- レンダリング系 ---
function renderList() {
  const listEl = $("htmlList");
  listEl.innerHTML = "";
  docs.forEach(doc => {
    const item = document.createElement("div");
    item.className = `html-item ${doc.id === activeId ? "active" : ""}`;
    const dateStr = new Date(doc.updatedAt).toLocaleDateString() + " " + new Date(doc.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    item.innerHTML = `
      <div class="title">${escapeHtml(doc.name || "名称未設定")}</div>
      <div class="meta">${doc.content.length.toLocaleString()}文字 | ${dateStr}</div>
    `;
    item.onclick = () => selectDoc(doc.id);
    listEl.appendChild(item);
  });
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function updateWorkspace() {
  const doc = getActiveDoc();
  if (!doc) return;

  $("docName").value = doc.name;
  $("source").value = doc.content;
  updateCharCount();

  // プレビューの更新
  const frame = currentDevice === "iphone" ? $("frameIphone") : $("frameIpad");
  frame.srcdoc = doc.content;
}

function updateCharCount() {
  $("charCount").textContent = $("source").value.length.toLocaleString() + "文字";
}

// --- アクション ---
function selectDoc(id) {
  activeId = id;
  renderList();
  updateWorkspace();
}

function createDoc() {
  const newDoc = {
    id: "doc_" + Date.now(),
    name: "新規HTML",
    content: "<!doctype html>\n<html>\n<head>\n</head>\n<body>\n <h2>新しいファイル</h2>\n</body>\n</html>",
    updatedAt: Date.now()
  };
  docs.unshift(newDoc);
  activeId = newDoc.id;
  saveData();
  renderList();
  updateWorkspace();
}

function duplicateDoc() {
  const doc = getActiveDoc();
  if (!doc) return;
  const dup = {
    id: "doc_" + Date.now(),
    name: doc.name + " (コピー)",
    content: doc.content,
    updatedAt: Date.now()
  };
  docs.unshift(dup);
  activeId = dup.id;
  saveData();
  renderList();
  updateWorkspace();
}

function deleteDoc() {
  if (docs.length <= 1) {
    alert("最低1つのHTMLが必要です。");
    return;
  }
  if (!confirm("本当に削除しますか？")) return;
  docs = docs.filter(d => d.id !== activeId);
  activeId = docs[0].id;
  saveData();
  renderList();
  updateWorkspace();
}

// --- イベントバインド ---
$("btnNew").onclick = createDoc;
$("btnDuplicate").onclick = duplicateDoc;
$("btnDelete").onclick = deleteDoc;

$("docName").oninput = (e) => {
  const doc = getActiveDoc();
  if (doc) {
    doc.name = e.target.value;
    doc.updatedAt = Date.now();
    saveData();
    renderList();
  }
};

$("source").oninput = (e) => {
  const doc = getActiveDoc();
  if (doc) {
    doc.content = e.target.value;
    doc.updatedAt = Date.now();
    saveData();
    updateCharCount();
  }
};

// タブ切替（プレビュー / 編集）
$("tabPreview").onclick = () => {
  currentMode = "preview";
  $("tabPreview").classList.add("active");
  $("tabEdit").classList.remove("active");
  $("editorWrap").style.display = "none";
  $("stageWrap").style.display = "flex";
  $("deviceSelector").style.display = "flex";
  updateWorkspace();
};

$("tabEdit").onclick = () => {
  currentMode = "edit";
  $("tabEdit").classList.add("active");
  $("tabPreview").classList.remove("active");
  $("editorWrap").style.display = "flex";
  $("stageWrap").style.display = "none";
  $("deviceSelector").style.display = "none";
};

// デバイス切替
$("devIphone").onclick = () => {
  currentDevice = "iphone";
  $("devIphone").classList.add("active");
  $("devIpad").classList.remove("active");
  $("iphoneFrame").style.display = "block";
  $("ipadFrame").style.display = "none";
  updateWorkspace();
};

$("devIpad").onclick = () => {
  currentDevice = "ipad";
  $("devIpad").classList.add("active");
  $("devIphone").classList.remove("active");
  $("ipadFrame").style.display = "block";
  $("iphoneFrame").style.display = "none";
  updateWorkspace();
};

// 全画面表示
$("btnFullscreen").onclick = () => {
  const doc = getActiveDoc();
  if (doc) {
    $("frameFull").srcdoc = doc.content;
    $("fullscreen").classList.add("show");
  }
};
$("btnExitFull").onclick = () => {
  $("fullscreen").classList.remove("show");
  $("frameFull").srcdoc = "";
};

// クリア・検索機能
$("btnClear").onclick = () => {
  $("source").value = "";
  const doc = getActiveDoc();
  if (doc) {
    doc.content = "";
    saveData();
  }
  updateCharCount();
};

$("search").addEventListener("input", () => {
  const q = $("search").value;
  if (!q) { $("searchResult").textContent = ""; return; }
  let n = 0, pos = 0;
  const src = $("source").value;
  while ((pos = src.indexOf(q, pos)) !== -1) { n++; pos += Math.max(q.length, 1); }
  $("searchResult").textContent = n + "件";
});

// 初期表示実行
renderList();
updateWorkspace();
</script>
</body>
</html>
