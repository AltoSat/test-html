<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Previewer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 12px)}
button,textarea,input{font:inherit}
button{border:0;color:var(--text);background:var(--panel2);border-radius:12px;min-height:38px;padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #38383c}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}
.app{max-width:1100px;margin:auto}

/* Horizontal Scroll Cards */
.card-slider{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:4px 2px 12px;
  margin-bottom:12px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.card-slider::-webkit-scrollbar{height:4px}
.card-slider::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px}

.card{
  flex:0 0 140px;
  height:76px;
  background:var(--panel);
  border-radius:14px;
  padding:10px 12px;
  border:2px solid transparent;
  cursor:pointer;
  transition:border-color .15s, background .15s, transform .1s;
  scroll-snap-align:start;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  user-select:none;
  -webkit-user-select:none;
}
.card:active{transform:scale(.96);background:var(--panel2)}
.card.active{border-color:var(--accent);background:#0a84ff18}
.card-title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.card-meta{font-size:10px;color:var(--muted);white-space:nowrap}

.card-new{
  flex:0 0 100px;
  height:76px;
  background:transparent;
  border:2px dashed var(--panel3);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  color:var(--accent);
  font-weight:600;
  font-size:12px;
  cursor:pointer;
  scroll-snap-align:start;
}
.card-new:active{background:#0a84ff10;transform:scale(.96)}
.card-new .plus{font-size:18px;line-height:1}

/* Toolbar Controls */
.preview-actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-bottom:12px}

/* Device Previews Layout */
.devices{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;padding:4px 0 12px}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.device-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}

/* iPhone 17 Pro Frame */
/* 402x874 (Physical Aspect Ratio approx 1:2.17) */
.phone{
  position:relative;
  width:min(360px, 46vw);
  aspect-ratio:402/874;
  background:#000;
  border:7px solid #28282b;
  border-radius:48px;
  overflow:hidden;
  box-shadow:0 16px 48px rgba(0,0,0,0.8), 0 0 0 1px #444;
}
.phone iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#000;
  color-scheme:dark;
}
/* Dynamic Island (Pro-scaled proportion) */
.island{
  position:absolute;
  z-index:5;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:28%;
  height:3.2%;
  min-height:22px;
  max-height:28px;
  background:#000;
  border-radius:20px;
  pointer-events:none;
  box-shadow:0 0 0 0.5px rgba(255,255,255,.08);
}
/* Home Bar */
.homebar{
  position:absolute;
  z-index:6;
  bottom:7px;
  left:50%;
  transform:translateX(-50%);
  width:34%;
  height:4px;
  border-radius:4px;
  background:#fff;
  pointer-events:none;
  opacity:.85;
}

/* iPad Gen 7 Frame (10.2 inch / 1080x810 resolution scaled) */
.ipad{
  position:relative;
  width:min(440px, 92vw);
  aspect-ratio:1080/810;
  background:#000;
  border:10px solid #2a2a2e;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 16px 48px rgba(0,0,0,0.8), 0 0 0 1px #444;
}
.ipad iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#000;
  color-scheme:dark;
}

/* Panels switch */
.list-panel{display:none}
.list-panel.show{display:block}
.editor-panel{display:none}
.editor-panel.show{display:block}

/* Editor Style */
.editor-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.editor-tools .name-input{
  flex:1;
  min-width:140px;
  height:38px;
  border:1px solid #38383c;
  border-radius:10px;
  background:#111113;
  color:#fff;
  padding:0 12px;
  outline:none;
  font-size:14px;
}
.editor-tools .name-input:focus{border-color:var(--accent)}
#count{font-size:12px;color:var(--muted);white-space:nowrap}

.search-box{display:flex;align-items:center;gap:4px;flex:1.5;min-width:220px}
.search-box input{
  flex:1;
  height:38px;
  border:1px solid #38383c;
  border-radius:10px;
  background:#111113;
  color:#fff;
  padding:0 10px;
  outline:none;
  font-size:13px;
}
.search-box button{
  min-height:38px;
  padding:0 10px;
  font-size:12px;
  border-radius:10px;
}
#searchResult{font-size:11px;color:var(--muted);white-space:nowrap;min-width:40px}

textarea{
  width:100%;
  height:min(55vh, 480px);
  resize:vertical;
  background:#111113;
  color:#f5f5f7;
  border:1px solid #38383c;
  border-radius:12px;
  padding:12px;
  outline:none;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.5;
}
textarea:focus{border-color:var(--accent)}
.status{font-size:11px;color:var(--muted);padding:0 2px 6px}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.editor-actions button{flex:1;min-width:90px}

/* Fullscreen View */
.fullscreen{position:fixed;inset:0;z-index:100;background:#000;padding:0;display:none}
.fullscreen.show{display:block}
.fullscreen iframe{width:100%;height:100%;border:0}
.fullscreen .exit{
  position:absolute;
  z-index:10;
  top:max(12px,env(safe-area-inset-top));
  right:14px;
  width:40px;
  height:40px;
  padding:0;
  border-radius:50%;
  background:rgba(60,60,65,.65);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;
  font-size:20px;
}

@media(min-width:800px){
  .phone{width:min(380px, 36vw)}
  .ipad{width:min(540px, 52vw)}
  textarea{height:min(60vh, 560px)}
}
</style>
</head>
<body>
<div class="app">

  <!-- MAIN LIST & PREVIEW -->
  <section id="listPanel" class="list-panel show">
    <!-- Horizontal Scroll Cards -->
    <div id="cardSlider" class="card-slider"></div>

    <div class="preview-actions">
      <button id="btnFullscreen" class="primary">全画面</button>
    </div>

    <!-- Devices Viewport -->
    <div class="devices">
      <div class="device-wrap">
        <div class="device-label">iPhone 17 Pro</div>
        <div class="phone" id="phone">
          <div class="island"></div>
          <iframe id="framePhone" title="iPhone preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          <div class="homebar"></div>
        </div>
      </div>
      <div class="device-wrap">
        <div class="device-label">iPad 第7世代（横）</div>
        <div class="ipad" id="ipad">
          <iframe id="frameIpad" title="iPad preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- EDITOR PANEL -->
  <section id="editorPanel" class="editor-panel">
    <div class="editor-tools">
      <input id="nameInput" class="name-input" type="text" placeholder="名前を入力" maxlength="80" autocomplete="off">
      <span id="count">0文字</span>
      <div class="search-box">
        <input id="search" type="search" placeholder="検索" autocomplete="off">
        <button id="btnSearchPrev" class="ghost">▲</button>
        <button id="btnSearchNext" class="ghost">▼</button>
        <span id="searchResult"></span>
      </div>
    </div>
    <div class="status">長押しで編集が開きました。変更後「保存」で反映されます。</div>
    <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
    <div class="editor-actions">
      <button id="btnSave" class="primary">保存</button>
      <button id="btnClear" class="ghost">クリア</button>
      <button id="btnCancel" class="ghost">キャンセル</button>
      <button id="btnDelete" class="danger">削除</button>
    </div>
  </section>
</div>

<!-- FULLSCREEN OVERLAY -->
<div id="fullscreen" class="fullscreen">
  <button class="exit" id="exit">×</button>
  <iframe id="fullFrame" title="Full screen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "pwa-previewer-items-v3";

  let items = [];
  let selectedId = null;
  let editingId = null; // null = new

  // Search state
  let searchMatches = [];
  let currentMatchIndex = -1;

  const source = $("source");
  const nameInput = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad = $("frameIpad");
  const fullFrame = $("fullFrame");

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        // Fallback for demo or initial state
        items = [{
          id: uid(),
          name: "サンプル HTML",
          html: `<!DOCTYPE html>\n<html>\n<head>\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<style>\n  body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; }\n  .card { background: #1e1e1e; padding: 16px; border-radius: 12px; border: 1px solid #333; margin-top: 15px; }\n  button { background: #0a84ff; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: bold; width: 100%; }\n</style>\n</head>\n<body>\n  <h2>Hello World</h2>\n  <p>PWA Previewerへようこそ！</p>\n  <div class="card">\n    <h3>カードコンポーネント</h3>\n    <p>iPhone17 Pro / iPad 第7世代の見た目を正確に再現します。</p>\n    <button>アクション</button>\n  </div>\n</body>\n</html>`,
          updated: Date.now()
        }];
        persist();
      }
    } catch (e) {
      items = [];
    }
    if (items.length && !selectedId) selectedId = items[0].id;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const h = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `${m}/${day} ${h}:${min}`;
  }

  function renderList() {
    const slider = $("cardSlider");
    let html = items
      .slice()
      .sort((a, b) => b.updated - a.updated)
      .map(it => `
        <div class="card ${it.id === selectedId ? "active" : ""}" data-id="${it.id}">
          <div class="card-title">${escapeHtml(it.name || "無題")}</div>
          <div class="card-meta">${formatDate(it.updated)}<br>${(it.html || "").length.toLocaleString()}字</div>
        </div>
      `).join("");

    // Append "New" card at the end
    html += `
      <div class="card-new" id="cardNew">
        <span class="plus">＋</span>
        <span>新規作成</span>
      </div>
    `;

    slider.innerHTML = html;

    // Attach click & long-press events
    slider.querySelectorAll(".card").forEach(el => {
      let pressTimer = null;

      const startPress = () => {
        pressTimer = setTimeout(() => {
          // Long press triggered -> open editor
          selectedId = el.dataset.id;
          showEditor(false);
        }, 500);
      };

      const cancelPress = () => {
        if (pressTimer) clearTimeout(pressTimer);
      };

      el.addEventListener("touchstart", startPress, {passive: true});
      el.addEventListener("touchend", cancelPress);
      el.addEventListener("touchmove", cancelPress);
      el.addEventListener("mousedown", startPress);
      el.addEventListener("mouseup", cancelPress);
      el.addEventListener("mouseleave", cancelPress);

      el.onclick = (e) => {
        if (selectedId !== el.dataset.id) {
          selectedId = el.dataset.id;
          renderList();
          updatePreview();
        }
      };
    });

    const btnNew = $("cardNew");
    if (btnNew) {
      btnNew.onclick = () => showEditor(true);
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function clearPreviews() {
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  /* HTML injection wrapper to enforce high-DPI viewport rendering matching real devices */
  function buildDeviceHtml(userHtml, deviceType) {
    if (!userHtml) return "";

    let viewportMeta = `<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">`;
    if (deviceType === 'iphone') {
      // iPhone 17 Pro Logical Viewport (402 x 874)
      viewportMeta = `<meta name="viewport" content="width=402, initial-scale=1.0, user-scalable=no">`;
    } else if (deviceType === 'ipad') {
      // iPad Gen 7 Logical Viewport Landscape (1080 x 810)
      viewportMeta = `<meta name="viewport" content="width=1080, initial-scale=1.0, user-scalable=no">`;
    }

    if (userHtml.includes('<head>')) {
      return userHtml.replace('<head>', `<head>${viewportMeta}`);
    } else {
      return `${viewportMeta}${userHtml}`;
    }
  }

  function updatePreview() {
    const it = items.find(x => x.id === selectedId);
    if (!it) {
      clearPreviews();
      return;
    }
    const rawHtml = it.html || "";
    framePhone.srcdoc = buildDeviceHtml(rawHtml, 'iphone');
    frameIpad.srcdoc = buildDeviceHtml(rawHtml, 'ipad');
  }

  function showList() {
    $("listPanel").classList.add("show");
    $("editorPanel").classList.remove("show");
    renderList();
    updatePreview();
  }

  function showEditor(isNew) {
    $("listPanel").classList.remove("show");
    $("editorPanel").classList.add("show");

    if (isNew) {
      editingId = null;
      nameInput.value = "";
      source.value = "";
      $("btnDelete").style.display = "none";
    } else {
      const it = items.find(x => x.id === selectedId);
      if (!it) {
        editingId = null;
        nameInput.value = "";
        source.value = "";
        $("btnDelete").style.display = "none";
      } else {
        editingId = it.id;
        nameInput.value = it.name || "";
        source.value = it.html || "";
        $("btnDelete").style.display = "inline-flex";
      }
    }
    updateCount();
    clearSearch();
    nameInput.focus();
  }

  function updateCount() {
    $("count").textContent = source.value.length.toLocaleString() + "文字";
  }

  function saveCurrent() {
    const name = (nameInput.value || "").trim() || "無題";
    const html = source.value;
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) {
        it.name = name;
        it.html = html;
        it.updated = Date.now();
      }
      selectedId = editingId;
    } else {
      const id = uid();
      items.push({ id, name, html, updated: Date.now() });
      selectedId = id;
    }
    persist();
    showList();
  }

  function deleteCurrent() {
    if (!editingId) return;
    const it = items.find(x => x.id === editingId);
    if (!it) return;
    if (!confirm(`「${it.name || "無題"}」を削除しますか？`)) return;
    items = items.filter(x => x.id !== editingId);
    selectedId = items.length ? items[0].id : null;
    persist();
    showList();
  }

  // --- Search & Highlight Logic ---
  function clearSearch() {
    $("search").value = "";
    $("searchResult").textContent = "";
    searchMatches = [];
    currentMatchIndex = -1;
  }

  function executeSearch() {
    const q = $("search").value;
    searchMatches = [];
    currentMatchIndex = -1;

    if (!q) {
      $("searchResult").textContent = "";
      return;
    }

    const val = source.value;
    let pos = 0;
    while ((pos = val.indexOf(q, pos)) !== -1) {
      searchMatches.push(pos);
      pos += Math.max(q.length, 1);
    }

    if (searchMatches.length > 0) {
      currentMatchIndex = 0;
      highlightMatch();
    } else {
      $("searchResult").textContent = "0件";
    }
  }

  function highlightMatch() {
    if (currentMatchIndex < 0 || currentMatchIndex >= searchMatches.length) return;
    const q = $("search").value;
    const startPos = searchMatches[currentMatchIndex];
    const endPos = startPos + q.length;

    source.focus();
    source.setSelectionRange(startPos, endPos);

    // Scroll textarea to selection
    const lineHeight = 19.5; // estimated line height
    const lines = source.value.substr(0, startPos).split("\n").length;
    source.scrollTop = (lines - 3) * lineHeight;

    $("searchResult").textContent = `${currentMatchIndex + 1}/${searchMatches.length}`;
  }

  function nextMatch() {
    if (searchMatches.length === 0) {
      executeSearch();
      return;
    }
    currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
    highlightMatch();
  }

  function prevMatch() {
    if (searchMatches.length === 0) {
      executeSearch();
      return;
    }
    currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
    highlightMatch();
  }

  // Event Listeners
  $("btnSave").onclick = saveCurrent;
  $("btnCancel").onclick = showList;
  $("btnClear").onclick = () => {
    source.value = "";
    updateCount();
    clearSearch();
    source.focus();
  };
  $("btnDelete").onclick = deleteCurrent;

  $("btnFullscreen").onclick = () => {
    const it = items.find(x => x.id === selectedId);
    if (!it) return;
    fullFrame.srcdoc = it.html || "";
    $("fullscreen").classList.add("show");
  };

  $("exit").onclick = () => {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
  };

  source.addEventListener("input", updateCount);

  $("search").addEventListener("input", executeSearch);
  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      nextMatch();
    }
  });
  $("btnSearchNext").onclick = nextMatch;
  $("btnSearchPrev").onclick = prevMatch;

  // Initialize
  load();
  showList();
})();
</script>
</body>
</html>
