<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>物品管理 - カット用A5</title>
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22物品管理%22,%22short_name%22:%22物品管理%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#2563eb%22}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            width: 100%;
            background: transparent;
            border: none;
        }

        .card-grid.mode-3col {
            grid-template-columns: repeat(3, 1fr);
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #d1d5db;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            page-break-inside: avoid;
            break-inside: avoid;
            margin: 0;
            overflow: hidden;
            min-width: 0;
        }

        .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            padding: 0;
            font-weight: bold;
        }

        .photo-area {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px dashed #94a3b8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            margin: 0;
            flex-shrink: 0;
        }

        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }

        .photo-placeholder {
            font-size: 20px;
            color: #94a3b8;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
        }

        .item-title {
            font-size: 15px;
            font-weight: bold;
            color: #0f172a;
            border: none;
            border-bottom: 2px solid #2563eb;
            background: transparent;
            padding: 2px 0;
            width: 100%;
            font-family: inherit;
            outline: none;
            text-align: left;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .item-memo {
            width: 100%;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            padding: 2px 0;
            font-size: 12px;
            color: #0f172a;
            font-family: inherit;
            resize: none;
            height: 22px;
            outline: none;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .bottom-info {
            display: flex;
            align-items: stretch;
            gap: 6px;
            flex: 1;
        }

        .left-fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            width: 100%;
        }

        .field-row {
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid #cbd5e1;
            height: 26px;
            width: 100%;
        }

        .field-row-split {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .field-row-split .field-row {
            flex: 1;
            min-width: 0;
        }

        .field-row input {
            border: none;
            background: transparent;
            padding: 0 2px;
            font-size: 13px;
            font-weight: bold;
            color: #0f172a;
            font-family: inherit;
            outline: none;
            width: 100%;
            min-width: 0;
            text-align: left;
            height: 100%;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .field-row input[type="date"] {
            font-size: 11px;
            padding: 0;
            text-align: left;
            -webkit-appearance: none;
            background: transparent;
        }

        .price-input {
            color: #b91c1c !important;
            font-weight: bold !important;
            font-size: 13px !important;
        }

        .url-input-inline {
            font-size: 11px !important;
            font-family: monospace !important;
            color: #2563eb !important;
            font-weight: normal !important;
        }

        .qr-area {
            display: none; /* 編集画面では非表示 */
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 50px;
        }

        .qr-code-container {
            display: flex;
            justify-content: center;
            width: 100%;
            line-height: 0;
        }

        .qr-code-container img {
            width: 45px !important;
            height: 45px !important;
            max-width: 100%;
        }

        .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .action-sub-btn {
            flex: 1;
            padding: 5px 0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #f8fafc;
            color: #334155;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .no-print {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 8px;
            padding: 0 16px; /* 画面の左右の余白を増加 */
            box-sizing: border-box;
        }

        .btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-secondary { background-color: #10b981; }

        /* モーダル */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content textarea {
            width: 100%;
            height: 140px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            line-height: 1.4;
            resize: none;
            outline: none;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btns button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        @media print {
            @page {
                size: A5 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: #fff;
                display: block;
                width: 148mm;
                height: 210mm;
                overflow: hidden;
            }

            .app-container {
                max-width: 100%;
                width: 100%;
                gap: 0;
                padding: 0;
            }

            .no-print,
            .remove-btn,
            .card-actions {
                display: none !important;
            }

            .card-grid {
                gap: 0;
                border: none;
                width: 100%;
                height: 210mm;
                align-content: start;
            }

            .item-card {
                border: 1px solid #d1d5db;
                padding: 6px 5px;
                gap: 4px;
            }

            .item-title {
                font-size: 13px;
                border-bottom-width: 1.5px;
                padding-bottom: 1px;
            }

            .photo-area {
                border: 1px solid #999;
                border-radius: 6px;
            }

            .photo-area img {
                border-radius: 6px;
            }

            .photo-placeholder { font-size: 12px; }

            .item-memo {
                font-size: 10px;
                height: 18px;
                border-bottom: 1px solid #cbd5e1;
            }

            .bottom-info {
                gap: 4px;
            }

            .field-row {
                height: 20px;
            }

            .field-row input {
                font-size: 11px;
            }

            .field-row input[type="date"] {
                font-size: 9px;
            }

            .qr-area {
                display: flex !important;
                width: 45px;
            }

            .qr-code-container img {
                width: 40px !important;
                height: 40px !important;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="card-grid" id="cardGrid"></div>
        <div class="no-print">
            <button class="btn btn-secondary" onclick="addProduct()">＋ 商品を追加</button>
            <button class="btn" onclick="window.print()">印刷 / PDF保存</button>
        </div>
    </div>

    <div class="modal-overlay" id="importModal">
        <div class="modal-content">
            <h3 style="margin:0; font-size:15px;">メモからデータを読み込む</h3>
            <p style="margin:0; font-size:11px; color:#64748b; line-height:1.3;">
                以下の順序で改行区切りで貼り付けてください：<br>
                1行目: 商品名 / 2行目: 備考 / 3行目: 価格<br>
                4行目: 店舗 / 5行目: 日付 / 6行目: URL
            </p>
            <textarea id="importText" placeholder="例:&#10;商品名&#10;備考テキスト&#10;1,000円&#10;店舗名&#10;2026.8.31&#10;https://..."></textarea>
            <div class="modal-btns">
                <button onclick="closeImportModal()" style="background:#e2e8f0; color:#475569;">キャンセル</button>
                <button onclick="applyImportText()" style="background:#2563eb; color:#fff;">反映する</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let products = [];
            let activeImportProdId = null;
            const MAX_PRODUCTS = 6;
            const STORAGE_KEY = 'item_management_data_v7';

            function generateId() {
                return 'p' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
                } catch (e) {
                    console.warn('保存失敗', e);
                }
            }

            function loadFromStorage() {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) {
                            products = parsed.filter(p => p && p.id);
                        }
                    } catch (e) {
                        products = [];
                    }
                }
            }

            function createEmptyProduct() {
                return {
                    id: generateId(),
                    title: '',
                    memo: '',
                    price: '',
                    store: '',
                    date: '',
                    url: '',
                    photo: null
                };
            }

            function init() {
                loadFromStorage();
                if (products.length === 0) {
                    products = [createEmptyProduct()];
                    saveToStorage();
                }
                renderAllCards();
                updateGridMode();
            }

            function renderAllCards() {
                const grid = document.getElementById('cardGrid');
                grid.innerHTML = '';
                products.forEach(prod => {
                    grid.appendChild(createCardElement(prod));
                });
            }

            function createCardElement(prod) {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.dataset.productId = prod.id;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.title = '削除';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeProduct(prod.id);
                });

                const photoArea = document.createElement('div');
                photoArea.className = 'photo-area';
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.style.display = 'none';
                fileInput.addEventListener('change', (e) => handlePhotoUpload(e, prod, photoArea));

                const placeholder = document.createElement('span');
                placeholder.className = 'photo-placeholder';
                placeholder.textContent = '📷';
                const img = document.createElement('img');
                img.style.display = 'none';
                if (prod.photo) {
                    img.src = prod.photo;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }

                photoArea.appendChild(placeholder);
                photoArea.appendChild(img);
                photoArea.appendChild(fileInput);
                photoArea.addEventListener('click', () => fileInput.click());

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.className = 'item-title';
                titleInput.value = prod.title || '';
                titleInput.placeholder = '商品名';
                titleInput.addEventListener('input', () => {
                    prod.title = titleInput.value;
                    saveToStorage();
                });

                const memoTextarea = document.createElement('textarea');
                memoTextarea.className = 'item-memo';
                memoTextarea.rows = 1;
                memoTextarea.value = prod.memo || '';
                memoTextarea.placeholder = '備考';
                memoTextarea.addEventListener('input', () => {
                    prod.memo = memoTextarea.value;
                    saveToStorage();
                });

                const bottomInfo = document.createElement('div');
                bottomInfo.className = 'bottom-info';

                const leftFields = document.createElement('div');
                leftFields.className = 'left-fields';

                // 1段目: 価格 ＋ 店舗
                const priceStoreRow = document.createElement('div');
                priceStoreRow.className = 'field-row-split';

                const priceRow = document.createElement('div');
                priceRow.className = 'field-row';
                const priceInput = document.createElement('input');
                priceInput.type = 'text';
                priceInput.className = 'price-input';
                priceInput.value = prod.price || '';
                priceInput.placeholder = '価格';
                priceInput.addEventListener('focus', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                });
                priceInput.addEventListener('blur', (e) => {
                    let val = e.target.value.replace(/[^0-9]/g, '');
                    if (val) {
                        e.target.value = Number(val).toLocaleString('ja-JP') + '円';
                        prod.price = e.target.value;
                    } else {
                        e.target.value = '';
                        prod.price = '';
                    }
                    saveToStorage();
                });
                priceInput.addEventListener('input', (e) => {
                    prod.price = e.target.value;
                });
                priceRow.appendChild(priceInput);

                const storeRow = document.createElement('div');
                storeRow.className = 'field-row';
                const storeInput = document.createElement('input');
                storeInput.type = 'text';
                storeInput.value = prod.store || '';
                storeInput.placeholder = '店舗名';
                storeInput.addEventListener('input', () => {
                    prod.store = storeInput.value;
                    saveToStorage();
                });
                storeRow.appendChild(storeInput);

                priceStoreRow.appendChild(priceRow);
                priceStoreRow.appendChild(storeRow);

                // 2段目: 日付 ＋ URL
                const dateUrlRow = document.createElement('div');
                dateUrlRow.className = 'field-row-split';

                const dateRow = document.createElement('div');
                dateRow.className = 'field-row';
                const dateInput = document.createElement('input');
                dateInput.type = 'date';
                dateInput.value = prod.date || '';
                dateInput.addEventListener('input', () => {
                    prod.date = dateInput.value;
                    saveToStorage();
                });
                dateRow.appendChild(dateInput);

                const urlRow = document.createElement('div');
                urlRow.className = 'field-row';
                const urlInput = document.createElement('input');
                urlInput.type = 'url';
                urlInput.className = 'url-input-inline';
                urlInput.value = prod.url || '';
                urlInput.placeholder = 'https://...';
                urlInput.addEventListener('input', () => {
                    prod.url = urlInput.value;
                    saveToStorage();
                    generateQRCode(qrContainer, prod.url);
                });
                urlRow.appendChild(urlInput);

                dateUrlRow.appendChild(dateRow);
                dateUrlRow.appendChild(urlRow);

                leftFields.appendChild(priceStoreRow);
                leftFields.appendChild(dateUrlRow);

                const qrArea = document.createElement('div');
                qrArea.className = 'qr-area';
                const qrContainer = document.createElement('div');
                qrContainer.className = 'qr-code-container';
                qrArea.appendChild(qrContainer);

                bottomInfo.appendChild(leftFields);
                bottomInfo.appendChild(qrArea);

                // アクションボタン
                const actions = document.createElement('div');
                actions.className = 'card-actions';
                
                const exportBtn = document.createElement('button');
                exportBtn.className = 'action-sub-btn';
                exportBtn.textContent = '保存';
                exportBtn.addEventListener('click', () => exportToAppleNotes(prod));

                const importBtn = document.createElement('button');
                importBtn.className = 'action-sub-btn';
                importBtn.textContent = '読込';
                importBtn.addEventListener('click', () => openImportModal(prod.id));

                actions.appendChild(exportBtn);
                actions.appendChild(importBtn);

                card.appendChild(removeBtn);
                card.appendChild(photoArea);
                card.appendChild(titleInput);
                card.appendChild(memoTextarea);
                card.appendChild(bottomInfo);
                card.appendChild(actions);

                generateQRCode(qrContainer, prod.url);
                return card;
            }

            function generateQRCode(container, url) {
                container.innerHTML = '';
                if (url) {
                    try {
                        new QRCode(container, {
                            text: url,
                            width: 45,
                            height: 45,
                            colorDark: '#0f172a',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } catch (e) {
                        console.warn('QR生成エラー', e);
                    }
                }
            }

            function handlePhotoUpload(event, prod, photoArea) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSize = 500;
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > maxSize) {
                            height = Math.round((height * maxSize) / width);
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = Math.round((width * maxSize) / height);
                            height = maxSize;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        prod.photo = compressedDataUrl;
                        saveToStorage();

                        const imgElement = photoArea.querySelector('img');
                        const placeholderEl = photoArea.querySelector('.photo-placeholder');
                        if (imgElement && placeholderEl) {
                            imgElement.src = compressedDataUrl;
                            imgElement.style.display = 'block';
                            placeholderEl.style.display = 'none';
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // メモアプリへの書き出し（文字のみ）
            // 順序: 商品名 -> 備考 -> 価格 -> 店舗 -> 日付 -> URL
            async function exportToAppleNotes(prod) {
                const textData = `${prod.title || ''}\n${prod.memo || ''}\n${prod.price || ''}\n${prod.store || ''}\n${prod.date || ''}\n${prod.url || ''}`;

                if (navigator.share) {
                    try {
                        await navigator.share({ title: prod.title || '商品データ', text: textData });
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            alert('共有に失敗しました: ' + err.message);
                        }
                    }
                } else {
                    await navigator.clipboard.writeText(textData);
                    alert('テキストをクリップボードにコピーしました。');
                }
            }

            // モーダル操作
            window.openImportModal = function(prodId) {
                activeImportProdId = prodId;
                document.getElementById('importText').value = '';
                document.getElementById('importModal').classList.add('active');
            };

            window.closeImportModal = function() {
                document.getElementById('importModal').classList.remove('active');
                activeImportProdId = null;
            };

            // 日付文字列の正規化 (2026.8.31, 2026/8/31 -> 2026-08-31)
            function normalizeDate(dateStr) {
                if (!dateStr) return '';
                let cleaned = dateStr.replace(/[\.\/]/g, '-').trim();
                let parts = cleaned.split('-');
                if (parts.length === 3) {
                    let year = parts[0];
                    let month = parts[1].padStart(2, '0');
                    let day = parts[2].padStart(2, '0');
                    if (year.length === 4) {
                        return `${year}-${month}-${day}`;
                    }
                }
                return dateStr;
            }

            // 1行目:商品名、2行目:備考、3行目:価格、4行目:店舗、5行目:日付、6行目:URL として順次読み込み
            window.applyImportText = function() {
                const text = document.getElementById('importText').value;
                if (!text || !activeImportProdId) return;

                const prod = products.find(p => p.id === activeImportProdId);
                if (prod) {
                    const lines = text.split('\n').map(l => l.trim());
                    if (lines.length > 0 && lines[0]) prod.title = lines[0];
                    if (lines.length > 1 && lines[1]) prod.memo = lines[1];
                    if (lines.length > 2 && lines[2]) prod.price = lines[2];
                    if (lines.length > 3 && lines[3]) prod.store = lines[3];
                    if (lines.length > 4 && lines[4]) prod.date = normalizeDate(lines[4]);
                    if (lines.length > 5 && lines[5]) prod.url = lines[5];

                    saveToStorage();
                    renderAllCards();
                }
                closeImportModal();
            };

            function addProduct() {
                if (products.length >= MAX_PRODUCTS) {
                    alert('最大' + MAX_PRODUCTS + '商品まで登録できます。');
                    return;
                }
                products.push(createEmptyProduct());
                saveToStorage();
                renderAllCards();
                updateGridMode();
            }

            function removeProduct(id) {
                if (products.length <= 1) {
                    alert('最低1商品は必要です。');
                    return;
                }
                products = products.filter(p => p.id !== id);
                saveToStorage();
                renderAllCards();
                updateGridMode();
            }

            function updateGridMode() {
                const grid = document.getElementById('cardGrid');
                if (products.length > 4) {
                    grid.classList.add('mode-3col');
                } else {
                    grid.classList.remove('mode-3col');
                }
            }

            window.addEventListener('DOMContentLoaded', init);
            window.addEventListener('beforeprint', updateGridMode);

            window.addProduct = addProduct;
            window.removeProduct = removeProduct;
        })();
    </script>
</body>
</html>
