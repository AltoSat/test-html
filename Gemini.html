<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Previewer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
  --mark:#ffd60a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button,textarea,input{font:inherit}
button{
  border:0;color:var(--text);background:var(--panel2);border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #38383c}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}
.app{max-width:1100px;margin:auto}

/* card row (horizontal scroll) */
.card-row{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
  padding:0 4px 14px;margin:0 -4px 6px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.card-row::-webkit-scrollbar{height:0}
.card{
  scroll-snap-align:start;
  flex:0 0 auto;width:132px;height:96px;
  background:var(--panel);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;justify-content:space-between;
  border:2px solid transparent;cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:border-color .15s,background .15s;
  position:relative;
}
.card:active{background:var(--panel2)}
.card.active{border-color:var(--accent);background:#0a84ff18}
.card-name{font-weight:600;font-size:14px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:10.5px;color:var(--muted)}
.card-new{
  align-items:center;justify-content:center;color:var(--muted);
  border:2px dashed #3a3a3c;background:transparent;
}
.card-new .plus{font-size:26px;font-weight:300;color:var(--muted);line-height:1}
.card-new .label{font-size:12px;margin-top:4px}
.card-empty-hint{font-size:12.5px;color:var(--muted);padding:2px 4px 10px}

/* card toast (slide up from below tapped card) */
.card-toast{
  position:absolute;
  z-index:50;
  background:var(--panel2);
  color:var(--text);
  padding:8px 14px;
  border-radius:12px;
  font-size:12.5px;
  border:1px solid #38383c;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  pointer-events:none;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .22s, transform .22s;
  white-space:nowrap;
}
.card-toast.show{
  opacity:1;
  transform:translateY(0);
}

/* device previews */
.devices{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start;padding:4px 0 24px}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}

/* iPhone 17 Pro: 402x874 CSS pt @3x (real device point size) */
.phone{
  position:relative;
  width:min(300px,86vw);
  aspect-ratio:402/874;
  background:#000;border:6px solid #202023;border-radius:52px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.phone-viewport{position:absolute;inset:0;overflow:hidden;border-radius:46px}
.phone-viewport iframe{
  position:absolute;top:50%;left:50%;
  width:402px;height:874px;border:0;background:#000;color-scheme:dark;
  transform-origin:center center;
  margin-left:-201px;margin-top:-437px;
}
.island{
  position:absolute;z-index:5;top:11px;left:50%;transform:translateX(-50%);
  width:33.5%;
  height:calc(9.5% * 0.75);
  max-height:calc(34px * 0.75);
  background:#000;border-radius:100px;pointer-events:none;
}
.homebar{
  position:absolute;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);
  width:36%;height:4px;border-radius:4px;background:#fff;pointer-events:none;opacity:.9;
}

/* iPad 7th gen: 810x1080 CSS pt landscape */
.ipad{
  position:relative;
  width:min(460px,92vw);
  aspect-ratio:1080/810;
  background:#000;border:10px solid #2a2a2e;border-radius:22px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.ipad-viewport{position:absolute;inset:0;overflow:hidden}
.ipad-viewport iframe{
  position:absolute;top:50%;left:50%;
  width:1080px;height:810px;border:0;background:#000;color-scheme:dark;
  transform-origin:center center;
  margin-left:-540px;margin-top:-405px;
}

/* fullscreen action icon - gray instead of primary */
.fs-icon-btn{
  position:absolute;
  left:calc(100% + 8px);
  top:50%;
  transform:translateY(-50%);
  width:40px;height:40px;border-radius:12px;padding:0;
  background:var(--panel2);border:1px solid #38383c;color:var(--text);
}
.fs-icon-btn:active{transform:translateY(-50%) scale(.97);opacity:.85}

/* editor (opened via long-press) */
.editor-overlay{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;
  overscroll-behavior:none;
}
.editor-overlay.show{display:flex}
.editor-sheet{
  width:100%;max-width:900px;max-height:92vh;overflow:auto;
  background:var(--bg);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px #000;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  /* prevent text selection in editor UI */
  -webkit-user-select:none;user-select:none;
}
.sheet-handle{width:36px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 12px}

/* title row with delete button */
.editor-title-row{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.editor-title-row .name-input{
  flex:1;min-width:120px;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 12px;outline:none;
  /* allow text selection inside input */
  -webkit-user-select:text;user-select:text;
}
.editor-title-row .name-input:focus{border-color:var(--accent)}
.editor-title-row .btn-delete{
  min-height:40px;padding:0 14px;font-size:13px;
}

/* textarea - word wrap instead of horizontal scroll */
textarea{
  width:100%;height:min(42vh,360px);resize:vertical;
  background:#111113;color:#f5f5f7;border:1px solid #38383c;border-radius:14px;
  padding:14px;outline:none;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;
  white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;overflow:auto;
  /* allow text selection inside textarea */
  -webkit-user-select:text;user-select:text;
}
textarea:focus{border-color:var(--accent)}

/* editor actions - single row */
.editor-actions{display:flex;gap:8px;flex-wrap:nowrap;margin-top:10px}
.editor-actions button{flex:1;min-width:0;white-space:nowrap;}

/* search section at bottom */
.search-section{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #38383c;
}
.search-box{
  position:relative;
  display:flex;align-items:center;gap:6px;
}
.search-box input{
  flex:1;width:100%;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 180px 0 11px;outline:none;
  /* allow text selection inside input */
  -webkit-user-select:text;user-select:text;
}
.search-box input:focus{border-color:var(--accent)}
.search-box .search-count{
  position:absolute;
  right:100px;
  top:50%;
  transform:translateY(-50%);
  font-size:12px;
  color:var(--muted);
  pointer-events:none;
  white-space:nowrap;
}
.search-box .search-nav{
  display:flex;gap:4px;width:88px;
}
.search-box button{
  min-height:36px;
  min-width:40px;
  padding:0 8px;
  font-size:16px;
}

/* fullscreen */
.fullscreen{position:fixed;inset:0;z-index:100;background:#000;padding:0;display:none;overscroll-behavior:none;}
.fullscreen.show{display:block}
.fullscreen-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;}
.fullscreen iframe{border:0;background:#000;color-scheme:dark}
.fs-controls{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));left:0;right:0;
  display:flex;justify-content:center;gap:8px;
}
.fs-controls button{
  min-height:36px;padding:0 14px;font-size:13px;border-radius:18px;
  background:rgba(60,60,65,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;
}
.fs-controls button.on{background:rgba(10,132,255,.85)}
.fullscreen .exit{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));right:14px;
  width:40px;height:40px;padding:0;border-radius:50%;
  background:rgba(0,0,0,.40);color:#fff;font-size:19px;
}

@media(min-width:800px){
  .phone{width:min(330px,32vw)}
  .ipad{width:min(520px,46vw)}
}
</style>
</head>
<body>
<div class="app">

  <div id="cardRow" class="card-row"></div>
  <div id="emptyHint" class="card-empty-hint" style="display:none">まだHTMLがありません。右端の「＋」から追加してください。長押しで編集・削除できます。</div>

  <div class="devices">
    <div class="device-wrap">
      <div class="phone" id="phone">
        <div class="island"></div>
        <div class="phone-viewport">
          <iframe id="framePhone" title="iPhone preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
        </div>
        <div class="homebar"></div>
      </div>
      <button id="btnFullscreen" class="fs-icon-btn" aria-label="全画面プレビュー">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>
    <div class="device-wrap">
      <div class="ipad" id="ipad">
        <div class="ipad-viewport">
          <iframe id="frameIpad" title="iPad preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- EDITOR SHEET (opened by long-press on a card) -->
<div id="editorOverlay" class="editor-overlay">
  <div class="editor-sheet">
    <div class="sheet-handle"></div>

    <div class="editor-title-row">
      <input id="nameInput" class="name-input" type="text" placeholder="名前を入力" maxlength="80" autocomplete="off">
      <button id="btnDelete" class="btn-delete danger">削除</button>
    </div>

    <div class="editor-textwrap">
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
    </div>

    <div class="editor-actions">
      <button id="btnCancel" class="ghost">キャンセル</button>
      <button id="btnClear" class="ghost">クリア</button>
      <button id="btnCopy" class="ghost">コピー</button>
      <button id="btnSave" class="primary">保存</button>
    </div>

    <div class="search-section">
      <div class="search-box">
        <input id="search" type="search" placeholder="検索" autocomplete="off">
        <span id="searchResult" class="search-count"></span>
        <div class="search-nav">
          <button id="btnSearchPrev" class="ghost">▲</button>
          <button id="btnSearchNext" class="ghost">▼</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- FULLSCREEN PREVIEW -->
<div id="fullscreen" class="fullscreen">
  <button class="exit" id="exit">×</button>
  <div class="fullscreen-stage" id="fsStage">
    <iframe id="fullFrame" title="Full screen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "pwa-previewer-items-v2";
  const OLD_KEY = "iphone17pro-pwa-preview-html-v1";

  const PHONE_W = 402, PHONE_H = 874;
  const IPAD_W = 1080, IPAD_H = 810;

  let items = [];
  let selectedId = null;
  let editingId = null;

  const source = $("source");
  const nameInput = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad = $("frameIpad");
  const fullFrame = $("fullFrame");

  const WEEKDAYS = ["日","月","火","水","木","金","土"];

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        const old = localStorage.getItem(OLD_KEY);
        if (old) {
          items = [{ id: uid(), name: "移行したHTML", html: old, updated: Date.now() }];
          persist();
        }
      }
    } catch (e) {
      items = [];
    }
    if (items.length && !selectedId) selectedId = items[0].id;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function formatDate(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const w = WEEKDAYS[d.getDay()];
    const h = String(d.getHours()).padStart(2,"0");
    const min = String(d.getMinutes()).padStart(2,"0");
    return `${m}/${day}（${w}）${h}:${min}`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fitIframe(iframe, wrapEl, deviceW, deviceH) {
    const rect = wrapEl.getBoundingClientRect();
    const scale = Math.max(rect.width / deviceW, rect.height / deviceH);
    iframe.style.transform = `scale(${scale})`;
  }

  function resizeAllPreviews() {
    fitIframe(framePhone, document.querySelector(".phone-viewport"), PHONE_W, PHONE_H);
    fitIframe(frameIpad, document.querySelector(".ipad-viewport"), IPAD_W, IPAD_H);
  }

  function resizeFullscreen() {
    if (!$("fullscreen").classList.contains("show")) return;
    const stage = $("fsStage");
    const dW = PHONE_W;
    const dH = PHONE_H;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    const scale = Math.min(availW / dW, availH / dH);
    fullFrame.style.width = dW + "px";
    fullFrame.style.height = dH + "px";
    fullFrame.style.transform = `scale(${scale})`;
    fullFrame.style.transformOrigin = "center center";
  }

  window.addEventListener("resize", () => { resizeAllPreviews(); resizeFullscreen(); });

  function renderCards() {
    const row = $("cardRow");
    const sorted = items.slice().sort((a, b) => b.updated - a.updated);
    $("emptyHint").style.display = items.length ? "none" : "block";

    const cardsHtml = sorted.map(it => `
      <div class="card ${it.id === selectedId ? "active" : ""}" data-id="${it.id}">
        <div class="card-name">${escapeHtml(it.name || "無題")}</div>
        <div class="card-meta">${formatDate(it.updated)}</div>
        <div class="card-meta">${(it.html || "").length.toLocaleString()}字</div>
      </div>
    `).join("");

    const newCard = `<div class="card card-new" id="cardNew"><div class="plus">＋</div><div class="label">新規</div></div>`;

    row.innerHTML = cardsHtml + newCard;

    row.querySelectorAll(".card[data-id]").forEach(el => {
      let pressTimer = null;
      let longPressed = false;

      const startPress = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          openEditor(el.dataset.id, false);
        }, 480);
      };
      const cancelPress = () => { clearTimeout(pressTimer); };

      el.addEventListener("pointerdown", startPress);
      el.addEventListener("pointerup", cancelPress);
      el.addEventListener("pointerleave", cancelPress);
      el.addEventListener("pointercancel", cancelPress);
      el.addEventListener("click", () => {
        if (longPressed) return;
        selectedId = el.dataset.id;
        renderCards();
        updatePreview();
        showCardToast(el, "長押しで編集");
      });
      el.addEventListener("contextmenu", e => e.preventDefault());
    });

    $("cardNew").onclick = () => openEditor(null, true);
  }

  function showCardToast(cardEl, msg) {
    const existing = document.querySelector(".card-toast");
    if (existing) existing.remove();

    const toast = document.createElement("div");
    toast.className = "card-toast";
    toast.textContent = msg;
    document.body.appendChild(toast);

    const rect = cardEl.getBoundingClientRect();
    let left = rect.left + rect.width/2 - toast.offsetWidth/2;
    let top = rect.bottom + 8;
    left = Math.max(8, Math.min(left, window.innerWidth - toast.offsetWidth - 8));
    top = Math.max(8, Math.min(top, window.innerHeight - toast.offsetHeight - 8));
    toast.style.left = left + "px";
    toast.style.top = top + "px";

    requestAnimationFrame(() => toast.classList.add("show"));
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 250);
    }, 1400);
  }

  function clearPreviews() {
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  function updatePreview() {
    const it = items.find(x => x.id === selectedId);
    if (!it) { clearPreviews(); return; }
    const html = it.html || "";
    framePhone.srcdoc = html;
    frameIpad.srcdoc = html;
    requestAnimationFrame(resizeAllPreviews);
  }

  let searchMatches = [];
  let searchIndex = -1;

  function openEditor(id, isNew) {
    editingId = isNew ? null : id;
    if (isNew) {
      nameInput.value = "";
      source.value = "";
    } else {
      const it = items.find(x => x.id === id);
      nameInput.value = it ? (it.name || "") : "";
      source.value = it ? (it.html || "") : "";
    }
    $("btnDelete").style.display = isNew ? "none" : "flex";
    $("search").value = "";
    $("searchResult").textContent = "";
    clearSearchHighlight();
    $("editorOverlay").classList.add("show");
    document.body.style.overflow = "hidden";
    setTimeout(() => nameInput.focus(), 50);
  }

  function closeEditor() {
    $("editorOverlay").classList.remove("show");
    document.body.style.overflow = "";
  }

  function saveCurrent() {
    const name = (nameInput.value || "").trim() || "無題";
    const html = source.value;
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) { it.name = name; it.html = html; it.updated = Date.now(); }
      selectedId = editingId;
    } else {
      const id = uid();
      items.push({ id, name, html, updated: Date.now() });
      selectedId = id;
    }
    persist();
    closeEditor();
    renderCards();
    updatePreview();
  }

  function deleteCurrent() {
    if (!editingId) return;
    const it = items.find(x => x.id === editingId);
    if (!it) return;
    if (!confirm(`「${it.name || "無題"}」を削除しますか？`)) return;
    items = items.filter(x => x.id !== editingId);
    if (selectedId === editingId) selectedId = items.length ? items[0].id : null;
    persist();
    closeEditor();
    renderCards();
    updatePreview();
  }

  function clearSearchHighlight() {
    searchMatches = [];
    searchIndex = -1;
  }

  function runSearch(direction) {
    const q = $("search").value;
    if (!q) {
      $("searchResult").textContent = "";
      clearSearchHighlight();
      return;
    }
    const text = source.value;
    const matches = [];
    let pos = 0;
    while (true) {
      const idx = text.indexOf(q, pos);
      if (idx === -1) break;
      matches.push(idx);
      pos = idx + Math.max(q.length, 1);
    }
    searchMatches = matches;

    if (!matches.length) {
      $("searchResult").textContent = "0件";
      searchIndex = -1;
      return;
    }

    if (direction === "next") {
      if (searchIndex === -1) searchIndex = 0;
      else searchIndex = (searchIndex + 1) % matches.length;
    } else if (direction === "prev") {
      if (searchIndex === -1) searchIndex = matches.length - 1;
      else searchIndex = (searchIndex - 1 + matches.length) % matches.length;
    } else {
      searchIndex = 0;
    }

    const start = matches[searchIndex];
    const end = start + q.length;
    source.focus({ preventScroll: true });
    source.setSelectionRange(start, end);
    scrollTextareaToSelection(start);
    $("searchResult").textContent = `${searchIndex + 1}/${matches.length}件`;
  }

  function scrollTextareaToSelection(charIndex) {
    const style = getComputedStyle(source);
    const mirror = document.createElement("div");
    mirror.style.position = "absolute";
    mirror.style.visibility = "hidden";
    mirror.style.height = "auto";
    mirror.style.width = source.clientWidth + "px";
    mirror.style.font = style.font;
    mirror.style.lineHeight = style.lineHeight;
    mirror.style.padding = style.padding;
    mirror.style.border = style.border;
    mirror.style.boxSizing = style.boxSizing;
    mirror.style.whiteSpace = "pre-wrap";
    mirror.style.wordBreak = "break-all";
    mirror.style.overflowWrap = "anywhere";

    const textBefore = source.value.slice(0, charIndex);
    mirror.textContent = textBefore;

    const span = document.createElement("span");
    span.textContent = "|";
    mirror.appendChild(span);

    document.body.appendChild(mirror);
    const targetTop = span.offsetTop;
    document.body.removeChild(mirror);

    const paddingTop = parseFloat(style.paddingTop) || 0;
    const paddingBottom = parseFloat(style.paddingBottom) || 0;
    const visibleHeight = source.clientHeight - paddingTop - paddingBottom;
    
    source.scrollTop = Math.max(0, targetTop - visibleHeight / 2);
  }

  $("search").addEventListener("input", () => { searchIndex = -1; runSearch("none"); });
  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); runSearch("next"); }
  });
  $("btnSearchNext").onclick = () => runSearch("next");
  $("btnSearchPrev").onclick = () => runSearch("prev");

  function openFullscreen() {
    const it = items.find(x => x.id === selectedId);
    if (!it) { alert("表示する項目を一覧から選んでください"); return; }
    fullFrame.srcdoc = it.html || "";
    $("fullscreen").classList.add("show");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(resizeFullscreen);
  }

  $("btnFullscreen").onclick = openFullscreen;
  $("exit").onclick = () => {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
    document.body.style.overflow = "";
  };

  $("btnSave").onclick = saveCurrent;
  $("btnCancel").onclick = closeEditor;
  $("btnDelete").onclick = deleteCurrent;
  $("btnClear").onclick = () => {
    source.value = "";
    $("search").value = "";
    $("searchResult").textContent = "";
    clearSearchHighlight();
    source.focus();
  };
  $("btnCopy").onclick = async () => {
    try {
      await navigator.clipboard.writeText(source.value);
      const btn = $("btnCopy");
      const old = btn.textContent;
      btn.textContent = "コピー済";
      setTimeout(() => btn.textContent = old, 1200);
    } catch (e) {
      alert("コピーに失敗しました");
    }
  };

  $("editorOverlay").addEventListener("click", (e) => {
    if (e.target === $("editorOverlay")) closeEditor();
  });

  load();
  renderCards();
  updatePreview();
  requestAnimationFrame(resizeAllPreviews);
})();
</script>
</body>
</html>
