<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>iPhone 17 Pro PWA プレビューア</title>
<style>
  :root {
    --bg: #000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --border: #38383a;
    --text: #f5f5f7;
    --text2: #8e8e93;
    --accent: #0a84ff;
    --accent-pressed: #0071e3;
    --danger: #ff453a;
    --radius: 12px;
    --phone-w: 402px;
    --phone-h: 874px;
    --safe-top: 62px;
    --safe-bottom: 34px;
    --island-w: 126px;
    --island-h: 37px;
    --corner: 55px;
    --bezel: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.4;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    min-height: 100vh;
  }

  /* ── Header ── */
  .app-header {
    flex-shrink: 0;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    background: rgba(28,28,30,0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 100;
  }
  .app-header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .header-actions { display: flex; gap: 8px; }

  /* ── Buttons ── */
  .btn {
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s, transform 0.1s;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text);
    background: var(--surface2);
  }
  .btn:active { transform: scale(0.97); opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-pressed); }
  .btn-ghost { background: transparent; color: var(--accent); padding: 10px 12px; }
  .btn-danger { background: transparent; color: var(--danger); }
  .btn-sm { padding: 8px 12px; font-size: 14px; min-height: 36px; border-radius: 8px; }

  /* ── Main layout ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── Editor panel ── */
  .editor-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  .editor-panel.hidden { display: none; }

  .label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: -0.01em;
  }

  .html-input {
    flex: 1;
    min-height: 200px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 14px;
    resize: vertical;
    outline: none;
    -webkit-overflow-scrolling: touch;
  }
  .html-input:focus { border-color: var(--accent); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .hint {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.45;
  }

  /* ── Preview panel ── */
  .preview-panel {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: #0a0a0a;
  }
  .preview-panel.active { display: flex; }

  .preview-toolbar {
    flex-shrink: 0;
    width: 100%;
    max-width: 430px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }

  /* ── Phone frame ── */
  .phone-scale {
    transform-origin: top center;
    /* scale is set by JS if needed */
  }

  .phone {
    width: calc(var(--phone-w) + var(--bezel) * 2);
    height: calc(var(--phone-h) + var(--bezel) * 2);
    background: #1a1a1a;
    border-radius: calc(var(--corner) + 4px);
    padding: var(--bezel);
    box-shadow:
      0 0 0 1px #333,
      0 25px 50px -12px rgba(0,0,0,0.7),
      inset 0 0 0 1px rgba(255,255,255,0.06);
    position: relative;
    flex-shrink: 0;
  }

  .phone-screen {
    width: var(--phone-w);
    height: var(--phone-h);
    border-radius: var(--corner);
    overflow: hidden;
    position: relative;
    background: #000;
    isolation: isolate;
  }

  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: var(--island-w);
    height: var(--island-h);
    background: #000;
    border-radius: 20px;
    z-index: 30;
    pointer-events: none;
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.08);
  }

  /* Home indicator */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    z-index: 30;
    pointer-events: none;
  }

  /* iframe: full screen content area (PWA style) */
  .pwa-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
    border-radius: var(--corner);
    /* allow touch */
    touch-action: manipulation;
  }

  /* ── Fullscreen mode ── */
  body.fullscreen .app-header,
  body.fullscreen .preview-toolbar {
    display: none !important;
  }
  body.fullscreen .preview-panel {
    padding: 0;
    background: #000;
  }
  body.fullscreen .phone {
    box-shadow: none;
    border-radius: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    max-width: none;
  }
  body.fullscreen .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 0;
  }
  body.fullscreen .dynamic-island,
  body.fullscreen .home-indicator {
    display: none;
  }
  body.fullscreen .phone-scale {
    transform: none !important;
    width: 100%;
    height: 100%;
  }

  .fs-exit {
    display: none;
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: 16px;
    z-index: 200;
    background: rgba(44,44,46,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  body.fullscreen .fs-exit { display: inline-flex; }

  /* ── Empty state ── */
  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text2);
    font-size: 14px;
    pointer-events: none;
    z-index: 5;
    background: #000;
    border-radius: var(--corner);
  }
  .empty-state.hidden { display: none; }

  /* ── Status toast ── */
  .toast {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 300;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
  <header class="app-header">
    <h1>iPhone 17 Pro PWA</h1>
    <div class="header-actions">
      <button type="button" class="btn btn-ghost btn-sm" id="btn-toggle-view">プレビュー</button>
    </div>
  </header>

  <main class="main">
    <!-- Editor -->
    <section class="editor-panel" id="editor-panel">
      <div class="label">HTML / CSS / JavaScript を貼り付け</div>
      <textarea class="html-input" id="html-input" spellcheck="false" placeholder="<!DOCTYPE html>
<html>
<head>...</head>
<body>...</body>
</html>"></textarea>
      <div class="toolbar">
        <button type="button" class="btn btn-primary" id="btn-preview">プレビュー</button>
        <button type="button" class="btn" id="btn-sample">サンプルHTML</button>
        <button type="button" class="btn btn-danger" id="btn-clear">クリア</button>
      </div>
      <p class="hint">
        LocalStorageに自動保存されます。iframeで完全分離しているため、貼り付けたコードはプレビューア本体に影響しません。<br>
        PWA想定のため Safari のアドレスバーは表示されません。Safe Area・Dynamic Island・ホームインジケータを確認できます。
      </p>
    </section>

    <!-- Preview -->
    <section class="preview-panel" id="preview-panel">
      <div class="preview-toolbar">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-back-edit">← 編集</button>
        <button type="button" class="btn btn-sm" id="btn-fullscreen">全画面プレビュー</button>
      </div>

      <div class="phone-scale" id="phone-scale">
        <div class="phone">
          <div class="phone-screen">
            <div class="dynamic-island" aria-hidden="true"></div>
            <iframe
              class="pwa-frame"
              id="pwa-frame"
              title="PWA Preview"
              sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox"
              allow="fullscreen"
            ></iframe>
            <div class="empty-state" id="empty-state">
              <span>HTMLを貼り付けて<br>「プレビュー」を押してください</span>
            </div>
            <div class="home-indicator" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <button type="button" class="btn fs-exit" id="btn-exit-fs">閉じる</button>
  <div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'iphone17pro-pwa-previewer-html';
  const PHONE_W = 402;
  const PHONE_H = 874;
  const SAFE_TOP = 62;
  const SAFE_BOTTOM = 34;

  const htmlInput = document.getElementById('html-input');
  const frame = document.getElementById('pwa-frame');
  const emptyState = document.getElementById('empty-state');
  const editorPanel = document.getElementById('editor-panel');
  const previewPanel = document.getElementById('preview-panel');
  const phoneScale = document.getElementById('phone-scale');
  const toastEl = document.getElementById('toast');

  /* ── Sample HTML (PWA-like with safe areas, fixed bars, tab bar) ── */
  const SAMPLE = `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Sample PWA</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    min-height: 100vh;
  }
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: calc(var(--safe-top) + 8px) 16px 12px;
    background: rgba(28,28,30,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid #38383a;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(var(--safe-top) + 56px) 16px calc(var(--safe-bottom) + 64px);
  }
  .card {
    background: #1c1c1e;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { font-size: 16px; margin-bottom: 6px; }
  .card p { font-size: 14px; color: #8e8e93; line-height: 1.5; }
  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    background: rgba(28,28,30,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid #38383a;
    padding-bottom: var(--safe-bottom);
    height: calc(49px + var(--safe-bottom));
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 10px;
    color: #8e8e93;
    padding-top: 6px;
    border: none;
    background: none;
    font-family: inherit;
  }
  .tab.active { color: #0a84ff; }
  .tab-icon {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: currentColor;
    opacity: 0.9;
  }
  input, button.action {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #38383a;
    background: #2c2c2e;
    color: #f5f5f7;
    font-size: 16px;
    font-family: inherit;
    margin-top: 8px;
  }
  button.action {
    background: #0a84ff;
    border: none;
    font-weight: 500;
    cursor: pointer;
  }
  .debug {
    font-size: 12px;
    color: #636366;
    margin-top: 16px;
    word-break: break-all;
  }
</style>
</head>
<body>
  <header class="header">Sample PWA</header>
  <main class="content" id="content">
    <div class="card">
      <h2>Safe Area 確認</h2>
      <p>上部は Dynamic Island / Safe Area を避け、下部はホームインジケータとタブバーが重ならないようにしています。</p>
    </div>
    <div class="card">
      <h2>入力テスト</h2>
      <input type="text" placeholder="テキストを入力…" id="inp">
      <button class="action" type="button" id="btn">送信</button>
    </div>
    <div class="card">
      <h2>スクロール領域</h2>
      <p>下にスクロールして fixed 要素の位置を確認してください。</p>
    </div>
    ${Array.from({length: 12}, (_, i) => `<div class="card"><h2>カード ${i + 1}</h2><p>position: fixed と env(safe-area-inset-*) の挙動確認用です。</p></div>`).join('')}
    <div class="debug" id="debug"></div>
  </main>
  <nav class="tabbar">
    <button class="tab active" type="button"><span class="tab-icon"></span>ホーム</button>
    <button class="tab" type="button"><span class="tab-icon"></span>検索</button>
    <button class="tab" type="button"><span class="tab-icon"></span>通知</button>
    <button class="tab" type="button"><span class="tab-icon"></span>設定</button>
  </nav>
  <script>
    document.getElementById('btn').onclick = function () {
      alert('入力: ' + (document.getElementById('inp').value || '(空)'));
    };
    document.querySelectorAll('.tab').forEach(function (t) {
      t.onclick = function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
      };
    });
    var d = document.getElementById('debug');
    function report() {
      var s = getComputedStyle(document.documentElement);
      d.textContent =
        'inner: ' + window.innerWidth + '×' + window.innerHeight +
        ' | dvh≈' + (window.visualViewport ? window.visualViewport.height : '?') +
        ' | safe-top: ' + s.getPropertyValue('--safe-top') +
        ' | safe-bottom: ' + s.getPropertyValue('--safe-bottom');
    }
    report();
    window.addEventListener('resize', report);
  <\/script>
</body>
</html>`;

  /* ── Toast ── */
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  /* ── LocalStorage ── */
  function save() {
    try { localStorage.setItem(STORAGE_KEY, htmlInput.value); } catch (e) {}
  }
  function load() {
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      if (v != null) htmlInput.value = v;
    } catch (e) {}
  }

  /* ── Inject safe-area CSS variables into preview document ── */
  function buildPreviewSrcdoc(userHtml) {
    // Prepend a base that forces PWA-like viewport and injects measured safe areas
    // so env(safe-area-inset-*) works even inside iframe (browsers often return 0).
    const inject = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<style id="__pwa-preview-inject">
  /* Force safe-area values matching iPhone 17 Pro PWA (fullscreen) */
  :root {
    --safe-area-inset-top: ${SAFE_TOP}px !important;
    --safe-area-inset-bottom: ${SAFE_BOTTOM}px !important;
    --safe-area-inset-left: 0px !important;
    --safe-area-inset-right: 0px !important;
  }
  /* Polyfill env() via custom properties for broader support in preview */
  html {
    --sat: ${SAFE_TOP}px;
    --sab: ${SAFE_BOTTOM}px;
    --sal: 0px;
    --sar: 0px;
  }
</style>
<script>
  /* Override env() approximation: rewrite common patterns is hard;
     instead expose CSS variables that authors can use, and also
     set constant values that match real device when env returns 0. */
  (function () {
    var style = document.createElement('style');
    style.textContent =
      ':root{' +
      '  --safe-area-inset-top:${SAFE_TOP}px;' +
      '  --safe-area-inset-bottom:${SAFE_BOTTOM}px;' +
      '}' +
      /* Make env() work by defining on :root via @supports fallback patterns
         Authors typically write: padding-top: env(safe-area-inset-top);
         Inside iframe env is usually 0, so we inject a second layer: */
      'html{padding:0;margin:0;}' +
      'body{min-height:100%;}';
    document.documentElement.appendChild(style);

    /* Monkey-patch: not possible for env(). Instead inject CSS that
       redefines common utility classes if present is not reliable.
       Best effort: set CSS variables and document the values. */
  })();
<\/script>
</head>
<body></body>
</html>`;

    // If user provided full document, we need to inject into it.
    // Strategy: parse roughly and inject style + override env via CSS variables
    // that shadow the usual usage pattern.

    const safePolyfill = `
<style id="__iphone17pro-safe-polyfill">
  /* iPhone 17 Pro PWA safe areas (preview polyfill)
     Real device: top 62 / bottom 34 in portrait PWA */
  :root {
    --safe-area-inset-top: ${SAFE_TOP}px;
    --safe-area-inset-right: 0px;
    --safe-area-inset-bottom: ${SAFE_BOTTOM}px;
    --safe-area-inset-left: 0px;
  }
</style>
<script>
(function(){
  /* Replace env(safe-area-inset-*) at runtime for stylesheets is impractical.
     Instead, force the iframe's visual size and tell authors to use the variables,
     AND inject a CSS layer that approximates by setting padding on html when
     viewport-fit is used — the reliable way is to redefine env via a hack:

     Modern approach used by many simulators: set the iframe size to the
     full screen and inject:

     @supports (padding: env(safe-area-inset-top)) is true but value is 0.
     So we append rules that mirror typical safe-area usage. */

  var css = ''
    + 'html{height:100%;}'
    + 'body{min-height:100%;min-height:100dvh;margin:0;}'
    /* Help fixed headers that use padding-top: env(safe-area-inset-top) —
       we cannot rewrite env, but we can set constant via custom property
       and document that sample uses the variables. For pasted code that
       uses env(), values stay 0 inside iframe — that's a browser limit.
       Work around: use CSS @property is not enough.
       Practical fix used here: inject a style that sets the SAME numeric
       values on a well-known polyfill variable and ALSO try to patch
       getComputedStyle for demo. */
    ;

  var s = document.createElement('style');
  s.id = '__pwa-preview-base';
  s.textContent = css;
  (document.head || document.documentElement).appendChild(s);

  /* Critical polyfill: define env() fallbacks by injecting rules that
     match the most common patterns authors write, using the real px values.
     This is best-effort for the preview environment. */
  var poly = document.createElement('style');
  poly.id = '__safe-area-force';
  poly.textContent = [
    /* Many PWAs use: padding-top: env(safe-area-inset-top, 0px) */
    /* We cannot intercept env, so we expand the visual safe region via
       a transparent overlay is wrong. Instead set constant on :root and
       encourage variable usage; for env()-based code, simulate by making
       the content box the full phone and accepting env=0, OR use a
       post-process rewrite. */
  ].join('');
  (document.head || document.documentElement).appendChild(poly);
})();
<\/script>`;

    // Robust approach: rewrite env(safe-area-inset-*) in the user HTML string
    // to the numeric values so the preview matches real PWA behavior.
    let html = userHtml;
    if (!html || !html.trim()) return '';

    // Normalize env() calls to fixed px for this device preview
    html = html.replace(/env\(\s*safe-area-inset-top\s*(?:,\s*[^)]+)?\s*\)/gi, SAFE_TOP + 'px');
    html = html.replace(/env\(\s*safe-area-inset-bottom\s*(?:,\s*[^)]+)?\s*\)/gi, SAFE_BOTTOM + 'px');
    html = html.replace(/env\(\s*safe-area-inset-left\s*(?:,\s*[^)]+)?\s*\)/gi, '0px');
    html = html.replace(/env\(\s*safe-area-inset-right\s*(?:,\s*[^)]+)?\s*\)/gi, '0px');
    html = html.replace(/constant\(\s*safe-area-inset-top\s*(?:,\s*[^)]+)?\s*\)/gi, SAFE_TOP + 'px');
    html = html.replace(/constant\(\s*safe-area-inset-bottom\s*(?:,\s*[^)]+)?\s*\)/gi, SAFE_BOTTOM + 'px');
    html = html.replace(/constant\(\s*safe-area-inset-left\s*(?:,\s*[^)]+)?\s*\)/gi, '0px');
    html = html.replace(/constant\(\s*safe-area-inset-right\s*(?:,\s*[^)]+)?\s*\)/gi, '0px');

    // Ensure viewport meta exists for mobile layout
    if (!/name\s*=\s*["']viewport["']/i.test(html)) {
      if (/<head[^>]*>/i.test(html)) {
        html = html.replace(/<head([^>]*)>/i, '<head$1>\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">');
      } else if (/<html[^>]*>/i.test(html)) {
        html = html.replace(/<html([^>]*)>/i, '<html$1><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>');
      } else {
        html = '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>' + html + '</body></html>';
      }
    }

    // Inject base style for height / overflow
    const baseStyle = `<style id="__pwa-preview-root">
html, body { margin: 0; }
html { height: 100%; background: #000; }
body { min-height: 100%; min-height: 100dvh; }
</style>`;

    if (/<head[^>]*>/i.test(html)) {
      html = html.replace(/<head([^>]*)>/i, '<head$1>' + baseStyle);
    } else {
      html = baseStyle + html;
    }

    return html;
  }

  function runPreview() {
    const raw = htmlInput.value;
    save();
    if (!raw.trim()) {
      frame.srcdoc = '';
      emptyState.classList.remove('hidden');
      toast('HTMLが空です');
      return;
    }
    const src = buildPreviewSrcdoc(raw);
    frame.srcdoc = src;
    emptyState.classList.add('hidden');
    showPreview();
    toast('プレビューを更新しました');
  }

  function showEditor() {
    editorPanel.classList.remove('hidden');
    previewPanel.classList.remove('active');
    document.getElementById('btn-toggle-view').textContent = 'プレビュー';
    document.body.classList.remove('fullscreen');
  }

  function showPreview() {
    editorPanel.classList.add('hidden');
    previewPanel.classList.add('active');
    document.getElementById('btn-toggle-view').textContent = '編集';
    requestAnimationFrame(fitPhone);
  }

  function fitPhone() {
    if (document.body.classList.contains('fullscreen')) {
      phoneScale.style.transform = '';
      return;
    }
    const panel = previewPanel;
    const pad = 32;
    const availW = panel.clientWidth - pad;
    const availH = panel.clientHeight - 60 - pad; // toolbar approx
    const phoneTotalW = PHONE_W + 24; // bezel
    const phoneTotalH = PHONE_H + 24;
    const scale = Math.min(1, availW / phoneTotalW, availH / phoneTotalH);
    phoneScale.style.transform = scale < 0.99 ? `scale(${scale})` : '';
  }

  function enterFullscreen() {
    document.body.classList.add('fullscreen');
    phoneScale.style.transform = '';
  }
  function exitFullscreen() {
    document.body.classList.remove('fullscreen');
    fitPhone();
  }

  /* ── Events ── */
  document.getElementById('btn-preview').addEventListener('click', runPreview);
  document.getElementById('btn-toggle-view').addEventListener('click', function () {
    if (previewPanel.classList.contains('active')) {
      showEditor();
    } else {
      runPreview();
    }
  });
  document.getElementById('btn-back-edit').addEventListener('click', showEditor);
  document.getElementById('btn-fullscreen').addEventListener('click', enterFullscreen);
  document.getElementById('btn-exit-fs').addEventListener('click', exitFullscreen);

  document.getElementById('btn-clear').addEventListener('click', function () {
    htmlInput.value = '';
    save();
    frame.srcdoc = '';
    emptyState.classList.remove('hidden');
    toast('クリアしました');
  });

  document.getElementById('btn-sample').addEventListener('click', function () {
    htmlInput.value = SAMPLE;
    save();
    toast('サンプルを挿入しました');
  });

  htmlInput.addEventListener('input', function () {
    // debounce save
    clearTimeout(htmlInput._saveT);
    htmlInput._saveT = setTimeout(save, 400);
  });

  window.addEventListener('resize', function () {
    if (previewPanel.classList.contains('active')) fitPhone();
  });

  // Escape exits fullscreen
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('fullscreen')) {
      exitFullscreen();
    }
  });

  /* ── Init ── */
  load();
  if (!htmlInput.value.trim()) {
    // optional: leave empty
  }
})();
</script>
</body>
</html>
