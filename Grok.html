<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Previewer — iPhone 17 Pro / iPad 7</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button,textarea,input{font:inherit}
button{border:0;color:var(--text);background:var(--panel2);border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #38383c}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}
.app{max-width:1100px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px 12px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.header-actions button{min-height:36px;padding:0 12px;font-size:13px}

/* tabs */
.tabs{display:flex;background:var(--panel);border-radius:12px;padding:3px;margin-bottom:12px}
.tab{flex:1;min-height:36px;background:transparent;color:var(--muted);font-size:14px}
.tab.active{background:var(--panel3);color:#fff}

/* list */
.list-panel{display:none}
.list-panel.show{display:block}
.item-list{display:flex;flex-direction:column;gap:6px;max-height:min(38vh,320px);overflow:auto;padding-right:2px;margin-bottom:14px}
.item{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border-radius:14px;padding:12px 14px;
  border:2px solid transparent;cursor:pointer;transition:border-color .15s,background .15s;
}
.item:active{background:var(--panel2)}
.item.active{border-color:var(--accent);background:#0a84ff18}
.item-name{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.item-empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}

/* device previews */
.devices{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;padding:4px 0 24px}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.device-label{font-size:12px;color:var(--muted);font-weight:500}
.phone{
  position:relative;width:min(280px,42vw);aspect-ratio:393/852;
  background:#000;border:6px solid #202023;border-radius:40px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;color-scheme:dark}
.island{
  position:absolute;z-index:5;top:9px;left:50%;transform:translateX(-50%);
  width:90px;height:28px;background:#000;border-radius:18px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.03);
}
.homebar{
  position:absolute;z-index:6;bottom:6px;left:50%;transform:translateX(-50%);
  width:90px;height:4px;border-radius:4px;background:#fff;pointer-events:none;opacity:.9;
}
.ipad{
  position:relative;width:min(420px,92vw);aspect-ratio:4/3;
  background:#000;border:8px solid #2a2a2e;border-radius:18px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.ipad iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;color-scheme:dark}
.ipad-bezel{
  position:absolute;z-index:5;top:50%;left:6px;transform:translateY(-50%);
  width:4px;height:28px;background:#1a1a1c;border-radius:2px;pointer-events:none;
}

/* editor */
.editor-panel{display:none}
.editor-panel.show{display:block}
.editor-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.editor-tools .name-input{
  flex:1;min-width:120px;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 12px;outline:none;
}
.editor-tools .name-input:focus{border-color:var(--accent)}
#count{font-size:13px;color:var(--muted);white-space:nowrap}
.search-box{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.search-box input{
  width:100%;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 11px;outline:none;
}
#searchResult{font-size:11px;color:var(--muted);white-space:nowrap}
textarea{
  width:100%;height:min(42vh,360px);resize:vertical;
  background:#111113;color:#f5f5f7;border:1px solid #38383c;border-radius:14px;
  padding:14px;outline:none;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;
}
textarea:focus{border-color:var(--accent)}
.status{font-size:12px;color:var(--muted);padding:2px 4px 8px}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.editor-actions button{flex:1;min-width:100px}

/* fullscreen */
.fullscreen{position:fixed;inset:0;z-index:100;background:#000;padding:0;display:none}
.fullscreen.show{display:block}
.fullscreen iframe{width:100%;height:100%;border:0}
.fullscreen .exit{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));right:14px;
  width:44px;height:44px;padding:0;border-radius:50%;
  background:rgba(60,60,65,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:20px;
}
.preview-actions{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.preview-actions button{min-height:38px;font-size:13px}

@media(min-width:800px){
  .item-list{max-height:min(50vh,420px)}
  .phone{width:min(320px,38vw)}
  .ipad{width:min(480px,48vw)}
  textarea{height:min(50vh,420px)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>PWA Previewer</h1>
    <div class="header-actions">
      <button id="btnNew" class="primary">＋ 新規</button>
    </div>
  </header>

  <nav class="tabs">
    <button id="tabList" class="tab active">一覧・プレビュー</button>
    <button id="tabEdit" class="tab">編集</button>
  </nav>

  <!-- LIST + PREVIEW -->
  <section id="listPanel" class="list-panel show">
    <div id="itemList" class="item-list"></div>

    <div class="preview-actions">
      <button id="btnFullPhone" class="primary">iPhone全画面</button>
      <button id="btnFullIpad">iPad全画面</button>
      <button id="btnEditSelected" class="ghost">選択を編集</button>
      <button id="btnDelete" class="danger">削除</button>
    </div>

    <div class="devices">
      <div class="device-wrap">
        <div class="device-label">iPhone 17 Pro</div>
        <div class="phone" id="phone">
          <div class="island"></div>
          <iframe id="framePhone" title="iPhone preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          <div class="homebar"></div>
        </div>
      </div>
      <div class="device-wrap">
        <div class="device-label">iPad 第7世代（横）</div>
        <div class="ipad" id="ipad">
          <div class="ipad-bezel"></div>
          <iframe id="frameIpad" title="iPad preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="editorPanel" class="editor-panel">
    <div class="editor-tools">
      <input id="nameInput" class="name-input" type="text" placeholder="名前を入力" maxlength="80" autocomplete="off">
      <span id="count">0文字</span>
      <div class="search-box">
        <input id="search" type="search" placeholder="検索" autocomplete="off">
        <span id="searchResult"></span>
      </div>
    </div>
    <div class="status">HTML・CSS・JavaScriptをそのまま貼り付けてください。保存すると一覧に反映されます。</div>
    <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
    <div class="editor-actions">
      <button id="btnSave" class="primary">保存して一覧へ</button>
      <button id="btnClear" class="ghost">クリア</button>
      <button id="btnCancel" class="ghost">キャンセル</button>
    </div>
  </section>
</div>

<div id="fullscreen" class="fullscreen">
  <button class="exit" id="exit">×</button>
  <iframe id="fullFrame" title="Full screen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "pwa-previewer-items-v2";
  const OLD_KEY = "iphone17pro-pwa-preview-html-v1";

  let items = [];
  let selectedId = null;
  let editingId = null; // null = new

  const source = $("source");
  const nameInput = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad = $("frameIpad");
  const fullFrame = $("fullFrame");

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        // migrate old single-html storage
        const old = localStorage.getItem(OLD_KEY);
        if (old) {
          items = [{
            id: uid(),
            name: "移行したHTML",
            html: old,
            updated: Date.now()
          }];
          persist();
        }
      }
    } catch (e) {
      items = [];
    }
    if (items.length && !selectedId) selectedId = items[0].id;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const h = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `${m}/${day} ${h}:${min}`;
  }

  function renderList() {
    const list = $("itemList");
    if (!items.length) {
      list.innerHTML = `<div class="item-empty">まだHTMLがありません。<br>「＋ 新規」から追加してください。</div>`;
      clearPreviews();
      return;
    }
    list.innerHTML = items
      .slice()
      .sort((a, b) => b.updated - a.updated)
      .map(it => `
        <div class="item ${it.id === selectedId ? "active" : ""}" data-id="${it.id}">
          <div class="item-name">${escapeHtml(it.name || "無題")}</div>
          <div class="item-meta">${formatDate(it.updated)} · ${(it.html || "").length.toLocaleString()}字</div>
        </div>
      `).join("");
    list.querySelectorAll(".item").forEach(el => {
      el.onclick = () => {
        selectedId = el.dataset.id;
        renderList();
        updatePreview();
      };
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function clearPreviews() {
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  function updatePreview() {
    const it = items.find(x => x.id === selectedId);
    if (!it) {
      clearPreviews();
      return;
    }
    const html = it.html || "";
    framePhone.srcdoc = html;
    frameIpad.srcdoc = html;
  }

  function showList() {
    $("listPanel").classList.add("show");
    $("editorPanel").classList.remove("show");
    $("tabList").classList.add("active");
    $("tabEdit").classList.remove("active");
    renderList();
    updatePreview();
  }

  function showEditor(isNew) {
    $("listPanel").classList.remove("show");
    $("editorPanel").classList.add("show");
    $("tabList").classList.remove("active");
    $("tabEdit").classList.add("active");

    if (isNew) {
      editingId = null;
      nameInput.value = "";
      source.value = "";
    } else {
      const it = items.find(x => x.id === selectedId);
      if (!it) {
        editingId = null;
        nameInput.value = "";
        source.value = "";
      } else {
        editingId = it.id;
        nameInput.value = it.name || "";
        source.value = it.html || "";
      }
    }
    updateCount();
    $("search").value = "";
    $("searchResult").textContent = "";
    nameInput.focus();
  }

  function updateCount() {
    $("count").textContent = source.value.length.toLocaleString() + "文字";
  }

  function saveCurrent() {
    const name = (nameInput.value || "").trim() || "無題";
    const html = source.value;
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) {
        it.name = name;
        it.html = html;
        it.updated = Date.now();
      }
      selectedId = editingId;
    } else {
      const id = uid();
      items.push({ id, name, html, updated: Date.now() });
      selectedId = id;
    }
    persist();
    showList();
  }

  function deleteSelected() {
    if (!selectedId) return;
    const it = items.find(x => x.id === selectedId);
    if (!it) return;
    if (!confirm(`「${it.name || "無題"}」を削除しますか？`)) return;
    items = items.filter(x => x.id !== selectedId);
    selectedId = items.length ? items[0].id : null;
    persist();
    renderList();
    updatePreview();
  }

  // events
  $("tabList").onclick = showList;
  $("tabEdit").onclick = () => showEditor(false);
  $("btnNew").onclick = () => showEditor(true);
  $("btnEditSelected").onclick = () => {
    if (!selectedId) {
      alert("編集する項目を一覧から選んでください");
      return;
    }
    showEditor(false);
  };
  $("btnSave").onclick = saveCurrent;
  $("btnCancel").onclick = showList;
  $("btnClear").onclick = () => {
    source.value = "";
    updateCount();
    $("search").value = "";
    $("searchResult").textContent = "";
    source.focus();
  };
  $("btnDelete").onclick = deleteSelected;

  $("btnFullPhone").onclick = () => {
    const it = items.find(x => x.id === selectedId);
    if (!it) return;
    fullFrame.srcdoc = it.html || "";
    $("fullscreen").classList.add("show");
  };
  $("btnFullIpad").onclick = () => {
    const it = items.find(x => x.id === selectedId);
    if (!it) return;
    fullFrame.srcdoc = it.html || "";
    $("fullscreen").classList.add("show");
  };
  $("exit").onclick = () => {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
  };

  source.addEventListener("input", updateCount);
  $("search").addEventListener("input", () => {
    const q = $("search").value;
    if (!q) {
      $("searchResult").textContent = "";
      return;
    }
    let n = 0, pos = 0;
    while ((pos = source.value.indexOf(q, pos)) !== -1) {
      n++;
      pos += Math.max(q.length, 1);
    }
    $("searchResult").textContent = n + "件";
  });

  // init
  load();
  showList();
})();
</script>
</body>
</html>
