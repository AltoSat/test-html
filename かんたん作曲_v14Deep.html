<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>物品管理 - カット用A5</title>
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22物品管理%22,%22short_name%22:%22物品管理%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#2563eb%22}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            width: 100%;
            background: transparent;
            border: none;
        }

        .card-grid.mode-3col {
            grid-template-columns: repeat(3, 1fr);
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #d1d5db;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            page-break-inside: avoid;
            break-inside: avoid;
            margin: 0;
            overflow: hidden;
            min-width: 0;
        }

        .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            padding: 0;
            font-weight: bold;
        }

        .photo-area {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px dashed #94a3b8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            margin: 0;
            flex-shrink: 0;
        }

        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }

        .photo-placeholder {
            font-size: 20px;
            color: #94a3b8;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
        }

        .item-title {
            font-size: 15px;
            font-weight: bold;
            color: #0f172a;
            border: none;
            border-bottom: 2px solid #2563eb;
            background: transparent;
            padding: 2px 0;
            width: 100%;
            font-family: inherit;
            outline: none;
            text-align: left;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .item-memo {
            width: 100%;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            padding: 2px 0;
            font-size: 12px;
            color: #0f172a;
            font-family: inherit;
            resize: none;
            height: 22px;
            outline: none;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .bottom-info {
            display: flex;
            align-items: stretch;
            gap: 6px;
            flex: 1;
        }

        .left-fields {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-areas:
                "price store"
                "date url";
            gap: 4px;
            min-width: 0;
            width: 100%;
        }

        .field-row {
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid #cbd5e1;
            height: 26px;
            width: 100%;
        }

        .field-row-split {
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .field-row-split .field-row {
            flex: 1;
            min-width: 0;
        }

        .field-row input {
            border: none;
            background: transparent;
            padding: 0 2px;
            font-size: 13px;
            font-weight: bold;
            color: #0f172a;
            font-family: inherit;
            outline: none;
            width: 100%;
            min-width: 0;
            text-align: left;
            height: 100%;
            border-radius: 0;
            -webkit-appearance: none;
        }

        .field-row input[type="date"] {
            font-size: 11px;
            padding: 0;
            text-align: right;
            -webkit-appearance: none;
            background: transparent;
        }

        .price-input {
            color: #b91c1c !important;
            font-weight: bold !important;
            font-size: 13px !important;
        }

        /* Grid area assignments */
        .field-price { grid-area: price; }
        .field-store { grid-area: store; }
        .field-date { grid-area: date; }
        .field-url { grid-area: url; }

        /* URL input styling */
        .field-url {
            border-bottom: none !important;
            height: auto !important;
            min-height: 26px;
        }
        .field-url input {
            border: 1px dashed #94a3b8;
            border-radius: 4px;
            background: #f8fafc;
            padding: 4px 6px;
            font-size: 11px;
            color: #2563eb;
            font-family: monospace;
            width: 100%;
            outline: none;
            -webkit-appearance: none;
            height: auto;
            font-weight: normal;
        }

        /* Clear button for text inputs */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .input-wrapper input,
        .input-wrapper textarea {
            flex: 1;
            min-width: 0;
            padding-right: 20px; /* space for clear button */
        }

        .clear-btn {
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            display: none;
            padding: 0 2px;
            line-height: 1;
            z-index: 2;
            -webkit-tap-highlight-color: transparent;
        }

        .input-wrapper.focused .clear-btn {
            display: block;
        }

        .clear-btn:hover {
            color: #ef4444;
        }

        .qr-area {
            display: none;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 50px;
        }

        .qr-code-container {
            display: flex;
            justify-content: center;
            width: 100%;
            line-height: 0;
        }

        .qr-code-container img {
            width: 45px !important;
            height: 45px !important;
            max-width: 100%;
        }

        .card-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .action-sub-btn {
            flex: 1;
            padding: 5px 0;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            background: #f8fafc;
            color: #334155;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .no-print {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 6px;
            flex-wrap: wrap;
            padding: 0 16px;
        }

        .btn {
            flex: 1;
            min-width: 110px;
            padding: 12px 8px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .btn-secondary {
            background-color: #10b981;
        }

        /* メモ読み込みモーダル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content textarea {
            width: 100%;
            height: 140px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            line-height: 1.4;
            resize: none;
            outline: none;
        }

        .modal-btns {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btns button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        @media print {
            @page {
                size: A5 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: #fff;
                display: block;
                width: 148mm;
                height: 210mm;
                overflow: hidden;
            }

            .app-container {
                max-width: 100%;
                width: 100%;
                gap: 0;
                padding: 0;
            }

            .no-print,
            .remove-btn,
            .card-actions,
            .clear-btn {
                display: none !important;
            }

            .card-grid {
                gap: 0;
                border: none;
                width: 100%;
                height: 210mm;
                align-content: start;
            }

            .item-card {
                border: 1px solid #d1d5db;
                padding: 6px 5px;
                gap: 4px;
            }

            .item-title {
                font-size: 13px;
                border-bottom-width: 1.5px;
                padding-bottom: 1px;
            }

            .photo-area {
                border: 1px solid #999;
                border-radius: 6px;
            }

            .photo-area img {
                border-radius: 6px;
            }

            .photo-placeholder {
                font-size: 12px;
            }

            .item-memo {
                font-size: 10px;
                height: 18px;
                border-bottom: 1px solid #cbd5e1;
            }

            .bottom-info {
                gap: 4px;
            }

            .left-fields {
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "price date"
                    "store store";
                gap: 4px;
            }

            .field-url {
                display: none !important;
            }

            .field-row {
                height: 20px;
            }

            .field-row input {
                font-size: 11px;
            }

            .field-row input[type="date"] {
                font-size: 9px;
            }

            .qr-area {
                display: flex !important;
                width: 45px;
            }

            .qr-code-container img {
                width: 40px !important;
                height: 40px !important;
            }

            .input-wrapper {
                padding-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="card-grid" id="cardGrid"></div>
        <div class="no-print">
            <button class="btn btn-secondary" onclick="addProduct()">＋追加</button>
            <button class="btn" onclick="window.print()">◻︎印刷</button>
        </div>
    </div>

    <!-- メモ読み込みモーダル -->
    <div class="modal-overlay" id="importModal">
        <div class="modal-content">
            <h3 style="margin:0; font-size:15px;">メモからデータを読み込む</h3>
            <p style="margin:0; font-size:11px; color:#64748b; line-height:1.3;">
                以下の順序で改行区切りで貼り付けてください：<br>
                1行目: 商品名 / 2行目: 備考 / 3行目: 価格<br>
                4行目: 日付 / 5行目: 店舗 / 6行目: URL<br>
                ※順序が多少違っても自動判別します。空白行は無視します。
            </p>
            <textarea id="importText" placeholder="例:&#10;商品名&#10;備考テキスト&#10;1,000円&#10;2026-08-31&#10;店舗名&#10;https://..."></textarea>
            <div class="modal-btns">
                <button onclick="closeImportModal()" style="background:#e2e8f0; color:#475569;">キャンセル</button>
                <button onclick="applyImportText()" style="background:#2563eb; color:#fff;">反映する</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            let products = [];
            let activeImportProdId = null;
            const MAX_PRODUCTS = 6;
            const STORAGE_KEY = 'item_management_data_v8';

            function generateId() {
                return 'p' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
                } catch (e) {
                    console.warn('保存失敗', e);
                }
            }

            function loadFromStorage() {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) {
                            products = parsed.filter(p => p && p.id);
                        }
                    } catch (e) {
                        products = [];
                    }
                }
            }

            function getDefaultProducts() {
                return [];
            }

            function init() {
                loadFromStorage();
                if (products.length === 0) {
                    products = getDefaultProducts().map(p => ({ ...p, id: generateId() }));
                    saveToStorage();
                }
                renderAllCards();
                updateGridMode();
            }

            function renderAllCards() {
                const grid = document.getElementById('cardGrid');
                grid.innerHTML = '';
                products.forEach(prod => {
                    grid.appendChild(createCardElement(prod));
                });
            }

            function createClearButton(input, wrapper, onChangeCallback) {
                const clearBtn = document.createElement('button');
                clearBtn.type = 'button';
                clearBtn.className = 'clear-btn';
                clearBtn.textContent = '×';
                clearBtn.tabIndex = -1;
                clearBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    input.value = '';
                    if (onChangeCallback) onChangeCallback();
                    input.focus();
                    wrapper.classList.remove('focused');
                });
                input.addEventListener('focus', () => {
                    wrapper.classList.add('focused');
                });
                input.addEventListener('blur', () => {
                    // Delay hiding to allow click on clear button
                    setTimeout(() => {
                        if (!wrapper.contains(document.activeElement)) {
                            wrapper.classList.remove('focused');
                        }
                    }, 100);
                });
                wrapper.appendChild(clearBtn);
            }

            function createCardElement(prod) {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.dataset.productId = prod.id;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.title = '削除';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeProduct(prod.id);
                });

                const photoArea = document.createElement('div');
                photoArea.className = 'photo-area';
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.style.display = 'none';
                fileInput.addEventListener('change', (e) => handlePhotoUpload(e, prod, photoArea));

                const placeholder = document.createElement('span');
                placeholder.className = 'photo-placeholder';
                placeholder.textContent = '📷';
                const img = document.createElement('img');
                img.style.display = 'none';
                if (prod.photo) {
                    img.src = prod.photo;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }

                photoArea.appendChild(placeholder);
                photoArea.appendChild(img);
                photoArea.appendChild(fileInput);
                photoArea.addEventListener('click', () => fileInput.click());

                // Title
                const titleWrapper = document.createElement('div');
                titleWrapper.className = 'input-wrapper';
                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.className = 'item-title';
                titleInput.value = prod.title || '';
                titleInput.placeholder = '商品名';
                titleInput.addEventListener('input', () => {
                    prod.title = titleInput.value;
                    saveToStorage();
                });
                titleWrapper.appendChild(titleInput);
                createClearButton(titleInput, titleWrapper, () => {
                    prod.title = '';
                    saveToStorage();
                });

                // Memo
                const memoWrapper = document.createElement('div');
                memoWrapper.className = 'input-wrapper';
                const memoTextarea = document.createElement('textarea');
                memoTextarea.className = 'item-memo';
                memoTextarea.rows = 1;
                memoTextarea.value = prod.memo || '';
                memoTextarea.placeholder = '備考';
                memoTextarea.addEventListener('input', () => {
                    prod.memo = memoTextarea.value;
                    saveToStorage();
                });
                memoWrapper.appendChild(memoTextarea);
                createClearButton(memoTextarea, memoWrapper, () => {
                    prod.memo = '';
                    saveToStorage();
                });

                const bottomInfo = document.createElement('div');
                bottomInfo.className = 'bottom-info';

                const leftFields = document.createElement('div');
                leftFields.className = 'left-fields';

                // Price
                const priceWrapper = document.createElement('div');
                priceWrapper.className = 'input-wrapper field-row field-price';
                const priceInput = document.createElement('input');
                priceInput.type = 'text';
                priceInput.className = 'price-input';
                priceInput.value = prod.price || '';
                priceInput.placeholder = '価格';
                priceInput.addEventListener('focus', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                });
                priceInput.addEventListener('blur', (e) => {
                    let val = e.target.value.replace(/[^0-9]/g, '');
                    if (val) {
                        e.target.value = Number(val).toLocaleString('ja-JP') + '円';
                        prod.price = e.target.value;
                    } else {
                        e.target.value = '';
                        prod.price = '';
                    }
                    saveToStorage();
                });
                priceInput.addEventListener('input', (e) => {
                    prod.price = e.target.value;
                });
                priceWrapper.appendChild(priceInput);
                createClearButton(priceInput, priceWrapper, () => {
                    prod.price = '';
                    saveToStorage();
                });

                // Store
                const storeWrapper = document.createElement('div');
                storeWrapper.className = 'input-wrapper field-row field-store';
                const storeInput = document.createElement('input');
                storeInput.type = 'text';
                storeInput.value = prod.store || '';
                storeInput.placeholder = '店舗名';
                storeInput.addEventListener('input', () => {
                    prod.store = storeInput.value;
                    saveToStorage();
                });
                storeWrapper.appendChild(storeInput);
                createClearButton(storeInput, storeWrapper, () => {
                    prod.store = '';
                    saveToStorage();
                });

                // Date
                const dateWrapper = document.createElement('div');
                dateWrapper.className = 'input-wrapper field-row field-date';
                const dateInput = document.createElement('input');
                dateInput.type = 'date';
                dateInput.value = prod.date || '';
                dateInput.addEventListener('input', () => {
                    prod.date = dateInput.value;
                    saveToStorage();
                });
                dateWrapper.appendChild(dateInput);
                createClearButton(dateInput, dateWrapper, () => {
                    prod.date = '';
                    saveToStorage();
                });

                // URL
                const urlWrapper = document.createElement('div');
                urlWrapper.className = 'input-wrapper field-row field-url';
                const urlInput = document.createElement('input');
                urlInput.type = 'url';
                urlInput.value = prod.url || '';
                urlInput.placeholder = 'https://...';
                urlInput.addEventListener('input', () => {
                    prod.url = urlInput.value;
                    saveToStorage();
                    generateQRCode(qrContainer, prod.url);
                });
                urlWrapper.appendChild(urlInput);
                createClearButton(urlInput, urlWrapper, () => {
                    prod.url = '';
                    saveToStorage();
                    generateQRCode(qrContainer, '');
                });

                leftFields.appendChild(priceWrapper);
                leftFields.appendChild(storeWrapper);
                leftFields.appendChild(dateWrapper);
                leftFields.appendChild(urlWrapper);

                const qrArea = document.createElement('div');
                qrArea.className = 'qr-area';
                const qrContainer = document.createElement('div');
                qrContainer.className = 'qr-code-container';
                qrArea.appendChild(qrContainer);

                bottomInfo.appendChild(leftFields);
                bottomInfo.appendChild(qrArea);

                // Actions
                const actions = document.createElement('div');
                actions.className = 'card-actions';

                const exportBtn = document.createElement('button');
                exportBtn.className = 'action-sub-btn';
                exportBtn.textContent = '保存';
                exportBtn.addEventListener('click', () => exportToAppleNotes(prod));

                const importBtn = document.createElement('button');
                importBtn.className = 'action-sub-btn';
                importBtn.textContent = '読込';
                importBtn.addEventListener('click', () => openImportModal(prod.id));

                const linkBtn = document.createElement('button');
                linkBtn.className = 'action-sub-btn';
                linkBtn.textContent = 'リンク';
                linkBtn.addEventListener('click', () => {
                    if (prod.url) {
                        window.open(prod.url, '_blank');
                    } else {
                        alert('URLが設定されていません。');
                    }
                });

                actions.appendChild(exportBtn);
                actions.appendChild(importBtn);
                actions.appendChild(linkBtn);

                card.appendChild(removeBtn);
                card.appendChild(photoArea);
                card.appendChild(titleWrapper);
                card.appendChild(memoWrapper);
                card.appendChild(bottomInfo);
                card.appendChild(actions);

                generateQRCode(qrContainer, prod.url);
                return card;
            }

            function generateQRCode(container, url) {
                container.innerHTML = '';
                if (url) {
                    try {
                        new QRCode(container, {
                            text: url,
                            width: 45,
                            height: 45,
                            colorDark: '#0f172a',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } catch (e) {
                        console.warn('QR生成エラー', e);
                    }
                }
            }

            function handlePhotoUpload(event, prod, photoArea) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSize = 500;
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > maxSize) {
                            height = Math.round((height * maxSize) / width);
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = Math.round((width * maxSize) / height);
                            height = maxSize;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        prod.photo = compressedDataUrl;
                        saveToStorage();

                        const imgElement = photoArea.querySelector('img');
                        const placeholderEl = photoArea.querySelector('.photo-placeholder');
                        if (imgElement && placeholderEl) {
                            imgElement.src = compressedDataUrl;
                            imgElement.style.display = 'block';
                            placeholderEl.style.display = 'none';
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function normalizeDate(dateStr) {
                if (!dateStr) return '';
                const match = dateStr.match(/^(\d{4})[./-](\d{1,2})[./-](\d{1,2})$/);
                if (match) {
                    const year = match[1];
                    const month = match[2].padStart(2, '0');
                    const day = match[3].padStart(2, '0');
                    return `${year}-${month}-${day}`;
                }
                return dateStr;
            }

            function isDateLike(str) {
                return /^(\d{4})[./-](\d{1,2})[./-](\d{1,2})$/.test(str);
            }

            function isPriceLike(str) {
                // 例: 1,030円, 1030, ¥1,030, $19.99, 19.99, 1,030
                return /^(¥|\$)?[\d,]+(\.\d+)?(円|¥|\$)?$/.test(str) && /\d/.test(str);
            }

            function isUrlLike(str) {
                return /^(https?:\/\/|www\.)|[a-zA-Z0-9-]+\.(com|jp|net|org|co\.jp|io|shop|info|dev|app|store|amazon|yahoo|rakuten|mercari|aucfan)(\/|$)/i.test(str);
            }

            // 保存・読込の順序: 商品名、備考、価格、日付、店舗、URL
            async function exportToAppleNotes(prod) {
                const textData =
                    `${prod.title || ''}\n${prod.memo || ''}\n${prod.price || ''}\n${prod.date || ''}\n${prod.store || ''}\n${prod.url || ''}`;

                if (navigator.share) {
                    try {
                        await navigator.share({ title: prod.title || '商品データ', text: textData });
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            alert('共有に失敗しました: ' + err.message);
                        }
                    }
                } else {
                    try {
                        await navigator.clipboard.writeText(textData);
                        alert('テキストをクリップボードにコピーしました。');
                    } catch (e) {
                        alert('コピーに失敗しました: ' + e.message);
                    }
                }
            }

            window.openImportModal = function(prodId) {
                activeImportProdId = prodId;
                document.getElementById('importText').value = '';
                document.getElementById('importModal').classList.add('active');
            };

            window.closeImportModal = function() {
                document.getElementById('importModal').classList.remove('active');
                activeImportProdId = null;
            };

            window.applyImportText = function() {
                const text = document.getElementById('importText').value;
                if (!text || !activeImportProdId) return;

                // 空白行を除外
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length === 0) return;

                const prod = products.find(p => p.id === activeImportProdId);
                if (!prod) return;

                // 汎用フィールドの順序: 商品名、備考、店舗
                const generalFields = ['title', 'memo', 'store'];
                let generalIndex = 0;

                for (const line of lines) {
                    if (isUrlLike(line)) {
                        prod.url = line;
                    } else if (isDateLike(line)) {
                        prod.date = normalizeDate(line);
                    } else if (isPriceLike(line)) {
                        prod.price = line;
                    } else {
                        // 汎用フィールドに割り当て
                        if (generalIndex < generalFields.length) {
                            const field = generalFields[generalIndex];
                            prod[field] = line;
                            generalIndex++;
                        }
                        // それ以上は無視
                    }
                }

                saveToStorage();
                renderAllCards();
                closeImportModal();
            };

            function addProduct() {
                if (products.length >= MAX_PRODUCTS) {
                    alert('最大' + MAX_PRODUCTS + '商品まで登録できます。');
                    return;
                }
                const newProd = {
                    id: generateId(),
                    title: '',
                    memo: '',
                    price: '',
                    store: '',
                    date: '',
                    url: '',
                    photo: null
                };
                products.push(newProd);
                saveToStorage();
                renderAllCards();
                updateGridMode();
            }

            function removeProduct(id) {
                if (products.length <= 1) {
                    alert('最低1商品は必要です。');
                    return;
                }
                products = products.filter(p => p.id !== id);
                saveToStorage();
                renderAllCards();
                updateGridMode();
            }

            function updateGridMode() {
                const grid = document.getElementById('cardGrid');
                if (products.length > 4) {
                    grid.classList.add('mode-3col');
                } else {
                    grid.classList.remove('mode-3col');
                }
            }

            window.addEventListener('DOMContentLoaded', init);
            window.addEventListener('beforeprint', updateGridMode);

            window.addProduct = addProduct;
            window.removeProduct = removeProduct;
        })();
    </script>
</body>
</html>
