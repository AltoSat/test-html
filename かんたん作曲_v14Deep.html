<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="theme-color" content="#000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HTML Manager - マルチプレビュー</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #000;
            --panel: #1c1c1e;
            --panel2: #2c2c2e;
            --panel3: #3a3a3c;
            --text: #f5f5f7;
            --muted: #98989f;
            --accent: #0a84ff;
            --danger: #ff453a;
            --green: #30d158;
            --border: #38383c;
            --radius: 16px;
            --radius-sm: 12px;
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overscroll-behavior: none;
        }
        body {
            padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
        }
        button,
        input,
        textarea {
            font: inherit;
            color: var(--text);
        }
        button {
            border: 0;
            background: var(--panel2);
            border-radius: var(--radius-sm);
            min-height: 44px;
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.08s, opacity 0.15s, background 0.15s;
            -webkit-user-select: none;
            user-select: none;
        }
        button:active {
            transform: scale(0.96);
            opacity: 0.8;
        }
        button.primary {
            background: var(--accent);
            color: #fff;
        }
        button.danger {
            background: rgba(255, 69, 58, 0.15);
            color: var(--danger);
        }
        button.ghost {
            background: transparent;
            border: 1px solid var(--border);
        }
        button.icon-btn {
            width: 44px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: transparent;
            border-radius: 50%;
            flex-shrink: 0;
        }
        button.icon-btn:hover {
            background: var(--panel2);
        }
        button.small {
            min-height: 34px;
            padding: 0 10px;
            font-size: 13px;
            border-radius: 10px;
        }
        .app {
            max-width: 1100px;
            margin: auto;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 2px 12px;
            flex-wrap: wrap;
        }
        header h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header-actions {
            display: flex;
            gap: 7px;
            align-items: center;
        }
        .header-actions button {
            min-height: 38px;
            padding: 0 13px;
            font-size: 14px;
            white-space: nowrap;
            border-radius: 11px;
        }

        /* ── メイン画面 ── */
        #mainView {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #mainView.hidden {
            display: none;
        }

        .device-switch {
            display: flex;
            gap: 4px;
            background: var(--panel);
            border-radius: 13px;
            padding: 3px;
            width: fit-content;
            flex-shrink: 0;
        }
        .device-switch button {
            min-height: 36px;
            padding: 0 16px;
            font-size: 13px;
            background: transparent;
            color: var(--muted);
            border-radius: 10px;
            font-weight: 600;
            white-space: nowrap;
        }
        .device-switch button.active {
            background: var(--panel3);
            color: #fff;
        }
        .device-switch button .dev-icon {
            margin-right: 4px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 820px) {
            .main-layout {
                grid-template-columns: 300px 1fr;
                align-items: start;
            }
        }

        /* リストパネル */
        .list-panel {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 70vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 820px) {
            .list-panel {
                max-height: calc(100vh - 180px);
                position: sticky;
                top: 10px;
            }
        }
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 6px 8px;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .list-header .count-badge {
            background: var(--panel3);
            color: #fff;
            padding: 1px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .list-empty {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            padding: 28px 12px;
            line-height: 1.5;
        }
        .entry-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 8px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.12s;
            background: transparent;
            border: 1px solid transparent;
            min-height: 0;
            text-align: left;
            width: 100%;
        }
        .entry-item:hover {
            background: var(--panel2);
        }
        .entry-item.selected {
            background: rgba(10, 132, 255, 0.18);
            border-color: rgba(10, 132, 255, 0.35);
        }
        .entry-item .entry-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .entry-item .entry-name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text);
        }
        .entry-item.selected .entry-name {
            color: #fff;
        }
        .entry-item .entry-meta {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .entry-item .entry-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .entry-item:hover .entry-actions,
        .entry-item.selected .entry-actions {
            opacity: 1;
        }
        .entry-item .entry-actions button {
            min-height: 30px;
            width: 30px;
            padding: 0;
            font-size: 14px;
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
        }
        .entry-item .entry-actions button:hover {
            background: var(--panel3);
            color: #fff;
        }
        .entry-item .entry-actions button.del:hover {
            color: var(--danger);
        }

        /* プレビューパネル */
        .preview-panel {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-height: 380px;
            position: relative;
        }
        .preview-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preview-toolbar .current-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .preview-toolbar .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .preview-toolbar .actions button {
            min-height: 36px;
            padding: 0 12px;
            font-size: 13px;
            border-radius: 10px;
        }

        .device-stage {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 340px;
            padding: 8px 0;
            position: relative;
        }

        /* iPhone 17 Pro フレーム */
        .device-frame.iphone {
            position: relative;
            width: min(340px, 78vw);
            aspect-ratio: 393 / 852;
            background: #000;
            border: 6px solid #202023;
            border-radius: 42px;
            overflow: hidden;
            box-shadow: 0 18px 55px #000, 0 0 0 1px #444;
            transition: all 0.25s ease;
        }
        .device-frame.iphone iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
            color-scheme: light;
        }
        .device-frame.iphone .island {
            position: absolute;
            z-index: 5;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 108px;
            height: 33px;
            background: #000;
            border-radius: 20px;
            pointer-events: none;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.02);
        }
        .device-frame.iphone .homebar {
            position: absolute;
            z-index: 6;
            bottom: 7px;
            left: 50%;
            transform: translateX(-50%);
            width: 108px;
            height: 4px;
            border-radius: 4px;
            background: #fff;
            pointer-events: none;
            opacity: 0.95;
        }

        /* iPad 第7世代 フレーム（横固定） */
        .device-frame.ipad {
            position: relative;
            width: min(560px, 92vw);
            aspect-ratio: 1024 / 768;
            background: #000;
            border: 7px solid #202023;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 18px 55px #000, 0 0 0 1px #444;
            transition: all 0.25s ease;
        }
        .device-frame.ipad iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
            color-scheme: light;
        }
        .device-frame.ipad .homebar {
            display: none;
        }
        .device-frame.ipad .island {
            display: none;
        }

        .device-label {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-top: 4px;
        }

        .no-selection {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--muted);
            font-size: 15px;
            min-height: 300px;
            text-align: center;
            padding: 20px;
        }
        .no-selection .icon {
            font-size: 48px;
            opacity: 0.5;
        }

        /* ── 編集画面 ── */
        #editView {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #editView.hidden {
            display: none;
        }
        .edit-topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .edit-topbar .back-btn {
            min-height: 40px;
            width: 40px;
            padding: 0;
            font-size: 20px;
            background: var(--panel2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .edit-topbar .name-input-wrap {
            flex: 1;
            min-width: 140px;
        }
        .edit-topbar input {
            width: 100%;
            height: 44px;
            background: #111113;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 14px;
            outline: none;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            transition: border-color 0.15s;
        }
        .edit-topbar input:focus {
            border-color: var(--accent);
        }
        .edit-status {
            font-size: 12px;
            color: var(--muted);
            padding: 2px 4px;
            min-height: 18px;
        }
        #sourceEditor {
            width: 100%;
            height: 50vh;
            min-height: 280px;
            resize: vertical;
            background: #111113;
            color: #f5f5f7;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            outline: none;
            font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
            line-height: 1.5;
            transition: border-color 0.15s;
        }
        #sourceEditor:focus {
            border-color: var(--accent);
        }
        .edit-bottom-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* ── 全画面プレビュー ── */
        #fullscreenOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #000;
            display: none;
            flex-direction: column;
        }
        #fullscreenOverlay.show {
            display: flex;
        }
        #fullscreenOverlay .fs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(30, 30, 32, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
            flex-shrink: 0;
        }
        #fullscreenOverlay .fs-header .fs-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #fullscreenOverlay .fs-header .fs-device {
            font-size: 12px;
            color: var(--muted);
            margin-left: 8px;
        }
        #fullscreenOverlay .fs-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: auto;
            background: #0a0a0c;
        }
        #fullscreenOverlay .fs-body .fs-frame-wrap {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.8);
            background: #fff;
            aspect-ratio: auto;
        }
        #fullscreenOverlay .fs-body .fs-frame-wrap.iphone-mode {
            aspect-ratio: 393 / 852;
            width: auto;
            max-width: 440px;
            max-height: 100%;
        }
        #fullscreenOverlay .fs-body .fs-frame-wrap.ipad-mode {
            aspect-ratio: 1024 / 768;
            width: 100%;
            max-width: 1000px;
            max-height: 100%;
        }
        #fullscreenOverlay .fs-body iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }
        #fullscreenOverlay .fs-exit {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 18px;
            background: rgba(60, 60, 65, 0.6);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        #fullscreenOverlay .fs-exit:hover {
            background: rgba(80, 80, 85, 0.7);
        }

        /* 共通 */
        .hidden {
            display: none !important;
        }

        /* スクロールバー */
        .list-panel::-webkit-scrollbar {
            width: 4px;
        }
        .list-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .list-panel::-webkit-scrollbar-thumb {
            background: var(--panel3);
            border-radius: 4px;
        }

        @media (max-width: 400px) {
            .device-frame.iphone {
                width: min(280px, 80vw);
                border-width: 5px;
                border-radius: 36px;
            }
            .device-frame.iphone .island {
                width: 90px;
                height: 28px;
                top: 8px;
            }
            .device-frame.iphone .homebar {
                width: 90px;
                bottom: 5px;
                height: 3px;
            }
            .device-frame.ipad {
                width: min(320px, 92vw);
                border-width: 5px;
                border-radius: 18px;
            }
            .preview-panel {
                padding: 10px;
                min-height: 300px;
            }
            .device-stage {
                min-height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>📱 HTML マルチプレビュー</h1>
            <div class="header-actions">
                <button id="btnNewEntry" class="primary">＋ 新規作成</button>
            </div>
        </header>

        <!-- ═══ メイン画面 ═══ -->
        <section id="mainView">
            <!-- デバイス切替 -->
            <div class="device-switch" id="deviceSwitch">
                <button data-device="iphone" class="active">
                    <span class="dev-icon">📱</span> iPhone 17 Pro
                </button>
                <button data-device="ipad">
                    <span class="dev-icon">🖥️</span> iPad 7th (横)
                </button>
            </div>

            <div class="main-layout">
                <!-- HTML一覧 -->
                <aside class="list-panel" id="listPanel">
                    <div class="list-header">
                        <span>HTML一覧</span>
                        <span class="count-badge" id="entryCount">0件</span>
                    </div>
                    <div id="entryList">
                        <!-- 動的に生成 -->
                    </div>
                </aside>

                <!-- プレビュー -->
                <div class="preview-panel">
                    <div class="preview-toolbar">
                        <span class="current-name" id="currentEntryName">未選択</span>
                        <div class="actions">
                            <button id="btnEditCurrent" class="small ghost">✏️ 編集</button>
                            <button id="btnFullscreen" class="small primary">⛶ 全画面</button>
                        </div>
                    </div>
                    <div class="device-stage" id="deviceStage">
                        <!-- プレビューフレームがここに入る -->
                        <div class="no-selection" id="noSelection">
                            <div class="icon">📂</div>
                            <div>左のリストからHTMLを選択してください</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ═══ 編集画面 ═══ -->
        <section id="editView" class="hidden">
            <div class="edit-topbar">
                <button id="btnBackToList" class="back-btn" title="戻る">←</button>
                <div class="name-input-wrap">
                    <input type="text" id="entryNameInput" placeholder="HTMLの名前を入力" autocomplete="off" maxlength="80">
                </div>
                <button id="btnSaveEdit" class="primary">保存</button>
            </div>
            <div class="edit-status" id="editStatus">編集中...</div>
            <textarea id="sourceEditor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
            <div class="edit-bottom-actions">
                <span style="font-size:12px;color:var(--muted);margin-right:auto;" id="editCharCount">0文字</span>
                <button id="btnDuplicateEntry" class="ghost">複製</button>
                <button id="btnDeleteEntry" class="danger">削除</button>
            </div>
        </section>
    </div>

    <!-- ═══ 全画面プレビュー ═══ -->
    <div id="fullscreenOverlay">
        <div class="fs-header">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                <span class="fs-name" id="fsName">プレビュー</span>
                <span class="fs-device" id="fsDeviceLabel">iPhone 17 Pro</span>
            </div>
            <button class="fs-exit" id="btnFsExit">✕</button>
        </div>
        <div class="fs-body">
            <div class="fs-frame-wrap iphone-mode" id="fsFrameWrap">
                <iframe id="fullFrame" title="Full screen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ─── 定数 ───
            const STORAGE_KEY = 'html-manager-entries-v2';
            const SELECTED_KEY = 'html-manager-selected-v2';
            const DEVICE_KEY = 'html-manager-device-v2';
            const DEFAULT_HTML = `<!doctype html>
        <html lang="ja">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>サンプルページ</title>
        <style>
        body{font-family:-apple-system,sans-serif;margin:0;padding:40px 20px;background:#f5f5f7;color:#1c1c1e;text-align:center}
        h1{font-size:28px;margin-bottom:12px}
        p{color:#666;line-height:1.6}
        .btn{display:inline-block;background:#0a84ff;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:600;margin-top:16px}
        </style>
        </head>
        <body>
        <h1>✨ サンプルHTML</h1>
        <p>このHTMLはテスト用のサンプルです。<br>自由に編集して、プレビューを確認してください。</p>
        <a class="btn" href="#">ボタン</a>
        </body>
        </html>`;

            // ─── 状態 ───
            let entries = []; // {id, name, html, updatedAt}
            let selectedId = null;
            let currentDevice = 'iphone'; // 'iphone' | 'ipad'
            let editingId = null; // 現在編集中のエントリID（nullなら新規）
            let isDirty = false;

            // ─── DOM参照 ───
            const $ = id => document.getElementById(id);
            const mainView = $('mainView');
            const editView = $('editView');
            const entryList = $('entryList');
            const entryCount = $('entryCount');
            const currentEntryName = $('currentEntryName');
            const deviceStage = $('deviceStage');
            const noSelection = $('noSelection');
            const deviceSwitch = $('deviceSwitch');
            const sourceEditor = $('sourceEditor');
            const entryNameInput = $('entryNameInput');
            const editStatus = $('editStatus');
            const editCharCount = $('editCharCount');
            const fullscreenOverlay = $('fullscreenOverlay');
            const fullFrame = $('fullFrame');
            const fsFrameWrap = $('fsFrameWrap');
            const fsName = $('fsName');
            const fsDeviceLabel = $('fsDeviceLabel');

            // ─── 初期化・ロード ───
            function loadEntries() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        entries = JSON.parse(raw);
                        if (!Array.isArray(entries)) entries = [];
                    } else {
                        // 初回: サンプルエントリを作成
                        entries = [{
                            id: generateId(),
                            name: 'サンプルHTML',
                            html: DEFAULT_HTML,
                            updatedAt: Date.now()
                        }];
                        saveEntries();
                    }
                } catch (e) {
                    console.error('Failed to load entries:', e);
                    entries = [];
                }
                // フィルタ: 不正なエントリを除去
                entries = entries.filter(e => e && typeof e.id === 'string' && typeof e.html === 'string');
                if (entries.length === 0) {
                    entries = [{
                        id: generateId(),
                        name: 'サンプルHTML',
                        html: DEFAULT_HTML,
                        updatedAt: Date.now()
                    }];
                    saveEntries();
                }
            }

            function loadSelected() {
                const saved = localStorage.getItem(SELECTED_KEY);
                if (saved && entries.some(e => e.id === saved)) {
                    selectedId = saved;
                } else if (entries.length > 0) {
                    selectedId = entries[0].id;
                } else {
                    selectedId = null;
                }
            }

            function loadDevice() {
                const saved = localStorage.getItem(DEVICE_KEY);
                if (saved === 'ipad' || saved === 'iphone') {
                    currentDevice = saved;
                }
                updateDeviceSwitchUI();
            }

            function generateId() {
                return 'entry_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
            }

            function saveEntries() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
                } catch (e) {
                    console.error('Failed to save entries:', e);
                }
            }

            function saveSelected() {
                if (selectedId) {
                    localStorage.setItem(SELECTED_KEY, selectedId);
                } else {
                    localStorage.removeItem(SELECTED_KEY);
                }
            }

            function saveDevice() {
                localStorage.setItem(DEVICE_KEY, currentDevice);
            }

            // ─── エントリ操作 ───
            function getEntry(id) {
                return entries.find(e => e.id === id) || null;
            }

            function getSelectedEntry() {
                return getEntry(selectedId);
            }

            function createEntry(name, html) {
                const entry = {
                    id: generateId(),
                    name: name || '新しいHTML',
                    html: html || '',
                    updatedAt: Date.now()
                };
                entries.push(entry);
                saveEntries();
                return entry;
            }

            function updateEntry(id, updates) {
                const entry = getEntry(id);
                if (entry) {
                    Object.assign(entry, updates);
                    entry.updatedAt = Date.now();
                    saveEntries();
                }
            }

            function deleteEntry(id) {
                entries = entries.filter(e => e.id !== id);
                saveEntries();
                if (selectedId === id) {
                    selectedId = entries.length > 0 ? entries[0].id : null;
                    saveSelected();
                }
                if (editingId === id) {
                    editingId = null;
                }
            }

            function duplicateEntry(id) {
                const src = getEntry(id);
                if (src) {
                    const copy = createEntry(src.name + ' (コピー)', src.html);
                    return copy;
                }
                return null;
            }

            // ─── レンダリング ───
            function renderList() {
                entryCount.textContent = entries.length + '件';

                if (entries.length === 0) {
                    entryList.innerHTML = '<div class="list-empty">HTMLがありません。<br>「＋ 新規作成」から作成してください。</div>';
                    return;
                }

                let html = '';
                entries.forEach(entry => {
                    const isSelected = entry.id === selectedId;
                    const name = escapeHtml(entry.name || '(名前なし)');
                    const dateStr = formatDate(entry.updatedAt);
                    const previewChars = entry.html ? entry.html.length : 0;
                    html += `
                <button class="entry-item ${isSelected ? 'selected' : ''}" data-id="${entry.id}">
                  <div class="entry-info">
                    <span class="entry-name">${name}</span>
                    <span class="entry-meta">${dateStr} · ${previewChars.toLocaleString()}文字</span>
                  </div>
                  <div class="entry-actions" data-actions="${entry.id}">
                    <button class="edit-btn" data-id="${entry.id}" title="編集">✏️</button>
                    <button class="del-btn" data-id="${entry.id}" title="削除">🗑️</button>
                  </div>
                </button>`;
                });
                entryList.innerHTML = html;

                // イベント付与
                entryList.querySelectorAll('.entry-item').forEach(item => {
                    const id = item.dataset.id;
                    // 項目クリック → 選択してプレビュー更新
                    item.addEventListener('click', (e) => {
                        // アクションボタンクリックは別処理
                        if (e.target.closest('.edit-btn') || e.target.closest('.del-btn')) return;
                        selectEntry(id);
                    });
                    // 編集ボタン
                    const editBtn = item.querySelector('.edit-btn');
                    if (editBtn) {
                        editBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            startEdit(id);
                        });
                    }
                    // 削除ボタン
                    const delBtn = item.querySelector('.del-btn');
                    if (delBtn) {
                        delBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handleDelete(id);
                        });
                    }
                });
            }

            function renderPreview() {
                const entry = getSelectedEntry();
                if (!entry) {
                    noSelection.classList.remove('hidden');
                    // 既存のフレームを削除
                    const existing = deviceStage.querySelector('.device-frame');
                    if (existing) existing.remove();
                    currentEntryName.textContent = '未選択';
                    return;
                }

                noSelection.classList.add('hidden');
                currentEntryName.textContent = entry.name || '(名前なし)';

                // 既存フレームを削除
                const existingFrame = deviceStage.querySelector('.device-frame');
                if (existingFrame) existingFrame.remove();

                // デバイスフレーム作成
                const frameDiv = document.createElement('div');
                frameDiv.className = `device-frame ${currentDevice}`;
                if (currentDevice === 'iphone') {
                    frameDiv.innerHTML = `
                <div class="island"></div>
                <iframe sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
                <div class="homebar"></div>`;
                } else {
                    frameDiv.innerHTML = `
                <iframe sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>`;
                }
                const iframe = frameDiv.querySelector('iframe');
                iframe.srcdoc = entry.html;
                deviceStage.appendChild(frameDiv);
            }

            function renderAll() {
                renderList();
                renderPreview();
            }

            function selectEntry(id) {
                if (!getEntry(id)) return;
                selectedId = id;
                saveSelected();
                renderList();
                renderPreview();
            }

            function updateDeviceSwitchUI() {
                deviceSwitch.querySelectorAll('button').forEach(btn => {
                    const dev = btn.dataset.device;
                    if (dev === currentDevice) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            // ─── 画面遷移 ───
            function showMainView() {
                mainView.classList.remove('hidden');
                editView.classList.add('hidden');
                isDirty = false;
                renderAll();
            }

            function showEditView() {
                mainView.classList.add('hidden');
                editView.classList.remove('hidden');
                sourceEditor.focus();
                updateEditCharCount();
            }

            function startEdit(id) {
                editingId = id;
                const entry = getEntry(id);
                if (entry) {
                    entryNameInput.value = entry.name || '';
                    sourceEditor.value = entry.html || '';
                } else {
                    entryNameInput.value = '';
                    sourceEditor.value = '';
                }
                editStatus.textContent = '編集中...';
                updateEditCharCount();
                showEditView();
            }

            function startNewEntry() {
                editingId = null;
                entryNameInput.value = '';
                sourceEditor.value = '';
                editStatus.textContent = '新規作成...';
                updateEditCharCount();
                showEditView();
            }

            function saveEdit() {
                const name = entryNameInput.value.trim() || '無名HTML';
                const html = sourceEditor.value;

                if (editingId) {
                    // 既存更新
                    updateEntry(editingId, { name, html });
                    selectedId = editingId;
                } else {
                    // 新規作成
                    const newEntry = createEntry(name, html);
                    selectedId = newEntry.id;
                    editingId = newEntry.id;
                }
                saveSelected();
                isDirty = false;
                editStatus.textContent = '保存済み ✓';
                setTimeout(() => { editStatus.textContent = '編集中...'; }, 1200);
                // プレビュー更新
                renderList();
                // メイン画面に戻る
                showMainView();
            }

            function handleDelete(id) {
                const entry = getEntry(id);
                if (!entry) return;
                if (!confirm(`「${entry.name}」を削除しますか？`)) return;
                deleteEntry(id);
                renderAll();
                if (editingId === id) {
                    editingId = null;
                    showMainView();
                }
            }

            function handleDuplicate(id) {
                const copy = duplicateEntry(id);
                if (copy) {
                    selectedId = copy.id;
                    saveSelected();
                    renderAll();
                    // 編集画面で複製を開く
                    startEdit(copy.id);
                }
            }

            // ─── 全画面プレビュー ───
            function openFullscreen() {
                const entry = getSelectedEntry();
                if (!entry) return;
                fsName.textContent = entry.name || '(名前なし)';
                fsDeviceLabel.textContent = currentDevice === 'iphone' ? 'iPhone 17 Pro' : 'iPad 7th gen (横)';
                // フレームクラス切替
                fsFrameWrap.className = 'fs-frame-wrap ' + (currentDevice === 'iphone' ? 'iphone-mode' : 'ipad-mode');
                fullFrame.srcdoc = entry.html;
                fullscreenOverlay.classList.add('show');
            }

            function closeFullscreen() {
                fullscreenOverlay.classList.remove('show');
                fullFrame.srcdoc = '';
            }

            // ─── ユーティリティ ───
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function formatDate(timestamp) {
                if (!timestamp) return '不明';
                const d = new Date(timestamp);
                const now = new Date();
                const diff = now - d;
                if (diff < 60000) return '今';
                if (diff < 3600000) return Math.floor(diff / 60000) + '分前';
                if (diff < 86400000) return Math.floor(diff / 3600000) + '時間前';
                if (d.getFullYear() === now.getFullYear()) {
                    return `${d.getMonth()+1}/${d.getDate()}`;
                }
                return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
            }

            function updateEditCharCount() {
                editCharCount.textContent = sourceEditor.value.length.toLocaleString() + '文字';
            }

            // ─── イベント登録 ───
            // デバイス切替
            deviceSwitch.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dev = btn.dataset.device;
                    if (dev !== currentDevice) {
                        currentDevice = dev;
                        saveDevice();
                        updateDeviceSwitchUI();
                        renderPreview();
                    }
                });
            });

            // 新規作成
            $('btnNewEntry').addEventListener('click', startNewEntry);
            // 編集ボタン（プレビューパネル内）
            $('btnEditCurrent').addEventListener('click', () => {
                if (selectedId) startEdit(selectedId);
            });
            // 全画面
            $('btnFullscreen').addEventListener('click', openFullscreen);
            // 編集画面のボタン
            $('btnBackToList').addEventListener('click', () => {
                if (isDirty) {
                    if (!confirm('変更が保存されていません。破棄して戻りますか？')) return;
                }
                showMainView();
            });
            $('btnSaveEdit').addEventListener('click', saveEdit);
            $('btnDeleteEntry').addEventListener('click', () => {
                if (editingId) {
                    handleDelete(editingId);
                }
            });
            $('btnDuplicateEntry').addEventListener('click', () => {
                if (editingId) {
                    handleDuplicate(editingId);
                }
            });
            // 全画面の閉じる
            $('btnFsExit').addEventListener('click', closeFullscreen);
            // Escapeキーで全画面閉じる
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && fullscreenOverlay.classList.contains('show')) {
                    closeFullscreen();
                }
                // Cmd/Ctrl+S で保存
                if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                    e.preventDefault();
                    if (!editView.classList.contains('hidden')) {
                        saveEdit();
                    }
                }
            });
            // 編集画面の入力監視
            sourceEditor.addEventListener('input', () => {
                isDirty = true;
                editStatus.textContent = '編集中...';
                updateEditCharCount();
            });
            entryNameInput.addEventListener('input', () => {
                isDirty = true;
                editStatus.textContent = '編集中...';
            });

            // ─── 起動 ───
            function init() {
                loadEntries();
                loadSelected();
                loadDevice();
                renderAll();
            }

            init();
        })();
    </script>
</body>
</html>
