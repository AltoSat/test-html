<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Previewer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button,textarea,input{font:inherit}
button{border:0;color:var(--text);background:var(--panel2);border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #38383c}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}
.app{max-width:1100px;margin:auto}
header{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 2px 8px}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.header-actions button{min-height:36px;padding:0 14px;font-size:14px}

/* 横スクロールカードリスト */
.card-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:4px 2px 12px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.card{
  flex:0 0 auto;
  width:160px;
  min-height:80px;
  background:var(--panel);
  border-radius:16px;
  padding:12px 14px;
  border:2px solid transparent;
  cursor:pointer;
  scroll-snap-align:start;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:border-color .15s,background .15s;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
.card:active{background:var(--panel2)}
.card.active{border-color:var(--accent);background:#0a84ff18}
.card-name{
  font-weight:600;
  font-size:14px;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:8px;
}
.card-new{
  background:transparent;
  border:2px dashed #3a3a3c;
  justify-content:center;
  align-items:center;
  color:var(--muted);
  font-size:32px;
  font-weight:300;
}
.card-new:active{background:var(--panel2)}
.card-empty{
  width:100%;
  text-align:center;
  color:var(--muted);
  padding:24px 12px;
  font-size:14px;
}

/* デバイスプレビュー */
.devices{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  align-items:flex-start;
  padding:4px 0 24px;
}
.device-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.device-label{
  font-size:12px;
  color:var(--muted);
  font-weight:500;
  transition:color .15s;
}
.device-wrap.selected .device-label{color:var(--accent)}
.phone-frame{
  position:relative;
  width:min(320px,55vw);
  aspect-ratio:393/852;
  background:#000;
  border:6px solid #202023;
  border-radius:40px;
  overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
  transition:box-shadow .2s,border-color .2s;
}
.device-wrap.selected .phone-frame{
  border-color:var(--accent);
  box-shadow:0 14px 40px #000,0 0 0 2px var(--accent);
}
.ipad-frame{
  position:relative;
  width:min(420px,82vw);
  aspect-ratio:4/3;
  background:#000;
  border:8px solid #2a2a2e;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
  transition:box-shadow .2s,border-color .2s;
}
.device-wrap.selected .ipad-frame{
  border-color:var(--accent);
  box-shadow:0 14px 40px #000,0 0 0 2px var(--accent);
}
/* iframe スケーリング用 */
.phone-frame iframe,
.ipad-frame iframe{
  position:absolute;
  top:0;
  left:0;
  transform-origin:top left;
  border:0;
  background:#000;
  color-scheme:dark;
}
/* ダイナミックアイランド（比率調整） */
.island{
  position:absolute;
  z-index:5;
  top:9px;
  left:50%;
  transform:translateX(-50%);
  width:32%;
  aspect-ratio:126/37;
  background:#000;
  border-radius:18px;
  pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.03);
}
/* ホームバー（比率調整） */
.homebar{
  position:absolute;
  z-index:6;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  width:34%;
  height:5px;
  border-radius:5px;
  background:#fff;
  pointer-events:none;
  opacity:.9;
}
.ipad-bezel{
  position:absolute;
  z-index:5;
  top:50%;
  left:6px;
  transform:translateY(-50%);
  width:4px;
  height:28px;
  background:#1a1a1c;
  border-radius:2px;
  pointer-events:none;
}

/* エディタ */
.editor-panel{display:none}
.editor-panel.show{display:block}
.editor-tools{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
  flex-wrap:wrap;
}
.editor-tools .name-input{
  flex:1;
  min-width:120px;
  height:40px;
  border:1px solid #38383c;
  border-radius:12px;
  background:#111113;
  color:#fff;
  padding:0 12px;
  outline:none;
}
.editor-tools .name-input:focus{border-color:var(--accent)}
#count{font-size:13px;color:var(--muted);white-space:nowrap}
.search-box{
  display:flex;
  align-items:center;
  gap:5px;
  flex:1;
  min-width:180px;
}
.search-box input{
  width:100%;
  height:40px;
  border:1px solid #38383c;
  border-radius:12px;
  background:#111113;
  color:#fff;
  padding:0 11px;
  outline:none;
}
.search-box button{
  min-height:40px;
  padding:0 12px;
  font-size:13px;
  flex-shrink:0;
}
#searchResult{font-size:11px;color:var(--muted);white-space:nowrap}
textarea{
  width:100%;
  height:min(50vh,380px);
  resize:vertical;
  background:#111113;
  color:#f5f5f7;
  border:1px solid #38383c;
  border-radius:14px;
  padding:14px;
  outline:none;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace;
  line-height:1.5;
}
textarea:focus{border-color:var(--accent)}
.status{font-size:12px;color:var(--muted);padding:2px 4px 8px}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.editor-actions button{flex:1;min-width:90px}

/* 全画面 */
.fullscreen{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  padding:0;
  display:none;
}
.fullscreen.show{display:block}
.fullscreen iframe{width:100%;height:100%;border:0}
.fullscreen .exit{
  position:absolute;
  z-index:10;
  top:max(12px,env(safe-area-inset-top));
  right:14px;
  width:44px;
  height:44px;
  padding:0;
  border-radius:50%;
  background:rgba(60,60,65,.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#fff;
  font-size:20px;
}

@media(min-width:800px){
  .phone-frame{width:min(340px,45vw)}
  .ipad-frame{width:min(460px,50vw)}
  textarea{height:min(55vh,420px)}
  .card{width:180px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-actions">
      <button id="btnFull" class="primary">全画面</button>
    </div>
  </header>

  <!-- 一覧・プレビュー -->
  <section id="listPanel" class="list-panel show">
    <div id="cardScroll" class="card-scroll"></div>

    <div class="devices">
      <div class="device-wrap selected" id="phoneWrap">
        <div class="device-label">iPhone 17 Pro</div>
        <div class="phone-frame" id="phoneFrame">
          <div class="island"></div>
          <iframe id="framePhone" title="iPhone preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          <div class="homebar"></div>
        </div>
      </div>
      <div class="device-wrap" id="ipadWrap">
        <div class="device-label">iPad 第7世代（横）</div>
        <div class="ipad-frame" id="ipadFrame">
          <div class="ipad-bezel"></div>
          <iframe id="frameIpad" title="iPad preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- エディタ -->
  <section id="editorPanel" class="editor-panel">
    <div class="editor-tools">
      <input id="nameInput" class="name-input" type="text" placeholder="名前を入力" maxlength="80" autocomplete="off">
      <span id="count">0文字</span>
      <div class="search-box">
        <input id="search" type="search" placeholder="検索" autocomplete="off">
        <span id="searchResult"></span>
        <button id="btnNextSearch" class="ghost">次へ</button>
      </div>
    </div>
    <div class="status">HTML・CSS・JavaScriptをそのまま貼り付けてください。保存すると一覧に反映されます。</div>
    <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
    <div class="editor-actions">
      <button id="btnSave" class="primary">保存して一覧へ</button>
      <button id="btnDeleteCurrent" class="danger">削除</button>
      <button id="btnClear" class="ghost">クリア</button>
      <button id="btnCancel" class="ghost">キャンセル</button>
    </div>
  </section>
</div>

<div id="fullscreen" class="fullscreen">
  <button class="exit" id="exit">×</button>
  <iframe id="fullFrame" title="Full screen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "pwa-previewer-items-v2";
  const OLD_KEY = "iphone17pro-pwa-preview-html-v1";

  let items = [];
  let selectedId = null;
  let editingId = null; // null = new
  let selectedDevice = 'phone'; // 'phone' or 'ipad'

  const source = $("source");
  const nameInput = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad = $("frameIpad");
  const fullFrame = $("fullFrame");
  const phoneFrame = $("phoneFrame");
  const ipadFrame = $("ipadFrame");

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        const old = localStorage.getItem(OLD_KEY);
        if (old) {
          items = [{
            id: uid(),
            name: "移行したHTML",
            html: old,
            updated: Date.now()
          }];
          persist();
        }
      }
    } catch (e) {
      items = [];
    }
    if (items.length && !selectedId) selectedId = items[0].id;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const h = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `${m}/${day} ${h}:${min}`;
  }

  function renderCards() {
    const scroll = $("cardScroll");
    if (!items.length) {
      scroll.innerHTML = `<div class="card-empty">まだHTMLがありません。<br>右の「＋」カードから追加してください。</div>`;
      clearPreviews();
      return;
    }
    const sorted = items.slice().sort((a, b) => b.updated - a.updated);
    let html = sorted.map(it => `
      <div class="card ${it.id === selectedId ? "active" : ""}" data-id="${it.id}">
        <div class="card-name">${escapeHtml(it.name || "無題")}</div>
        <div class="card-meta">${formatDate(it.updated)} · ${(it.html || "").length.toLocaleString()}字</div>
      </div>
    `).join("");
    html += `<div class="card card-new" id="cardNew">＋</div>`;
    scroll.innerHTML = html;

    // カードのイベント
    scroll.querySelectorAll(".card:not(.card-new)").forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedId = el.dataset.id;
        renderCards();
        updatePreview();
      });
      // 長押し（タッチ）
      let longPressTimer = null;
      let longPressTriggered = false;
      el.addEventListener('touchstart', (e) => {
        longPressTriggered = false;
        longPressTimer = setTimeout(() => {
          longPressTriggered = true;
          selectedId = el.dataset.id;
          renderCards();
          updatePreview();
          showEditor(false);
        }, 600);
      }, {passive: false});
      el.addEventListener('touchend', (e) => {
        clearTimeout(longPressTimer);
        if (longPressTriggered) {
          e.preventDefault(); // クリック抑止
        }
      });
      el.addEventListener('touchmove', () => clearTimeout(longPressTimer), {passive: true});
      // デスクトップ向け右クリック
      el.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        selectedId = el.dataset.id;
        renderCards();
        updatePreview();
        showEditor(false);
      });
    });

    const newCard = $("cardNew");
    if (newCard) {
      newCard.addEventListener('click', () => showEditor(true));
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function clearPreviews() {
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  function updatePreview() {
    const it = items.find(x => x.id === selectedId);
    if (!it) {
      clearPreviews();
      return;
    }
    const html = it.html || "";
    framePhone.srcdoc = html;
    frameIpad.srcdoc = html;
  }

  function showList() {
    $("listPanel").classList.add("show");
    $("editorPanel").classList.remove("show");
    renderCards();
    updatePreview();
    resizeIframes();
  }

  function showEditor(isNew) {
    $("listPanel").classList.remove("show");
    $("editorPanel").classList.add("show");

    if (isNew) {
      editingId = null;
      nameInput.value = "";
      source.value = "";
    } else {
      const it = items.find(x => x.id === selectedId);
      if (!it) {
        editingId = null;
        nameInput.value = "";
        source.value = "";
      } else {
        editingId = it.id;
        nameInput.value = it.name || "";
        source.value = it.html || "";
      }
    }
    updateCount();
    $("search").value = "";
    $("searchResult").textContent = "";
    nameInput.focus();
  }

  function updateCount() {
    $("count").textContent = source.value.length.toLocaleString() + "文字";
  }

  function saveCurrent() {
    const name = (nameInput.value || "").trim() || "無題";
    const html = source.value;
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) {
        it.name = name;
        it.html = html;
        it.updated = Date.now();
      }
      selectedId = editingId;
    } else {
      const id = uid();
      items.push({ id, name, html, updated: Date.now() });
      selectedId = id;
    }
    persist();
    showList();
  }

  function deleteCurrentFromEditor() {
    if (!editingId) {
      alert("新規作成中は削除できません。");
      return;
    }
    const it = items.find(x => x.id === editingId);
    if (!it) return;
    if (!confirm(`「${it.name || "無題"}」を削除しますか？`)) return;
    items = items.filter(x => x.id !== editingId);
    selectedId = items.length ? items[0].id : null;
    editingId = null;
    persist();
    showList();
  }

  // デバイス選択
  function selectDevice(device) {
    selectedDevice = device;
    $("phoneWrap").classList.toggle("selected", device === 'phone');
    $("ipadWrap").classList.toggle("selected", device === 'ipad');
  }
  $("phoneWrap").addEventListener('click', () => selectDevice('phone'));
  $("ipadWrap").addEventListener('click', () => selectDevice('ipad'));

  // 全画面ボタン
  $("btnFull").addEventListener('click', () => {
    const it = items.find(x => x.id === selectedId);
    if (!it) return;
    fullFrame.srcdoc = it.html || "";
    $("fullscreen").classList.add("show");
  });

  $("exit").addEventListener('click', () => {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
  });

  // エディタ内検索
  let searchIndex = -1;
  function findMatches(query) {
    const text = source.value;
    const matches = [];
    if (!query) return matches;
    let pos = 0;
    while ((pos = text.indexOf(query, pos)) !== -1) {
      matches.push(pos);
      pos += Math.max(query.length, 1);
    }
    return matches;
  }
  function updateSearchResult() {
    const q = $("search").value;
    if (!q) {
      $("searchResult").textContent = "";
      return;
    }
    const matches = findMatches(q);
    $("searchResult").textContent = matches.length ? `${matches.length}件` : "0件";
    if (matches.length) searchIndex = -1; // リセット
  }
  $("search").addEventListener('input', updateSearchResult);
  $("btnNextSearch").addEventListener('click', () => {
    const q = $("search").value;
    if (!q) return;
    const matches = findMatches(q);
    if (!matches.length) {
      $("searchResult").textContent = "0件";
      return;
    }
    searchIndex = (searchIndex + 1) % matches.length;
    const pos = matches[searchIndex];
    source.focus();
    source.setSelectionRange(pos, pos + q.length);
    // スクロール位置調整
    const lineHeight = 20; // おおよその行の高さ
    const textBefore = source.value.substring(0, pos);
    const lineNumber = textBefore.split('\n').length - 1;
    const scrollTop = lineNumber * lineHeight - source.clientHeight / 2 + lineHeight;
    source.scrollTop = Math.max(0, scrollTop);
    $("searchResult").textContent = `${searchIndex + 1}/${matches.length}件`;
  });

  // iframeスケーリング
  function resizeIframes() {
    // iPhone
    const phoneWidth = phoneFrame.clientWidth;
    const phoneHeight = phoneFrame.clientHeight;
    const phoneTargetWidth = 393;
    const phoneTargetHeight = 852;
    const phoneScale = Math.min(phoneWidth / phoneTargetWidth, phoneHeight / phoneTargetHeight);
    framePhone.style.width = phoneTargetWidth + 'px';
    framePhone.style.height = phoneTargetHeight + 'px';
    framePhone.style.transform = `scale(${phoneScale})`;

    // iPad
    const ipadWidth = ipadFrame.clientWidth;
    const ipadHeight = ipadFrame.clientHeight;
    const ipadTargetWidth = 1024;
    const ipadTargetHeight = 768;
    const ipadScale = Math.min(ipadWidth / ipadTargetWidth, ipadHeight / ipadTargetHeight);
    frameIpad.style.width = ipadTargetWidth + 'px';
    frameIpad.style.height = ipadTargetHeight + 'px';
    frameIpad.style.transform = `scale(${ipadScale})`;
  }

  window.addEventListener('resize', () => {
    if ($("listPanel").classList.contains('show')) resizeIframes();
  });

  // イベントリスナー
  $("btnSave").addEventListener('click', saveCurrent);
  $("btnCancel").addEventListener('click', showList);
  $("btnClear").addEventListener('click', () => {
    source.value = "";
    updateCount();
    $("search").value = "";
    $("searchResult").textContent = "";
    source.focus();
  });
  $("btnDeleteCurrent").addEventListener('click', deleteCurrentFromEditor);
  source.addEventListener('input', updateCount);

  // 初期化
  load();
  selectDevice('phone');
  showList();
})();
</script>
</body>
</html>
