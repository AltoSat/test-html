<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>PWA Previewer - iPhone 17 Pro</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #1c1c1e;
            --surface2: #2c2c2e;
            --text: #ffffff;
            --text2: #8e8e93;
            --accent: #0a84ff;
            --border: #3a3a3c;
            --radius: 14px;
            --iphone-width: 402px;
            --iphone-height: 874px;
            --iphone-frame: 10px;
            --iphone-radius: 55px;
            --frame-radius: calc(var(--iphone-radius) + var(--iphone-frame));
            --sat: 59px;
            --sab: 34px;
            --di-width: 126px;
            --di-height: 37px;
            --di-top: 11px;
            --hi-width: 140px;
            --hi-height: 5px;
            --hi-bottom: 8px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
        }
        .app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            height: 100dvh;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            background: var(--bg);
            overflow: hidden;
        }
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            min-height: 52px;
            flex-shrink: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 50;
        }
        .header-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .header-badge {
            font-size: 11px;
            font-weight: 500;
            color: var(--text2);
            background: var(--surface);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.01em;
        }
        /* Segmented Control */
        .segmented {
            display: flex;
            flex-shrink: 0;
            margin: 10px 16px 8px;
            background: var(--surface);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }
        .segmented button {
            flex: 1;
            padding: 9px 0;
            font-size: 14px;
            font-weight: 500;
            border: none;
            background: transparent;
            color: var(--text2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            letter-spacing: 0.01em;
        }
        .segmented button.active {
            background: var(--surface2);
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
        .segmented button:active {
            opacity: 0.7;
        }
        /* Main area */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        /* Editor View */
        .editor-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            padding: 0 12px 12px;
            gap: 10px;
        }
        .editor-view.hidden {
            display: none;
        }
        .editor-textarea {
            flex: 1;
            width: 100%;
            resize: none;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            font-size: 13px;
            font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
            line-height: 1.5;
            outline: none;
            min-height: 200px;
            user-select: text;
            -webkit-user-select: text;
            -webkit-overflow-scrolling: touch;
            tab-size: 2;
        }
        .editor-textarea:focus {
            border-color: var(--accent);
        }
        .editor-textarea::placeholder {
            color: #555;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-height: 48px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 0.01em;
            white-space: nowrap;
            min-width: 0;
        }
        .btn:active {
            transform: scale(0.97);
            opacity: 0.8;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-tertiary {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        /* Preview View */
        .preview-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            position: relative;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .preview-view.hidden {
            display: none;
        }
        .iphone-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }
        .iphone-wrapper {
            position: relative;
            transform-origin: center center;
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }
        .iphone-frame {
            position: relative;
            width: calc(var(--iphone-width) + var(--iphone-frame) * 2);
            height: calc(var(--iphone-height) + var(--iphone-frame) * 2);
            background: #1a1a1a;
            border-radius: var(--frame-radius);
            box-shadow:
                0 0 0 2px #333,
                0 0 0 4px #1a1a1a,
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 4px 16px rgba(0, 0, 0, 0.5),
                inset 0 0 2px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            flex-shrink: 0;
        }
        .iphone-screen {
            position: absolute;
            top: var(--iphone-frame);
            left: var(--iphone-frame);
            width: var(--iphone-width);
            height: var(--iphone-height);
            border-radius: var(--iphone-radius);
            overflow: hidden;
            background: #000;
            z-index: 1;
        }
        .iphone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000;
        }
        .dynamic-island {
            position: absolute;
            top: var(--di-top);
            left: 50%;
            transform: translateX(-50%);
            width: var(--di-width);
            height: var(--di-height);
            background: #000;
            border-radius: 20px;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .dynamic-island::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1a1a2e;
            box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.8);
        }
        .home-indicator {
            position: absolute;
            bottom: var(--hi-bottom);
            left: 50%;
            transform: translateX(-50%);
            width: var(--hi-width);
            height: var(--hi-height);
            background: rgba(255, 255, 255, 0.8);
            border-radius: 3px;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .preview-controls {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            padding: 8px 12px 4px;
            width: 100%;
            max-width: 600px;
        }
        .preview-controls .btn {
            flex: 1;
            min-height: 44px;
            font-size: 14px;
            padding: 10px 14px;
        }
        /* Fullscreen mode */
        .app.fullscreen .header,
        .app.fullscreen .segmented,
        .app.fullscreen .preview-controls {
            display: none;
        }
        .app.fullscreen .main {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            background: #000;
        }
        .app.fullscreen .preview-view {
            padding: 0;
        }
        .app.fullscreen .iphone-frame {
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            border-radius: 0;
            box-shadow: none;
            background: #000;
        }
        .app.fullscreen .iphone-screen {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0;
        }
        .app.fullscreen .iphone-wrapper {
            width: 100%;
            height: 100%;
        }
        .app.fullscreen .dynamic-island {
            top: calc(var(--di-top) + env(safe-area-inset-top, 0px));
        }
        .app.fullscreen .home-indicator {
            bottom: calc(var(--hi-bottom) + env(safe-area-inset-bottom, 0px));
        }
        /* Desktop: keep frame in fullscreen */
        @media (min-width: 768px) {
            .app.fullscreen .iphone-frame {
                width: calc(var(--iphone-width) + var(--iphone-frame) * 2);
                height: calc(var(--iphone-height) + var(--iphone-frame) * 2);
                border-radius: var(--frame-radius);
                box-shadow:
                    0 0 0 2px #333,
                    0 0 0 4px #1a1a1a,
                    0 20px 60px rgba(0, 0, 0, 0.7),
                    0 4px 16px rgba(0, 0, 0, 0.5),
                    inset 0 0 2px rgba(255, 255, 255, 0.1);
                background: #1a1a1a;
            }
            .app.fullscreen .iphone-screen {
                top: var(--iphone-frame);
                left: var(--iphone-frame);
                width: var(--iphone-width);
                height: var(--iphone-height);
                border-radius: var(--iphone-radius);
            }
            .app.fullscreen .iphone-wrapper {
                width: auto;
                height: auto;
            }
            .app.fullscreen .dynamic-island {
                top: var(--di-top);
            }
            .app.fullscreen .home-indicator {
                bottom: var(--hi-bottom);
            }
        }
        /* Responsive scaling for small screens */
        @media (max-width: 480px) {
            .header {
                padding: 6px 12px;
                min-height: 46px;
            }
            .header-title {
                font-size: 15px;
            }
            .segmented {
                margin: 8px 10px 6px;
            }
            .segmented button {
                padding: 8px 0;
                font-size: 13px;
                min-height: 40px;
            }
            .editor-view {
                padding: 0 8px 8px;
                gap: 8px;
            }
            .btn {
                min-height: 44px;
                font-size: 14px;
                padding: 10px 12px;
                border-radius: 10px;
            }
            .preview-controls {
                padding: 6px 8px 2px;
                gap: 6px;
            }
            .preview-controls .btn {
                min-height: 40px;
                font-size: 13px;
                padding: 8px 10px;
            }
        }
        @media (max-width: 380px) {
            .btn {
                font-size: 13px;
                padding: 10px 8px;
                min-height: 42px;
            }
            .btn-row {
                gap: 6px;
            }
            .segmented button {
                font-size: 12px;
            }
        }
        /* Scrollbar for editor */
        .editor-textarea::-webkit-scrollbar {
            width: 6px;
        }
        .editor-textarea::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        .editor-textarea::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <span class="header-title">PWA Previewer</span>
            <span class="header-badge">iPhone 17 Pro</span>
        </header>
        <!-- Segmented Control -->
        <div class="segmented" id="segmented">
            <button id="btnEditorTab" class="active" aria-label="エディタ">エディタ</button>
            <button id="btnPreviewTab" aria-label="プレビュー">プレビュー</button>
        </div>
        <!-- Main -->
        <main class="main" id="main">
            <!-- Editor View -->
            <div class="editor-view" id="editorView">
                <textarea class="editor-textarea" id="editorTextarea" placeholder="ここにPWAのHTMLを貼り付けてください…" spellcheck="false"></textarea>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btnPreview">プレビュー</button>
                    <button class="btn btn-secondary" id="btnSample">サンプルHTML</button>
                    <button class="btn btn-tertiary" id="btnClear">クリア</button>
                </div>
            </div>
            <!-- Preview View -->
            <div class="preview-view hidden" id="previewView">
                <div class="iphone-stage" id="iphoneStage">
                    <div class="iphone-wrapper" id="iphoneWrapper">
                        <div class="iphone-frame" id="iphoneFrame">
                            <div class="iphone-screen" id="iphoneScreen">
                                <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin" loading="eager" title="PWAプレビュー"></iframe>
                            </div>
                            <div class="dynamic-island" id="dynamicIsland"></div>
                            <div class="home-indicator" id="homeIndicator"></div>
                        </div>
                    </div>
                </div>
                <div class="preview-controls">
                    <button class="btn btn-secondary" id="btnBackEditor">← エディタ</button>
                    <button class="btn btn-primary" id="btnFullscreen">全画面</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        (function() {
            // DOM Elements
            const app = document.getElementById('app');
            const btnEditorTab = document.getElementById('btnEditorTab');
            const btnPreviewTab = document.getElementById('btnPreviewTab');

            const previewView = document.getElementById('previewView');

            const btnFullscreen = document.getElementById('btnFullscreen');

            const iphoneFrame = document.getElementById('iphoneFrame');
            const dynamicIsland = document.getElementById('dynamicIsland');

            // Constants
            const STORAGE_KEY = 'pwa-previewer-html';
            const IPHONE_WIDTH = 402;

            const FRAME_TOTAL_WIDTH = IPHONE_WIDTH + FRAME_PADDING * 2;
            const FRAME_TOTAL_HEIGHT = IPHONE_HEIGHT + FRAME_PADDING * 2;
            const SAFE_TOP = 59;

            const DI_WIDTH = 126;
            const DI_HEIGHT = 37;
            const DI_TOP = 11;
            const HI_WIDTH = 140;
            const HI_HEIGHT = 5;
            const HI_BOTTOM = 8;

            // State
            let isFullscreen = false;
            let currentView = 'editor'; // 'editor' | 'preview'
            let scaleFactor = 1;

            // Sample HTML for testing
            const SAMPLE_HTML = `<!DOCTYPE html>
        <html lang="ja">

        <script>
          document.getElementById('btnClickTest').addEventListener('click', function() {
            document.getElementById('clickResult').textContent = '✓ ボタンがクリックされました！ (' + new Date().toLocaleTimeString() + ')';
          });
          document.querySelectorAll('.tab-item').forEach(function(item) {
            item.addEventListener('click', function() {
              document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
              item.classList.add('active');
            });
          });
        <\/script>
        </body>
        </html>`;

            // Load saved HTML from LocalStorage
            function loadSavedHTML() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved !== null && saved !== undefined) {
                        editorTextarea.value = saved;
                        return true;
                    }
                } catch (e) {
                    // localStorage may be unavailable
                }
                return false;
            }

            // Save HTML to LocalStorage
            function saveHTML(html) {
                try {
                    localStorage.setItem(STORAGE_KEY, html);
                } catch (e) {
                    // localStorage may be full or unavailable
                }
            }

            // Clear LocalStorage
            function clearSavedHTML() {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch (e) {
                    // ignore
                }
            }

            // Build the iframe srcdoc with injected styles
            function buildSrcdoc(userHTML) {
                // Extract body content from full HTML document if present
                let bodyContent = userHTML;
                let extractedHead = '';

                // Check if it looks like a full HTML document
                const hasDoctype = /<!DOCTYPE/i.test(userHTML);
                const hasHtmlTag = /<html[\s>]/i.test(userHTML);
                const hasBodyTag = /<body[\s>]/i.test(userHTML);

                if (hasDoctype || hasHtmlTag || hasBodyTag) {
                    // Try to extract body content
                    const bodyMatch = userHTML.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
                    if (bodyMatch && bodyMatch[1]) {
                        bodyContent = bodyMatch[1];
                    } else if (hasHtmlTag) {
                        // Extract content between html tags
                        const htmlContentMatch = userHTML.match(/<html[^>]*>([\s\S]*?)<\/html>/i);
                        if (htmlContentMatch && htmlContentMatch[1]) {
                            // Remove head section
                            const withoutHead = htmlContentMatch[1].replace(/<head[^>]*>[\s\S]*?<\/head>/i, '');
                            const bodyOnly = withoutHead.replace(/<body[^>]*>/i, '').replace(/<\/body>/i, '');
                            bodyContent = bodyOnly;
                        }
                    } else if (hasBodyTag) {
                        // Just remove body tags
                        bodyContent = userHTML.replace(/<body[^>]*>/i, '').replace(/<\/body>/i, '');
                    }
                    // Extract head content (for potential styles/scripts)
                    const headMatch = userHTML.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
                    if (headMatch && headMatch[1]) {
                        extractedHead = headMatch[1];
                    }
                }

                // Build the complete document
                const safeAreaCSS = `
          :root {
            --sat: ${SAFE_TOP}px;
            --sab: ${SAFE_BOTTOM}px;
            --sar: 0px;
            --sal: 0px;
            --di-height: ${DI_HEIGHT}px;
            --di-width: ${DI_WIDTH}px;
            --di-top: ${DI_TOP}px;
            --hi-height: ${HI_HEIGHT}px;
            --hi-bottom: ${HI_BOTTOM}px;
          }
          *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
          }
          html {
            width: 100%;
            height: 100%;
            background: #000;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
          }
          body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            padding-top: env(safe-area-inset-top, var(--sat));
            padding-bottom: env(safe-area-inset-bottom, var(--sab));
            padding-left: env(safe-area-inset-left, var(--sal));
            padding-right: env(safe-area-inset-right, var(--sar));
          }
          /* Scrollbar styling for desktop browsers */
          ::-webkit-scrollbar { width: 6px; }
          ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 3px; }
          ::-webkit-scrollbar-track { background: transparent; }
          /* Make sure content extends under safe area when viewport-fit=cover */
          @supports (padding: max(0px)) {
            body {
              padding-top: max(env(safe-area-inset-top, var(--sat)), var(--sat));
              padding-bottom: max(env(safe-area-inset-bottom, var(--sab)), var(--sab));
            }
          }
        `;

                // Handle extracted head content (user styles/scripts)
                let headExtra = extractedHead;
                // Remove any viewport meta from user's head to avoid conflicts
                headExtra = headExtra.replace(/<meta[^>]*viewport[^>]*>/gi, '');

                return `<!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="theme-color" content="#000000">
          <style>${safeAreaCSS}</style>
          ${headExtra}
        </head>
        <body>
          ${bodyContent}
        </body>
        </html>`;
            }

            // Update iframe preview
            function updatePreview() {
                const html = editorTextarea.value;
                if (!html || html.trim() === '') {
                    // Show empty state
                    previewFrame.srcdoc = '<!DOCTYPE html><html><head><style>html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;color:#555;font-family:-apple-system,sans-serif;font-size:14px;}</style></head><body><div>HTMLを入力してください</div></body></html>';
                    return;
                }
                const srcdoc = buildSrcdoc(html);
                previewFrame.srcdoc = srcdoc;
                saveHTML(html);
            }

            // Switch to editor view
            function showEditor() {
                currentView = 'editor';
                editorView.classList.remove('hidden');
                previewView.classList.add('hidden');
                btnEditorTab.classList.add('active');
                btnPreviewTab.classList.remove('active');
                if (isFullscreen) {
                    toggleFullscreen(false);
                }
            }

            // Switch to preview view
            function showPreview() {
                currentView = 'preview';
                editorView.classList.add('hidden');
                previewView.classList.remove('hidden');
                btnPreviewTab.classList.add('active');
                btnEditorTab.classList.remove('active');
                updatePreview();
                // Recalculate scale after view becomes visible
                requestAnimationFrame(() => {
                    calculateScale();
                });
            }

            // Toggle fullscreen preview
            function toggleFullscreen(force) {
                if (force !== undefined) {
                    isFullscreen = force;
                } else {
                    isFullscreen = !isFullscreen;
                }
                if (isFullscreen) {
                    app.classList.add('fullscreen');
                    // Hide home indicator in fullscreen on mobile (it overlaps with system indicator)
                    if (window.innerWidth < 768) {
                        homeIndicator.style.opacity = '0';
                    }
                    // Recalculate scale (though in fullscreen on mobile, scale=1)
                    requestAnimationFrame(() => {
                        calculateScale();
                    });
                } else {
                    app.classList.remove('fullscreen');
                    homeIndicator.style.opacity = '1';
                    requestAnimationFrame(() => {
                        calculateScale();
                    });
                }
            }

            // Calculate and apply scale for iPhone frame
            function calculateScale() {
                if (currentView !== 'preview') return;
                if (isFullscreen && window.innerWidth < 768) {
                    iphoneWrapper.style.transform = 'scale(1)';
                    iphoneWrapper.style.width = '100%';
                    iphoneWrapper.style.height = '100%';
                    iphoneFrame.style.width = '100vw';
                    iphoneFrame.style.height = '100dvh';
                    return;
                }
                if (isFullscreen && window.innerWidth >= 768) {
                    // Desktop fullscreen: keep frame at natural size but centered
                    const stageRect = iphoneStage.getBoundingClientRect();
                    const availW = stageRect.width - 20;
                    const availH = stageRect.height - 20;
                    const scaleX = availW / FRAME_TOTAL_WIDTH;
                    const scaleY = availH / FRAME_TOTAL_HEIGHT;
                    const s = Math.min(scaleX, scaleY, 1.0);
                    iphoneWrapper.style.transform = `scale(${s})`;
                    iphoneWrapper.style.width = FRAME_TOTAL_WIDTH + 'px';
                    iphoneWrapper.style.height = FRAME_TOTAL_HEIGHT + 'px';
                    iphoneFrame.style.width = FRAME_TOTAL_WIDTH + 'px';
                    iphoneFrame.style.height = FRAME_TOTAL_HEIGHT + 'px';
                    scaleFactor = s;
                    return;
                }
                const stageRect = iphoneStage.getBoundingClientRect();
                const availW = stageRect.width - 16;
                const availH = stageRect.height - 16;
                const scaleX = availW / FRAME_TOTAL_WIDTH;
                const scaleY = availH / FRAME_TOTAL_HEIGHT;
                const s = Math.min(scaleX, scaleY, 1.0);
                iphoneWrapper.style.transform = `scale(${s})`;
                iphoneWrapper.style.width = FRAME_TOTAL_WIDTH + 'px';
                iphoneWrapper.style.height = FRAME_TOTAL_HEIGHT + 'px';
                iphoneFrame.style.width = FRAME_TOTAL_WIDTH + 'px';
                iphoneFrame.style.height = FRAME_TOTAL_HEIGHT + 'px';
                scaleFactor = s;
            }

            // Initialize
            function init() {
                // Load saved HTML
                const loaded = loadSavedHTML();
                if (!loaded) {
                    editorTextarea.value = '';
                }
                // Set up event listeners
                btnEditorTab.addEventListener('click', showEditor);
                btnPreviewTab.addEventListener('click', showPreview);
                btnPreview.addEventListener('click', showPreview);
                btnBackEditor.addEventListener('click', showEditor);
                btnFullscreen.addEventListener('click', function() {
                    toggleFullscreen();
                });
                btnClear.addEventListener('click', function() {
                    editorTextarea.value = '';
                    clearSavedHTML();
                    editorTextarea.focus();
                });
                btnSample.addEventListener('click', function() {
                    editorTextarea.value = SAMPLE_HTML;
                    saveHTML(SAMPLE_HTML);
                });
                // Auto-save on input (debounced)
                let debounceTimer;
                editorTextarea.addEventListener('input', function() {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(() => {
                        saveHTML(editorTextarea.value);
                    }, 400);
                });
                // Handle resize
                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        calculateScale();
                    }, 150);
                });
                // Handle orientation change
                window.addEventListener('orientationchange', function() {
                    setTimeout(() => {
                        calculateScale();
                    }, 300);
                });
                // Initial scale calculation if preview is visible
                if (currentView === 'preview') {
                    requestAnimationFrame(() => {
                        calculateScale();
                    });
                }
                // Keyboard shortcut: Cmd/Ctrl+Enter to preview
                editorTextarea.addEventListener('keydown', function(e) {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                        e.preventDefault();
                        showPreview();
                    }
                    if (e.key === 'Escape' && isFullscreen) {
                        toggleFullscreen(false);
                    }
                });
                // Escape to exit fullscreen
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && isFullscreen) {
                        toggleFullscreen(false);
                    }
                });
                // Touch outside editor doesn't dismiss keyboard (native behavior)
                console.log('PWA Previewer ready');
            }

            // Start
            init();
        })();
    </script>
</body>
</html>
