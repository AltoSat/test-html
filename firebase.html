<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Firebase TEST</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f7;
  color: #222;
}
.card {
  width: calc(100% - 40px);
  max-width: 400px;
  padding: 30px 20px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
}
h1 {
  margin: 0 0 20px;
  text-align: center;
  font-size: 24px;
}
#message {
  min-height: 30px;
  margin: 20px 0;
  text-align: center;
  font-size: 20px;
  font-weight: 600;
}
input {
  width: 100%;
  padding: 13px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
  margin-bottom: 10px;
}
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
  -webkit-appearance: none;
}
button:active {
  transform: scale(.98);
  opacity: .7;
}
button:disabled {
  opacity: .5;
}
#status {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  color: #666;
  line-height: 1.5;
}
</style>
</head>
<body>
<div class="card">
<h1>🔥 Firebase TEST</h1>
<div id="message">読み込み中…</div>

<input
id=“inputMessage”
type=“text”
placeholder=“保存する文字を入力”
autocomplete=“off”

<button id="saveButton" type="button">
Firebaseに保存
</button>
<div id="status">
Firebaseからデータを取得しています
</div>
</div>
<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
/* Firebase設定 */
const firebaseConfig = {
  apiKey: "AIzaSyApgxhOGJHWzdqBXsYShVeyPogUifB0lug",
  authDomain: "test-6dd18.firebaseapp.com",
  projectId: "test-6dd18",
  storageBucket: "test-6dd18.firebasestorage.app",
  messagingSenderId: "1017834847457",
  appId: "1:1017834847457:web:d01c5213366a5db9318ba0"
};
/* Firebase開始 */
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
/* 保存先 */
const messageRef = doc(
  db,
  "test",
  "001"
);
/* HTML */
const message =
  document.getElementById("message");
const input =
  document.getElementById("inputMessage");
const button =
  document.getElementById("saveButton");
const status =
  document.getElementById("status");
/* Firebaseから読み込み */
async function loadMessage() {
  status.textContent =
    "Firebaseからデータを取得しています…";
  try {
    const snapshot =
      await getDoc(messageRef);
    if (snapshot.exists()) {
      const data =
        snapshot.data();
      message.textContent =
        data.message || "データなし";
      status.textContent =
        "Firebaseから正常に読み込みました。";
    } else {
      message.textContent =
        "データがありません";
      status.textContent =
        "Firestoreにデータがありません。";
    }
  } catch (error) {
    console.error(error);
    message.textContent =
      "読み込みエラー";
    status.textContent =
      "Firebaseエラー：" + error.message;
  }
}
/* Firebaseへ保存 */
async function saveMessage() {
  const text =
    input.value.trim();
  if (!text) {
    status.textContent =
      "文字を入力してください。";
    return;
  }
  button.disabled = true;
  button.textContent =
    "保存中…";
  status.textContent =
    "Firebaseへ保存しています…";
  try {
    await setDoc(
      messageRef,
      {
        message: text
      }
    );
    message.textContent =
      text;
    status.textContent =
      "✅ Firebaseへ保存しました！";
    input.value = "";
  } catch (error) {
    console.error(error);
    status.textContent =
      "❌ 保存エラー：" + error.message;
  } finally {
    button.disabled = false;
    button.textContent =
      "Firebaseに保存";
  }
}
/* ボタン */
button.addEventListener(
  "click",
  saveMessage
);
/* 起動 */
loadMessage();
</script>
</body>
</html>
