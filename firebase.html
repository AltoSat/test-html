<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase TEST</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f7;
  color: #222;
}
.card {
  width: calc(100% - 40px);
  max-width: 400px;
  padding: 30px 20px;
  text-align: center;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
}
h1 {
  font-size: 24px;
  margin: 0 0 20px;
}
#message {
  font-size: 20px;
  font-weight: 600;
  margin: 20px 0;
}
input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 10px;
  margin-bottom: 10px;
}
button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
}
#status {
  font-size: 14px;
  color: #666;
  margin-top: 15px;
}
</style>
</head>
<body>
<div class="card">
  <h1>🔥 Firebase TEST</h1>
  <div id="message">
    読み込み中…
  </div>

<input
id=“inputMessage”
type=“text”
placeholder=“Firebaseに保存する文字”

  <button id="saveButton">
    Firebaseに保存
  </button>
  <div id="status">
    Firebaseからデータを取得しています
  </div>
</div>
<script type="module">
/* Firebase SDK */
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
/* Firebaseプロジェクト設定 */
const firebaseConfig = {
  apiKey: "AIzaSyApgxhOGJHWzdqBXsYShVeyPogUifB0lug",
  authDomain: "test-6dd18.firebaseapp.com",
  projectId: "test-6dd18",
  storageBucket: "test-6dd18.firebasestorage.app",
  messagingSenderId: "1017834847457",
  appId: "1:1017834847457:web:d01c5213366a5db9318ba0"
};
/* Firebaseを開始 */
const app = initializeApp(firebaseConfig);
/* Firestoreを使用 */
const db = getFirestore(app);
/* 使用するドキュメント */
const documentRef = doc(db, "test", "001");
/* 画面の部品 */
const messageElement =
  document.getElementById("message");
const inputElement =
  document.getElementById("inputMessage");
const saveButton =
  document.getElementById("saveButton");
const statusElement =
  document.getElementById("status");
/* Firebaseからデータを読み込む */
async function loadData() {
  try {
    const documentSnapshot =
      await getDoc(documentRef);
    if (documentSnapshot.exists()) {
      const data =
        documentSnapshot.data();
      messageElement.textContent =
        data.message || "データなし";
      statusElement.textContent =
        "Firebaseから正常に読み込みました。";
    } else {
      messageElement.textContent =
        "データがありません";
      statusElement.textContent =
        "Firestoreにデータがありません。";
    }
  } catch (error) {
    console.error(error);
    messageElement.textContent =
      "読み込みエラー";
    statusElement.textContent =
      error.message;
  }
}
/* Firebaseへデータを保存 */
async function saveData() {
  const message =
    inputElement.value.trim();
  if (!message) {
    statusElement.textContent =
      "保存する文字を入力してください。";
    return;
  }
  saveButton.disabled = true;
  statusElement.textContent =
    "Firebaseへ保存しています…";
  try {
    await setDoc(
      documentRef,
      {
        message: message
      }
    );
    messageElement.textContent =
      message;
    statusElement.textContent =
      "Firebaseへ保存しました！";
    inputElement.value = "";
  } catch (error) {
    console.error(error);
    statusElement.textContent =
      "保存エラー：" + error.message;
  } finally {
    saveButton.disabled = false;
  }
}
/* ボタンを押したら保存 */
saveButton.addEventListener(
  "click",
  saveData
);
/* 最初にFirebaseから読み込む */
loadData();
</script>
</body>
</html>
