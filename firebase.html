<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase TEST</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f7;
}
.card {
  width: calc(100% - 40px);
  max-width: 400px;
  padding: 30px 20px;
  background: white;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,.1);
}
h1 {
  font-size: 24px;
}
#message {
  margin: 20px 0;
  font-size: 20px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}
button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
}
#status {
  margin-top: 15px;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="card">
<h1>🔥 Firebase TEST</h1>
<div id="message">接続しています…</div>

<input
id=“input”
type=“text”
placeholder=“保存する文字を入力”

<button id="save">
Firebaseに保存
</button>
<div id="status">
準備中…
</div>
</div>
<script type="module">
/*
 Firebase SDK
*/
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
/*
 Firebase設定
*/
const firebaseConfig = {
  apiKey: "AIzaSyApgxhOGJHWzdqBXsYShVeyPogUifB0lug",
  authDomain: "test-6dd18.firebaseapp.com",
  projectId: "test-6dd18",
  storageBucket: "test-6dd18.firebasestorage.app",
  messagingSenderId: "1017834847457",
  appId: "1:1017834847457:web:d01c5213366a5db9318ba0"
};
/*
 Firebaseを開始
*/
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
/*
 Firestoreの保存場所
*/
const ref = doc(
  db,
  "test",
  "001"
);
/*
 HTMLの部品
*/
const message =
  document.getElementById("message");
const input =
  document.getElementById("input");
const save =
  document.getElementById("save");
const status =
  document.getElementById("status");
/*
 Firebaseから読み込む
*/
async function readData() {
  try {
    const result =
      await getDoc(ref);
    if (result.exists()) {
      message.textContent =
        result.data().message;
      status.textContent =
        "Firebaseから読み込みました。";
    } else {
      message.textContent =
        "データなし";
      status.textContent =
        "データがありません。";
    }
  } catch (error) {
    message.textContent =
      "接続エラー";
    status.textContent =
      error.message;
    console.error(error);
  }
}
/*
 Firebaseへ保存
*/
save.addEventListener("click", async () => {
  const text =
    input.value.trim();
  if (!text) {
    status.textContent =
      "文字を入力してください。";
    return;
  }
  save.textContent =
    "保存中…";
  save.disabled = true;
  try {
    await setDoc(ref, {
      message: text
    });
    message.textContent =
      text;
    status.textContent =
      "✅ Firebaseへ保存しました！";
    input.value = "";
  } catch (error) {
    status.textContent =
      "❌ 保存できませんでした：" +
      error.message;
    console.error(error);
  } finally {
    save.textContent =
      "Firebaseに保存";
    save.disabled = false;
  }
});
/*
 起動時に読み込む
*/
readData();
</script>
</body>
</html>
