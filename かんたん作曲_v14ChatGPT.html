<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2c2c2e">
  <title>ココマーク</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ココマーク">
  <style>
    :root {
      --bg-color: #1c1c1e;
      --panel-bg: rgba(20, 20, 22, 0.78); /* 背景画像を読み取りやすく、ぼかしを弱める */
      --header-bg: rgba(30, 30, 32, 0.85);
      --accent-color: #0a84ff;
      --text-color: #ffffff;
      --border-color: rgba(255, 255, 255, 0.2);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    input[type="range"],
    input[type="color"],
    input[type="text"] {
      touch-action: auto;
      user-select: auto;
      -webkit-user-select: auto;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー領域 */
    header {
      height: calc(44px + var(--safe-area-top));
      padding-top: var(--safe-area-top);
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 12px;
      padding-right: 12px;
      border-bottom: 0.5px solid var(--border-color);
      z-index: 100;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 15px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon:disabled {
      color: #636366;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #fff;
      border-radius: 18px;
      padding: 6px 14px;
      font-weight: 600;
    }

    #editor-container {
      flex: 1;
      position: relative;
      overflow: visible; /* オブジェクトがはみ出ても見やすく設定 */
      background-color: #121212;
      min-height: 0;
      touch-action: none;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      z-index: 50;
      gap: 20px;
    }

    .file-select-label {
      background-color: var(--accent-color);
      color: white;
      padding: 14px 28px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
    }

    #image-input {
      display: none;
    }

    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      overflow: visible; /* オブジェクトが画像の外側にはみ出ても見えるようにする */
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      overflow: visible;
    }

    /* オブジェクトツール（プロパティパネル：4列・省スペース構成） */
    #properties-panel {
      position: absolute;
      bottom: calc(52px + (var(--safe-area-bottom) / 2));
      left: 8px;
      right: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 7px;
      display: grid;
      grid-template-columns: 48px 76px 76px minmax(0, 1fr);
      gap: 6px;
      align-items: center;
      border: 0.5px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      z-index: 90;
      transition: top 0.18s ease, bottom 0.18s ease;
    }

    #properties-panel.at-top {
      bottom: auto;
      top: calc(52px + var(--safe-area-top));
    }

    #properties-panel.hidden {
      display: none;
    }

    .panel-label {
      font-size: 10px;
      color: #f0f0f5;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95);
      min-width: 28px;
      flex-shrink: 0;
      font-weight: 600;
    }

    /* 1列目：その他のボタン */
    .panel-col-other {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.12);
      padding-right: 5px;
      min-width: 0;
    }

    /* 2列目：カラー（3×3） */
    .panel-col-color {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.12);
      padding-right: 6px;
      min-width: 0;
    }

    .color-swatch-container {
      display: grid;
      grid-template-columns: repeat(3, 20px);
      grid-template-rows: repeat(3, 20px);
      gap: 4px;
      align-items: center;
      justify-items: center;
    }

    .color-swatch,
    .color-picker-wrapper {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
      box-sizing: border-box;
      cursor: pointer;
    }

    .color-swatch {
      border: 2px solid rgba(255, 255, 255, 0.42);
      background-clip: padding-box;
    }

    .color-swatch.selected {
      border-color: #ffffff;
      transform: scale(1.12);
      box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.85);
    }

    /* 自由カラー変更ボタン：色相リング＋中央の白いボタンで視認性を向上 */
    .color-picker-wrapper {
      position: relative;
      background:
        radial-gradient(circle at center, #2c2c2e 0 30%, transparent 31%),
        conic-gradient(from -45deg, #ff3b30, #ffcc00, #34c759, #00c7be, #0a84ff, #5856d6, #af52de, #ff2d55, #ff3b30);
      border: 2px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 1px 4px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    .color-picker-wrapper::after {
      content: '＋';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }

    .color-picker-wrapper input[type="color"] {
      position: absolute;
      opacity: 0;
      inset: -10px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      z-index: 2;
    }

    /* 3列目：十字キー */
    .panel-col-middle {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,0.12);
      padding-right: 6px;
      min-width: 0;
    }

    .nudge-cross {
      display: grid;
      grid-template-columns: repeat(3, 22px);
      grid-template-rows: repeat(3, 22px);
      gap: 2px;
      align-items: center;
      justify-items: center;
    }

    .nudge-btn {
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .nudge-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    #nudge-up { grid-column: 2; grid-row: 1; }
    #nudge-left { grid-column: 1; grid-row: 2; }
    #nudge-right { grid-column: 3; grid-row: 2; }
    #nudge-down { grid-column: 2; grid-row: 3; }

    /* 4列目：各種コントロールを縦に並べる */
    .panel-col-sliders {
      display: flex;
      flex-direction: column;
      gap: 3px;
      justify-content: center;
      min-width: 0;
    }

    .panel-row {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      min-width: 0;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .text-input-field {
      width: 100%;
      min-width: 0;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 3px 20px 3px 6px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.2;
    }

    .btn-clear-text {
      position: absolute;
      right: 4px;
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.4);
      color: #000;
      border-radius: 50%;
      border: none;
      font-size: 9px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent-color);
      height: 20px;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 3px 5px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
      line-height: 1.1;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      min-width: 34px;
    }

    .toggle-btn.active {
      background: var(--accent-color);
    }

    .btn-icon-delete {
      background: rgba(255, 69, 58, 0.35);
      color: #ff453a;
      border: 1px solid rgba(255, 69, 58, 0.5);
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .btn-icon-delete:active {
      background: rgba(255, 69, 58, 0.6);
    }

    /* 小さい画面でも4列を維持しつつ、省スペースで操作できるようにする */
    @media (max-width: 430px) {
      #properties-panel {
        grid-template-columns: 42px 70px 70px minmax(0, 1fr);
        gap: 4px;
        padding: 6px;
      }

      .color-swatch-container {
        grid-template-columns: repeat(3, 18px);
        grid-template-rows: repeat(3, 18px);
        gap: 3px;
      }

      .color-swatch,
      .color-picker-wrapper {
        width: 18px;
        height: 18px;
      }

      .nudge-cross {
        grid-template-columns: repeat(3, 20px);
        grid-template-rows: repeat(3, 20px);
      }

      .nudge-btn {
        width: 20px;
        height: 20px;
      }

      .panel-label {
        min-width: 25px;
        font-size: 9px;
      }
    }

    /* フッターメニュー */
    toolbar {
      height: calc(48px + (var(--safe-area-bottom) / 2));
      padding-bottom: calc(var(--safe-area-bottom) / 2);
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-around;
      border-top: 0.5px solid var(--border-color);
      z-index: 100;
      flex-shrink: 0;
    }

    .tool-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #a0a0a5;
      font-size: 10px;
      gap: 2px;
      width: 60px;
      height: 100%;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .tool-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .tool-item.active {
      color: var(--accent-color);
    }

    #save-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #save-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #save-modal img {
      max-width: 90%;
      max-height: 70vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    #save-modal p {
      color: #fff;
      font-size: 14px;
      text-align: center;
    }

    .close-modal-btn {
      background: #3a3a3c;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; gap: 4px;">
      <button id="btn-undo" class="btn-icon" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      </button>
      <button id="btn-redo" class="btn-icon" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
      </button>
    </div>
    <h1>ココマーク</h1>
    <button id="btn-export" class="btn-icon btn-primary">保存</button>
  </header>

  <div id="editor-container">
    <div id="start-screen">
      <label class="file-select-label" for="image-input">写真を選択</label>
      <input type="file" id="image-input" accept="image/*">
    </div>

    <div id="viewport">
      <canvas id="bg-canvas"></canvas>
      <canvas id="annotation-canvas"></canvas>
    </div>
  </div>

  <!-- オブジェクト操作用ツールパネル（4列構成） -->
  <div id="properties-panel" class="hidden">
    <!-- 1列目：その他のボタン -->
    <div class="panel-col-other">
      <button class="btn-icon-delete" id="btn-delete" title="削除" aria-label="削除">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
      <button id="btn-shadow-toggle" class="toggle-btn active">影</button>
      <button id="btn-bold" class="toggle-btn">太字</button>
      <button id="btn-aspect-square" class="toggle-btn">正方形</button>
    </div>

    <!-- 2列目：カラー（3×3） -->
    <div class="panel-col-color">
      <div id="color-presets" class="color-swatch-container"></div>
    </div>

    <!-- 3列目：十字キー -->
    <div class="panel-col-middle">
      <div class="nudge-cross">
        <button class="nudge-btn" id="nudge-up">↑</button>
        <button class="nudge-btn" id="nudge-left">←</button>
        <button class="nudge-btn" id="nudge-right">→</button>
        <button class="nudge-btn" id="nudge-down">↓</button>
      </div>
    </div>

    <!-- 4列目：スライダー・文字入力 -->
    <div class="panel-col-sliders">
      <div class="panel-row" id="text-prop-row">
        <span class="panel-label">文字</span>
        <div class="input-wrapper">
          <input type="text" id="text-content-input" class="text-input-field" placeholder="テキストを入力">
          <button id="btn-clear-text" class="btn-clear-text">✕</button>
        </div>
      </div>

      <div class="panel-row" id="size-prop-row">
        <span class="panel-label" id="size-label">サイズ</span>
        <input type="range" id="size-slider" min="1" max="100" value="100">
      </div>

      <div class="panel-row" id="outline-prop-row">
        <span class="panel-label">フチ</span>
        <input type="range" id="outline-slider" min="0" max="20" value="20">
      </div>

      <div class="panel-row" id="radius-prop-row">
        <span class="panel-label">角丸</span>
        <input type="range" id="radius-slider" min="0" max="100" value="100">
      </div>

      <div class="panel-row" id="arrow-prop-row">
        <span class="panel-label">先端</span>
        <input type="range" id="arrow-slider" min="5" max="90" value="90">
      </div>
    </div>
  </div>

  <toolbar>
    <button class="tool-item active" data-tool="select">
      <svg viewBox="0 0 24 24"><path d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4L7 18.5V2z"/></svg>
      選択
    </button>
    <button class="tool-item" data-tool="text">
      <svg viewBox="0 0 24 24"><path d="M5 4v3h5.5v12h3V7H19V4H5z"/></svg>
      文字
    </button>
    <button class="tool-item" data-tool="rect">
      <svg viewBox="0 0 24 24"><path d="M3 5v14h18V5H3zm16 12H5V7h14v10z"/></svg>
      四角
    </button>
    <button class="tool-item" data-tool="arrow">
      <svg viewBox="0 0 24 24"><path d="M16.01 11H4v2h12.01v3L20 12l-3.99-4v3z"/></svg>
      矢印
    </button>
  </toolbar>

  <div id="save-modal">
    <img id="save-preview" src="" alt="完成画像">
    <p>画像を長押しして「"写真"に保存」を選択してください</p>
    <button class="close-modal-btn" id="btn-close-modal">閉じる</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // 定数
    // -------------------------------------------------------------
    const PRESET_COLORS = [
      { name: '赤', val: '#e63946' },
      { name: '黒', val: '#000000' }
    ];

    const RECENT_COLORS_KEY = 'cocomark_recent_colors';
    const MAX_RECENT_COLORS = 6; // 3×3カラーグリッド用（プリセット2＋最近6＋カスタム1）

    const MAX_TEXT_SIZE = 160;
    const MAX_STROKE_WIDTH = 40;
    const MAX_OUTLINE_WIDTH = 20;
    const MAX_ARROW_SIZE = 90;
    const MAX_BORDER_RADIUS_PERCENT = 100;
    // 画像外へ移動したオブジェクトを画面上で表示するための描画余白。
    // 保存時は従来どおり画像サイズだけを書き出すため影響しない。
    const ANNOTATION_OVERFLOW = 2000;

    // -------------------------------------------------------------
    // 状態
    // -------------------------------------------------------------
    const state = {
      image: null,
      imgWidth: 0,
      imgHeight: 0,
      scale: 1,
      panX: 0,
      panY: 0,
      activeTool: 'select',
      annotations: [],
      selectedId: null,
      history: [],
      historyIndex: -1,
      recentColors: [],
      defaults: {
        color: '#e63946',
        strokeWidth: MAX_STROKE_WIDTH,
        textSize: MAX_TEXT_SIZE,
        borderRadius: MAX_BORDER_RADIUS_PERCENT,
        outlineWidth: MAX_OUTLINE_WIDTH,
        arrowSize: MAX_ARROW_SIZE,
        isBold: true,
        hasShadow: true,
        text: '文字入力'
      }
    };

    // -------------------------------------------------------------
    // DOM
    // -------------------------------------------------------------
    const editorContainer = document.getElementById('editor-container');
    const viewport = document.getElementById('viewport');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const annoCanvas = document.getElementById('annotation-canvas');
    const annoCtx = annoCanvas.getContext('2d');
    const imageInput = document.getElementById('image-input');
    const startScreen = document.getElementById('start-screen');
    const propertiesPanel = document.getElementById('properties-panel');

    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const btnExport = document.getElementById('btn-export');
    const btnDelete = document.getElementById('btn-delete');
    const colorPresetsContainer = document.getElementById('color-presets');
    const textContentInput = document.getElementById('text-content-input');
    const btnClearText = document.getElementById('btn-clear-text');
    const btnBold = document.getElementById('btn-bold');
    const sizeSlider = document.getElementById('size-slider');
    const sizeLabel = document.getElementById('size-label');
    const outlineSlider = document.getElementById('outline-slider');
    const radiusSlider = document.getElementById('radius-slider');
    const arrowSlider = document.getElementById('arrow-slider');
    const btnAspectSquare = document.getElementById('btn-aspect-square');
    const btnShadowToggle = document.getElementById('btn-shadow-toggle');
    const saveModal = document.getElementById('save-modal');
    const savePreview = document.getElementById('save-preview');
    const btnCloseModal = document.getElementById('btn-close-modal');

    const measureCtx = document.createElement('canvas').getContext('2d');

    // -------------------------------------------------------------
    // 最前面へ移動
    // -------------------------------------------------------------
    function bringToFront(id) {
      if (!id) return;
      const idx = state.annotations.findIndex(a => a.id === id);
      if (idx !== -1 && idx !== state.annotations.length - 1) {
        const [item] = state.annotations.splice(idx, 1);
        state.annotations.push(item);
      }
    }

    // -------------------------------------------------------------
    // 最近使った色
    // -------------------------------------------------------------
    function loadRecentColors() {
      try {
        const raw = localStorage.getItem(RECENT_COLORS_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        state.recentColors = Array.isArray(arr) ? arr.slice(0, MAX_RECENT_COLORS) : [];
      } catch (err) {
        state.recentColors = [];
      }
    }

    function saveRecentColors() {
      try {
        localStorage.setItem(RECENT_COLORS_KEY, JSON.stringify(state.recentColors));
      } catch (err) {}
    }

    function pushRecentColor(color) {
      if (!color) return;
      const c = color.toLowerCase();
      if (PRESET_COLORS.some(p => p.val.toLowerCase() === c)) return;
      state.recentColors = state.recentColors.filter(x => x.toLowerCase() !== c);
      state.recentColors.unshift(c);
      if (state.recentColors.length > MAX_RECENT_COLORS) {
        state.recentColors.length = MAX_RECENT_COLORS;
      }
      saveRecentColors();
      renderColorPalette();
    }

    function renderColorPalette() {
      colorPresetsContainer.innerHTML = '';
      const list = [
        ...PRESET_COLORS.map(p => p.val),
        ...state.recentColors
      ];
      list.slice(0, 8).forEach(val => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = val;
        swatch.dataset.color = val;
        swatch.addEventListener('click', (e) => {
          e.preventDefault();
          selectColor(val);
        });
        colorPresetsContainer.appendChild(swatch);
      });

      // 9マス目は常に自由カラー変更ボタン
      const picker = document.createElement('div');
      picker.className = 'color-picker-wrapper';
      picker.title = '自由にカラーを変更';
      picker.setAttribute('aria-label', '自由にカラーを変更');
      const input = document.createElement('input');
      input.type = 'color';
      input.id = 'custom-color-picker';
      input.value = state.defaults.color;
      picker.appendChild(input);
      colorPresetsContainer.appendChild(picker);

      input.addEventListener('change', (e) => {
        const c = e.target.value;
        const selectedAnno = state.annotations.find(a => a.id === state.selectedId);

        // 選択中のオブジェクトだけを変更。デフォルト色は変更しないため、
        // 既存オブジェクトや次回作成するオブジェクトの色が連動して変わらない。
        if (selectedAnno) {
          selectedAnno.color = c;
          pushRecentColor(c);
          saveHistory();
          renderAnnotations();
          updateUI();
        } else {
          state.defaults.color = c;
          pushRecentColor(c);
          updateUI();
        }
      });
    }

    // -------------------------------------------------------------
    // 初期化
    // -------------------------------------------------------------
    function init() {
      loadRecentColors();
      renderColorPalette();

      document.querySelectorAll('.tool-item[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tool-item[data-tool]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.activeTool = btn.dataset.tool;
          if (state.activeTool !== 'select') {
            state.selectedId = null;
          }
          updateUI();
          renderAnnotations();
        });
      });

      setupNudgeButtons();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      saveHistory();
    }

    // -------------------------------------------------------------
    // 画像読み込み
    // -------------------------------------------------------------
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          state.image = img;
          state.imgWidth = img.width;
          state.imgHeight = img.height;

          bgCanvas.width = img.width;
          bgCanvas.height = img.height;
          annoCanvas.width = img.width + ANNOTATION_OVERFLOW * 2;
          annoCanvas.height = img.height + ANNOTATION_OVERFLOW * 2;
          annoCanvas.style.width = (img.width + ANNOTATION_OVERFLOW * 2) + 'px';
          annoCanvas.style.height = (img.height + ANNOTATION_OVERFLOW * 2) + 'px';
          annoCanvas.style.left = (-ANNOTATION_OVERFLOW) + 'px';
          annoCanvas.style.top = (-ANNOTATION_OVERFLOW) + 'px';

          bgCtx.drawImage(img, 0, 0);

          startScreen.style.display = 'none';
          state.annotations = [];
          state.selectedId = null;

          requestAnimationFrame(() => {
            fitViewportToScreen();
            updateUI();
            renderAnnotations();
          });

          saveHistory();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function fitViewportToScreen() {
      const containerW = editorContainer.clientWidth;
      const containerH = editorContainer.clientHeight;
      if (!containerW || !containerH || !state.imgWidth || !state.imgHeight) return;

      const padding = 20;
      const scale = Math.min(
        (containerW - padding) / state.imgWidth,
        (containerH - padding) / state.imgHeight
      );

      state.scale = scale;
      state.panX = (containerW - state.imgWidth * scale) / 2;
      state.panY = (containerH - state.imgHeight * scale) / 2;

      updateViewportTransform();
    }

    function updateViewportTransform() {
      viewport.style.width = state.imgWidth + 'px';
      viewport.style.height = state.imgHeight + 'px';
      viewport.style.transform =
        `translate3d(${state.panX}px, ${state.panY}px, 0) scale(${state.scale})`;
      positionPanel();
    }

    // -------------------------------------------------------------
    // 座標計算
    // -------------------------------------------------------------
    function getCanvasCoords(e) {
      const rect = bgCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return { x: 0, y: 0 };
      const x = (e.clientX - rect.left) * (state.imgWidth / rect.width);
      const y = (e.clientY - rect.top) * (state.imgHeight / rect.height);
      return { x, y };
    }

    function getContainerCoords(e) {
      const rect = editorContainer.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function measureTextAnno(a) {
      measureCtx.font = `${a.isBold ? 'bold' : 'normal'} ${a.size}px -apple-system, sans-serif`;
      const w = measureCtx.measureText(a.text).width;
      return { w, h: a.size };
    }

    function getRotCenter(a) {
      if (a.type === 'rect') {
        return { x: a.x + a.w / 2, y: a.y + a.h / 2 };
      }
      if (a.type === 'text') {
        return { x: a.x, y: a.y };
      }
      return { x: 0, y: 0 };
    }

    function localToWorld(a, px, py) {
      const c = getRotCenter(a);
      const rad = (a.rotation || 0) * Math.PI / 180;
      const dx = px - c.x;
      const dy = py - c.y;
      return {
        x: c.x + dx * Math.cos(rad) - dy * Math.sin(rad),
        y: c.y + dx * Math.sin(rad) + dy * Math.cos(rad)
      };
    }

    function withRotation(ctx, a, fn) {
      const c = getRotCenter(a);
      ctx.save();
      if (a.rotation) {
        ctx.translate(c.x, c.y);
        ctx.rotate((a.rotation * Math.PI) / 180);
        ctx.translate(-c.x, -c.y);
      }
      fn();
      ctx.restore();
    }

    // -------------------------------------------------------------
    // 履歴管理
    // -------------------------------------------------------------
    function saveHistory() {
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(JSON.stringify(state.annotations));
      state.historyIndex++;
      updateUndoRedoButtons();
    }

    function undo() {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        state.annotations = JSON.parse(state.history[state.historyIndex]);
        state.selectedId = null;
        updateUI();
        renderAnnotations();
        updateUndoRedoButtons();
      }
    }

    function redo() {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        state.annotations = JSON.parse(state.history[state.historyIndex]);
        state.selectedId = null;
        updateUI();
        renderAnnotations();
        updateUndoRedoButtons();
      }
    }

    function updateUndoRedoButtons() {
      btnUndo.disabled = state.historyIndex <= 0;
      btnRedo.disabled = state.historyIndex >= state.history.length - 1;
    }

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    // -------------------------------------------------------------
    // タッチ＆ポインターイベント処理
    // -------------------------------------------------------------
    let activePointers = new Map();
    let isDrawing = false;
    let isDraggingObj = false;
    let isTransformingObj = false;
    let isPanning = false;
    let isPinching = false;
    let wasPinchingGesture = false;
    let panMoved = false;
    let pendingSelectId = null;

    let transformHandle = null;
    let currentAnnotation = null;
    let startImageCoords = { x: 0, y: 0 };
    let initialObjState = null;

    let panStart = { x: 0, y: 0 };
    let panStartPan = { x: 0, y: 0 };

    let initialPinchDist = 1;
    let initialScale = 1;
    let initialImgAnchor = { x: 0, y: 0 };

    let initialRotCenter = { x: 0, y: 0 };
    let initialHandleAngle = 0;
    let initialRotation = 0;

    function startPinch() {
      const pts = Array.from(activePointers.values());
      if (pts.length < 2) return;
      wasPinchingGesture = true;
      const cRect = editorContainer.getBoundingClientRect();
      const mid = {
        x: (pts[0].x + pts[1].x) / 2 - cRect.left,
        y: (pts[0].y + pts[1].y) / 2 - cRect.top
      };
      initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
      initialScale = state.scale;
      initialImgAnchor = {
        x: (mid.x - state.panX) / state.scale,
        y: (mid.y - state.panY) / state.scale
      };
      isPinching = true;
    }

    function cancelActiveGesture() {
      if (isDrawing && currentAnnotation) {
        state.annotations = state.annotations.filter(a => a.id !== currentAnnotation.id);
        currentAnnotation = null;
      }
      isDrawing = false;
      isDraggingObj = false;
      isTransformingObj = false;
      isPanning = false;
      panMoved = false;
      pendingSelectId = null;
      transformHandle = null;
      initialObjState = null;
    }

    editorContainer.addEventListener('pointerdown', (e) => {
      if (!state.image) return;

      try {
        e.target.setPointerCapture(e.pointerId);
      } catch (err) {}

      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 2) {
        cancelActiveGesture();
        startPinch();
        return;
      }
      if (activePointers.size > 2) return;

      wasPinchingGesture = false;
      const coords = getCanvasCoords(e);
      startImageCoords = coords;

      // 変形ハンドルのタップ判定
      if (state.selectedId) {
        const selectedAnno = state.annotations.find(a => a.id === state.selectedId);
        if (selectedAnno) {
          const handle = getHitHandle(coords, selectedAnno);
          if (handle) {
            isTransformingObj = true;
            transformHandle = handle;
            initialObjState = JSON.parse(JSON.stringify(selectedAnno));
            if (handle === 'rot') {
              initialRotCenter = getRotCenter(selectedAnno);
              const rotH = getHandles(selectedAnno).find(h => h.id === 'rot');
              if (rotH) {
                initialHandleAngle = Math.atan2(
                  rotH.y - initialRotCenter.y,
                  rotH.x - initialRotCenter.x
                );
              }
              initialRotation = selectedAnno.rotation || 0;
            }
            return;
          }
        }
      }

      // 新規作成
      if (state.activeTool !== 'select') {
        const id = Date.now().toString() + Math.random().toString(36).slice(2, 6);

        if (state.activeTool === 'text') {
          const newAnno = {
            id, type: 'text',
            x: coords.x, y: coords.y,
            text: state.defaults.text,
            color: state.defaults.color,
            size: state.defaults.textSize,
            isBold: state.defaults.isBold,
            hasShadow: state.defaults.hasShadow,
            outlineWidth: state.defaults.outlineWidth,
            rotation: 0
          };
          state.annotations.push(newAnno);
          pendingSelectId = id;
          bringToFront(id);
          saveHistory();
          switchTool('select');
          renderAnnotations();
          return;
        }

        if (state.activeTool === 'rect') {
          isDrawing = true;
          currentAnnotation = {
            id, type: 'rect',
            x: coords.x, y: coords.y,
            w: 1, h: 1,
            color: state.defaults.color,
            strokeWidth: state.defaults.strokeWidth,
            outlineWidth: state.defaults.outlineWidth,
            borderRadius: state.defaults.borderRadius,
            hasShadow: state.defaults.hasShadow,
            rotation: 0
          };
          state.annotations.push(currentAnnotation);
          pendingSelectId = id;
          bringToFront(id);
          renderAnnotations();
          return;
        }

        if (state.activeTool === 'arrow') {
          isDrawing = true;
          currentAnnotation = {
            id, type: 'arrow',
            x1: coords.x, y1: coords.y,
            x2: coords.x + 1, y2: coords.y + 1,
            color: state.defaults.color,
            strokeWidth: state.defaults.strokeWidth,
            outlineWidth: state.defaults.outlineWidth,
            arrowSize: state.defaults.arrowSize,
            hasShadow: state.defaults.hasShadow
          };
          state.annotations.push(currentAnnotation);
          pendingSelectId = id;
          bringToFront(id);
          renderAnnotations();
          return;
        }
      }

      // 選択・移動モード
      const hitAnno = getHitAnnotation(coords);
      if (hitAnno) {
        pendingSelectId = hitAnno.id;
        bringToFront(hitAnno.id);
        isDraggingObj = true;
        initialObjState = JSON.parse(JSON.stringify(hitAnno));
      } else {
        pendingSelectId = null;
        isPanning = true;
        panMoved = false;
        panStart = getContainerCoords(e);
        panStartPan = { x: state.panX, y: state.panY };
      }
    });

    editorContainer.addEventListener('pointermove', (e) => {
      if (!activePointers.has(e.pointerId)) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activePointers.size === 2) {
        if (!isPinching) startPinch();
        const pts = Array.from(activePointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        let newScale = initialScale * (dist / initialPinchDist);
        newScale = Math.max(0.05, Math.min(20, newScale));

        const cRect = editorContainer.getBoundingClientRect();
        const mid = {
          x: (pts[0].x + pts[1].x) / 2 - cRect.left,
          y: (pts[0].y + pts[1].y) / 2 - cRect.top
        };

        state.scale = newScale;
        state.panX = mid.x - initialImgAnchor.x * newScale;
        state.panY = mid.y - initialImgAnchor.y * newScale;

        updateViewportTransform();
        return;
      }

      if (activePointers.size > 1) return;

      if (isPanning) {
        const c = getContainerCoords(e);
        const dx = c.x - panStart.x;
        const dy = c.y - panStart.y;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) panMoved = true;
        state.panX = panStartPan.x + dx;
        state.panY = panStartPan.y + dy;
        updateViewportTransform();
        return;
      }

      const coords = getCanvasCoords(e);

      if (isDrawing && currentAnnotation) {
        if (currentAnnotation.type === 'rect') {
          currentAnnotation.w = coords.x - startImageCoords.x;
          currentAnnotation.h = coords.y - startImageCoords.y;
        } else if (currentAnnotation.type === 'arrow') {
          currentAnnotation.x2 = coords.x;
          currentAnnotation.y2 = coords.y;
        }
        renderAnnotations();
        return;
      }

      const selectedAnno = state.annotations.find(a => a.id === (state.selectedId || pendingSelectId));
      if (!selectedAnno) return;

      if (isTransformingObj && initialObjState) {
        const dx = coords.x - startImageCoords.x;
        const dy = coords.y - startImageCoords.y;

        if (selectedAnno.type === 'rect') {
          if (transformHandle === 'rot') {
            const cur = Math.atan2(
              coords.y - initialRotCenter.y,
              coords.x - initialRotCenter.x
            );
            selectedAnno.rotation =
              initialRotation + (cur - initialHandleAngle) * (180 / Math.PI);
          } else {
            applyRectResize(selectedAnno, initialObjState, transformHandle, dx, dy);
          }
        } else if (selectedAnno.type === 'arrow') {
          if (transformHandle === 'p1') {
            selectedAnno.x1 = coords.x;
            selectedAnno.y1 = coords.y;
          } else if (transformHandle === 'p2') {
            selectedAnno.x2 = coords.x;
            selectedAnno.y2 = coords.y;
          }
        } else if (selectedAnno.type === 'text') {
          if (transformHandle === 'rot') {
            const cur = Math.atan2(
              coords.y - initialRotCenter.y,
              coords.x - initialRotCenter.x
            );
            selectedAnno.rotation =
              initialRotation + (cur - initialHandleAngle) * (180 / Math.PI);
          }
        }
        renderAnnotations();
        return;
      }

      if (isDraggingObj && initialObjState) {
        const dx = coords.x - startImageCoords.x;
        const dy = coords.y - startImageCoords.y;

        if (selectedAnno.type === 'rect' || selectedAnno.type === 'text') {
          selectedAnno.x = initialObjState.x + dx;
          selectedAnno.y = initialObjState.y + dy;
        } else if (selectedAnno.type === 'arrow') {
          selectedAnno.x1 = initialObjState.x1 + dx;
          selectedAnno.y1 = initialObjState.y1 + dy;
          selectedAnno.x2 = initialObjState.x2 + dx;
          selectedAnno.y2 = initialObjState.y2 + dy;
        }
        renderAnnotations();
      }
    });

    function applyRectResize(target, s, handle, dx, dy) {
      const th = (s.rotation || 0) * Math.PI / 180;
      const cos = Math.cos(-th), sin = Math.sin(-th);
      const ldx = dx * cos - dy * sin;
      const ldy = dx * sin + dy * cos;

      let nw = s.w;
      let nh = s.h;
      if (handle === 'se') { nw = s.w + ldx; nh = s.h + ldy; }
      else if (handle === 'nw') { nw = s.w - ldx; nh = s.h - ldy; }
      else if (handle === 'ne') { nw = s.w + ldx; nh = s.h - ldy; }
      else if (handle === 'sw') { nw = s.w - ldx; nh = s.h + ldy; }

      nw = Math.max(10, nw);
      nh = Math.max(10, nh);

      let anchorLocalX, anchorLocalY;
      if (handle === 'se') { anchorLocalX = s.x; anchorLocalY = s.y; }
      else if (handle === 'nw') { anchorLocalX = s.x + s.w; anchorLocalY = s.y + s.h; }
      else if (handle === 'ne') { anchorLocalX = s.x; anchorLocalY = s.y + s.h; }
      else { anchorLocalX = s.x + s.w; anchorLocalY = s.y; }

      const A = localToWorld(s, anchorLocalX, anchorLocalY);

      let ax, ay;
      if (handle === 'se') { ax = -nw / 2; ay = -nh / 2; }
      else if (handle === 'nw') { ax = nw / 2; ay = nh / 2; }
      else if (handle === 'ne') { ax = -nw / 2; ay = nh / 2; }
      else { ax = nw / 2; ay = -nh / 2; }

      const c = Math.cos(th), sn = Math.sin(th);
      const rx = ax * c - ay * sn;
      const ry = ax * sn + ay * c;

      target.w = nw;
      target.h = nh;
      target.x = (A.x - rx) - nw / 2;
      target.y = (A.y - ry) - nh / 2;
    }

    const handlePointerUp = (e) => {
      try {
        if (e.target.hasPointerCapture(e.pointerId)) {
          e.target.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}

      const wasPinching = isPinching;
      activePointers.delete(e.pointerId);

      if (wasPinching) {
        if (activePointers.size < 2) isPinching = false;
        return;
      }

      if (wasPinchingGesture) {
        wasPinchingGesture = false;
        return;
      }

      if (isPanning) {
        if (!panMoved) {
          state.selectedId = null;
        }
        isPanning = false;
        panMoved = false;
        updateUI();
        renderAnnotations();
        return;
      }

      if (pendingSelectId) {
        state.selectedId = pendingSelectId;
        pendingSelectId = null;
      }

      if (isDrawing || isDraggingObj || isTransformingObj) {
        let discard = false;

        if (currentAnnotation && currentAnnotation.type === 'rect') {
          if (currentAnnotation.w < 0) {
            currentAnnotation.x += currentAnnotation.w;
            currentAnnotation.w = Math.abs(currentAnnotation.w);
          }
          if (currentAnnotation.h < 0) {
            currentAnnotation.y += currentAnnotation.h;
            currentAnnotation.h = Math.abs(currentAnnotation.h);
          }
        }

        if (isDrawing && currentAnnotation) {
          const a = currentAnnotation;
          if (a.type === 'rect') {
            discard = Math.abs(a.w) < 8 || Math.abs(a.h) < 8;
          } else if (a.type === 'arrow') {
            discard = Math.hypot(a.x2 - a.x1, a.y2 - a.y1) < 8;
          }
          if (discard) {
            state.annotations = state.annotations.filter(x => x.id !== a.id);
            state.selectedId = null;
          }
        }

        if (!discard) {
          saveHistory();
          if (isDrawing) {
            switchTool('select');
          }
        }
      }

      updateUI();
      renderAnnotations();

      isDrawing = false;
      isDraggingObj = false;
      isTransformingObj = false;
      transformHandle = null;
      currentAnnotation = null;
      initialObjState = null;
    };

    editorContainer.addEventListener('pointerup', handlePointerUp);
    editorContainer.addEventListener('pointercancel', handlePointerUp);
    editorContainer.addEventListener('pointerleave', (e) => {
      if (activePointers.has(e.pointerId)) handlePointerUp(e);
    });

    // -------------------------------------------------------------
    // ヒットテスト
    // -------------------------------------------------------------
    function getHitAnnotation(coords) {
      for (let i = state.annotations.length - 1; i >= 0; i--) {
        const a = state.annotations[i];

        if (a.type === 'rect') {
          const c = getRotCenter(a);
          const rad = -(a.rotation || 0) * Math.PI / 180;
          const dx = coords.x - c.x;
          const dy = coords.y - c.y;
          const lx = c.x + dx * Math.cos(rad) - dy * Math.sin(rad);
          const ly = c.y + dx * Math.sin(rad) + dy * Math.cos(rad);

          const minX = Math.min(a.x, a.x + a.w);
          const maxX = Math.max(a.x, a.x + a.w);
          const minY = Math.min(a.y, a.y + a.h);
          const maxY = Math.max(a.y, a.y + a.h);
          const margin = 12 / state.scale + 8;
          if (lx >= minX - margin && lx <= maxX + margin &&
              ly >= minY - margin && ly <= maxY + margin) {
            return a;
          }
        } else if (a.type === 'arrow') {
          const dist = distToSegment(coords, { x: a.x1, y: a.y1 }, { x: a.x2, y: a.y2 });
          if (dist < (a.strokeWidth / 2 + 24 / state.scale)) return a;
        } else if (a.type === 'text') {
          const m = measureTextAnno(a);
          const w = m.w;
          const h = a.size;

          const c = getRotCenter(a);
          const rad = -(a.rotation || 0) * Math.PI / 180;
          const dx = coords.x - c.x;
          const dy = coords.y - c.y;
          const lx = c.x + dx * Math.cos(rad) - dy * Math.sin(rad);
          const ly = c.y + dx * Math.sin(rad) + dy * Math.cos(rad);

          if (lx >= a.x - w/2 - 12 && lx <= a.x + w/2 + 12 &&
              ly >= a.y - h/2 - 12 && ly <= a.y + h/2 + 12) {
            return a;
          }
        }
      }
      return null;
    }

    function getHandles(a) {
      const handles = [];
      const off = 34 / state.scale;

      if (a.type === 'rect') {
        const corners = [
          { id: 'nw', x: a.x, y: a.y },
          { id: 'ne', x: a.x + a.w, y: a.y },
          { id: 'se', x: a.x + a.w, y: a.y + a.h },
          { id: 'sw', x: a.x, y: a.y + a.h }
        ];
        corners.forEach(p => {
          const w = localToWorld(a, p.x, p.y);
          handles.push({ id: p.id, x: w.x, y: w.y });
        });
        const r = localToWorld(a, a.x + a.w / 2, a.y - off);
        handles.push({ id: 'rot', x: r.x, y: r.y });
      } else if (a.type === 'text') {
        const topY = a.y - a.size / 2;
        const r = localToWorld(a, a.x, topY - off);
        handles.push({ id: 'rot', x: r.x, y: r.y });
      } else if (a.type === 'arrow') {
        handles.push({ id: 'p1', x: a.x1, y: a.y1 });
        handles.push({ id: 'p2', x: a.x2, y: a.y2 });
      }
      return handles;
    }

    function getHitHandle(coords, a) {
      const handleSize = 26 / state.scale;
      const handles = getHandles(a);
      for (const h of handles) {
        if (Math.hypot(coords.x - h.x, coords.y - h.y) < handleSize) {
          return h.id;
        }
      }
      return null;
    }

    function distToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    // -------------------------------------------------------------
    // 描画処理
    // -------------------------------------------------------------
    function renderAnnotations() {
      annoCtx.clearRect(0, 0, annoCanvas.width, annoCanvas.height);
      annoCtx.save();
      annoCtx.translate(ANNOTATION_OVERFLOW, ANNOTATION_OVERFLOW);

      state.annotations.forEach(a => {
        if (a.type === 'rect') {
          annoCtx.save();
          if (a.hasShadow) {
            annoCtx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            annoCtx.shadowBlur = 8;
            annoCtx.shadowOffsetX = 3;
            annoCtx.shadowOffsetY = 3;
          }
          drawRoundedRect(annoCtx, a);
          annoCtx.restore();
        } else if (a.type === 'arrow') {
          annoCtx.save();
          if (a.hasShadow) {
            annoCtx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            annoCtx.shadowBlur = 8;
            annoCtx.shadowOffsetX = 3;
            annoCtx.shadowOffsetY = 3;
          }
          drawArrow(annoCtx, a);
          annoCtx.restore();
        } else if (a.type === 'text') {
          drawText(annoCtx, a);
        }

        if (a.id === state.selectedId) {
          drawSelectionBounds(a);
        }
      });

      annoCtx.restore();
      positionPanel();
    }

    function drawRoundedRect(ctx, a) {
      withRotation(ctx, a, () => {
        const x = a.x;
        const y = a.y;
        const w = a.w;
        const h = a.h;
        const absW = Math.abs(w);
        const absH = Math.abs(h);

        const maxR = Math.min(absW, absH) / 2;
        const pct = (a.borderRadius != null ? a.borderRadius : 0) / 100;
        let r = Math.max(0, Math.min(maxR, maxR * pct));

        ctx.beginPath();
        if (r <= 0) {
          ctx.rect(x, y, w, h);
        } else {
          const x1 = Math.min(x, x + w);
          const x2 = Math.max(x, x + w);
          const y1 = Math.min(y, y + h);
          const y2 = Math.max(y, y + h);

          ctx.moveTo(x1 + r, y1);
          ctx.arcTo(x2, y1, x2, y2, r);
          ctx.arcTo(x2, y2, x1, y2, r);
          ctx.arcTo(x1, y2, x1, y1, r);
          ctx.arcTo(x1, y1, x2, y1, r);
          ctx.closePath();
        }

        ctx.lineJoin = 'round';

        const outline = a.outlineWidth != null ? a.outlineWidth : 2;
        if (outline > 0) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = a.strokeWidth + outline * 2;
          ctx.stroke();
        }

        ctx.strokeStyle = a.color;
        ctx.lineWidth = a.strokeWidth;
        ctx.stroke();
      });
    }

    function drawArrow(ctx, a) {
      const angle = Math.atan2(a.y2 - a.y1, a.x2 - a.x1);
      const headLen = a.arrowSize || 20;

      const drawPath = () => {
        ctx.beginPath();
        ctx.moveTo(a.x1, a.y1);
        ctx.lineTo(a.x2, a.y2);
        ctx.lineTo(
          a.x2 - headLen * Math.cos(angle - Math.PI / 6),
          a.y2 - headLen * Math.sin(angle - Math.PI / 6)
        );
        ctx.moveTo(a.x2, a.y2);
        ctx.lineTo(
          a.x2 - headLen * Math.cos(angle + Math.PI / 6),
          a.y2 - headLen * Math.sin(angle + Math.PI / 6)
        );
      };

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const outline = a.outlineWidth != null ? a.outlineWidth : 2;
      if (outline > 0) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = a.strokeWidth + outline * 2;
        drawPath();
        ctx.stroke();
      }

      ctx.strokeStyle = a.color;
      ctx.lineWidth = a.strokeWidth;
      drawPath();
      ctx.stroke();
    }

    // 文字の描画（フチがついた場合でも正しくドロップシャドウが付与されるように修正）
    function drawText(ctx, a) {
      withRotation(ctx, a, () => {
        ctx.font = `${a.isBold ? 'bold' : 'normal'} ${a.size}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';

        const outline = (a.outlineWidth != null) ? a.outlineWidth : 2;
        const hasShadow = a.hasShadow !== false;

        // 1. 影の描画処理（独立して影用のパスを描画）
        if (hasShadow) {
          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
          ctx.shadowBlur = 4;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;

          if (outline > 0) {
            ctx.strokeStyle = 'rgba(0, 0, 0, 1)';
            // フチを大きくしても影の太さまで同じ割合で増えないよう制限
            ctx.lineWidth = Math.min(outline * 2, 8);
            ctx.strokeText(a.text, a.x, a.y);
          } else {
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillText(a.text, a.x, a.y);
          }
          ctx.restore();
        }

        // 2. 本体の描画（白フチおよびテキスト本体）
        if (outline > 0) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = outline * 2;
          ctx.strokeText(a.text, a.x, a.y);
        }
        ctx.fillStyle = a.color;
        ctx.fillText(a.text, a.x, a.y);
      });
    }

    function drawSelectionBounds(a) {
      annoCtx.save();
      annoCtx.strokeStyle = '#0a84ff';
      annoCtx.lineWidth = 2 / state.scale;
      annoCtx.fillStyle = '#ffffff';
      annoCtx.setLineDash([]);

      const handleR = 7 / state.scale;

      if (a.type === 'rect') {
        withRotation(annoCtx, a, () => {
          annoCtx.strokeRect(a.x, a.y, a.w, a.h);
        });
      } else if (a.type === 'text') {
        const m = measureTextAnno(a);
        withRotation(annoCtx, a, () => {
          annoCtx.strokeRect(a.x - m.w / 2 - 4, a.y - a.size / 2 - 4, m.w + 8, a.size + 8);
        });
      }

      const handles = getHandles(a);
      handles.forEach(h => {
        if (h.id === 'rot') {
          let base;
          if (a.type === 'rect') {
            base = localToWorld(a, a.x + a.w / 2, a.y);
          } else {
            base = localToWorld(a, a.x, a.y - a.size / 2);
          }

          annoCtx.beginPath();
          annoCtx.moveTo(base.x, base.y);
          annoCtx.lineTo(h.x, h.y);
          annoCtx.strokeStyle = '#0a84ff';
          annoCtx.lineWidth = 2 / state.scale;
          annoCtx.stroke();

          annoCtx.beginPath();
          annoCtx.arc(h.x, h.y, handleR + 2 / state.scale, 0, Math.PI * 2);
          annoCtx.fillStyle = '#0a84ff';
          annoCtx.fill();
          annoCtx.strokeStyle = '#ffffff';
          annoCtx.lineWidth = 2 / state.scale;
          annoCtx.stroke();

          annoCtx.beginPath();
          annoCtx.arc(h.x, h.y, handleR * 0.45, 0.4, Math.PI * 1.6);
          annoCtx.strokeStyle = '#ffffff';
          annoCtx.lineWidth = 1.6 / state.scale;
          annoCtx.stroke();
        } else {
          annoCtx.beginPath();
          annoCtx.arc(h.x, h.y, handleR, 0, Math.PI * 2);
          annoCtx.fillStyle = '#ffffff';
          annoCtx.fill();
          annoCtx.strokeStyle = '#0a84ff';
          annoCtx.lineWidth = 2 / state.scale;
          annoCtx.stroke();
        }
      });

      annoCtx.restore();
    }

    // -------------------------------------------------------------
    // パネル位置調整
    // -------------------------------------------------------------
    function positionPanel() {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a) return;

      let objCenterY;
      if (a.type === 'rect') objCenterY = a.y + a.h / 2;
      else if (a.type === 'text') objCenterY = a.y;
      else if (a.type === 'arrow') objCenterY = (a.y1 + a.y2) / 2;
      else objCenterY = 0;

      const screenY = state.panY + objCenterY * state.scale;
      const containerH = editorContainer.clientHeight;

      if (screenY > containerH * 0.5) {
        propertiesPanel.classList.add('at-top');
      } else {
        propertiesPanel.classList.remove('at-top');
      }
    }

    // -------------------------------------------------------------
    // UI 同期
    // -------------------------------------------------------------
    function updateUI() {
      const a = state.annotations.find(x => x.id === state.selectedId);

      if (!a) {
        propertiesPanel.classList.add('hidden');
        return;
      }

      propertiesPanel.classList.remove('hidden');

      document.querySelectorAll('.color-swatch').forEach(s => {
        if (s.dataset.color && s.dataset.color.toLowerCase() === (a.color || '').toLowerCase()) {
          s.classList.add('selected');
        } else {
          s.classList.remove('selected');
        }
      });
      const customPicker = document.getElementById('custom-color-picker');
      if (customPicker) customPicker.value = a.color || '#e63946';

      document.getElementById('text-prop-row').style.display = (a.type === 'text') ? 'flex' : 'none';
      document.getElementById('radius-prop-row').style.display = (a.type === 'rect') ? 'flex' : 'none';
      document.getElementById('arrow-prop-row').style.display = (a.type === 'arrow') ? 'flex' : 'none';
      btnBold.style.display = (a.type === 'text') ? 'block' : 'none';
      btnAspectSquare.style.display = (a.type === 'rect') ? 'block' : 'none';

      if (a.type === 'text') {
        textContentInput.value = a.text;
        btnBold.classList.toggle('active', !!a.isBold);
        sizeLabel.textContent = 'サイズ';
        sizeSlider.min = 12;
        sizeSlider.max = MAX_TEXT_SIZE;
        sizeSlider.value = a.size;
      } else {
        sizeLabel.textContent = '線幅';
        sizeSlider.min = 1;
        sizeSlider.max = MAX_STROKE_WIDTH;
        sizeSlider.value = a.strokeWidth;
      }

      if (a.type === 'rect') {
        radiusSlider.value = (a.borderRadius != null) ? a.borderRadius : 0;
      }
      if (a.type === 'arrow') {
        arrowSlider.value = a.arrowSize || 20;
      }

      outlineSlider.max = MAX_OUTLINE_WIDTH;
      outlineSlider.value = (a.outlineWidth != null) ? a.outlineWidth : 2;

      btnShadowToggle.classList.toggle('active', !!a.hasShadow);

      positionPanel();
    }

    function switchTool(tool) {
      state.activeTool = tool;
      document.querySelectorAll('.tool-item[data-tool]').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === tool);
      });
    }

    function selectColor(color) {
      state.defaults.color = color;
      const selectedAnno = state.annotations.find(a => a.id === state.selectedId);
      if (selectedAnno) {
        selectedAnno.color = color;
        saveHistory();
        renderAnnotations();
      }
      updateUI();
    }

    // -------------------------------------------------------------
    // プロパティ操作イベント
    // -------------------------------------------------------------
    textContentInput.addEventListener('input', (e) => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && a.type === 'text') {
        a.text = e.target.value;
        renderAnnotations();
      }
    });
    textContentInput.addEventListener('change', () => saveHistory());

    btnClearText.addEventListener('click', () => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && a.type === 'text') {
        a.text = '';
        textContentInput.value = '';
        textContentInput.focus();
        renderAnnotations();
        saveHistory();
      }
    });

    btnBold.addEventListener('click', () => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && a.type === 'text') {
        a.isBold = !a.isBold;
        state.defaults.isBold = a.isBold;
        updateUI();
        saveHistory();
        renderAnnotations();
      }
    });

    sizeSlider.addEventListener('input', (e) => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a) return;
      const val = Number(e.target.value);
      if (a.type === 'text') {
        a.size = val;
      } else {
        a.strokeWidth = val;
      }
      renderAnnotations();
    });
    sizeSlider.addEventListener('change', (e) => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a) return;
      const val = Number(e.target.value);
      if (a.type === 'text') state.defaults.textSize = val;
      else state.defaults.strokeWidth = val;
      saveHistory();
    });

    outlineSlider.addEventListener('input', (e) => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a) return;
      a.outlineWidth = Number(e.target.value);
      state.defaults.outlineWidth = a.outlineWidth;
      renderAnnotations();
    });
    outlineSlider.addEventListener('change', () => saveHistory());

    radiusSlider.addEventListener('input', (e) => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && a.type === 'rect') {
        a.borderRadius = Number(e.target.value);
        state.defaults.borderRadius = a.borderRadius;
        renderAnnotations();
      }
    });
    radiusSlider.addEventListener('change', () => saveHistory());

    arrowSlider.addEventListener('input', (e) => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && a.type === 'arrow') {
        a.arrowSize = Number(e.target.value);
        state.defaults.arrowSize = a.arrowSize;
        renderAnnotations();
      }
    });
    arrowSlider.addEventListener('change', () => saveHistory());

    btnAspectSquare.addEventListener('click', () => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a && a.type === 'rect') {
        const minSide = Math.min(Math.abs(a.w), Math.abs(a.h));
        const cx = a.x + a.w / 2;
        const cy = a.y + a.h / 2;
        const signW = a.w < 0 ? -1 : 1;
        const signH = a.h < 0 ? -1 : 1;
        a.w = minSide * signW;
        a.h = minSide * signH;
        a.x = cx - a.w / 2;
        a.y = cy - a.h / 2;
        saveHistory();
        renderAnnotations();
      }
    });

    btnShadowToggle.addEventListener('click', () => {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (a) {
        a.hasShadow = !a.hasShadow;
        state.defaults.hasShadow = a.hasShadow;
        updateUI();
        saveHistory();
        renderAnnotations();
      }
    });

    // -------------------------------------------------------------
    // 微調整ボタン
    // -------------------------------------------------------------
    function applyNudge(dx, dy) {
      const a = state.annotations.find(x => x.id === state.selectedId);
      if (!a) return;
      if (a.type === 'rect' || a.type === 'text') {
        a.x += dx;
        a.y += dy;
      } else if (a.type === 'arrow') {
        a.x1 += dx;
        a.y1 += dy;
        a.x2 += dx;
        a.y2 += dy;
      }
      renderAnnotations();
    }

    function setupNudgeButtons() {
      const defs = [
        { id: 'nudge-left', dx: -2, dy: 0 },
        { id: 'nudge-right', dx: 2, dy: 0 },
        { id: 'nudge-up', dx: 0, dy: -2 },
        { id: 'nudge-down', dx: 0, dy: 2 }
      ];

      defs.forEach(({ id, dx, dy }) => {
        const btn = document.getElementById(id);
        let holdTimer = null;
        let repeatTimer = null;
        let active = false;

        const stop = () => {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
          if (active) {
            active = false;
            saveHistory();
          }
        };

        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (!state.selectedId) return;
          active = true;
          applyNudge(dx, dy);
          holdTimer = setTimeout(() => {
            repeatTimer = setInterval(() => applyNudge(dx, dy), 55);
          }, 380);
        });
        btn.addEventListener('pointerup', stop);
        btn.addEventListener('pointercancel', stop);
        btn.addEventListener('pointerleave', stop);
      });
    }

    // ゴミ箱（削除）ボタン処理
    btnDelete.addEventListener('click', () => {
      if (state.selectedId) {
        state.annotations = state.annotations.filter(a => a.id !== state.selectedId);
        state.selectedId = null;
        updateUI();
        saveHistory();
        renderAnnotations();
      }
    });

    // -------------------------------------------------------------
    // エクスポート（保存）
    // -------------------------------------------------------------
    btnExport.addEventListener('click', () => {
      if (!state.image) return;

      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = state.imgWidth;
      exportCanvas.height = state.imgHeight;
      const exportCtx = exportCanvas.getContext('2d');

      exportCtx.drawImage(state.image, 0, 0);

      state.annotations.forEach(a => {
        if (a.type === 'rect') {
          exportCtx.save();
          if (a.hasShadow) {
            exportCtx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            exportCtx.shadowBlur = 8;
            exportCtx.shadowOffsetX = 3;
            exportCtx.shadowOffsetY = 3;
          }
          drawRoundedRect(exportCtx, a);
          exportCtx.restore();
        } else if (a.type === 'arrow') {
          exportCtx.save();
          if (a.hasShadow) {
            exportCtx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            exportCtx.shadowBlur = 8;
            exportCtx.shadowOffsetX = 3;
            exportCtx.shadowOffsetY = 3;
          }
          drawArrow(exportCtx, a);
          exportCtx.restore();
        } else if (a.type === 'text') {
          drawText(exportCtx, a);
        }
      });

      savePreview.src = exportCanvas.toDataURL('image/png');
      saveModal.classList.add('active');
    });

    btnCloseModal.addEventListener('click', () => {
      saveModal.classList.remove('active');
    });

    // 初期化実行
    init();
  </script>
</body>
</html>
