<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>iPhone 17 Pro PWA Previewer</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--text:#f5f5f7;--muted:#98989f;--accent:#0a84ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
button,textarea{font:inherit}
button{border:0;color:var(--text);background:var(--panel2);border-radius:14px;min-height:44px;padding:0 16px;font-weight:600}
button.primary{background:var(--accent)}
button:active{transform:scale(.97);opacity:.8}
.app{max-width:900px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px 14px}
h1{font-size:21px;margin:0;font-weight:700}
.actions{display:flex;gap:7px;overflow:auto}
.actions button{min-height:40px;padding:0 12px;font-size:14px;white-space:nowrap}
.editor{display:grid;gap:10px}
textarea{width:100%;height:240px;resize:vertical;background:#111113;color:#f5f5f7;border:1px solid #38383c;border-radius:16px;padding:14px;outline:none;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5}
textarea:focus{border-color:var(--accent)}
.preview-wrap{display:none}
.preview-wrap.show{display:block}
.editor.hide{display:none}
.phone-stage{display:grid;place-items:center;padding:4px 0 30px}
.phone{position:relative;width:min(393px,100%);aspect-ratio:393/852;background:#000;border:7px solid #202023;border-radius:48px;overflow:hidden;box-shadow:0 18px 55px #000,0 0 0 1px #444}
.phone iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;color-scheme:dark}
.island{position:absolute;z-index:5;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:22px;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.02)}
.homebar{position:absolute;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:5px;background:#fff;pointer-events:none;opacity:.95}
.phone-label{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.fullscreen{position:fixed;inset:0;z-index:100;background:#000;padding:0;display:none}
.fullscreen.show{display:block}
.fullscreen iframe{width:100%;height:100%;border:0}
.fullscreen .exit{position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));right:14px;width:44px;height:44px;padding:0;border-radius:50%;background:rgba(60,60,65,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}
.status{font-size:12px;color:var(--muted);padding:2px 4px 10px;min-height:18px}
@media(min-width:700px){body{padding-left:24px;padding-right:24px}.editor textarea{height:300px}}
.tabs{display:flex;background:#1c1c1e;border-radius:13px;padding:2px;margin-bottom:14px}.tab{flex:1;min-height:38px;background:transparent;color:#98989f}.tab.active{background:#3a3a3c;color:#fff}.editor-tools,.preview-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px}.editor-tools #count{font-size:13px;color:#98989f;white-space:nowrap}.search-box{display:flex;align-items:center;gap:5px;flex:1;min-width:0}.search-box input{width:100%;height:40px;border:1px solid #38383c;border-radius:12px;background:#111113;color:#fff;padding:0 11px;outline:none}#searchResult{font-size:11px;color:#98989f;white-space:nowrap}''</style>
</head>
<body>
<div class="app">
<header><h1>iPhone 17 Pro PWAプレビュー</h1></header>
<nav class="tabs"><button id="editTab" class="tab active">編集</button><button id="previewTab" class="tab">プレビュー</button></nav>

<section id="editor" class="editor"><div class="editor-tools"><span id="count">0文字</span><div class="search-box"><input id="search" type="search" placeholder="検索" autocomplete="off"><span id="searchResult"></span></div><button id="clear">クリア</button></div>
<div class="status">HTML・CSS・JavaScriptをそのまま貼り付けてください</div>
<textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
</section>

<section id="previewWrap" class="preview-wrap">
<div class="actions" style="margin-bottom:10px">
<button id="full" class="primary">全画面プレビュー</button>
</div>
<div class="phone-stage">
<div class="phone" id="phone">
<div class="island"></div>
<iframe id="frame" title="PWA preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
<div class="homebar"></div>
</div>

</div>
</section>
</div>

<div id="fullscreen" class="fullscreen">
<button class="exit" id="exit">×</button>
<iframe id="fullFrame" title="Full screen PWA preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<script>
const $=id=>document.getElementById(id);
const source=$("source"),frame=$("frame"),fullFrame=$("fullFrame");
const KEY="iphone17pro-pwa-preview-html-v1";
source.value=localStorage.getItem(KEY)||"";
function updateCount(){$("count").textContent=source.value.length.toLocaleString()+"文字"}
function save(){localStorage.setItem(KEY,source.value);updateCount()}
function run(){save();frame.srcdoc=source.value}
function showEditor(){$("editor").classList.remove("hide");$("previewWrap").classList.remove("show");$("editTab").classList.add("active");$("previewTab").classList.remove("active")}
function showPreview(){run();$("editor").classList.add("hide");$("previewWrap").classList.add("show");$("editTab").classList.remove("active");$("previewTab").classList.add("active")}
$("editTab").onclick=showEditor;$("previewTab").onclick=showPreview;
$("clear").onclick=()=>{source.value="";save();$("search").value="";$("searchResult").textContent="";source.focus()};
$("full").onclick=()=>{fullFrame.srcdoc=source.value;$("fullscreen").classList.add("show")};
$("exit").onclick=()=>{$("fullscreen").classList.remove("show");fullFrame.srcdoc=""};
source.addEventListener("input",save);
$("search").addEventListener("input",()=>{const q=$("search").value;if(!q){$("searchResult").textContent="";return}let n=0,pos=0;while((pos=source.value.indexOf(q,pos))!==-1){n++;pos+=Math.max(q.length,1)}$("searchResult").textContent=n+"件"});
window.addEventListener("beforeunload",save);updateCount();
</script>
</body>
</html>
