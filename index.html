<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1018">
<title>かんたん作曲</title>
<style>
:root {
  --bg: #090d14;
  --surface: #111824;
  --surface-2: #172131;
  --surface-3: #202d40;
  --ink: #f5f8ff;
  --muted: #98a8bd;
  --line: rgba(187, 207, 235, .16);
  --grid: rgba(183, 205, 235, .12);
  --grid-strong: rgba(183, 205, 235, .26);
  --accent: #53d7ff;
  --record: #ff5573;
  --record-soft: rgba(255, 85, 115, .18);
  --rest: #f6c45b;
  --row-h: 36px;
  --ruler-h: 12px;
  --shadow: 0 12px 30px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.22);
  --white-key-w: 44px;
  --white-key-h: 146px;
  --black-key-w: 27px;
  --black-key-h: 92px;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
}
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  touch-action: manipulation;
}
button, input { font: inherit; }
button { -webkit-appearance: none; appearance: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  min-height: calc(100dvh + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% -20%, rgba(83,215,255,.13), transparent 34%),
    var(--bg);
}
.control {
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 10px;
  color: var(--ink);
  background: linear-gradient(180deg, var(--surface-3), var(--surface-2));
  box-shadow: inset 0 1px rgba(255,255,255,.05), 0 3px 9px rgba(0,0,0,.16);
  font-weight: 750;
  font-size: 12px;
  white-space: nowrap;
  touch-action: manipulation;
}
.control:active { transform: translateY(1px); filter: brightness(.92); }
.control.play { color: #06151b; background: linear-gradient(180deg, #85e8ff, var(--accent)); border-color: #8eeaff; }
.control.play.is-playing { color: #fff; background: linear-gradient(180deg, #ff7189, #d92d52); border-color: #ff8197; }
.control.record { min-width: 76px; }
.control.record.is-on {
  color: #fff;
  background: linear-gradient(180deg, #d93657, #a91f3b);
  border-color: rgba(255,145,164,.8);
  box-shadow: 0 0 0 3px var(--record-soft), inset 0 1px rgba(255,255,255,.16);
}
.rec-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 4px;
  border-radius: 50%;
  background: var(--muted);
  box-shadow: 0 0 0 2px rgba(255,255,255,.08);
}
.record.is-on .rec-dot { background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.85); }

.control-deck .control.play { height: 31px; }

.control:disabled { opacity: .42; filter: saturate(.4); }
.composer {
  position: relative;
  min-height: 0;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.score-viewport {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  background: #0d141e;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-x pan-y;
  scrollbar-color: var(--surface-3) transparent;
  scrollbar-width: thin;
  transition: background-color .4s ease;
}
.score-viewport::-webkit-scrollbar { width: 5px; height: 5px; }
.score-viewport::-webkit-scrollbar-thumb { background: #35455c; border-radius: 9px; }
.score-content {
  position: relative;
  min-height: 100%;
  background-color: #0d141e;
  background-image: linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 100% var(--row-h);
  background-position: 0 0;
  isolation: isolate;
  transform-origin: 0 0;
}
.score-content::before {
  content: "";
  position: absolute;
  inset: var(--ruler-h) 0 0;
  z-index: 0;
  pointer-events: none;
  background-image: linear-gradient(to bottom, var(--grid-strong) 2px, transparent 2px);
  background-size: 100% calc(4 * var(--row-h));
}
.pitch-lane {
  position: absolute;
  top: var(--ruler-h);
  bottom: 0;
  z-index: 0;
  pointer-events: none;
  border-left: 1px solid rgba(183,205,235,.12);
  border-right: 1px solid rgba(183,205,235,.08);
  background: rgba(255,255,255,.012);
}
.pitch-lane.is-black {
  z-index: 1;
  background: rgba(0,0,0,.28);
  border-color: rgba(183,205,235,.2);
}
.time-label {
  position: absolute;
  z-index: 1;
  left: 4px;
  height: 16px;
  padding: 1px 5px 0;
  color: #71839a;
  background: rgba(9,13,20,.78);
  border-radius: 5px;
  font-size: 9px;
  line-height: 14px;
  pointer-events: none;
}
.note-block {
  position: absolute;
  z-index: 4;
  min-height: 12px;
  border: 1px solid rgba(164,235,255,.72);
  border-radius: 7px;
  color: #05202a;
  background:
    linear-gradient(135deg, rgba(255,255,255,.5), transparent 38%),
    linear-gradient(180deg, #68ddfa, #31afd5);
  box-shadow: inset 0 1px rgba(255,255,255,.48), 0 4px 11px rgba(0,0,0,.28);
  overflow: hidden;
  touch-action: pan-x pan-y;
}
.note-block::after {
  content: "";
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 3px;
  height: 2px;
  border-radius: 2px;
  background: rgba(2,49,66,.32);
}
.note-label {
  position: sticky;
  top: 3px;
  display: block;
  padding: 3px 2px 0;
  font-size: 13px;
  line-height: 1;
  font-weight: 900;
  text-align: center;
  text-shadow: 0 1px rgba(255,255,255,.28);
}
.note-block.is-selected {
  z-index: 7;
  border: 2px solid #fff;
  box-shadow: 0 0 0 3px rgba(83,215,255,.65), 0 0 25px rgba(83,215,255,.5), inset 0 1px rgba(255,255,255,.6);
}
.note-block.is-playing {
  z-index: 8;
  background: linear-gradient(180deg, #fff5a8, #f6bf46);
  border-color: #fff8ce;
  box-shadow: 0 0 0 3px rgba(246,196,91,.35), 0 0 28px rgba(246,196,91,.72);
}
.rest-block {
  position: absolute;
  left: 0;
  z-index: 3;
  width: 100%;
  min-height: 12px;
  border-top: 1px solid rgba(246,196,91,.58);
  border-bottom: 1px solid rgba(246,196,91,.58);
  background:
    repeating-linear-gradient(135deg, rgba(246,196,91,.12) 0 8px, rgba(246,196,91,.035) 8px 16px),
    rgba(48,42,25,.25);
  color: var(--rest);
  touch-action: pan-x pan-y;
}
.rest-block.is-selected {
  z-index: 6;
  border: 2px solid #ffe49c;
  box-shadow: inset 0 0 0 2px rgba(246,196,91,.28), 0 0 20px rgba(246,196,91,.24);
}
.rest-block.is-playing { background-color: rgba(246,196,91,.2); }
.rest-label {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  min-width: 54px;
  padding: 2px 7px;
  border: 1px solid rgba(246,196,91,.35);
  border-radius: 999px;
  background: rgba(20,18,12,.78);
  font-size: 10px;
  font-weight: 850;
  text-align: center;
}
.playhead {
  position: absolute;
  z-index: 11;
  left: 0;
  width: 100%;
  height: 2px;
  pointer-events: none;
  display: none;
  background: #ff5573;
  box-shadow: 0 0 12px #ff5573, 0 0 3px #fff;
}
.playhead::before {
  content: "";
  position: sticky;
  left: 5px;
  display: block;
  width: 10px;
  height: 10px;
  transform: translateY(-4px) rotate(45deg);
  border-radius: 2px;
  background: #ff5573;
  box-shadow: 0 0 10px rgba(255,85,115,.8);
}
.toast {
  position: fixed;
  z-index: 40;
  left: 50%;
  top: calc(12px + env(safe-area-inset-top));
  max-width: calc(100% - 24px);
  transform: translate(-50%, -12px);
  padding: 8px 12px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 999px;
  color: #fff;
  background: rgba(27,38,53,.94);
  box-shadow: 0 10px 28px rgba(0,0,0,.38);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
  font-weight: 750;
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes controlShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
.control.is-shaking { animation: controlShake .38s ease; }

.keyboard-viewport {
  order: 1;
  height: var(--white-key-h);
  overflow: hidden;
  position: relative;
  touch-action: none;
  background: #080b10;
  display: flex;
  align-items: flex-end;
}
.keyboard-inner {
  position: relative;
  height: var(--white-key-h);
  transform: translateZ(0);
  flex: 0 0 auto;
  transform-origin: 0 100%;
}
.piano-key {
  position: absolute;
  top: 0;
  padding: 0;
  border: 0;
  border-radius: 0 0 7px 7px;
  overflow: hidden;
}
.white-key {
  z-index: 1;
  width: var(--white-key-w);
  height: var(--white-key-h);
  border-right: 1px solid #7d8490;
  border-bottom: 5px solid #9da5b0;
  background: linear-gradient(90deg, #d6d9df 0, #fff 12%, #f8f9fb 76%, #bdc2ca 100%);
  box-shadow: inset 0 -8px 10px rgba(60,67,77,.12), inset 0 1px #fff;
}
.white-key:first-child { border-left: 1px solid #7d8490; }
.black-key {
  z-index: 3;
  width: var(--black-key-w);
  height: var(--black-key-h);
  border: 1px solid #020305;
  border-bottom: 7px solid #020305;
  background: linear-gradient(90deg, #06080b, #303640 45%, #0b0e13 78%, #020304);
  box-shadow: inset 0 -5px 4px rgba(255,255,255,.06), 0 5px 7px rgba(0,0,0,.5);
}
.piano-key.is-pressed.white-key {
  background: linear-gradient(90deg, #8ddff2, #e4fbff 30%, #9ce8f7);
  border-bottom-width: 2px;
  transform: translateY(3px);
}
.piano-key.is-pressed.black-key {
  background: linear-gradient(90deg, #063b4c, #32b9db 50%, #062c38);
  border-bottom-width: 3px;
  transform: translateY(3px);
  box-shadow: 0 0 17px rgba(83,215,255,.45);
}
.key-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 8px;
  color: #39414d;
  font-size: 14px;
  font-weight: 850;
  text-align: center;
  pointer-events: none;
}
.key-octave { display: block; margin-top: 2px; color: #78808a; font-size: 14px; }

@media (max-height: 700px) {
  :root { --white-key-h: 118px; --black-key-h: 75px; --row-h: 32px; }
  .control-deck { padding-top: max(3px, env(safe-area-inset-top)); }
  .control-deck .control { min-height: 26px; height: 26px; }
  .control-deck .control.play { height: 28px; }
  .keyboard-nav { height: 28px; }
}
@media (min-width: 700px) {
  :root { --row-h: 39px; --white-key-w: 52px; --black-key-w: 31px; --white-key-h: 168px; --black-key-h: 106px; }
  .control-deck { grid-template-columns: minmax(120px, 1fr) 128px minmax(120px, 1fr); padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
  .dpad { width: 128px; }
  .control-deck .control { font-size: 12px; }
}

.setting-stack { display: grid; gap: 12px; margin-bottom: 13px; }
.setting-block {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(17,25,37,.88);
}
.setting-label { display: block; margin-bottom: 8px; color: #e9f1fc; font-size: 13px; font-weight: 850; }
.setting-help { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label {
  min-height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: #b9c7d9;
  background: #202d40;
  font-size: 12px;
  font-weight: 800;
  touch-action: manipulation;
}
.segmented input:checked + label {
  color: #06151b;
  border-color: #8eeaff;
  background: linear-gradient(180deg, #8aeaff, var(--accent));
  box-shadow: 0 3px 14px rgba(83,215,255,.25);
}
.length-row { display: grid; grid-template-columns: 1fr 62px; align-items: center; gap: 10px; }
#noteLengthRange { width: 100%; height: 32px; margin: 0; accent-color: var(--accent); }
.length-value {
  min-height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--accent);
  background: #0d141e;
  font-size: 12px;
  font-weight: 850;
}
.score-content, .keyboard-inner {
  transition: transform .5s cubic-bezier(.22,.8,.22,1);
}
.score-viewport.playback-fit { overflow-x: hidden; scroll-behavior: auto; }
.keyboard-viewport.playback-fit { overflow: hidden; }

@keyframes keyRadiance {
  from { filter: brightness(1.2) saturate(1.25); }
  to { filter: brightness(1.65) saturate(1.6); }
}
.mini-btn.is-playing { color: #fff; border-color: #ff8197; background: linear-gradient(180deg, #e34c69, #a91f3b); }

.tab-view {
  display: none;
  min-height: 0;
  flex: 1 1 auto;
  overflow: hidden;
}
.tab-view.is-active { display: flex; flex-direction: column; }
.composition-view .composer { flex: 1 1 auto; }

.keyboard-panel {
  position: relative;
  z-index: 25;
  flex: none;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #111926, #080c12);
  border-top: 1px solid rgba(204,223,250,.24);
  box-shadow: 0 -10px 28px rgba(0,0,0,.34);
  padding-bottom: 0;
  gap: 10px;
}
.keyboard-nav {
  order: 3;
  height: 32px;
  display: grid;
  grid-template-columns: 32px 1fr 32px;
  align-items: center;
  gap: 7px;
  padding: 3px 8px;
  border-bottom: 1px solid var(--line);
}
.octave-shift {
  width: 32px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: #c9d5e5;
  background: #1b2636;
  touch-action: manipulation;
}
.range-wrap { position: relative; display: flex; align-items: center; gap: 7px; min-width: 0; }
.range-label { color: var(--muted); font-size: 10px; font-weight: 750; white-space: nowrap; }
#keyboardRange {
  width: 100%;
  height: 24px;
  margin: 0;
  accent-color: var(--accent);
  touch-action: manipulation;
}
.control-deck {
  order: 2;
  flex: none;
  display: grid;
  grid-template-columns: minmax(84px, 1fr) 142px minmax(84px, 1fr);
  align-items: center;
  gap: 8px;
  padding: 8px max(8px, env(safe-area-inset-left)) 7px max(8px, env(safe-area-inset-right));
  background: rgba(9, 13, 20, .96);
  border-top: 1px solid var(--line);
  border-bottom: 0;
  box-shadow: 0 -7px 18px rgba(0,0,0,.22);
}
.deck-side {
  min-width: 0;
  display: grid;
  gap: 6px;
}
.control-deck .control {
  width: 100%;
  min-width: 0;
  min-height: 43px;
  height: 43px;
  padding: 0 5px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 800;
}
.control-deck .control:active { transform: scale(.97); }
.control-deck .control.rest-action { color: var(--rest); }
.control-deck .control.delete-action { color: #ff9aa6; }
.dpad {
  width: 142px;
  height: 142px;
  display: grid;
  grid-template-columns: 44px 44px 44px;
  grid-template-rows: 44px 44px 44px;
  gap: 4px;
  justify-content: center;
  align-content: center;
}
.dpad-btn {
  width: 44px !important;
  height: 44px !important;
  min-height: 44px !important;
  padding: 0 !important;
  border-radius: 12px !important;
  font-size: 19px !important;
  line-height: 1;
}
.dpad-up { grid-column: 2; grid-row: 1; }
.dpad-left { grid-column: 1; grid-row: 2; }
.dpad-center {
  grid-column: 2;
  grid-row: 2;
  width: 44px;
  height: 44px;
  min-height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: radial-gradient(circle, rgba(83,215,255,.16), rgba(255,255,255,.025));
  color: var(--ink);
  font-size: 19px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}
.dpad-right { grid-column: 3; grid-row: 2; }
.dpad-down { grid-column: 2; grid-row: 3; }
.control.random-action {
  color: #d9c8ff;
  border-color: rgba(183,151,255,.38);
  background: linear-gradient(180deg, #342c50, #241f39);
}
.bottom-tabs {
  flex: none;
  z-index: 60;
  height: calc(56px + env(safe-area-inset-bottom, 0px));
  margin: 8px 10px 0;
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: rgba(15,23,34,.78);
  -webkit-backdrop-filter: blur(22px);
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 18px;
  box-shadow: 0 12px 32px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.05);
}
.tab-btn {
  min-width: 0;
  border: 0;
  border-radius: 14px;
  color: #8fa0b5;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 10px;
  font-weight: 700;
  touch-action: manipulation;
  transition: transform .18s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
}
.tab-btn:active { transform: scale(.93); }
.tab-btn.is-active {
  color: #04141a;
  background: linear-gradient(145deg, #aaf2ff, #53d7ff 55%, #3bbde0);
  box-shadow: 0 6px 18px rgba(83,215,255,.38), inset 0 1px rgba(255,255,255,.55);
}
.tab-ico { font-size: 20px; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.1)); }
.tab-label { font-size: 10px; letter-spacing: .03em; }
.content-screen {
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding: max(14px, env(safe-area-inset-top)) 14px 22px;
  background:
    radial-gradient(circle at 85% 0, rgba(83,215,255,.12), transparent 30%),
    var(--bg);
}
.screen-inner { width: min(720px, 100%); margin: 0 auto; }
.screen-title { margin: 0 0 14px; font-size: 22px; letter-spacing: -.04em; }
.panel-card {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: linear-gradient(180deg, rgba(31,44,62,.94), rgba(18,26,38,.96));
  box-shadow: var(--shadow);
}
.save-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.text-input {
  min-width: 0;
  height: 45px;
  border: 1px solid rgba(187,207,235,.25);
  border-radius: 11px;
  padding: 0 12px;
  color: var(--ink);
  background: #0d141e;
  user-select: text;
  -webkit-user-select: text;
  -webkit-touch-callout: default;
  font-size: 16px;
}
.primary-action {
  min-width: 78px;
  height: 45px;
  border: 1px solid #8eeaff;
  border-radius: 11px;
  color: #06151b;
  background: linear-gradient(180deg, #8aeaff, var(--accent));
  font-weight: 850;
}
.library-list { display: grid; gap: 9px; margin-top: 13px; }
.song-item {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 9px;
  align-items: center;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(22,32,47,.92);
}
.song-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 850; }
.song-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }
.song-actions { display: flex; gap: 5px; }
.mini-btn {
  min-height: 37px;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 0 9px;
  color: var(--ink);
  background: #243247;
  font-size: 11px;
  font-weight: 800;
}
.empty-library { padding: 26px 10px; color: var(--muted); text-align: center; font-size: 13px; }
.settings-copy { color: #bdcadd; font-size: 13px; line-height: 1.75; }
.export-btn { width: 100%; min-height: 49px; margin-top: 12px; }
.modal-backdrop {
  position: fixed;
  z-index: 200;
  inset: 0;
  display: none;
  place-items: center;
  padding: 22px;
  background: rgba(0,0,0,.64);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.modal-backdrop.is-open { display: grid; }
.modal-card {
  width: min(360px, 100%);
  padding: 18px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 17px;
  background: #172131;
  box-shadow: 0 25px 70px rgba(0,0,0,.5);
}
.modal-title { margin: 0; font-size: 18px; }
.modal-message { margin: 9px 0 17px; color: #bdcadd; font-size: 13px; line-height: 1.65; }
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modal-btn { min-height: 45px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: #26354b; font-weight: 800; }
.modal-btn.danger { color: #fff; background: #b62e49; border-color: #ff738d; }

.score-viewport.overview-mode { background-color: #080d14; }
.score-viewport.overview-mode .score-content { box-shadow: 0 0 0 1px rgba(83,215,255,.2); }

.piano-key.is-playing-key.white-key {
  background: linear-gradient(90deg, #fff4a4, #fffbdc 38%, #ffd45e);
  border-color: #fff6a2;
  box-shadow: inset 0 -7px 8px rgba(120,80,0,.16), 0 0 22px rgba(255,215,90,.9);
  filter: brightness(1.3) saturate(1.35);
  animation: keyRadiance .48s ease-in-out infinite alternate;
}
.piano-key.is-playing-key.black-key {
  background: linear-gradient(90deg, #7a4b00, #ffd85f 48%, #8c5700);
  border-color: #fff375;
  box-shadow: 0 0 24px rgba(255,215,90,.9);
  filter: brightness(1.42) saturate(1.45);
  animation: keyRadiance .48s ease-in-out infinite alternate;
}

.edge-cue {
  position: absolute;
  z-index: 25;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.edge-cue.is-visible { opacity: 1; }
.edge-cue.left, .edge-cue.right {
  top: 18%; bottom: 18%; width: 13px;
  background: radial-gradient(ellipse at center, rgba(83,215,255,.95), rgba(83,215,255,.12) 50%, transparent 73%);
  filter: drop-shadow(0 0 8px rgba(83,215,255,.85));
}
.edge-cue.left { left: 0; border-radius: 0 999px 999px 0; }
.edge-cue.right { right: 0; border-radius: 999px 0 0 999px; }
.edge-cue.up, .edge-cue.down {
  left: 18%; right: 18%; height: 12px;
  background: radial-gradient(ellipse at center, rgba(246,196,91,.95), rgba(246,196,91,.1) 55%, transparent 76%);
  filter: drop-shadow(0 0 8px rgba(246,196,91,.72));
}
.edge-cue.up { top: 0; border-radius: 0 0 999px 999px; }
.edge-cue.down { bottom: 0; border-radius: 999px 999px 0 0; }

@media (max-height: 720px) {
  :root { --white-key-h: 104px; --black-key-h: 67px; }
  .control-deck { grid-template-columns: minmax(76px,1fr) 126px minmax(76px,1fr); padding-top: 5px; padding-bottom: 5px; }
  .control-deck .control { min-height: 37px; height: 37px; font-size: 12px; }
  .dpad { width: 126px; height: 122px; grid-template-columns: 38px 38px 38px; grid-template-rows: 38px 38px 38px; }
  .dpad-btn { width: 38px !important; height: 38px !important; min-height: 38px !important; }
  .dpad-center { width: 38px; height: 38px; min-height: 38px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  body { background: #fff; }
  .keyboard-panel, .control-deck { display: none; }
}

.score-viewport.playback-lock { overflow: hidden !important; touch-action: none !important; pointer-events: none !important; }
.keyboard-viewport.playback-lock { overflow: hidden !important; touch-action: none !important; pointer-events: none !important; }
.tab-btn:disabled { opacity: .4; pointer-events: none; }

.score-viewport.is-zooming, .keyboard-viewport.is-zooming {
  overflow: hidden !important;
  touch-action: none !important;
}
</style>
</head>
<body>
<div id="app">
  <section id="compositionView" class="tab-view composition-view is-active" aria-label="作曲">
    <main class="composer">
      <div id="scoreViewport" class="score-viewport" aria-label="縦型ピアノロール。左右が音程、上から下が時間です。">
        <div id="scoreContent" class="score-content"></div>
      </div>
      <div id="edgeLeft" class="edge-cue left" aria-hidden="true"></div>
      <div id="edgeRight" class="edge-cue right" aria-hidden="true"></div>
      <div id="edgeUp" class="edge-cue up" aria-hidden="true"></div>
      <div id="edgeDown" class="edge-cue down" aria-hidden="true"></div>
    </main>

    <section class="keyboard-panel" aria-label="4オクターブのピアノ鍵盤">
      <div class="keyboard-nav">
        <button id="keyLeft" class="octave-shift" type="button" aria-label="低い音域へ">◀</button>
        <div class="range-wrap">
          <span class="range-label">音域</span>
          <input id="keyboardRange" type="range" min="0" max="100" value="28" aria-label="盤の表示音域">
        </div>
        <button id="keyRight" class="octave-shift" type="button" aria-label="高い音域へ">▶</button>
      </div>
      <div id="keyboardViewport" class="keyboard-viewport">
        <div id="keyboardInner" class="keyboard-inner"></div>
      </div>
      <div class="control-deck" aria-label="作曲コントロール">
        <div class="deck-side">
          <button id="restBtn" class="control rest-action" type="button">休符</button>
          <button id="deleteBtn" class="control delete-action" type="button">削除</button>
        </div>
        <div class="dpad" aria-label="選択音符の編集">
          <button id="shortenBtn" class="control dpad-btn dpad-up" type="button" aria-label="選択中の音符を短くする">▲</button>
          <button id="pitchDownBtn" class="control dpad-btn dpad-left" type="button" aria-label="選択中の音符を半音下げる">◀</button>
          <button id="centerBtn" class="control dpad-btn dpad-center" type="button" aria-label="選択中の音符を中心に表示">◎</button>
          <button id="pitchUpBtn" class="control dpad-btn dpad-right" type="button" aria-label="選択中の音符を半音上げる">▶</button>
          <button id="extendBtn" class="control dpad-btn dpad-down" type="button" aria-label="選択中の音符を伸ばす">▼</button>
        </div>
        <div class="deck-side">
          <button id="playBtn" class="control play" type="button">▶ 再生</button>
          <button id="recordBtn" class="control record" type="button" aria-pressed="false"><span class="rec-dot"></span><span id="recordLabel">記録</span></button>
          <button id="randomBtn" class="control random-action" type="button">ランダム</button>
        </div>
      </div>
    </section>
  </section>

  <section id="songsView" class="tab-view content-screen" aria-label="楽曲">
    <div class="screen-inner">
      <h2 class="screen-title">楽曲</h2>
      <div class="panel-card">
        <div class="save-row">
          <input id="songNameInput" class="text-input" type="text" maxlength="60" placeholder="曲名を入力" aria-label="保存する曲名">
          <button id="saveSongBtn" class="primary-action" type="button">保存</button>
        </div>
      </div>
      <div id="songList" class="library-list" aria-live="polite"></div>
    </div>
  </section>

  <section id="settingsView" class="tab-view content-screen" aria-label="設定">
    <div class="screen-inner">
      <h2 class="screen-title">設定</h2>
      <div class="setting-stack">
        <div class="setting-block">
          <span class="setting-label">ピアノ左右スワイプ</span>
          <div class="segmented" role="radiogroup" aria-label="ピアノ左右スワイプの動作">
            <input id="swipePlay" type="radio" name="swipeMode" value="play" checked>
            <label for="swipePlay">音をたどる</label>
            <input id="swipeScroll" type="radio" name="swipeMode" value="scroll">
            <label for="swipeScroll">音域を移動</label>
          </div>
          <div class="setting-help">「音域を移動」でも、最初に触れた鍵盤は鳴ります。そのまま指を離さず左右へ動かすと、楽譜とピアノをスクロールします</div>
        </div>
        <div class="setting-block">
          <label class="setting-label" for="noteLengthRange">1音あたりの長さ</label>
          <div class="length-row">
            <input id="noteLengthRange" type="range" min="0.12" max="1.00" step="0.02" value="0.28">
            <output id="noteLengthValue" class="length-value" for="noteLengthRange">0.28秒</output>
          </div>
          <div class="setting-help">再生テンポを変更します。この値は楽曲ごとに保存されます。</div>
        </div>
        <div class="setting-block">
          <label class="setting-label" for="randomLengthRange">ランダム生成の長さ</label>
          <div class="length-row">
            <input id="randomLengthRange" type="range" min="12" max="100" step="1" value="12">
            <output id="randomLengthValue" class="length-value" for="randomLengthRange">12音</output>
          </div>
          <div class="setting-help">ランダムボタンで生成するフレーズの長さ（音符・休符の合計数）を指定します。</div>
        </div>
      </div>
      <div class="panel-card">
        <div class="settings-copy">保存したすべての楽曲と、現在作曲中の内容をJSONファイルとして書き出します。バックアップや別端末への保管に利用できます。</div>
        <button id="exportBtn" class="primary-action export-btn" type="button">すべての楽曲をエクスポート</button>
        <button id="importBtn" class="primary-action export-btn" type="button" style="margin-top:8px;">楽曲をインポート</button>
        <input id="importFileInput" type="file" accept="application/json,application/JSON" style="display:none">
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="bottom-tabs" aria-label="画面切り替え">
    <button class="tab-btn is-active" type="button" data-tab="composition"><span class="tab-ico">🎹</span><span class="tab-label">作曲</span></button>
    <button class="tab-btn" type="button" data-tab="songs"><span class="tab-ico">🎵</span><span class="tab-label">楽曲</span></button>
    <button class="tab-btn" type="button" data-tab="settings"><span class="tab-ico">⚙️</span><span class="tab-label">設定</span></button>
  </nav>
</div>

<div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <h2 id="modalTitle" class="modal-title">確認</h2>
    <div id="modalMessage" class="modal-message"></div>
    <div class="modal-actions">
      <button id="modalCancel" class="modal-btn" type="button">キャンセル</button>
      <button id="modalConfirm" class="modal-btn danger" type="button">実行</button>
    </div>
  </div>
</div>
<script>

(() => {
  'use strict';

  if (window.__kantanDocAbort) {
    try { window.__kantanDocAbort.abort(); } catch (_) {}
  }
  window.__kantanDocAbort = new AbortController();
  const __docSignal = window.__kantanDocAbort.signal;

  const PITCH_COUNT = 48;
  const FIRST_MIDI = 48;
  const BPM = 108;
  const DEFAULT_UNIT_SECONDS = 60 / BPM / 2;
  const STORAGE_KEY = 'kantan-sakkyoku-v4';
  const SONGS_KEY = 'kantan-sakkyoku-songs-v1';
  const NOTE_NAMES_JA = ['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
  const BLACK_PCS = new Set([1,3,6,8,10]);
  const PIANO_PARTIALS = [
    { ratio: 1, type: 'triangle', gain: .82, detune: -1.7 },
    { ratio: 2, type: 'sine', gain: .24, detune: 1.1 },
    { ratio: 3, type: 'sine', gain: .10, detune: -.6 },
    { ratio: 4.01, type: 'sine', gain: .045, detune: 1.8 }
  ];

  const els = {
    playBtn: document.getElementById('playBtn'),
    recordBtn: document.getElementById('recordBtn'),
    recordLabel: document.getElementById('recordLabel'),
    extendBtn: document.getElementById('extendBtn'),
    shortenBtn: document.getElementById('shortenBtn'),
    restBtn: document.getElementById('restBtn'),
    deleteBtn: document.getElementById('deleteBtn'),
    pitchDownBtn: document.getElementById('pitchDownBtn'),
    pitchUpBtn: document.getElementById('pitchUpBtn'),
    centerBtn: document.getElementById('centerBtn'),
    scoreViewport: document.getElementById('scoreViewport'),
    scoreContent: document.getElementById('scoreContent'),
    toast: document.getElementById('toast'),
    keyboardViewport: document.getElementById('keyboardViewport'),
    keyboardInner: document.getElementById('keyboardInner'),
    keyboardRange: document.getElementById('keyboardRange'),
    keyLeft: document.getElementById('keyLeft'),
    keyRight: document.getElementById('keyRight'),
    randomBtn: document.getElementById('randomBtn'),
    compositionView: document.getElementById('compositionView'),
    songsView: document.getElementById('songsView'),
    settingsView: document.getElementById('settingsView'),
    songNameInput: document.getElementById('songNameInput'),
    saveSongBtn: document.getElementById('saveSongBtn'),
    songList: document.getElementById('songList'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    importFileInput: document.getElementById('importFileInput'),
    confirmModal: document.getElementById('confirmModal'),
    modalTitle: document.getElementById('modalTitle'),
    modalMessage: document.getElementById('modalMessage'),
    modalCancel: document.getElementById('modalCancel'),
    modalConfirm: document.getElementById('modalConfirm'),
    edgeLeft: document.getElementById('edgeLeft'),
    edgeRight: document.getElementById('edgeRight'),
    edgeUp: document.getElementById('edgeUp'),
    edgeDown: document.getElementById('edgeDown'),
    swipePlay: document.getElementById('swipePlay'),
    swipeScroll: document.getElementById('swipeScroll'),
    noteLengthRange: document.getElementById('noteLengthRange'),
    noteLengthValue: document.getElementById('noteLengthValue'),
    randomLengthRange: document.getElementById('randomLengthRange'),
    randomLengthValue: document.getElementById('randomLengthValue')
  };

  let events = [];
  let selectedId = null;
  let nextId = 1;
  let recordMode = false;
  let toastTimer = 0;
  let audio = null;
  let playing = null;
  let keyGeometry = new Map();
  let pianoWidth = 0;
  let songs = [];
  let currentSongId = null;
  let currentSongName = '';
  let modalAction = null;
  let overviewState = null;
  let libraryPlaybackTimer = 0;
  let libraryPlaying = null;
  let currentUnitSeconds = DEFAULT_UNIT_SECONDS;
  let pianoSwipeMode = 'play';
  let currentScale = 1;
  let renderScoreRAF = null;
  let randomPhraseLength = 12;
  let keyboardGesture = { pointerId: null, lastMidi: null, holdTimer: 0, holdInterval: 0, eventId: null, previousSelectedId: null, startX: 0, startScroll: 0, scrolling: false, voice: null, audioReady: false };
  let activeZoom = null;
  let audioUnlockPromise = null;
  let playbackStarting = false;
  let playbackToken = 0;
  let prePlaybackScroll = { left: 0, top: 0 };

  let smoothScrollEndTimer = 0;
  let suppressScrollSync = false;
  let smoothScrollAnimId = 0;

  const rootStyle = getComputedStyle(document.documentElement);
  function cssNumber(name) {
    return parseFloat(rootStyle.getPropertyValue(name));
  }
  function rowH() { return cssNumber('--row-h'); }
  function rulerH() { return cssNumber('--ruler-h'); }
  function whiteKeyW() { return cssNumber('--white-key-w'); }
  function blackKeyW() { return cssNumber('--black-key-w'); }

  function measureSafeTop() {
    const div = document.createElement('div');
    div.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;padding-top:env(safe-area-inset-top,0px);pointer-events:none;';
    document.body.appendChild(div);
    const top = parseFloat(getComputedStyle(div).paddingTop) || 0;
    div.remove();
    return top;
  }
  function setupRuler() {
    const safeTop = measureSafeTop();
    document.documentElement.style.setProperty('--ruler-h', `${Math.max(12, safeTop + 12)}px`);
  }

  function noteInfo(midi) {
    const pc = ((midi % 12) + 12) % 12;
    const octave = Math.floor(midi / 12) - 1;
    return { pc, octave, name: NOTE_NAMES_JA[pc], label: NOTE_NAMES_JA[pc] + octave };
  }

  function frequency(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function sanitizeLoaded(data) {
    if (!Array.isArray(data)) return [];
    const clean = [];
    for (const item of data) {
      if (!item || (item.type !== 'note' && item.type !== 'rest')) continue;
      const duration = Math.max(1, Math.floor(Number(item.duration) || 1));
      if (item.type === 'note') {
        const midi = Math.floor(Number(item.midi));
        if (midi < FIRST_MIDI || midi >= FIRST_MIDI + PITCH_COUNT) continue;
        clean.push({ id: nextId++, type: 'note', midi, duration });
      } else {
        clean.push({ id: nextId++, type: 'rest', duration });
      }
    }
    return clean;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      events = sanitizeLoaded(saved.events);
      recordMode = Boolean(saved.recordMode);
      currentSongId = saved.currentSongId || null;
      currentSongName = typeof saved.currentSongName === 'string' ? saved.currentSongName : '';
      currentUnitSeconds = Math.max(.12, Math.min(1, Number(saved.unitSeconds) || DEFAULT_UNIT_SECONDS));
      pianoSwipeMode = saved.pianoSwipeMode === 'scroll' ? 'scroll' : 'play';
      randomPhraseLength = Math.max(12, Math.min(100, Number(saved.randomPhraseLength) || 12));
      selectedId = events.length ? events[events.length - 1].id : null;
    } catch (_) {
      events = [];
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        events: events.map(({type, midi, duration}) => ({type, midi, duration})),
        recordMode,
        currentSongId,
        currentSongName,
        unitSeconds: currentUnitSeconds,
        pianoSwipeMode,
        randomPhraseLength
      }));
    } catch (_) {}
  }

  function serializeEvents(list = events) {
    return list.map(({type, midi, duration}) => type === 'note'
      ? { type, midi, duration }
      : { type, duration });
  }

  function loadSongs() {
    try {
      const parsed = JSON.parse(localStorage.getItem(SONGS_KEY) || '[]');
      songs = Array.isArray(parsed) ? parsed.filter(song => song && Array.isArray(song.events)) : [];
    } catch (_) { songs = []; }
  }

  function saveSongs() {
    try { localStorage.setItem(SONGS_KEY, JSON.stringify(songs)); } catch (_) {}
  }

  function openConfirm(title, message, confirmText, action) {
    modalAction = action;
    els.modalTitle.textContent = title;
    els.modalMessage.textContent = message;
    els.modalConfirm.textContent = confirmText;
    els.confirmModal.classList.add('is-open');
  }

  function closeConfirm() {
    modalAction = null;
    els.confirmModal.classList.remove('is-open');
  }

  function switchTab(name) {
    const map = { composition: els.compositionView, songs: els.songsView, settings: els.settingsView };
    Object.entries(map).forEach(([key, view]) => view.classList.toggle('is-active', key === name));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('is-active', btn.dataset.tab === name));
    if (name === 'songs') {
      els.songNameInput.value = currentSongName;
      renderSongList();
    }
    if (name === 'settings') syncSettingsUI();
    if (name === 'composition') requestAnimationFrame(() => {
      renderKeyboard();
      renderScore();
      updateEdgeIndicators();
    });
  }

  function renderSongList() {
    els.songList.innerHTML = '';
    if (!songs.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-library panel-card';
      empty.textContent = '保存した楽曲はまだありません。';
      els.songList.appendChild(empty);
      return;
    }
    const sorted = [...songs].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    for (const song of sorted) {
      const item = document.createElement('article');
      item.className = 'song-item';
      const info = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'song-name';
      name.textContent = song.name || '無題の曲';
      const meta = document.createElement('div');
      meta.className = 'song-meta';
      const notes = song.events.filter(e => e.type === 'note').length;
      meta.textContent = `${notes}音・1音 ${Number(song.unitSeconds || DEFAULT_UNIT_SECONDS).toFixed(2)}秒`;
      info.append(name, meta);
      const actions = document.createElement('div');
      actions.className = 'song-actions';
      const play = document.createElement('button');
      play.className = 'mini-btn'; play.type = 'button'; play.textContent = '再生';
      play.addEventListener('click', () => playLibrarySong(song, play));
      const edit = document.createElement('button');
      edit.className = 'mini-btn'; edit.type = 'button'; edit.textContent = '編集';
      edit.addEventListener('click', () => editSong(song));
      const del = document.createElement('button');
      del.className = 'mini-btn'; del.type = 'button'; del.textContent = '削除';
      del.addEventListener('click', () => openConfirm('楽曲を削除', `「${song.name || '無題の曲'}」を削除しますか？`, '削除', () => {
        songs = songs.filter(item => item.id !== song.id);
        if (currentSongId === song.id) currentSongId = null;
        saveSongs(); saveState(); renderSongList();
      }));
      actions.append(play, edit, del);
      item.append(info, actions);
      els.songList.appendChild(item);
    }
  }

  function saveCurrentSong() {
    if (!events.length) { showToast('保存する音符がありません'); return; }
    const name = (els.songNameInput.value || '').trim() || `無題の曲 ${songs.length + 1}`;
    const now = Date.now();
    if (currentSongId) {
      const song = songs.find(item => item.id === currentSongId);
      if (song) { song.name = name; song.events = serializeEvents(); song.unitSeconds = currentUnitSeconds; song.updatedAt = now; }
      else currentSongId = null;
    }
    if (!currentSongId) {
      currentSongId = `song-${now}-${Math.random().toString(36).slice(2,7)}`;
      songs.push({ id: currentSongId, name, events: serializeEvents(), unitSeconds: currentUnitSeconds, updatedAt: now });
    }
    currentSongName = name;
    saveSongs(); saveState(); renderSongList();
    showToast('楽曲を保存しました');
  }

  function editSong(song) {
    stopPlayback(false);
    nextId = 1;
    events = sanitizeLoaded(song.events);
    selectedId = events.length ? events[events.length - 1].id : null;
    currentSongId = song.id;
    currentSongName = song.name || '';
    currentUnitSeconds = Math.max(.12, Math.min(1, Number(song.unitSeconds) || DEFAULT_UNIT_SECONDS));
    syncSettingsUI();
    saveState(); renderScore({ preserve: false });
    switchTab('composition');
    showToast('楽曲を読み込みました');
  }

  function layoutEvents() {
    let cursor = 0;
    const map = new Map();
    for (const ev of events) {
      map.set(ev.id, { start: cursor, end: cursor + ev.duration });
      cursor += ev.duration;
    }
    return { map, total: cursor };
  }

  function selectedIndex() {
    return events.findIndex(ev => ev.id === selectedId);
  }

  function findAdjacentNote(fromIndex, direction) {
    for (let i = fromIndex + direction; i >= 0 && i < events.length; i += direction) {
      if (events[i].type === 'note') return i;
    }
    return -1;
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    els.toast.textContent = message;
    els.toast.classList.add('show');
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1350);
  }

  function setPlaybackUI(active) {
    const disableList = [
      els.restBtn, els.deleteBtn, els.shortenBtn, els.extendBtn,
      els.pitchDownBtn, els.pitchUpBtn, els.centerBtn, els.randomBtn,
      els.recordBtn, els.keyLeft, els.keyRight, els.keyboardRange,
      ...document.querySelectorAll('.tab-btn')
    ];
    disableList.forEach(el => { if (el) el.disabled = active; });
    els.playBtn.disabled = false;
    els.playBtn.style.pointerEvents = 'auto';
    if (active) {
      els.scoreViewport.classList.add('playback-lock');
      els.keyboardViewport.classList.add('playback-lock');
    } else {
      els.scoreViewport.classList.remove('playback-lock');
      els.keyboardViewport.classList.remove('playback-lock');
    }
  }

  function updateControls() {
    const isPlaying = Boolean(playing);
    const idx = selectedIndex();
    const hasSelection = idx >= 0;
    const selected = hasSelection ? events[idx] : null;
    const noteSelected = Boolean(selected && selected.type === 'note');
    const canResize = Boolean(selected);
    els.extendBtn.disabled = !canResize || isPlaying;
    els.shortenBtn.disabled = !canResize || isPlaying;
    els.deleteBtn.disabled = (!hasSelection && events.length === 0) || isPlaying;
    els.restBtn.disabled = isPlaying;
    els.pitchDownBtn.disabled = !noteSelected || selected.midi <= FIRST_MIDI || isPlaying;
    els.pitchUpBtn.disabled = !noteSelected || selected.midi >= FIRST_MIDI + PITCH_COUNT - 1 || isPlaying;
    els.recordBtn.classList.toggle('is-on', recordMode);
    els.recordBtn.setAttribute('aria-pressed', String(recordMode));
    els.recordLabel.textContent = '記録';
  }

  function buildKeyGeometry() {
    keyGeometry = new Map();
    let whiteIndex = 0;
    for (let midi = FIRST_MIDI; midi < FIRST_MIDI + PITCH_COUNT; midi++) {
      const info = noteInfo(midi);
      if (!BLACK_PCS.has(info.pc)) {
        keyGeometry.set(midi, { left: whiteIndex * whiteKeyW(), width: whiteKeyW(), isBlack: false });
        whiteIndex++;
      }
    }
    for (let midi = FIRST_MIDI; midi < FIRST_MIDI + PITCH_COUNT; midi++) {
      const info = noteInfo(midi);
      if (BLACK_PCS.has(info.pc)) {
        let previousWhite = 0;
        for (let m = FIRST_MIDI; m < midi; m++) {
          if (!BLACK_PCS.has(noteInfo(m).pc)) previousWhite++;
        }
        keyGeometry.set(midi, {
          left: previousWhite * whiteKeyW() - blackKeyW() / 2,
          width: blackKeyW(),
          isBlack: true
        });
      }
    }
    pianoWidth = whiteIndex * whiteKeyW();
  }

  function geometryFor(midi) {
    return keyGeometry.get(midi) || { left: 0, width: whiteKeyW(), isBlack: false };
  }

  function clampScrollLeft(left) {
    const scoreMax = Math.max(0, pianoWidth - els.scoreViewport.clientWidth);
    const keyMax = Math.max(0, pianoWidth - els.keyboardViewport.clientWidth);
    const maxLeft = Math.min(scoreMax, keyMax);
    return Math.max(0, Math.min(maxLeft, left));
  }

  function clampScrollTop(top) {
    const maxTop = Math.max(0, els.scoreContent.scrollHeight - els.scoreViewport.clientHeight);
    return Math.max(0, Math.min(maxTop, top));
  }

  function keyAtPoint(clientX, clientY) {
    const rect = els.keyboardViewport.getBoundingClientRect();
    const x = clientX - rect.left + els.keyboardViewport.scrollLeft;
    const y = clientY - rect.top;
    if (y < 0 || y > rect.height) {
        return null;
    }

    const blackKeyHeight = cssNumber('--black-key-h');

    if (y <= blackKeyHeight) {
        for (let midi = FIRST_MIDI + PITCH_COUNT - 1; midi >= FIRST_MIDI; midi--) {
            const geom = keyGeometry.get(midi);
            if (!geom || !geom.isBlack) continue;
            if (x >= geom.left && x < geom.left + geom.width) {
                return midi;
            }
        }
    }

    for (let midi = FIRST_MIDI; midi < FIRST_MIDI + PITCH_COUNT; midi++) {
        const geom = keyGeometry.get(midi);
        if (!geom || geom.isBlack) continue;
        if (x >= geom.left && x < geom.left + geom.width) {
            return midi;
        }
    }
    return null;
  }

  function smoothScrollBoth(left, top) {
    const targetLeft = clampScrollLeft(left);
    const targetTop = clampScrollTop(top);

    suppressScrollSync = true;
    smoothScrollAnimId++;
    const token = smoothScrollAnimId;
    clearTimeout(smoothScrollEndTimer);

    els.scoreViewport.scrollTo({ top: targetTop, left: targetLeft, behavior: 'smooth' });
    els.keyboardViewport.scrollTo({ left: targetLeft, behavior: 'smooth' });
    syncKeyboardRange(targetLeft);

    smoothScrollEndTimer = setTimeout(() => {
      if (token !== smoothScrollAnimId) return;
      suppressScrollSync = false;
      setLinkedScroll(targetLeft);
      els.scoreViewport.scrollTop = targetTop;
      syncKeyboardRange();
      updateEdgeIndicators();
    }, 680);
  }

  function setLinkedScroll(left, source = '') {
    const scoreMax = Math.max(0, pianoWidth - els.scoreViewport.clientWidth);
    const keyMax = Math.max(0, pianoWidth - els.keyboardViewport.clientWidth);
    const next = Math.max(0, Math.min(Math.min(scoreMax, keyMax), left));
    if (source !== 'score') els.scoreViewport.scrollLeft = next;
    if (source !== 'keyboard') els.keyboardViewport.scrollLeft = next;
    const max = Math.max(1, Math.min(scoreMax, keyMax));
    els.keyboardRange.value = String(Math.round(next / max * 100));
  }

  function cancelRenderScoreRAF() {
    if (renderScoreRAF) {
      cancelAnimationFrame(renderScoreRAF);
      renderScoreRAF = null;
    }
  }

  function renderScore(options = {}) {
    cancelRenderScoreRAF();
    if (!keyGeometry.size) buildKeyGeometry();
    const preserveLeft = els.scoreViewport.scrollLeft;
    const preserveTop = els.scoreViewport.scrollTop;
    const { map, total } = layoutEvents();
    const viewport = els.scoreViewport;
    const bottomPadUnits = Math.ceil(viewport.clientHeight / Math.max(rowH(), 1)) + 2;
    const minUnits = Math.max(total + bottomPadUnits, Math.ceil(viewport.clientHeight / Math.max(rowH(), 1)) + 5, 18);
    const h = rulerH() + minUnits * rowH();
    els.scoreContent.style.height = `${h}px`;
    els.scoreContent.style.width = `${pianoWidth}px`;
    els.scoreContent.innerHTML = '';

    const orderedMidis = Array.from(keyGeometry.keys()).sort((a, b) => {
      const ga = geometryFor(a), gb = geometryFor(b);
      return Number(ga.isBlack) - Number(gb.isBlack) || ga.left - gb.left;
    });
    for (const midi of orderedMidis) {
      const geom = geometryFor(midi);
      const lane = document.createElement('div');
      lane.className = 'pitch-lane' + (geom.isBlack ? ' is-black' : '');
      lane.style.left = `${geom.left}px`;
      lane.style.width = `${geom.width}px`;
      lane.style.top = `${rulerH()}px`;
      els.scoreContent.appendChild(lane);
    }

    const labelLimit = Math.max(total + 8, 16);
    for (let t = 0; t <= labelLimit; t += 4) {
      const marker = document.createElement('div');
      marker.className = 'time-label';
      marker.style.top = `${rulerH() + t * rowH() + 3}px`;
      marker.textContent = `${Math.floor(t / 4) + 1}`;
      els.scoreContent.appendChild(marker);
    }

    for (const ev of events) {
      const pos = map.get(ev.id);
      const top = rulerH() + pos.start * rowH() + 2;
      const height = Math.max(12, ev.duration * rowH() - 4);
      const block = document.createElement('div');
      block.dataset.eventId = String(ev.id);
      block.style.top = `${top}px`;
      block.style.height = `${height}px`;
      block.setAttribute('role', 'button');
      block.setAttribute('tabindex', '0');
      block.setAttribute('aria-pressed', String(ev.id === selectedId));

      if (ev.type === 'note') {
        const geom = geometryFor(ev.midi);
        block.className = 'note-block' + (ev.id === selectedId ? ' is-selected' : '');
        block.style.left = `${geom.left}px`;
        block.style.width = `${geom.width}px`;
        block.style.zIndex = geom.isBlack ? '5' : '4';
        block.setAttribute('aria-label', `${noteInfo(ev.midi).label}、長さ${ev.duration}`);
        const label = document.createElement('span');
        label.className = 'note-label';
        label.textContent = noteInfo(ev.midi).name;
        block.appendChild(label);
      } else {
        block.className = 'rest-block' + (ev.id === selectedId ? ' is-selected' : '');
        block.setAttribute('aria-label', `休符、長さ${ev.duration}`);
        for (let x = 115; x < pianoWidth; x += 320) {
          const label = document.createElement('span');
          label.className = 'rest-label';
          label.style.left = `${x}px`;
          label.textContent = '— 休符 —';
          block.appendChild(label);
        }
      }
      block.addEventListener('click', () => selectEvent(ev.id));
      block.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectEvent(ev.id);
        }
      });
      els.scoreContent.appendChild(block);
    }

    const playhead = document.createElement('div');
    playhead.id = 'playhead';
    playhead.className = 'playhead';
    els.scoreContent.appendChild(playhead);

    updateControls();
    requestAnimationFrame(updateEdgeIndicators);

    if (options.preserve !== false) {
      setLinkedScroll(preserveLeft);
      els.scoreViewport.scrollTop = preserveTop;
    }

    if (options.focusId) {
      renderScoreRAF = requestAnimationFrame(() => {
        renderScoreRAF = null;
        focusEvent(options.focusId, options.smooth !== false);
      });
    }
  }

  function focusEvent(id, smooth = true) {
    centerOnEvent(id, smooth);
  }

  function selectEvent(id, audition = true) {
    selectedId = id;
    const ev = events.find(item => item.id === id);
    renderScore();
    saveState();
    if (audition && ev && ev.type === 'note') playPreview(ev.midi);
  }

  function insertionIndex() {
    const idx = selectedIndex();
    return idx >= 0 ? idx + 1 : events.length;
  }

  function addNote(midi, opts = {}) {
    if (!opts.skipStop) stopPlayback(false);
    const ev = { id: nextId++, type: 'note', midi, duration: 1 };
    events.splice(insertionIndex(), 0, ev);
    selectedId = ev.id;
    renderScore();
    saveState();
    if (opts.audition !== false) playPreview(midi);
    requestAnimationFrame(() => ensureEventVisible(ev.id));
    return ev.id;
  }

  function addRest(duration = 1, quiet = false) {
    stopPlayback(false);
    const ev = { id: nextId++, type: 'rest', duration: Math.max(1, duration) };
    events.splice(insertionIndex(), 0, ev);
    selectedId = ev.id;
    renderScore();
    saveState();
    if (!quiet) showToast('休符を追加しました');
    requestAnimationFrame(() => ensureEventVisible(ev.id));
    return ev.id;
  }

  function changeDuration(delta, id = selectedId, quiet = false, focusAfter = false) {
    const ev = events.find(item => item.id === id);
    if (!ev) return;
    const next = Math.max(1, ev.duration + delta);
    if (next === ev.duration) {
      if (!quiet) showToast('これ以上変更できません');
      return;
    }
    ev.duration = next;
    selectedId = ev.id;
    renderScore(focusAfter ? { focusId: ev.id } : {});
    saveState();
    if (!quiet) showToast(delta > 0 ? `長さ ${next}` : `長さ ${next}`);
    if (!focusAfter) requestAnimationFrame(() => ensureEventVisible(ev.id));
  }

  function changePitch(delta, focusAfter = true) {
    const idx = selectedIndex();
    if (idx < 0 || events[idx].type !== 'note') {
      showToast('音符を選択してください');
      return;
    }
    const ev = events[idx];
    const next = Math.max(FIRST_MIDI, Math.min(FIRST_MIDI + PITCH_COUNT - 1, ev.midi + delta));
    if (next === ev.midi) return;
    ev.midi = next;
    selectedId = ev.id;
    renderScore(focusAfter ? { focusId: ev.id } : {});
    saveState();
    playPreview(ev.midi);
    if (!focusAfter) requestAnimationFrame(() => ensureEventVisible(ev.id));
  }

  function deleteSelected() {
    stopPlayback(false);
    const idx = selectedIndex();
    if (idx < 0) return;
    events.splice(idx, 1);
    selectedId = idx > 0 ? events[idx - 1].id : null;
    renderScore();
    saveState();
    showToast('選択した音符を削除しました');
  }

  function generateRandomPhrase() {
    stopPlayback(false);
    const scale = [0, 2, 4, 5, 7, 9, 11, 12];
    const base = 60 + (Math.random() < .5 ? 0 : -5);
    const length = Math.max(4, Math.floor(randomPhraseLength));
    events = [];
    nextId = 1;
    let previous = 3;
    for (let i = 0; i < length; i++) {
      if (i > 1 && i < length - 1 && Math.random() < .16) {
        events.push({ id: nextId++, type: 'rest', duration: Math.random() < .7 ? 1 : 2 });
        continue;
      }
      const step = Math.max(0, Math.min(scale.length - 1, previous + Math.floor(Math.random() * 5) - 2));
      previous = step;
      const duration = Math.random() < .62 ? 1 : (Math.random() < .82 ? 2 : 3);
      events.push({ id: nextId++, type: 'note', midi: Math.max(FIRST_MIDI, Math.min(FIRST_MIDI + PITCH_COUNT - 1, base + scale[step])), duration });
    }
    selectedId = events.length ? events[events.length - 1].id : null;
    currentSongId = null;
    currentSongName = '';
    renderScore();
    saveState();
    showToast('新しいフレーズを生成しました');
    void startPlayback(true);
  }

  function updateEdgeIndicators() {
    if (!els.compositionView.classList.contains('is-active') || els.scoreViewport.classList.contains('overview-mode') || els.scoreViewport.classList.contains('is-zooming')) {
      [els.edgeLeft, els.edgeRight, els.edgeUp, els.edgeDown].forEach(el => el.classList.remove('is-visible'));
      return;
    }
    const notes = events.filter(ev => ev.type === 'note');
    const viewport = els.scoreViewport;
    const left = viewport.scrollLeft;
    const right = left + viewport.clientWidth;
    let hiddenLeft = false, hiddenRight = false;
    for (const ev of notes) {
      const geom = geometryFor(ev.midi);
      hiddenLeft ||= geom.left + geom.width < left + 2;
      hiddenRight ||= geom.left > right - 2;
    }
    const { map, total } = layoutEvents();
    const top = viewport.scrollTop;
    const bottom = top + viewport.clientHeight;
    let hiddenUp = false, hiddenDown = false;
    for (const ev of events) {
      const pos = map.get(ev.id);
      const y1 = rulerH() + pos.start * rowH();
      const y2 = rulerH() + pos.end * rowH();
      hiddenUp ||= y2 < top + 2;
      hiddenDown ||= y1 > bottom - 2;
    }
    els.edgeLeft.classList.toggle('is-visible', hiddenLeft);
    els.edgeRight.classList.toggle('is-visible', hiddenRight);
    els.edgeUp.classList.toggle('is-visible', hiddenUp);
    els.edgeDown.classList.toggle('is-visible', hiddenDown && total > 0);
  }

  function setContentTransitions(enabled) {
    els.scoreContent.style.transition = enabled ? 'transform .5s cubic-bezier(.22,.8,.22,1)' : 'none';
    els.keyboardInner.style.transition = enabled ? 'transform .5s cubic-bezier(.22,.8,.22,1)' : 'none';
  }

  function cancelZoomAnimation() {
    if (activeZoom) {
      cancelAnimationFrame(activeZoom.raf);
      activeZoom = null;
    }
    setContentTransitions(true);
    suppressScrollSync = false;
  }

  function finishEnterOverviewImmediate() {
    if (!overviewState) return;
    const st = overviewState;
    els.scoreContent.style.transform = `translate(${st.targetTx}px, ${st.targetTy}px) scale(${st.scoreScale})`;
    els.keyboardInner.style.transform = `translate(0, 0) scale(${st.keyScale})`;
    els.scoreViewport.scrollLeft = 0;
    els.scoreViewport.scrollTop = 0;
    els.keyboardViewport.scrollLeft = 0;
    els.keyboardViewport.style.height = `${st.targetKeyboardHeight}px`;
    overviewState.currentTx = st.targetTx;
    overviewState.currentTy = st.targetTy;
    overviewState.currentKeyTx = 0;
    setContentTransitions(true);
    suppressScrollSync = false;
    activeZoom = null;
    syncKeyboardRange(0);
    updateEdgeIndicators();
  }

  function finishLeaveOverviewImmediateFallback() {
    if (!overviewState) return;
    const st = overviewState;
    const viewport = els.scoreViewport;
    els.scoreContent.style.transform = '';
    els.keyboardInner.style.transform = '';
    viewport.classList.remove('is-zooming');
    els.keyboardViewport.classList.remove('is-zooming');
    viewport.scrollLeft = clampScrollLeft(st.targetScrollLeft != null ? st.targetScrollLeft : (st.left || 0));
    viewport.scrollTop = clampScrollTop(st.targetScrollTop != null ? st.targetScrollTop : (st.top || 0));
    els.keyboardViewport.scrollLeft = viewport.scrollLeft;
    els.keyboardViewport.style.height = '';
    setContentTransitions(true);
    suppressScrollSync = false;
    overviewState = null;
    currentScale = 1;
    activeZoom = null;
    viewport.classList.remove('overview-mode', 'playback-fit');
    els.keyboardViewport.classList.remove('playback-fit');
    els.scoreViewport.classList.remove('playback-lock');
    els.keyboardViewport.classList.remove('playback-lock');
    syncKeyboardRange(viewport.scrollLeft);
    updateEdgeIndicators();
  }

  function enterOverview(startUnit = 0) {
    if (activeZoom) {
      const previousPhase = activeZoom.phase;
      cancelZoomAnimation();
      if (previousPhase === 'enter') finishEnterOverviewImmediate();
      else if (previousPhase === 'leave') finishLeaveOverviewImmediateFallback();
    }

    const viewport = els.scoreViewport;
    const kViewport = els.keyboardViewport;
    const startTop = viewport.scrollTop;
    const startLeft = viewport.scrollLeft;
    const startY = rulerH() + startUnit * rowH();

    const scoreScale = viewport.clientWidth / Math.max(1, pianoWidth);
    const keyScale = kViewport.clientWidth / Math.max(1, pianoWidth);
    currentScale = scoreScale;

    const normalKeyboardHeight = kViewport.getBoundingClientRect().height;
    const targetKeyboardHeight = Math.max(0, els.keyboardInner.offsetHeight * keyScale);

    const targetTx = 0;
    const targetTy = viewport.clientHeight / 2 - startY * scoreScale;

    const startTx = -startLeft;
    const startTy = -startTop;

    const startKeyScrollLeft = kViewport.scrollLeft;
    const startKeyTx = -startKeyScrollLeft;
    const targetKeyTx = 0;

    overviewState = {
      left: startLeft,
      top: startTop,
      focusY: startY,
      scoreScale,
      keyScale,
      normalKeyboardHeight,
      targetKeyboardHeight,
      targetTx,
      targetTy,
      targetScrollLeft: startLeft,
      targetScrollTop: startTop,
      currentTx: startTx,
      currentTy: startTy,
      currentKeyTx: startKeyTx
    };

    viewport.classList.add('is-zooming', 'overview-mode', 'playback-fit');
    kViewport.classList.add('is-zooming', 'playback-fit');

    setContentTransitions(false);
    suppressScrollSync = true;

    els.scoreContent.style.transformOrigin = '0 0';
    els.keyboardInner.style.transformOrigin = '0 100%';
    els.scoreContent.style.transform = `translate(${startTx}px, ${startTy}px) scale(1)`;
    els.keyboardInner.style.transform = `translate(${startKeyTx}px, 0) scale(1)`;

    viewport.scrollLeft = 0;
    viewport.scrollTop = 0;
    kViewport.scrollLeft = 0;

    const duration = 520;
    const startTime = performance.now();
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    activeZoom = { raf: 0, phase: 'enter' };

    const frame = (now) => {
      if (!activeZoom || activeZoom.phase !== 'enter') return;
      let t = Math.min(1, (now - startTime) / duration);
      const e = ease(t);
      const scale = 1 + (scoreScale - 1) * e;
      const kScale = 1 + (keyScale - 1) * e;

      const tx = startTx + (targetTx - startTx) * e;
      const ty = startTy + (targetTy - startTy) * e;
      const currentKeyTx = startKeyTx + (targetKeyTx - startKeyTx) * e;
      const currentHeight = normalKeyboardHeight + (targetKeyboardHeight - normalKeyboardHeight) * e;

      els.scoreContent.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      els.keyboardInner.style.transform = `translate(${currentKeyTx}px, 0) scale(${kScale})`;
      kViewport.style.height = `${currentHeight}px`;
      overviewState.currentKeyTx = currentKeyTx;

      if (t < 1) {
        activeZoom.raf = requestAnimationFrame(frame);
      } else {
        finishEnterOverviewImmediate();
      }
    };
    activeZoom.raf = requestAnimationFrame(frame);
    syncKeyboardRange(0);
  }

  function leaveOverview(targetEventId = null) {
    if (!overviewState) return;
    if (activeZoom && activeZoom.phase === 'leave') return;
    if (activeZoom && activeZoom.phase === 'enter') {
      cancelZoomAnimation();
      finishEnterOverviewImmediate();
    }

    const viewport = els.scoreViewport;
    const kViewport = els.keyboardViewport;
    const startScale = currentScale || overviewState.scoreScale || 1;
    const startKeyScale = overviewState.keyScale || startScale;
    const startHeight = kViewport.getBoundingClientRect().height;
    const targetHeight = overviewState.normalKeyboardHeight || cssNumber('--white-key-h');

    let finalScrollLeft, finalScrollTop;

    if (targetEventId) {
      const ev = events.find(item => item.id === targetEventId);
      if (ev) {
        const { map } = layoutEvents();
        const pos = map.get(targetEventId);
        const targetY = rulerH() + ((pos.start + pos.end) / 2) * rowH();
        let targetX;
        if (ev.type === 'note') {
          const geom = geometryFor(ev.midi);
          targetX = geom.left + geom.width / 2;
        } else {
          targetX = pianoWidth / 2;
        }
        finalScrollLeft = clampScrollLeft(targetX - viewport.clientWidth / 2);
        finalScrollTop = clampScrollTop(targetY - viewport.clientHeight / 2);
      } else {
        finalScrollLeft = clampScrollLeft(overviewState.left || 0);
        finalScrollTop = clampScrollTop(overviewState.top || 0);
      }
    } else {
      finalScrollLeft = clampScrollLeft(overviewState.left || 0);
      finalScrollTop = clampScrollTop(overviewState.top || 0);
    }

    const startTx = overviewState.currentTx !== undefined ? overviewState.currentTx : (overviewState.targetTx || 0);
    const startTy = overviewState.currentTy !== undefined ? overviewState.currentTy : (overviewState.targetTy || 0);
    const finalTx = -finalScrollLeft;
    const finalTy = -finalScrollTop;

    const startKeyTx = overviewState.currentKeyTx !== undefined ? overviewState.currentKeyTx : 0;
    const finalKeyTx = -finalScrollLeft;

    setContentTransitions(false);
    suppressScrollSync = true;

    els.scoreContent.style.transformOrigin = '0 0';
    els.keyboardInner.style.transformOrigin = '0 100%';

    const duration = 520;
    const startTime = performance.now();
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    activeZoom = { raf: 0, phase: 'leave' };
    overviewState.targetScrollLeft = finalScrollLeft;
    overviewState.targetScrollTop = finalScrollTop;

    const frame = (now) => {
      if (!activeZoom || activeZoom.phase !== 'leave') return;
      let t = Math.min(1, (now - startTime) / duration);
      const e = ease(t);
      const scale = startScale + (1 - startScale) * e;
      const kScale = startKeyScale + (1 - startKeyScale) * e;

      const currentTx = startTx + (finalTx - startTx) * e;
      const currentTy = startTy + (finalTy - startTy) * e;
      const currentKeyTx = startKeyTx + (finalKeyTx - startKeyTx) * e;
      const currentHeight = startHeight + (targetHeight - startHeight) * e;

      overviewState.currentTx = currentTx;
      overviewState.currentTy = currentTy;
      overviewState.currentKeyTx = currentKeyTx;

      els.scoreContent.style.transform = `translate(${currentTx}px, ${currentTy}px) scale(${scale})`;
      els.keyboardInner.style.transform = `translate(${currentKeyTx}px, 0) scale(${kScale})`;
      kViewport.style.height = `${currentHeight}px`;

      if (t < 1) {
        activeZoom.raf = requestAnimationFrame(frame);
      } else {
        els.scoreContent.style.transform = '';
        els.keyboardInner.style.transform = '';

        viewport.classList.remove('is-zooming', 'overview-mode', 'playback-fit');
        kViewport.classList.remove('is-zooming', 'playback-fit');
        els.scoreViewport.classList.remove('playback-lock');
        kViewport.classList.remove('playback-lock');

        viewport.scrollLeft = finalScrollLeft;
        viewport.scrollTop = finalScrollTop;
        kViewport.scrollLeft = finalScrollLeft;
        kViewport.style.height = '';

        setContentTransitions(true);
        suppressScrollSync = false;
        overviewState = null;
        currentScale = 1;
        activeZoom = null;

        syncKeyboardRange(finalScrollLeft);
        updateEdgeIndicators();
      }
    };
    activeZoom.raf = requestAnimationFrame(frame);
  }

  function setPlayingKey(midi) {
    els.keyboardInner.querySelectorAll('.is-playing-key').forEach(key => key.classList.remove('is-playing-key'));

  function ensureEventVisible(id) {
    cancelRenderScoreRAF();
    const ev = events.find(item => item.id === id);
    if (!ev) return;
    const { map } = layoutEvents();
    const pos = map.get(id);
    const top = rulerH() + pos.start * rowH();
    const bottom = rulerH() + pos.end * rowH();
    const safeTop = els.scoreViewport.scrollTop + 18;
    const safeBottom = els.scoreViewport.scrollTop + els.scoreViewport.clientHeight - 24;
    if (top < safeTop) els.scoreViewport.scrollTop = Math.max(0, top - 18);
    else if (bottom > safeBottom) els.scoreViewport.scrollTop = Math.max(0, bottom - els.scoreViewport.clientHeight + 36);

    if (ev.type === 'note' && !recordMode) {
      const geom = geometryFor(ev.midi);
      const x = geom.left;
      const safeLeft = els.scoreViewport.scrollLeft + 25;
      const safeRight = els.scoreViewport.scrollLeft + els.scoreViewport.clientWidth - geom.width - 25;
      if (x < safeLeft) setLinkedScroll(Math.max(0, x - els.scoreViewport.clientWidth * .3));
      else if (x > safeRight) setLinkedScroll(Math.max(0, x - els.scoreViewport.clientWidth * .7));
    }
  }

  function centerOnEvent(id, smooth = true) {
    if (!id) return;
    cancelRenderScoreRAF();
    const ev = events.find(e => e.id === id);
    if (!ev) return;
    const { map } = layoutEvents();
    const pos = map.get(id);
    const viewport = els.scoreViewport;
    const blockTop = rulerH() + pos.start * rowH();
    const blockBottom = rulerH() + pos.end * rowH();

    const targetY = (blockTop + blockBottom) / 2;
    const maxTop = Math.max(0, els.scoreContent.scrollHeight - viewport.clientHeight);
    let top = Math.max(0, targetY - viewport.clientHeight / 2);
    top = Math.min(top, maxTop);

    let left = viewport.scrollLeft;
    if (ev.type === 'note') {
      const geom = geometryFor(ev.midi);
      const targetX = geom.left + geom.width / 2;
      const maxLeft = Math.max(0, pianoWidth - viewport.clientWidth);
      left = Math.max(0, targetX - viewport.clientWidth / 2);
      left = Math.min(left, maxLeft);
    } else {
      const maxLeft = Math.max(0, pianoWidth - viewport.clientWidth);
      left = Math.max(0, pianoWidth / 2 - viewport.clientWidth / 2);
      left = Math.min(left, maxLeft);
    }

    if (smooth) {
      smoothScrollBoth(left, top);
    } else {
      setLinkedScroll(left);
      viewport.scrollTop = top;
    }
  }
