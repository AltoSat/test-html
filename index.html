<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>セーフエリア タッチテスト</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#10141c; color:#f4f6fa;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
body { min-height:100%; }
#app { position:fixed; inset:0; overflow:hidden; background:
  radial-gradient(ellipse at 50% 15%,#202b3b 0%,#10141c 55%); }
.info { position:absolute; left:18px; right:18px; top:calc(env(safe-area-inset-top) + 66px);
  text-align:center; }
h1 { font-size:19px; margin:0 0 8px; }
p { color:#aeb9c9; font-size:13px; line-height:1.6; margin:0; }
.status { margin:22px auto 0; padding:14px; max-width:340px; border:1px solid #354257;
  border-radius:14px; background:#182130; text-align:left; }
.status strong { color:#7dd3fc; }
#last { min-height:24px; margin-top:8px; color:#facc15; overflow-wrap:anywhere; }
#counts { font-variant-numeric:tabular-nums; margin-top:8px; }
.test-btn { position:absolute; z-index:5; width:72px; height:42px; padding:0 4px;
  border:1px solid #8ba8ce; border-radius:12px; background:#263b57; color:white;
  font-size:12px; font-weight:700; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; justify-content:center; user-select:none; }
.test-btn:active { background:#087eaa; transform:scale(.94); }
.top-left { top:12px; left:calc(50% - 150px); }
.top-right { top:12px; left:calc(50% + 78px); }
.bottom-left { bottom:calc(env(safe-area-inset-bottom) - 28px); left:calc(50% - 150px); }
.bottom-right { bottom:calc(env(safe-area-inset-bottom) - 28px); left:calc(50% + 78px); }
.reset { display:block; margin:12px auto 0; padding:9px 18px; border:1px solid #53647b;
  border-radius:10px; color:#e8eef8; background:#263244; font-size:13px; }
.measure { position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 52px);
  color:#7f8da2; font-size:10px; text-align:center; pointer-events:none; }
@media (max-width:350px) {
  .test-btn { width:62px; }
  .top-left,.bottom-left { left:calc(50% - 137px); }
  .top-right,.bottom-right { left:calc(50% + 75px); }
}
</style>
</head>
<body>
<div id="app">
  <button class="test-btn top-left" data-name="島・左">上 左</button>
  <button class="test-btn top-right" data-name="島・右">上 右</button>
  <button class="test-btn bottom-left" data-name="バー・左">下 左</button>
  <button class="test-btn bottom-right" data-name="バー・右">下 右</button>

  <main class="info">
    <h1>タッチ反応テスト</h1>
    <p>上の2個はDynamic Islandの左右、<br>下の2個はホームバーの左右を想定したボタンです。<br>それぞれタップして反応を確認してください。</p>
    <section class="status" aria-live="polite">
      <div>最後に反応した場所：<strong id="last">まだタップされていません</strong></div>
      <div id="counts">上左 0　上右 0　下左 0　下右 0</div>
      <button class="reset" id="reset">カウントをリセット</button>
    </section>
  </main>
  <div class="measure" id="measure"></div>
</div>
<script>
(() => {
  const counts = {"島・左":0,"島・右":0,"バー・左":0,"バー・右":0};
  const labels = {"島・左":"上左","島・右":"上右","バー・左":"下左","バー・右":"下右"};
  const last = document.getElementById("last");
  const countView = document.getElementById("counts");
  function render() {
    countView.textContent = Object.keys(counts).map(k => `${labels[k]} ${counts[k]}`).join("　");
  }
  document.querySelectorAll(".test-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.name;
      counts[name]++;
      last.textContent = `${name}：反応しました（${new Date().toLocaleTimeString("ja-JP")}）`;
      render();
      if (navigator.vibrate) navigator.vibrate(20);
    });
  });
  document.getElementById("reset").addEventListener("click", () => {
    Object.keys(counts).forEach(k => counts[k]=0);
    last.textContent = "リセットしました";
    render();
  });
  const measure = document.getElementById("measure");
  function updateMeasure() {
    const s = getComputedStyle(document.documentElement);
    measure.textContent = `画面 ${innerWidth}×${innerHeight}px ／ safe-area 上:${s.getPropertyValue("--sat") || "env"} 下:${s.getPropertyValue("--sab") || "env"}`;
  }
  updateMeasure();
  addEventListener("resize", updateMeasure);
})();
</script>
</body>
</html>
