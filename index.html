<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>手法A (スワイプガード) 単体実験</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a; color: #eee; padding: 16px;
            display: flex; flex-direction: column; gap: 14px;
            user-select: none; -webkit-user-select: none;
            overflow-x: hidden;
            min-height: 100vh;
        }
        h1 { font-size: 1.1rem; color: #8ab4f8; }
        .desc { font-size: 0.8rem; color: #aaa; line-height: 1.4; }
        .status-box {
            background: #1a1a2e; border: 1px solid #333; padding: 10px; border-radius: 8px;
            font-size: 0.85rem; color: #fbbf24; word-break: break-all;
        }
        .card {
            background: #1e1e30; border: 1px solid #333; border-radius: 8px; padding: 14px;
            display: flex; flex-direction: column; gap: 10px;
        }
        .card h2 { font-size: 0.95rem; color: #8ab4f8; }
        
        .program-item {
            background: #2a2a3c; border: 1px solid #444; border-radius: 6px;
            padding: 16px; text-align: center; font-size: 0.9rem; color: #fff;
            touch-action: manipulation;
        }
        .program-item:active { background: #3b82f6; }

        .log-area {
            background: #000; border: 1px solid #333; border-radius: 6px;
            padding: 8px; font-family: monospace; font-size: 0.75rem; color: #4ade80;
            height: 120px; overflow-y: auto;
        }
        
        /* 画面右端のガードエリア（視覚化用） */
        .edge-indicator {
            position: fixed; top: 0; right: 0; width: 15vw; height: 100%;
            background: rgba(239, 68, 68, 0.15); border-left: 1px dashed #ef4444;
            pointer-events: none; z-index: 999;
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; font-size: 0.65rem; color: #fca5a5;
        }
    </style>
</head>
<body>

    <div class="edge-indicator">右端ガードエリア (15vw)</div>

    <h1>✦ 手法A: 右端スワイプガード実験</h1>
    <p class="desc">長押しでGoogle検索へ移動後、Safariの「戻る」で復帰し、画面右端から左へスワイプした時に「進む」動作がブロックされるかテストします。</p>

    <div class="status-box" id="statusBox">状態: 準備完了</div>

    <div class="card">
        <h2>番組タイトル長押しテスト</h2>
        <div class="program-item" id="longpressTarget">ここを0.5秒長押し（Google検索へ）</div>
    </div>

    <div style="font-size: 0.8rem; font-weight: bold; margin-top: 6px;">イベントログ:</div>
    <div class="log-area" id="logArea"></div>

<script>
    const logArea = document.getElementById('logArea');
    const statusBox = document.getElementById('statusBox');

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        logArea.innerHTML = `[${time}] ${msg}<br>` + logArea.innerHTML;
    }

    // ページ復帰検知
    window.addEventListener('pageshow', (e) => {
        if (e.persisted) {
            log('キャッシュから復帰 (pageshow)');
            statusBox.textContent = '状態: 検索から戻りました（進むブロック有効中）';
        } else {
            log('通常読込 (pageshow)');
        }
    });

    // --- 長押し検索処理（href使用） ---
    const target = document.getElementById('longpressTarget');
    let timer = null;

    target.addEventListener('touchstart', (e) => {
        timer = setTimeout(() => {
            log('長押し検知: Google検索へ移動します');
            // location.href を使用して遷移（「戻る」を可能にする）
            window.location.href = 'https://www.google.com/search?q=テスト番組名';
        }, 500);
    }, { passive: true });

    const cancelTimer = () => {
        if (timer) {
            clearTimeout(timer);
            timer = null;
        }
    };

    target.addEventListener('touchmove', cancelTimer, { passive: true });
    target.addEventListener('touchend', cancelTimer);
    target.addEventListener('touchcancel', cancelTimer);


    // --- 画面右端からの左スワイプ（進む動作）をキャッチしてブロック ---
    let touchStartX = 0;
    let touchStartY = 0;
    let isRightEdgeTouch = false;

    document.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        const screenWidth = window.innerWidth;

        // 画面右端15%以内のタッチ開始かどうか判定
        if (touchStartX > screenWidth * 0.85) {
            isRightEdgeTouch = true;
            log('右端ガードエリア内でタッチ開始');
        } else {
            isRightEdgeTouch = false;
        }
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        if (!isRightEdgeTouch) return;

        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;
        const diffX = touchStartX - currentX; // 右から左へ指を動かした距離
        const diffY = Math.abs(currentY - touchStartY);

        // 横方向へのスワイプ（右から左へ10px以上移動）かつ縦移動より優勢な場合
        if (diffX > 10 && diffX > diffY) {
            // ブラウザ標準の「進む（Forward）」ジェスチャーを阻止
            if (e.cancelable) {
                e.preventDefault();
                log('右端からの「進むスワイプ」をブロックしました！');
            }
        }
    }, { passive: false }); // preventDefault() を呼ぶため passive: false

    document.addEventListener('touchend', () => {
        isRightEdgeTouch = false;
    });
</script>
</body>
</html>
