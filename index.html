<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Previewer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
  --menu:#bf5af2;
  --sep:#38383c;
  --sel:#1a293a;
  --side:70px;
  --side-open:min(280px,72vw);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
@supports (height: 100dvh){
  html,body{height:100dvh}
}
button,textarea,input{font:inherit}
button{
  border:0;color:var(--text);background:var(--panel2);
  border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid var(--sep)}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}

.app{height:100%;display:flex;width:100%}

/* ================= SIDEBAR ================= */
.sidebar{
  flex:0 0 auto;
  width:var(--side);
  background:var(--panel);
  border-right:1px solid #2c2c2e;
  display:flex;flex-direction:column;
  transition:width .22s cubic-bezier(.22,.8,.24,1);
  overflow:hidden;
  position:relative;z-index:20;
}
.sidebar.open{width:var(--side-open)}

.side-scroll{
  flex:1;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:calc(10px + env(safe-area-inset-top)) 8px 8px;
  touch-action:pan-y;
}
.side-scroll::-webkit-scrollbar{width:0}
.side-empty{
  padding:22px 10px;color:var(--muted);font-size:12.5px;line-height:1.7;text-align:center;
  display:none;
}
.sidebar.open .side-empty{display:block}

.side-foot{
  flex:0 0 auto;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid #2c2c2e;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.foot-btn{
  flex:1;min-width:0;
  min-height:46px;
  border-radius:12px;
  padding:0;
  background:var(--panel2);
  color:var(--muted);
}
.foot-btn:hover{color:var(--text)}
.foot-btn svg{width:20px;height:20px;display:block}

.sidebar:not(.open) .side-foot{
  flex-direction:column;
  flex-wrap:nowrap;
  gap:8px;
}
.sidebar:not(.open) .foot-btn{
  flex:0 0 auto;
  width:46px;
  height:46px;
  min-height:46px;
  border-radius:50%;
  margin:0 auto;
}

/* rows */
.srow{
  display:flex;align-items:center;gap:12px;
  padding:12px 12px;min-height:84px;
  border-radius:14px;
  position:relative;z-index:2;
  background:var(--panel);
  touch-action:pan-y;
  transition:transform .24s cubic-bezier(.22,.8,.24,1),background .15s;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  cursor:pointer;
}
.sidebar:not(.open) .srow{
  flex-direction:column;
  justify-content:center;
  padding:6px 2px;
  gap:2px;
  min-height:auto;
}

.row-icon{
  width:56px;height:56px;flex:0 0 auto;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  color:#ffd60a;overflow:hidden;background:transparent;
}
.sidebar:not(.open) .row-icon{width:48px;height:48px;border-radius:12px}
.row-icon svg{width:46px;height:46px;display:block}
.sidebar:not(.open) .row-icon svg{width:34px;height:34px}
.row-icon img{width:100%;height:100%;object-fit:cover;display:block}
.row-icon .ico-letter{
  width:100%;height:100%;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:700;color:#fff;line-height:1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.sidebar:not(.open) .row-icon .ico-letter{border-radius:12px;font-size:34px}

/* フォルダアイコン：大きめ・絵文字対応 */
.row-icon.folder-icon{
  width:64px;height:64px;border-radius:16px;
}
.row-icon.folder-icon svg{width:54px;height:54px}
.row-icon.folder-icon .ico-emoji{
  font-size:44px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.sidebar:not(.open) .row-icon.folder-icon{width:52px;height:52px;border-radius:13px}
.sidebar:not(.open) .row-icon.folder-icon svg{width:42px;height:42px}
.sidebar:not(.open) .row-icon.folder-icon .ico-emoji{font-size:38px}

.row-main{flex:1;min-width:0}
.row-title{
  font-size:15px;font-weight:600;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-sub{
  font-size:12px;color:var(--muted);line-height:1.3;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-sub2{
  font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:.85;
}
.row-apps{
  flex:0 0 auto;display:flex;gap:3px;align-items:center;
}
.mini-app{
  width:26px;height:26px;border-radius:8px;overflow:hidden;
  background:var(--panel3);display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
  font-size:14px;font-weight:700;color:#fff;line-height:1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.mini-app img{width:100%;height:100%;object-fit:cover;display:block}
.row-chev{color:#5a5a5e;flex:0 0 auto;display:flex;align-items:center}
.row-chev svg{width:16px;height:16px;display:block}

/* コンパクト時：名前をアイコン下に小さく（最大2行） */
.sidebar:not(.open) .row-main{
  width:100%;
  text-align:center;
  flex:0 0 auto;
  min-height:24px;
}
.sidebar:not(.open) .row-title{
  font-size:10px;
  font-weight:500;
  color:var(--muted);
  line-height:1.15;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  white-space:normal;
  word-break:break-all;
  overflow-wrap:anywhere;
  padding:0 2px;
}
.sidebar:not(.open) .row-sub,
.sidebar:not(.open) .row-sub2,
.sidebar:not(.open) .row-apps,
.sidebar:not(.open) .row-chev{display:none}

.sidebar:not(.open) .side-scroll{
  padding:calc(8px + env(safe-area-inset-top)) 5px 5px;
}
.sidebar:not(.open) .swipe{
  margin-bottom:1px;
}

.srow.selected{background:var(--sel)}
.srow.selected::after{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);
}
.sidebar:not(.open) .srow.selected::after{top:12px;bottom:12px}

/* swipe */
.swipe{
  position:relative;overflow:hidden;background:transparent;border-radius:14px;
  margin-bottom:3px;
}
.swipe-actions{
  position:absolute;top:0;right:0;bottom:0;display:flex;z-index:1;
}
.swipe-actions button{
  width:76px;min-height:100%;border-radius:0;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;font-weight:600;color:#fff;background:#48484a;
}
.swipe-actions button:active{transform:none;opacity:.75}
.swipe-actions button svg{width:20px;height:20px}
.swipe-actions .act-edit{background:#0a84ff}
.swipe-actions .act-move{background:#5e5ce6}
.swipe-actions .act-rename{background:#5e5ce6}
.swipe-actions .act-del{background:#ff453a}
.sidebar:not(.open) .swipe-actions{display:none}

.swipe.dragging{overflow:visible;z-index:40;transition:none}
.swipe.dragging .srow{
  transition:none;background:var(--panel2);
  box-shadow:0 12px 34px rgba(0,0,0,.7),0 0 0 1px #4a4a4e;
  transform:scale(1.02);
}

/* 一覧切替アニメーション */
@keyframes listFadeIn{
  0%   { opacity:0; transform:translateX(-16px); }
  100% { opacity:1; transform:translateX(0); }
}
@keyframes listFadeInRight{
  0%   { opacity:0; transform:translateX(16px); }
  100% { opacity:1; transform:translateX(0); }
}
.side-list.anim-in{
  animation:listFadeIn .24s cubic-bezier(.22,.8,.24,1) both;
}
.side-list.anim-in-right{
  animation:listFadeInRight .24s cubic-bezier(.22,.8,.24,1) both;
}

/* drag target folder bar */
.drag-folders{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:none;gap:8px;flex-wrap:nowrap;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 12px 12px;
  background:rgba(28,28,30,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--sep);
  overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
}
.drag-folders.show{display:flex}
.drag-folders::-webkit-scrollbar{height:0}
.chip{
  flex:0 0 auto;height:36px;border-radius:18px;padding:0 16px;
  background:var(--panel3);color:var(--text);
  display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;
  transition:transform .12s,background .12s;
  white-space:nowrap;
}
.chip.current{background:#3a3a3c;color:var(--muted)}
.chip.over{background:var(--accent);color:#fff;transform:scale(1.08)}

/* toast */
.toast{
  position:fixed;left:50%;
  bottom:calc(28px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  background:rgba(60,60,65,.96);color:#fff;padding:9px 16px;border-radius:20px;
  font-size:13px;font-weight:600;z-index:120;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;white-space:nowrap;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* sidebar swipe hint */
.swipe-hint{
  position:fixed;
  top:50%;
  left:90px;
  transform:translateY(-50%) translateX(-10px) scale(.85);
  background:var(--accent);
  color:#fff;
  padding:8px 15px;
  border-radius:20px;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.02em;
  opacity:0;
  pointer-events:none;
  transition:opacity .16s ease, transform .16s cubic-bezier(.22,.8,.24,1), background .16s;
  z-index:60;
  white-space:nowrap;
  box-shadow:0 8px 26px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
}
.swipe-hint.show{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}
.swipe-hint.ready{background:var(--ok)}
.swipe-hint.menu-ready{background:var(--menu)}

/* ================= MAIN / PREVIEW ================= */
.main{
  flex:1;min-width:0;display:flex;flex-direction:column;
  min-height:0;
}
.toolbar{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
}
.dev-btn{
  min-height:36px;border-radius:18px;padding:0 16px;font-size:13px;font-weight:700;
  background:var(--panel2);color:var(--muted);
}
.dev-btn.on{background:var(--accent);color:#fff}
.toolbar .spacer{flex:1}
.tool-btn{
  min-height:36px;border-radius:18px;padding:0 14px;font-size:13px;font-weight:700;
  background:var(--panel2);
  display:inline-flex;align-items:center;gap:6px;
}
.tool-btn svg{width:16px;height:16px}

.stage{
  flex:1;min-height:0;min-width:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  padding:4px 8px 6px;
}

.phone{
  position:relative;
  width:300px;height:652px;
  background:#000;
  border:6px solid #202023;
  border-radius:48px;
  overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
  flex:0 0 auto;
}
.phone-viewport{
  position:absolute;inset:0;
  overflow:hidden;
  border-radius:42px;
  background:#000;
}
.phone-viewport iframe{
  position:absolute;top:50%;left:50%;
  width:402px;height:874px;border:0;background:#000;color-scheme:dark;
  transform-origin:center center;
  margin-left:-201px;margin-top:-437px;
}
.island{
  position:absolute;z-index:5;top:11px;left:50%;transform:translateX(-50%);
  width:33.5%;
  height:34px;
  background:#000;border-radius:100px;pointer-events:none;
}
.homebar{
  position:absolute;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);
  width:36%;height:4px;border-radius:4px;background:#fff;pointer-events:none;opacity:.9;
}

.ipad{
  position:relative;
  width:460px;height:345px;
  background:#000;
  border:10px solid #2a2a2e;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
  flex:0 0 auto;
}
.ipad-viewport{
  position:absolute;inset:0;
  overflow:hidden;
  border-radius:14px;
  background:#000;
}
.ipad-viewport iframe{
  position:absolute;top:50%;left:50%;
  width:1080px;height:810px;border:0;background:#000;color-scheme:dark;
  transform-origin:center center;
  margin-left:-540px;margin-top:-405px;
}

/* ================= SHEETS ================= */
.editor-overlay{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;
  overscroll-behavior:none;
}
.editor-overlay.show{display:flex}
.editor-sheet{
  width:100%;max-width:900px;max-height:92vh;
  background:var(--bg);border-radius:20px 20px 0 0;
  box-shadow:0 -10px 40px #000;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;overflow:hidden;
}
.editor-scroll{
  flex:1;overflow:auto;min-height:0;padding:14px 14px 0;
}
.editor-search-wrap{
  flex-shrink:0;background:var(--bg);border-top:1px solid var(--sep);
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
}
.sheet-handle{width:36px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 12px}

.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.editor-actions button{flex:1;min-width:70px;white-space:nowrap;font-size:13.5px}

.editor-title-row{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.icon-preview{
  width:46px;height:46px;flex:0 0 auto;border-radius:13px;
  background:#111113;border:1px solid var(--sep);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.icon-preview img{width:100%;height:100%;object-fit:cover;display:block}
.icon-preview .ico-letter{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;line-height:1;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.icon-preview .ico-none{font-size:19px;color:var(--muted)}

.editor-title-row .name-input{
  flex:1;min-width:80px;height:46px;border:1px solid var(--sep);border-radius:13px;
  background:#111113;color:#fff;padding:0 12px;outline:none;
  -webkit-user-select:text;user-select:text;
}
.editor-title-row .name-input:focus{border-color:var(--accent)}

textarea{
  width:100%;height:min(42vh,360px);resize:vertical;
  background:#111113;color:#f5f5f7;border:1px solid var(--sep);border-radius:14px;
  padding:14px;outline:none;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;
  white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;overflow:auto;
  -webkit-user-select:text;user-select:text;
}
textarea:focus{border-color:var(--accent)}

.search-section{margin-top:0;padding-top:0;border-top:none}
.search-box{display:flex;align-items:center;gap:6px}
.search-field{position:relative;flex:1;min-width:0}
.search-field input{
  width:100%;height:42px;border:1px solid var(--sep);border-radius:12px;
  background:#111113;color:#fff;padding:0 62px 0 11px;outline:none;
  -webkit-user-select:text;user-select:text;
  -webkit-appearance:none;appearance:none;
  caret-color:#f5f5f7;font-size:16px;
}
.search-field input:focus{border-color:var(--accent)}
.search-count{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:11.5px;color:var(--muted);pointer-events:none;white-space:nowrap;
}
.search-box .nav-btn{min-height:42px;min-width:44px;padding:0 8px;font-size:15px}
.search-box #btnSave{min-height:42px;min-width:66px;font-size:14px;font-weight:700}

/* picker / settings / folder edit */
.picker-sheet{
  width:100%;max-width:520px;max-height:72vh;
  background:var(--bg);border-radius:20px 20px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 -10px 40px #000;
}
.picker-sheet h3{margin:0;font-size:16px;font-weight:700;text-align:center}
.picker-list{
  overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:8px;min-height:0;
}
.picker-item{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border-radius:14px;padding:16px;
  font-size:15px;font-weight:600;cursor:pointer;
  border:1px solid transparent;
}
.picker-item .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.picker-item.current{border-color:var(--accent);background:#0a84ff18}
.picker-item:active{background:var(--panel2)}

/* folder edit */
.folder-edit-row{display:flex;gap:8px;align-items:center}
.folder-edit-row .emoji-input{
  width:64px;height:52px;flex:0 0 auto;
  border:1px solid var(--sep);border-radius:13px;
  background:#111113;color:#fff;padding:0;outline:none;
  text-align:center;font-size:26px;line-height:1;
  -webkit-user-select:text;user-select:text;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Helvetica Neue",sans-serif;
}
.folder-edit-row .emoji-input:focus{border-color:var(--accent)}
.folder-edit-row .name-input{
  flex:1;min-width:0;height:52px;border:1px solid var(--sep);border-radius:13px;
  background:#111113;color:#fff;padding:0 12px;outline:none;
  -webkit-user-select:text;user-select:text;
}
.folder-edit-row .name-input:focus{border-color:var(--accent)}

/* ================= FULLSCREEN ================= */
.fullscreen{position:fixed;inset:0;z-index:100;background:#000;padding:0;display:none;overscroll-behavior:none;}
.fullscreen.show{display:block}
.fullscreen-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;}
.fullscreen iframe{border:0;background:#000;color-scheme:dark}
.fullscreen .exit{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));right:14px;
  width:40px;height:40px;padding:0;border-radius:50%;
  background:rgba(0,0,0,.40);color:#fff;font-size:19px;
}
</style>
</head>
<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="side-scroll" id="sideScroll">
      <div class="side-list" id="sideList"></div>
    </div>

    <div class="side-foot">
      <button id="btnNew" class="foot-btn" aria-label="追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
      <button id="btnSettings" class="foot-btn" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>

<script>
(() => {
  const $ = id => document.getElementById(id);

  /* ---- storage keys ---- */
  const NOTES_KEY   = "pwa-previewer-items-v2";
  const FOLDERS_KEY = "pwa-previewer-folders-v1";
  const OLD_KEY     = "iphone17pro-pwa-preview-html-v1";
  const DEFAULT_FOLDER_NAME = "マイメモ";

  const PHONE_W = 402, PHONE_H = 874, PHONE_B = 6;
  const IPAD_W  = 1080, IPAD_H  = 810, IPAD_B  = 10;

  /* サイドバージェスチャ閾値
     ・SB_BACK_DX          : 短めスワイプ（一覧に戻る / メニューを閉じる）
     ・SB_EXPAND_DX_FOLDER : フォルダ内での長めスワイプ（メニューを開く）
     ・SB_EXPAND_DX_ROOT   : ルートでのスワイプ（メニューを開く） */
  const SB_BACK_DX          = 45;
  const SB_EXPAND_DX_FOLDER = 200;
  const SB_EXPAND_DX_ROOT   = 45;

  /* プレビュー内タップを親へ通知するブリッジ（srcdoc に追記） */
  const TAP_BRIDGE =
    '<script>(function(){document.addEventListener("click",function(){' +
    'try{parent.postMessage({__pwaPreviewTap:1},"*");}catch(e){}' +
    '},true);})();<\/script>';

  let items = [];
  let folders = [];
  let selectedId = null;
  let editingId = null;
  let currentFolderId = null;
  let sidebarOpen = window.innerWidth >= 760;
  let currentDevice = "phone";

  const source     = $("source");
  const nameInput  = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad  = $("frameIpad");
  const fullFrame  = $("fullFrame");

  const WEEKDAYS = ["日","月","火","水","木","金","土"];

  const ICON = {
    folder: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.6A2.6 2.6 0 0 1 5.6 4h3.1c.55 0 1.07.24 1.43.66l1.02 1.2c.2.23.48.36.79.36h6.46A2.6 2.6 0 0 1 21 8.82V17.4A2.6 2.6 0 0 1 18.4 20H5.6A2.6 2.6 0 0 1 3 17.4V6.6z"/></svg>`,
    back:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>`,
    edit:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>`,
    move:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M12.5 6l6 6-6 6"/></svg>`,
    trash:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>`
  };

  /* =========================================================
     utils
  ========================================================= */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function escapeHtml(s){
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function firstGrapheme(s){
    if(!s) return "";
    if(typeof Intl !== "undefined" && Intl.Segmenter){
      try{
        const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
        const it = seg.segment(s)[Symbol.iterator]().next();
        if(!it.done) return it.value.segment;
      }catch(_){}
    }
    const arr = Array.from(s);
    return arr.length ? arr[0] : "";
  }

  function formatDate(ts){
    const d = new Date(ts);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const w = WEEKDAYS[d.getDay()];
    const h = String(d.getHours()).padStart(2,"0");
    const min = String(d.getMinutes()).padStart(2,"0");
    return `${y}/${m}/${day}（${w}）${h}:${min}`;
  }

  function byteLength(s){
    let n = 0;
    for(let i = 0; i < s.length; i++){
      const c = s.charCodeAt(i);
      if(c < 0x80) n += 1;
      else if(c < 0x800) n += 2;
      else if(c >= 0xD800 && c <= 0xDBFF){ n += 4; i++; }
      else n += 3;
    }
    return n;
  }
  function formatBytes(n){
    if(n < 1024) return n + " B";
    if(n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  function colorFor(s){
    let h = 0;
    for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return `hsl(${h} 62% 42%)`;
  }

  function validIcon(v){
    return typeof v === "string" && /^data:image\//.test(v);
  }

  function iconInner(it){
    if(validIcon(it.icon)){
      return `<img src="${it.icon}" alt="">`;
    }
    const name = (it.name || "無").trim();
    const ch = firstGrapheme(name) || "無";
    return `<span class="ico-letter" style="background:${colorFor(name)}">${escapeHtml(ch)}</span>`;
  }

  function folderIconInner(f){
    if(f && typeof f.emoji === "string" && f.emoji){
      return `<span class="ico-emoji">${escapeHtml(f.emoji)}</span>`;
    }
    return ICON.folder;
  }

  /* ---- HTML タイトル抽出 ---- */
  const ENTITIES = {
    amp:"&", lt:"<", gt:">", quot:'"', apos:"'", nbsp:" ",
    copy:"©", reg:"®", trade:"™", hellip:"…", mdash:"—", ndash:"–",
    laquo:"«", raquo:"»", yen:"¥", middot:"·"
  };
  function decodeEntities(s){
    return String(s).replace(/&(#x[0-9a-fA-F]+|#[0-9]+|[a-zA-Z][a-zA-Z0-9]*);/g, (m, e) => {
      if(e.charAt(0) === "#"){
        const hex = e.charAt(1).toLowerCase() === "x";
        const code = hex ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
        if(!isNaN(code) && code > 0 && code <= 0x10FFFF){
          try{ return String.fromCodePoint(code); }catch(_){ return m; }
        }
        return m;
      }
      const key = e.toLowerCase();
      return Object.prototype.hasOwnProperty.call(ENTITIES, key) ? ENTITIES[key] : m;
    });
  }
  function extractHtmlTitle(html){
    if(!html) return "";
    const m = String(html).match(/<title[^>]*>([\s\S]*?)<\/title\s*>/i);
    if(!m) return "";
    let t = m[1].replace(/<[^>]*>/g, "");
    t = decodeEntities(t).replace(/\s+/g, " ").trim();
    return t.slice(0, 80);
  }

  /* =========================================================
     persistence
  ========================================================= */
  function persist(){
    try{
      localStorage.setItem(NOTES_KEY, JSON.stringify(items));
      localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
    }catch(e){
      console.warn("persist failed", e);
      showToast("保存容量が不足しています");
    }
  }

  function load(){
    folders = [];
    try{
      const rawF = localStorage.getItem(FOLDERS_KEY);
      if(rawF){
        const p = JSON.parse(rawF);
        if(Array.isArray(p)) folders = p.filter(f => f && typeof f === "object" && f.id);
      }
    }catch(e){ folders = []; }
    folders.forEach(f => {
      if(typeof f.name !== "string" || !f.name) f.name = "無題のフォルダ";
      if(f.emoji !== undefined && typeof f.emoji !== "string") delete f.emoji;
      if(typeof f.emoji === "string" && f.emoji) f.emoji = firstGrapheme(f.emoji);
    });

    items = [];
    try{
      const raw = localStorage.getItem(NOTES_KEY);
      if(raw){
        const p = JSON.parse(raw);
        if(Array.isArray(p)) items = p;
      }else{
        const old = localStorage.getItem(OLD_KEY);
        if(old){
          items = [{ id: uid(), name: "移行したHTML", html: old, updated: Date.now() }];
        }
      }
    }catch(e){ items = []; }
    if(!Array.isArray(items)) items = [];
    items = items.filter(it => it && typeof it === "object");

    if(folders.length === 0){
      folders = [{ id: uid(), name: DEFAULT_FOLDER_NAME }];
    }

    const fids = new Set(folders.map(f => f.id));
    items.forEach(it => {
      if(!it.id) it.id = uid();
      if(typeof it.name !== "string") it.name = "無題";
      if(typeof it.html !== "string") it.html = "";
      if(typeof it.updated !== "number") it.updated = Date.now();
      if(!it.folderId || !fids.has(it.folderId)) it.folderId = folders[0].id;
      if(it.icon !== undefined && !validIcon(it.icon)) delete it.icon;
    });

    selectedId = items.length ? items[0].id : null;
    currentFolderId = null;
    persist();
  }

  /* =========================================================
     previews
  ========================================================= */
  function fitIframe(iframe, wrapEl, deviceW, deviceH){
    if(!wrapEl) return;
    const rect = wrapEl.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    const scale = Math.max(rect.width / deviceW, rect.height / deviceH) * 1.002;
    iframe.style.transform = `scale(${scale})`;
  }

  function resizeAllPreviews(){
    fitIframe(framePhone, document.querySelector(".phone-viewport"), PHONE_W, PHONE_H);
    fitIframe(frameIpad,  document.querySelector(".ipad-viewport"),  IPAD_W,  IPAD_H);
  }

  function fitDevices(){
    const stage = $("stage");
    const sw = Math.max(80, stage.clientWidth  - 16);
    const sh = Math.max(80, stage.clientHeight - 10);

    const phone = $("phone");
    const ipad  = $("ipad");

    if(!phone.hidden){
      const k = Math.min(
        (sw - 2*PHONE_B) / PHONE_W,
        (sh - 2*PHONE_B) / PHONE_H
      );
      const w = PHONE_W * k + 2*PHONE_B;
      const h = PHONE_H * k + 2*PHONE_B;
      phone.style.width  = w.toFixed(2) + "px";
      phone.style.height = h.toFixed(2) + "px";
      const rad = Math.max(20, w * 0.135);
      phone.style.borderRadius = rad.toFixed(1) + "px";
      const vp = phone.querySelector(".phone-viewport");
      vp.style.borderRadius = Math.max(0, rad - 7).toFixed(1) + "px";

      const island = phone.querySelector(".island");
      if(island){
        island.style.height = Math.max(10, 34 * k).toFixed(2) + "px";
        island.style.top    = Math.max(3, 11 * k).toFixed(2) + "px";
        island.style.borderRadius = Math.max(6, 100 * k).toFixed(1) + "px";
      }
      const homebar = phone.querySelector(".homebar");
      if(homebar){
        homebar.style.height = Math.max(2, 4 * k).toFixed(2) + "px";
        homebar.style.bottom = Math.max(3, 8 * k).toFixed(2) + "px";
      }
    }

    if(!ipad.hidden){
      const k = Math.min(
        (sw - 2*IPAD_B) / IPAD_W,
        (sh - 2*IPAD_B) / IPAD_H
      );
      const w = IPAD_W * k + 2*IPAD_B;
      const h = IPAD_H * k + 2*IPAD_B;
      ipad.style.width  = w.toFixed(2) + "px";
      ipad.style.height = h.toFixed(2) + "px";
      const rad = Math.max(10, Math.min(w, h) * 0.06);
      ipad.style.borderRadius = rad.toFixed(1) + "px";
      const vp = ipad.querySelector(".ipad-viewport");
      vp.style.borderRadius = Math.max(0, rad - 8).toFixed(1) + "px";
    }
  }

  function resizeFullscreen(){
    if(!$("fullscreen").classList.contains("show")) return;
    const stage = $("fsStage");
    const dW = PHONE_W, dH = PHONE_H;
    const scale = Math.min(stage.clientWidth / dW, stage.clientHeight / dH);
    fullFrame.style.width  = dW + "px";
    fullFrame.style.height = dH + "px";
    fullFrame.style.transform = `scale(${scale})`;
    fullFrame.style.transformOrigin = "center center";
  }

  function relayout(){
    fitDevices();
    resizeAllPreviews();
    resizeFullscreen();
  }

  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", () => setTimeout(relayout, 120));

  if(window.ResizeObserver){
    const ro = new ResizeObserver(() => {
      fitDevices();
      resizeAllPreviews();
    });
    ro.observe($("stage"));
  }

  function clearPreviews(){
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  function updatePreview(){
    const it = items.find(x => x.id === selectedId);
    if(!it){ clearPreviews(); return; }
    const html = (it.html || "") + TAP_BRIDGE;
    framePhone.srcdoc = html;
    frameIpad.srcdoc = html;
    requestAnimationFrame(resizeAllPreviews);
  }

  /* プレビュー内（iframe）タップの通知受け取り */
  window.addEventListener("message", e => {
    const d = e.data;
    if(!d || typeof d !== "object" || !d.__pwaPreviewTap) return;
    let ok = false;
    try{
      ok = (e.source === framePhone.contentWindow) || (e.source === frameIpad.contentWindow);
    }catch(_){ ok = true; }
    if(!ok) return;
    handlePreviewInnerTap();
  });

  /* =========================================================
     toast
  ========================================================= */
  let toastTimer = null;
  function
