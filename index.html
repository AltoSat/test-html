<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>画面端タッチ限界検証</title>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    #env-measurer {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      top: var(--sat);
      bottom: var(--sab);
    }

    /* メインコンテンツ（中央のダッシュボード） */
    .container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      z-index: 1;
      pointer-events: none; /* 中央部分はボタン操作の邪魔にならないようにする */
    }

    .dashboard {
      width: 100%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .counter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 600;
    }

    .counter-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px;
      border-radius: 8px;
    }

    .last-log {
      font-size: 14px;
      color: #38bdf8;
      min-height: 24px;
      margin-bottom: 16px;
      word-break: break-all;
    }

    .btn-reset {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-reset:active {
      opacity: 0.8;
    }

    .debug-info {
      position: absolute;
      bottom: calc(var(--sab) + 60px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }

    /* 共通検証用ボタン：画面極限配置 */
    .test-btn {
      position: absolute;
      background-color: rgba(37, 99, 235, 0.85);
      color: #ffffff;
      border: 1px solid #60a5fa;
      font-weight: bold;
      font-size: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      touch-action: none;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
      transition: background-color 0.05s ease, transform 0.05s ease;
    }

    .test-btn.active {
      background-color: #22c55e !important;
      border-color: #86efac !important;
      transform: scale(0.98);
    }

    /* 
      【上部ボタン】画面絶対上端（top: 0）から配置。
      ダイナミックアイランドの左右の隙間を埋めるように横幅を広くし、上端限界までのタッチ判定を検証。
    */
    .btn-top-left {
      top: 0;
      left: 0;
      width: 38%; /* 画面中央のダイナミックアイランドを避けて左右に配置 */
      height: calc(var(--sat) + 10px); /* ステータスバー・ダイナミックアイランドの高さ包含領域までカバー */
      padding-top: var(--sat);
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    .btn-top-right {
      top: 0;
      right: 0;
      width: 38%;
      height: calc(var(--sat) + 10px);
      padding-top: var(--sat);
      border-top-left-radius: 0;
      border-top-right-radius: 0;
    }

    /* 
      【下部ボタン】画面絶対下端（bottom: 0）に密着。
      ホームバーの左右を挟み込むように配置し、下端限界のタッチ反応を検証。
    */
    .btn-bottom-left {
      bottom: 0;
      left: 0;
      width: 38%;
      height: calc(var(--sab) + 24px);
      padding-bottom: var(--sab);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .btn-bottom-right {
      bottom: 0;
      right: 0;
      width: 38%;
      height: calc(var(--sab) + 24px);
      padding-bottom: var(--sab);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    /* ホームバー領域の視覚的ガイド線 */
    .home-bar-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div id="env-measurer"></div>
  <div class="home-bar-indicator"></div>

  <div class="container">
    <div class="dashboard">
      <div class="counter-grid">
        <div class="counter-item">上左：<span id="count-tl">0</span></div>
        <div class="counter-item">上右：<span id="count-tr">0</span></div>
        <div class="counter-item">下左：<span id="count-bl">0</span></div>
        <div class="counter-item">下右：<span id="count-br">0</span></div>
      </div>
      <div class="last-log" id="last-log">最後に反応した場所：なし</div>
      <button class="btn-reset" id="reset-btn">カウントリセット</button>
    </div>
  </div>

  <div class="debug-info" id="debug-info">計測中...</div>

  <!-- 検証ターゲットボタン（画面端限界配置） -->
  <button id="btn-tl" class="test-btn btn-top-left">上左</button>
  <button id="btn-tr" class="test-btn btn-top-right">上右</button>
  <button id="btn-bl" class="test-btn btn-bottom-left">下左</button>
  <button id="btn-br" class="test-btn btn-bottom-right">下右</button>

  <script>
    (function () {
      const counts = { tl: 0, tr: 0, bl: 0, br: 0 };
      const labels = { tl: '上左', tr: '上右', bl: '下左', br: '下右' };

      const countElements = {
        tl: document.getElementById('count-tl'),
        tr: document.getElementById('count-tr'),
        bl: document.getElementById('count-bl'),
        br: document.getElementById('count-br')
      };

      const buttons = {
        tl: document.getElementById('btn-tl'),
        tr: document.getElementById('btn-tr'),
        bl: document.getElementById('btn-bl'),
        br: document.getElementById('btn-br')
      };

      const lastLog = document.getElementById('last-log');
      const resetBtn = document.getElementById('reset-btn');
      const debugInfo = document.getElementById('debug-info');
      const envMeasurer = document.getElementById('env-measurer');

      function handleTouch(key, e) {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();

        counts[key]++;
        countElements[key].textContent = counts[key];

        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        lastLog.textContent = `最後に反応した場所：${labels[key]}（${timeStr}）`;

        const btn = buttons[key];
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 150);

        if (navigator.vibrate) {
          try { navigator.vibrate(40); } catch (err) {}
        }
      }

      Object.keys(buttons).forEach(key => {
        const btn = buttons[key];
        btn.addEventListener('touchstart', (e) => handleTouch(key, e), { passive: false });
        btn.addEventListener('click', (e) => { e.stopPropagation(); });
      });

      resetBtn.addEventListener('touchstart', (e) => {
        if (e.cancelable) e.preventDefault();
        resetCounts();
      }, { passive: false });
      resetBtn.addEventListener('click', resetCounts);

      function resetCounts() {
        Object.keys(counts).forEach(key => {
          counts[key] = 0;
          countElements[key].textContent = '0';
        });
        lastLog.textContent = '最後に反応した場所：なし';
      }

      function updateMetrics() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const computedStyle = window.getComputedStyle(envMeasurer);
        const sat = computedStyle.top;
        const sab = computedStyle.bottom;
        debugInfo.innerHTML = `Viewport: ${vw} x ${vh}<br>safe-area-top: ${sat} / bottom: ${sab}`;
      }

      window.addEventListener('resize', updateMetrics);
      window.addEventListener('orientationchange', updateMetrics);
      document.addEventListener('DOMContentLoaded', updateMetrics);
      setTimeout(updateMetrics, 300);
    })();
  </script>
</body>
</html>
