  function createAudioGraph(ctx) {
    const master = ctx.createGain();
    master.gain.value = 0.72;
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 18;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.004;
    compressor.release.value = 0.22;

    const dry = ctx.createGain();
    dry.gain.value = 0.88;
    const wet = ctx.createGain();
    wet.gain.value = 0.13;
    const convolver = ctx.createConvolver();
    const length = Math.floor(ctx.sampleRate * 1.35);
    const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const data = impulse.getChannelData(c);
      for (let i = 0; i < length; i++) {
        const decay = Math.pow(1 - i / length, 2.7);
        data[i] = (Math.random() * 2 - 1) * decay * (c ? .92 : 1);
      }
    }
    convolver.buffer = impulse;
    master.connect(dry);
    master.connect(convolver);
    convolver.connect(wet);
    dry.connect(compressor);
    wet.connect(compressor);
    compressor.connect(ctx.destination);
    return { ctx, master, liveSources: new Set() };
  }

  function ensureAudioSync() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    try {
      if (!audio || !audio.ctx || audio.ctx.state === 'closed') {
        audio = createAudioGraph(new AudioCtx());
      }
      if (audio.ctx.state === 'suspended' || audio.ctx.state === 'interrupted') {
        const resume = audio.ctx.resume();
        if (resume && typeof resume.catch === 'function') resume.catch(() => {});
      }
      if (!audio._primed) {
        audio._primed = true;
        try {
          const buf = audio.ctx.createBuffer(1, 1, audio.ctx.sampleRate || 22050);
          const src = audio.ctx.createBufferSource();
          src.buffer = buf;
          src.connect(audio.ctx.destination);
          src.start(0);
        } catch (_) {}
      }
      return audio;
    } catch (_) {
      return null;
    }
  }

  async function unlockAudio() {
    if (audioUnlockPromise) return audioUnlockPromise;
    audioUnlockPromise = (async () => {
      const graph = ensureAudioSync();
      if (!graph) {
        showToast('このブラウザはWeb Audioに対応していません');
        throw new Error('Web Audio unsupported');
      }
      const ctx = graph.ctx;
      if (ctx.state !== 'running') {
        try { await ctx.resume(); } catch (_) {}
      }
      if (!audio || !audio.ctx || audio.ctx.state === 'closed') {
        throw new Error('AudioContext closed');
      }
      return audio;
    })().finally(() => { audioUnlockPromise = null; });
    return audioUnlockPromise;
  }

  function stopAllLiveSources() {
    if (!audio) return;
    for (const source of Array.from(audio.liveSources)) {
      try { source.stop(); } catch (_) {}
    }
    audio.liveSources.clear();
  }

  function createPianoVoiceBase(midi, when, velocity) {
    if (!audio) return null;
    const { ctx, master } = audio;
    const f = frequency(midi);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(Math.min(7200, 1900 + f * 5.5), when);
    filter.Q.setValueAtTime(.75, when);
    const envelope = ctx.createGain();
    const amp = Math.max(.035, Math.min(.22, velocity * .19));
    envelope.gain.setValueAtTime(.0001, when);
    envelope.gain.linearRampToValueAtTime(amp, when + .009);
    envelope.gain.exponentialRampToValueAtTime(Math.max(.0002, amp * .42), when + .16);
    filter.connect(envelope);
    envelope.connect(master);
    return { f, filter, envelope, amp };
  }

  function createPianoOscillators(base, when, opts = {}) {
    const { ctx, liveSources } = audio;
    const oscillators = [];
    PIANO_PARTIALS.forEach((part, index) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = part.type;
      osc.frequency.setValueAtTime(base.f * part.ratio, when);
      osc.detune.setValueAtTime(part.detune, when);
      g.gain.setValueAtTime(part.gain, when);
      if (opts.sustained) {
        osc.connect(g);
        g.connect(base.filter);
        liveSources.add(osc);
        osc.onended = () => liveSources.delete(osc);
        osc.start();
        oscillators.push(osc);
      } else {
        if (index > 0) g.gain.exponentialRampToValueAtTime(.0001, when + Math.min(.9, .22 + opts.holdSeconds * .4));
        osc.connect(g);
        g.connect(base.filter);
        liveSources.add(osc);
        osc.onended = () => liveSources.delete(osc);
        osc.start(when);
        osc.stop(opts.releaseStart + .48);
      }
    });
    return oscillators;
  }

  function addPianoClick(when, velocity) {
    if (!audio) return null;
    const { ctx, master, liveSources } = audio;
    const click = ctx.createBufferSource();
    const clickBuffer = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * .025)), ctx.sampleRate);
    const cd = clickBuffer.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / cd.length, 4);
    click.buffer = clickBuffer;
    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(.014 * velocity, when);
    clickGain.gain.exponentialRampToValueAtTime(.0001, when + .025);
    click.connect(clickGain);
    clickGain.connect(master);
    liveSources.add(click);
    click.onended = () => liveSources.delete(click);
    click.start(when);
    return click;
  }

  function pianoVoice(midi, when, holdSeconds, velocity = .72) {
    if (!audio) return;
    const base = createPianoVoiceBase(midi, when, velocity);
    if (!base) return;
    const releaseStart = when + Math.max(.12, holdSeconds);
    const bodyEnd = Math.min(releaseStart - .015, when + Math.max(.20, holdSeconds * .72));
    if (bodyEnd > when + .17) {
      base.envelope.gain.exponentialRampToValueAtTime(Math.max(.0002, base.amp * .13), bodyEnd);
    }
    base.envelope.gain.exponentialRampToValueAtTime(.0001, releaseStart + .42);
    createPianoOscillators(base, when, { holdSeconds, releaseStart });
    addPianoClick(when, velocity);
  }

  function startSustainedVoice(midi, velocity = .78) {
    if (!audio) return null;
    const now = audio.ctx.currentTime;
    const base = createPianoVoiceBase(midi, now, velocity);
    if (!base) return null;
    const oscillators = createPianoOscillators(base, now, { sustained: true });
    const click = addPianoClick(now, velocity);

    let stopped = false;
    const stop = () => {
      if (stopped) return;
      stopped = true;
      const t = audio.ctx.currentTime;
      base.envelope.gain.cancelScheduledValues(t);
      base.envelope.gain.setTargetAtTime(0.0001, t, 0.03);
      oscillators.forEach(osc => { try { osc.stop(t + .12); } catch(_){} });
      if (click) { try { click.stop(t + .01); } catch(_){} }
    };
    return { stop };
  }

  function playPreview(midi) {
    ensureAudioSync();
    unlockAudio().then(() => {
      if (!audio || !audio.ctx) return;
      pianoVoice(midi, audio.ctx.currentTime + .008, .28, .72);
    }).catch(() => {});
  }

  function playButtonSound(type = 'default') {
    ensureAudioSync();
    unlockAudio().then(() => {
      if (!audio || !audio.ctx) return;
      const now = audio.ctx.currentTime;
      const osc = audio.ctx.createOscillator();
      const gain = audio.ctx.createGain();

      switch(type) {
        case 'up':
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.08);
          break;
        case 'down':
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.exponentialRampToValueAtTime(523.25, now + 0.08);
          break;
        case 'left':
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(493.88, now + 0.08);
          break;
        case 'right':
          osc.frequency.setValueAtTime(493.88, now);
          osc.frequency.exponentialRampToValueAtTime(587.33, now + 0.08);
          break;
        case 'center':
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          break;
        case 'rest':
          osc.frequency.setValueAtTime(329.63, now);
          break;
        case 'delete':
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
          break;
        case 'record':
          osc.frequency.setValueAtTime(880, now);
          break;
        case 'play':
          osc.frequency.setValueAtTime(698.46, now);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1);
          break;
        case 'random':
          osc.frequency.setValueAtTime(392, now);
          osc.frequency.exponentialRampToValueAtTime(784, now + 0.12);
          break;
        default:
          osc.frequency.setValueAtTime(440, now);
      }

      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(audio.master);
      osc.start(now);
      osc.stop(now + 0.15);
    }).catch(() => {});
  }

  function resetKeyboardGesture() {
    cancelHold();
    stopGestureVoice();
    keyboardGesture.pointerId = null;
    keyboardGesture.lastMidi = null;
    keyboardGesture.eventId = null;
    keyboardGesture.previousSelectedId = null;
    keyboardGesture.scrolling = false;
    keyboardGesture.audioReady = false;
    keyboardGesture.startX = 0;
    keyboardGesture.startScroll = 0;
  }

  function stopPlayback(showMessage = false, focusEventId = null) {
    playbackToken += 1;
    playbackStarting = false;
    const wasPlaying = Boolean(playing);
    const currentPlaying = playing;
    const targetId = focusEventId || (currentPlaying ? currentPlaying.currentId : null);
    const leaveTargetId = targetId || (currentPlaying && events.length ? events[events.length - 1].id : null);

    if (currentPlaying) cancelAnimationFrame(currentPlaying.raf);
    stopAllLiveSources();
    playing = null;
    setPlayingKey(null);
    setPlaybackUI(false);

    try {
      leaveOverview(leaveTargetId);
    } catch (_) {
      finishLeaveOverviewImmediateFallback();
    }
    resetKeyboardGesture();

    els.playBtn.textContent = '▶ 再生';
    els.playBtn.classList.remove('is-playing');
    const playhead = document.getElementById('playhead');
    if (playhead) playhead.style.display = 'none';
    document.querySelectorAll('.note-block.is-playing, .rest-block.is-playing').forEach(node => node.classList.remove('is-playing'));

    if (leaveTargetId) {
      selectedId = leaveTargetId;
      updateSelectedHighlight(leaveTargetId);
      saveState();
    } else {
      updateControls();
    }

    if (showMessage && wasPlaying) showToast('停止しました');
  }

  function playbackStartIndex(forceBeginning = false) {
    if (forceBeginning) return 0;
    const idx = selectedIndex();
    if (idx < 0 || idx >= events.length - 1) return 0;
    return idx;
  }

  async function startPlayback(forceBeginning = false) {
    if (playing) {
      const focusId = playing.currentId || null;
      stopPlayback(true, focusId);
      return;
    }
    if (playbackStarting) {
      stopPlayback(true, null);
      return;
    }
    stopLibraryPlayback(false);
    if (!events.length) {
      showToast('鍵盤から音符を入力してください');
      els.playBtn.classList.remove('is-shaking');
      void els.playBtn.offsetWidth;
      els.playBtn.classList.add('is-shaking');
      setTimeout(() => els.playBtn.classList.remove('is-shaking'), 400);
      return;
    }

    ensureAudioSync();

    const token = ++playbackToken;
    playbackStarting = true;

    prePlaybackScroll.left = els.scoreViewport.scrollLeft;
    prePlaybackScroll.top = els.scoreViewport.scrollTop;

    const { map, total } = layoutEvents();
    const startIndex = playbackStartIndex(forceBeginning);
    const startUnit = map.get(events[startIndex].id).start;
    const playUnits = Math.max(0, total - startUnit);

    setPlaybackUI(true);
    enterOverview(startUnit);
    els.playBtn.textContent = '■ 停止';
    els.playBtn.classList.add('is-playing');
    const playhead = document.getElementById('playhead');
    if (playhead) playhead.style.display = 'block';

    try {
      await unlockAudio();
      if (token !== playbackToken) return;
      if (!audio || !audio.ctx) throw new Error('AudioContext is not available');
      if (audio.ctx.state !== 'running') {
        try { await audio.ctx.resume(); } catch (_) {}
      }
      if (token !== playbackToken) return;
      if (audio.ctx.state !== 'running') {
        showToast('再生できませんでした。もう一度▶を押してください');
        stopPlayback(false);
        return;
      }
      if (!events.length) {
        stopPlayback(false);
        return;
      }

      const startAt = audio.ctx.currentTime + .075;

      for (let i = startIndex; i < events.length; i++) {
        const ev = events[i];
        if (ev.type !== 'note') continue;
        const pos = map.get(ev.id);
        const relativeStart = pos.start - startUnit;
        pianoVoice(ev.midi, startAt + relativeStart * currentUnitSeconds, Math.max(.12, ev.duration * currentUnitSeconds * .92), .78);
      }

      playing = { startAt, total, map, startUnit, playUnits, lastId: null, currentId: null, raf: 0 };

      const tick = () => {
        if (!playing || !audio) return;
        const elapsedUnits = Math.max(0, (audio.ctx.currentTime - playing.startAt) / currentUnitSeconds);
        if (elapsedUnits >= playing.playUnits + .03) {
          const lastEvent = events.length ? events[events.length - 1] : null;
          const focusId = lastEvent ? lastEvent.id : null;
          stopPlayback(false, focusId);
          showToast('再生が終わりました');
          return;
        }
        const absoluteUnit = playing.startUnit + elapsedUnits;
        const y = rulerH() + Math.min(playing.total, absoluteUnit) * rowH();
        const ph = document.getElementById('playhead');
        if (ph) ph.style.top = `${y}px`;
        let current = events[events.length - 1];
        for (const ev of events) {
          const pos = playing.map.get(ev.id);
          if (absoluteUnit >= pos.start && absoluteUnit < pos.end) { current = ev; break; }
        }
        playing.currentId = current.id;
        if (playing.lastId !== current.id) {
          document.querySelectorAll('.note-block.is-playing, .rest-block.is-playing').forEach(n => n.classList.remove('is-playing'));
          const node = els.scoreContent.querySelector(`[data-event-id="${current.id}"]`);
          if (node) node.classList.add('is-playing');
          setPlayingKey(current.type === 'note' ? current.midi : null);
          playing.lastId = current.id;
        }

        if (activeZoom && activeZoom.phase === 'enter') {
          // enterOverviewアニメーション中はtransformを上書きしない
        } else if (overviewState && els.scoreViewport.classList.contains('is-zooming')) {
          const scale = currentScale || overviewState.scoreScale || 1;
          const ty = els.scoreViewport.clientHeight / 2 - y * scale;
          const tx = overviewState.targetTx || 0;
          els.scoreContent.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
          overviewState.currentTx = tx;
          overviewState.currentTy = ty;
        } else {
          const viewport = els.scoreViewport;
          const focusY = overviewState && overviewState.focusY != null ? overviewState.focusY : 0;
          const targetTop = focusY + (y - focusY) * currentScale - viewport.clientHeight / 2;
          const maxTop = Math.max(0, els.scoreContent.scrollHeight - viewport.clientHeight);
          viewport.scrollTop = Math.max(0, Math.min(targetTop, maxTop));
        }
        playing.raf = requestAnimationFrame(tick);
      };
      playing.raf = requestAnimationFrame(tick);
    } catch (err) {
      showToast('再生エラー: ' + (err && err.message ? err.message : '不明'));
      stopPlayback(false);
    } finally {
      if (token === playbackToken) playbackStarting = false;
    }
  }

  function stopLibraryPlayback(showMessage = false) {
    clearTimeout(libraryPlaybackTimer);
    if (libraryPlaying && libraryPlaying.button) {
      libraryPlaying.button.textContent = '再生';
      libraryPlaying.button.classList.remove('is-playing');
    }
    const wasPlaying = Boolean(libraryPlaying);
    libraryPlaying = null;
    stopAllLiveSources();
    if (showMessage && wasPlaying) showToast('停止しました');
  }

  async function playLibrarySong(song, button) {
    if (libraryPlaying && libraryPlaying.songId === song.id) {
      stopLibraryPlayback(true);
      return;
    }
    stopPlayback(false);
    stopLibraryPlayback(false);
    if (!song.events.length) return;
    ensureAudioSync();
    try { await unlockAudio(); } catch (_) { return; }
    const unitSeconds = Math.max(.12, Math.min(1, Number(song.unitSeconds) || DEFAULT_UNIT_SECONDS));
    let cursor = 0;
    for (const ev of song.events) {
      const duration = Math.max(1, Number(ev.duration) || 1);
      if (ev.type === 'note') pianoVoice(ev.midi, audio.ctx.currentTime + .06 + cursor * unitSeconds, duration * unitSeconds * .92, .76);
      cursor += duration;
    }
    libraryPlaying = { songId: song.id, button };
    button.textContent = '停止';
    button.classList.add('is-playing');
    showToast(`「${song.name || '無題の曲'}」を再生`);
    libraryPlaybackTimer = setTimeout(() => {
      if (libraryPlaying && libraryPlaying.songId === song.id) {
        button.textContent = '再生';
        button.classList.remove('is-playing');
        libraryPlaying = null;
        showToast('再生が終わりました');
      }
    }, (cursor * unitSeconds + .7) * 1000);
  }

  function renderKeyboard() {
    buildKeyGeometry();
    els.keyboardInner.innerHTML = '';
    const orderedMidis = Array.from(keyGeometry.keys()).sort((a, b) => {
      const ga = geometryFor(a), gb = geometryFor(b);
      return Number(ga.isBlack) - Number(gb.isBlack) || ga.left - gb.left;
    });
    for (const midi of orderedMidis) {
      const info = noteInfo(midi);
      const geom = geometryFor(midi);
      const key = document.createElement('div');
      key.className = 'piano-key ' + (geom.isBlack ? 'black-key' : 'white-key');
      key.dataset.midi = String(midi);
      key.style.left = `${geom.left}px`;
      key.style.width = `${geom.width}px`;
      key.setAttribute('role', 'button');
      key.setAttribute('aria-label', info.label);
      if (!geom.isBlack && info.pc === 0) {
        const label = document.createElement('span');
        label.className = 'key-label';
        label.innerHTML = `<span class="key-octave">${info.octave}</span>`;
        key.appendChild(label);
      }
      els.keyboardInner.appendChild(key);
    }
    els.keyboardInner.style.width = `${pianoWidth}px`;
  }

  function maxKeyboardScroll() {
    return Math.max(0, els.keyboardInner.offsetWidth - els.keyboardViewport.clientWidth);
  }

  function setKeyboardScroll(value) {
    const max = maxKeyboardScroll();
    setLinkedScroll(max * Math.max(0, Math.min(100, value)) / 100);
  }

  function syncKeyboardRange(left = els.keyboardViewport.scrollLeft) {
    const max = maxKeyboardScroll();
    const clamped = Math.max(0, Math.min(max, Number.isFinite(left) ? left : els.keyboardViewport.scrollLeft));
    els.keyboardRange.value = max ? String(Math.round(clamped / max * 100)) : '0';
  }

  function setKeyState(midi) {
    els.keyboardInner.querySelectorAll('.is-pressed').forEach(k => k.classList.remove('is-pressed'));
    if (midi != null) {
      const key = els.keyboardInner.querySelector(`[data-midi="${midi}"]`);
      if (key) key.classList.add('is-pressed');
    }
  }

  function cancelHold() {
    clearTimeout(keyboardGesture.holdTimer);
    clearInterval(keyboardGesture.holdInterval);
    keyboardGesture.holdTimer = 0;
    keyboardGesture.holdInterval = 0;
  }

  function stopGestureVoice() {
    if (keyboardGesture.voice) {
      keyboardGesture.voice.stop();
      keyboardGesture.voice = null;
    }
  }

  function cancelGestureNote() {
    if (keyboardGesture.eventId == null) return;
    const idx = events.findIndex(ev => ev.id === keyboardGesture.eventId);
    if (idx >= 0) {
      events.splice(idx, 1);
      selectedId = (keyboardGesture.previousSelectedId != null && events.some(ev => ev.id === keyboardGesture.previousSelectedId))
        ? keyboardGesture.previousSelectedId
        : (events.length ? events[events.length - 1].id : null);
      renderScore();
      saveState();
    }
    keyboardGesture.eventId = null;
    keyboardGesture.previousSelectedId = null;
  }

  function armHold(eventId) {
    cancelHold();
    keyboardGesture.holdTimer = setTimeout(() => {
      changeDuration(1, eventId, true);
      showToast('長押しで音符を伸ばしています');
      keyboardGesture.holdInterval = setInterval(() => changeDuration(1, eventId, true), 330);
    }, 470);
  }

  function enterKeyboardKey(midi) {
    if (!Number.isFinite(midi) || midi === keyboardGesture.lastMidi) return;
    stopGestureVoice();
    keyboardGesture.lastMidi = midi;
    cancelHold();
    setKeyState(midi);
    keyboardGesture.voice = startSustainedVoice(midi);
    if (!recordMode) {
      keyboardGesture.eventId = null;
      return;
    }
    keyboardGesture.previousSelectedId = selectedId;
    const id = addNote(midi, { audition: false, skipStop: true });
    keyboardGesture.eventId = id;
    armHold(id);
  }

  function endKeyboardGesture(pointerId) {
    if (keyboardGesture.pointerId !== pointerId) return;
    setKeyState(null);
    resetKeyboardGesture();
  }

  els.keyboardViewport.addEventListener('pointerdown', e => {
    if (playing || keyboardGesture.pointerId != null) return;
    const midi = keyAtPoint(e.clientX, e.clientY);
    if (midi == null) return;

    keyboardGesture.pointerId = e.pointerId;
    keyboardGesture.startX = e.clientX;
    keyboardGesture.startScroll = els.keyboardViewport.scrollLeft;
    keyboardGesture.scrolling = false;
    keyboardGesture.audioReady = true;

    ensureAudioSync();
    enterKeyboardKey(midi);
  }, { passive: false });

  els.keyboardViewport.addEventListener('pointermove', e => {
    if (keyboardGesture.pointerId !== e.pointerId) return;
    e.preventDefault();
    const midi = keyAtPoint(e.clientX, e.clientY);

    if (midi == null && recordMode && keyboardGesture.eventId != null) {
      cancelHold();
      stopGestureVoice();
      setKeyState(null);
      cancelGestureNote();
      keyboardGesture.lastMidi = null;
      keyboardGesture.scrolling = false;
    }

    const dx = e.clientX - keyboardGesture.startX;
    if (pianoSwipeMode === 'scroll') {
      if (Math.abs(dx) > 7) keyboardGesture.scrolling = true;
      if (keyboardGesture.scrolling) {
        cancelHold();
        stopGestureVoice();
        setKeyState(null);
        setLinkedScroll(keyboardGesture.startScroll - dx);
      }
      return;
    }
    if (midi != null) {
      enterKeyboardKey(midi);
      try {
        if (audio && audio.ctx && audio.ctx.state === 'running') {
          if (keyboardGesture.voice) keyboardGesture.voice.stop();
          keyboardGesture.voice = startSustainedVoice(midi);
        }
      } catch (err) {}
    }
    else cancelHold();
  }, { passive: false });

  els.keyboardViewport.addEventListener('pointerup', e => endKeyboardGesture(e.pointerId));
  els.keyboardViewport.addEventListener('pointercancel', e => endKeyboardGesture(e.pointerId));
  els.keyboardViewport.addEventListener('pointerleave', e => {
    if (keyboardGesture.pointerId === e.pointerId) {
      if (recordMode && keyboardGesture.eventId != null) {
        cancelHold();
        stopGestureVoice();
        setKeyState(null);
        cancelGestureNote();
        keyboardGesture.lastMidi = null;
      }
      endKeyboardGesture(e.pointerId);
    }
  });

  document.addEventListener('pointerdown', () => {
    ensureAudioSync();
    unlockAudio().catch(() => {});
  }, { capture: true, passive: true, signal: __docSignal });

  els.recordBtn.addEventListener('click', () => {
    playButtonSound('record');
    recordMode = !recordMode;
    updateControls();
    saveState();
    showToast(recordMode ? '記録 ON' : '記録 OFF');
  });

  function clearComposition() {
    stopPlayback(false);
    events.length = 0; selectedId = null; nextId = 1;
    currentSongId = null; currentSongName = '';
    renderScore(); saveState(); els.scoreViewport.scrollTop = 0;
    showToast('全消去しました');
  }

  function bindPress(button, onTap, onLong, delay = 550) {
    let timer = 0, longFired = false, pointerId = null;
    button.addEventListener('pointerdown', e => {
      if (button.disabled || pointerId !== null) return;
      pointerId = e.pointerId;
      longFired = false;
      try { button.setPointerCapture(e.pointerId); } catch (_) {}
      ensureAudioSync();
      timer = setTimeout(() => {
        longFired = true;
        if (navigator.vibrate) navigator.vibrate(18);
        onLong(e);
      }, delay);
    });
    const finish = e => {
      if (pointerId !== e.pointerId) return;
      clearTimeout(timer);
      timer = 0;
      const shouldTap = !longFired && !button.disabled;
      pointerId = null;
      if (shouldTap) onTap(e);
    };
    const cancel = e => {
      if (pointerId !== e.pointerId) return;
      clearTimeout(timer);
      timer = 0;
      pointerId = null;
    };
    button.addEventListener('pointerup', finish);
    button.addEventListener('pointercancel', cancel);
  }

  function syncSettingsUI() {
    els.swipePlay.checked = pianoSwipeMode === 'play';
    els.swipeScroll.checked = pianoSwipeMode === 'scroll';
    els.noteLengthRange.value = String(currentUnitSeconds);
    els.noteLengthValue.textContent = `${currentUnitSeconds.toFixed(2)}秒`;
    els.randomLengthRange.value = String(randomPhraseLength);
    els.randomLengthValue.textContent = `${randomPhraseLength}音`;
  }

  bindPress(els.playBtn,
    () => { startPlayback(false); },
    () => {
      if (playing) {
        stopPlayback(false);
        setTimeout(() => startPlayback(true), 520);
      } else {
        startPlayback(true);
      }
    }, 650);

  bindPress(els.deleteBtn,
    () => { playButtonSound('delete'); deleteSelected(); },
    () => openConfirm('楽譜を全消去', '現在の音符と休符をすべて消去しますか？保存済みの楽曲は削除されません。', '全消去', clearComposition));
  bindPress(els.randomBtn,
    () => { playButtonSound('random'); showToast('長押しでランダムフレーズを生成します'); },
    () => { generateRandomPhrase(); }, 700);

  bindPress(els.centerBtn,
    () => { playButtonSound('center'); centerSelectedEvent(); },
    () => {
      playButtonSound('center');
      if (!events.length) { showToast('音符がありません'); return; }
      selectedId = events[events.length - 1].id;
      renderScore({ preserve: false });
      saveState();
      centerOnEvent(selectedId, true);
    }, 500);

  function bindDpadAction(button, onAction, delay = 480, interval = 120) {
    let longTimer = 0, repeatTimer = 0, pointerId = null, longFired = false;

    const clearTimers = () => {
      clearTimeout(longTimer);
      clearInterval(repeatTimer);
      longTimer = 0;
      repeatTimer = 0;
    };

    button.addEventListener('pointerdown', e => {
      if (button.disabled || pointerId !== null) return;
      pointerId = e.pointerId;
      longFired = false;
      try { button.setPointerCapture(e.pointerId); } catch (_) {}
      ensureAudioSync();

      longTimer = setTimeout(() => {
        longFired = true;
        if (navigator.vibrate) navigator.vibrate(18);
        repeatTimer = setInterval(() => {
          if (!button.disabled) {
            onAction();
          } else {
            clearInterval(repeatTimer);
            repeatTimer = 0;
          }
        }, interval);
      }, delay);
    });

    const finishTap = e => {
      if (pointerId !== e.pointerId) return;
      clearTimers();
      if (!longFired && !button.disabled) onAction();
      pointerId = null;
    };

    const cancelNoTap = e => {
      if (pointerId !== e.pointerId) return;
      clearTimers();
      pointerId = null;
    };

    button.addEventListener('pointerup', finishTap);
    button.addEventListener('pointercancel', cancelNoTap);
  }

  function bindDpadNoteNav(button, direction) {
    let longTimer = 0, repeatTimer = 0, pointerId = null, longFired = false;

    const clearTimers = () => {
      clearTimeout(longTimer);
      clearInterval(repeatTimer);
      longTimer = 0;
      repeatTimer = 0;
    };

    const performLongAction = () => {
      const ev = events.find(item => item.id === selectedId);
      if (!ev) return;
      changeDuration(direction, ev.id, true, false);
      if (ev.type === 'note') playPreview(ev.midi);
    };

    const performTapNavigation = () => {
      const idx = selectedIndex();
      if (idx < 0) return;
      const targetIdx = findAdjacentNote(idx, direction);
      let target;
      if (targetIdx < 0) {
        const noteIndices = events.map((e, i) => e.type === 'note' ? i : -1).filter(i => i >= 0);
        if (!noteIndices.length) { showToast('音符がありません'); return; }
        target = events[direction < 0 ? noteIndices[noteIndices.length - 1] : noteIndices[0]];
      } else {
        target = events[targetIdx];
      }
      selectedId = target.id;
      renderScore({ preserve: false });
      saveState();
      playPreview(target.midi);
      requestAnimationFrame(() => centerOnEvent(target.id, true));
    };

    button.addEventListener('pointerdown', e => {
      if (button.disabled || pointerId !== null) return;
      pointerId = e.pointerId;
      longFired = false;
      try { button.setPointerCapture(e.pointerId); } catch (_) {}
      ensureAudioSync();

      longTimer = setTimeout(() => {
        longFired = true;
        if (navigator.vibrate) navigator.vibrate(18);
        performLongAction();
        repeatTimer = setInterval(() => {
          if (!button.disabled) {
            performLongAction();
          } else {
            clearInterval(repeatTimer);
            repeatTimer = 0;
          }
        }, 330);
      }, 470);
    });

    const finishTap = e => {
      if (pointerId !== e.pointerId) return;
      clearTimers();
      if (!longFired && !button.disabled) performTapNavigation();
      pointerId = null;
    };

    const cancelNoTap = e => {
      if (pointerId !== e.pointerId) return;
      clearTimers();
      pointerId = null;
    };

    button.addEventListener('pointerup', finishTap);
    button.addEventListener('pointercancel', cancelNoTap);
  }

  bindDpadAction(els.pitchDownBtn, () => changePitch(-1));
  bindDpadAction(els.pitchUpBtn, () => changePitch(1));
  bindDpadNoteNav(els.shortenBtn, -1);
  bindDpadNoteNav(els.extendBtn, 1);

  (function setupRestHold() {
    let active = false;
    let duration = 1;
    let timer = 0;
    let interval = 0;
    let activeEventId = null;
    let activePointerId = null;
    const start = (e) => {
      if (els.restBtn.disabled || active) return;
      active = true;
      activePointerId = e.pointerId;
      duration = 1;

      playButtonSound('rest');

      activeEventId = addRest(1, true);
      timer = setTimeout(() => {
        interval = setInterval(() => {
          duration = Math.min(16, duration + 1);
          if (activeEventId) {
            changeDuration(1, activeEventId, true);
          }
          showToast(`休符の長さ ${duration}`);
        }, 380);
      }, 420);
    };
    const cleanup = (e) => {
      if (e && activePointerId !== null && e.pointerId !== activePointerId) return;
      clearTimeout(timer);
      clearInterval(interval);
      active = false;
      activeEventId = null;
      activePointerId = null;
    };
    els.restBtn.addEventListener('pointerdown', start);
    els.restBtn.addEventListener('pointerup', (e) => {
      cleanup(e);
    });
    els.restBtn.addEventListener('pointercancel', cleanup);
    els.restBtn.addEventListener('pointerleave', cleanup);
    els.restBtn.addEventListener('click', e => {
      e.preventDefault();
      activePointerId = null;
      if (!els.restBtn.disabled && !active) addRest(1);
    });
  })();

  function shiftAllNotes(offset) {
    const targetNotes = events.filter(ev => ev.type === 'note');
    if (!targetNotes.length) { showToast('音符がありません'); return; }
    const canShift = targetNotes.every(ev => {
      const next = ev.midi + offset * 12;
      return next >= FIRST_MIDI && next < FIRST_MIDI + PITCH_COUNT;
    });
    if (!canShift) {
      showToast('これ以上オクターブを変更できません');
      return;
    }
    targetNotes.forEach(ev => { ev.midi += offset * 12; });
    renderScore({ preserve: false });
    saveState();
    showToast(offset > 0 ? '1オクターブ上げました' : '1オクターブ下げました');
  }

  bindPress(els.keyLeft,
    () => { setLinkedScroll(els.keyboardViewport.scrollLeft - whiteKeyW() * 7); },
    () => { shiftAllNotes(-1); },
    480);
  bindPress(els.keyRight,
    () => { setLinkedScroll(els.keyboardViewport.scrollLeft + whiteKeyW() * 7); },
    () => { shiftAllNotes(1); },
    480);

  document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
  els.swipePlay.addEventListener('change', () => {
    if (!els.swipePlay.checked) return;
    pianoSwipeMode = 'play'; saveState();
  });
  els.swipeScroll.addEventListener('change', () => {
    if (!els.swipeScroll.checked) return;
    pianoSwipeMode = 'scroll'; saveState();
  });
  els.noteLengthRange.addEventListener('input', () => {
    currentUnitSeconds = Math.max(.12, Math.min(1, Number(els.noteLengthRange.value) || DEFAULT_UNIT_SECONDS));
    els.noteLengthValue.textContent = `${currentUnitSeconds.toFixed(2)}秒`;
    saveState();
  });
  els.randomLengthRange.addEventListener('input', () => {
    randomPhraseLength = Math.max(12, Math.min(100, Number(els.randomLengthRange.value) || 12));
    els.randomLengthValue.textContent = `${randomPhraseLength}音`;
    saveState();
  });

  els.saveSongBtn.addEventListener('click', saveCurrentSong);
  els.exportBtn.addEventListener('click', () => {
    const payload = {
      format: 'kantan-sakkyoku-v1',
      exportedAt: new Date().toISOString(),
      current: { name: currentSongName, events: serializeEvents(), unitSeconds: currentUnitSeconds },
      songs
    };
    const json = '\uFEFF' + JSON.stringify(payload, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kantan_sakkyoku_backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    showToast('エクスポートしました');
  });

  els.importBtn.addEventListener('click', () => els.importFileInput.click());
  els.importFileInput.addEventListener('change', handleImportFile);

  function handleImportFile(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const rawText = reader.result;
        const jsonText = rawText.replace(/^\uFEFF/, '');
        const data = JSON.parse(jsonText);
        if (!data || !Array.isArray(data.songs)) throw new Error('invalid');
        const importedSongs = data.songs.filter(s => s && Array.isArray(s.events)).map(s => ({
          id: s.id || `song-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
          name: s.name || '無題の曲',
          events: s.events.filter(ev => ev && (ev.type === 'note' || ev.type === 'rest')).map(ev => ({
            type: ev.type,
            midi: ev.type === 'note' ? Math.floor(Number(ev.midi)) : undefined,
            duration: Math.max(1, Math.floor(Number(ev.duration) || 1))
          })).filter(ev => ev.type !== 'note' || (ev.midi >= FIRST_MIDI && ev.midi < FIRST_MIDI + PITCH_COUNT)),
          unitSeconds: Math.max(.12, Math.min(1, Number(s.unitSeconds) || DEFAULT_UNIT_SECONDS)),
          updatedAt: s.updatedAt || Date.now()
        }));
        openConfirm('楽曲をインポート', `「${file.name}」から${importedSongs.length}曲を読み込み、現在の楽曲ライブラリを置き換えますか？`, 'インポート', () => {
          songs = importedSongs;
          saveSongs();
          if (data.current && Array.isArray(data.current.events)) {
            events = sanitizeLoaded(data.current.events);
            selectedId = events.length ? events[events.length - 1].id : null;
            currentSongId = data.current.id || null;
            currentSongName = data.current.name || '';
            currentUnitSeconds = Math.max(.12, Math.min(1, Number(data.current.unitSeconds) || DEFAULT_UNIT_SECONDS));
            syncSettingsUI();
            renderScore({ preserve: false });
          }
          renderSongList();
          showToast('インポートしました');
        });
      } catch (_) {
        showToast('インポートできませんでした');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  els.modalCancel.addEventListener('click', closeConfirm);
  els.modalConfirm.addEventListener('click', () => {
    const action = modalAction;
    closeConfirm();
    if (action) action();
  });
  els.confirmModal.addEventListener('pointerdown', e => { if (e.target === els.confirmModal) closeConfirm(); });

  els.keyboardRange.addEventListener('input', () => setKeyboardScroll(Number(els.keyboardRange.value)));

  let scrollSyncRaf = 0;
  let pendingScrollSource = null;
  function scheduleScrollSync(source) {
    pendingScrollSource = source;
    if (scrollSyncRaf) return;
    scrollSyncRaf = requestAnimationFrame(() => {
      scrollSyncRaf = 0;
      if (pendingScrollSource === 'keyboard') {
        const left = els.keyboardViewport.scrollLeft;
        if (!suppressScrollSync && Math.abs(els.scoreViewport.scrollLeft - left) > 0.5) els.scoreViewport.scrollLeft = left;
      } else if (pendingScrollSource === 'score') {
        const left = els.scoreViewport.scrollLeft;
        if (!suppressScrollSync && Math.abs(els.keyboardViewport.scrollLeft - left) > 0.5) els.keyboardViewport.scrollLeft = left;
      }
      pendingScrollSource = null;
      syncKeyboardRange();
      updateEdgeIndicators();
    });
  }
  els.keyboardViewport.addEventListener('scroll', () => scheduleScrollSync('keyboard'), { passive: true });
  els.scoreViewport.addEventListener('scroll', () => scheduleScrollSync('score'), { passive: true });

  const preventDefault = e => e.preventDefault();
  document.addEventListener('gesturestart', preventDefault, { passive: false, signal: __docSignal });
  document.addEventListener('gesturechange', preventDefault, { passive: false, signal: __docSignal });
  document.addEventListener('gestureend', preventDefault, { passive: false, signal: __docSignal });
  document.addEventListener('selectstart', preventDefault, { passive: false, signal: __docSignal });
  document.addEventListener('dragstart', preventDefault, { passive: false, signal: __docSignal });
  document.addEventListener('contextmenu', preventDefault, { passive: false, signal: __docSignal });
  document.addEventListener('touchmove', e => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false, signal: __docSignal });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopPlayback(false);
    } else {
      ensureAudioSync();
      if (audio && audio.ctx) {
        const ctx = audio.ctx;
        if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
          ctx.resume().catch(() => {});
        }
      }
    }
  }, { signal: __docSignal });

  function doResize() {
    setupRuler();
    const currentLeft = els.scoreViewport.scrollLeft;
    renderKeyboard();
    renderScore({ preserve: false });
    setLinkedScroll(currentLeft);
    updateEdgeIndicators();
  }

  window.addEventListener('resize', () => {
    if (playing || activeZoom || overviewState) {
      setTimeout(() => {
        if (!playing && !activeZoom && !overviewState) doResize();
      }, 120);
    } else {
      doResize();
    }
  }, { signal: __docSignal });

  loadState();
  loadSongs();
  setupRuler();
  els.songNameInput.value = currentSongName;
  syncSettingsUI();
  renderKeyboard();
  renderScore({ preserve: false });
  updateControls();
  requestAnimationFrame(() => {
    const initial = 28;
    els.keyboardRange.value = String(initial);
    setKeyboardScroll(initial);
    const c4 = geometryFor(60);
    const desiredPitch = c4.left - els.scoreViewport.clientWidth * .28;
    setLinkedScroll(Math.max(0, desiredPitch));
    if (selectedId) ensureEventVisible(selectedId);
  });
})();
</script>
</body>
</html>
