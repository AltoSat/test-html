<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1018">
<title>かんたん作曲 - レイアウト試作品</title>
<style>
  /* ============================================================
     CSS変数（元のアプリと同じ）
     ============================================================ */
  :root {
    --bg: #090d14;
    --surface: #111824;
    --surface-2: #172131;
    --ink: #f5f8ff;
    --muted: #98a8bd;
    --accent: #53d7ff;
    --danger: #ff5573;
    --row-h: 44px;
    --tab-h: 56px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }

  /* ============================================================
     html/body（safe-area下まで背景を覆う）
     ============================================================ */
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* body::before で safe-area 下まで背景を描画 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: calc(100dvh + env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 50% -20%, rgba(83,215,255,.13), transparent 34%),
      var(--bg);
    z-index: 0;
    pointer-events: none;
  }

  /* ============================================================
     #app（黒帯対策: absolute + min-height）
     ============================================================ */
  #app {
    position: absolute;
    top: 0; left: 0; right: 0;
    min-height: calc(100dvh + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 1;
  }

  /* ============================================================
     ヘッダー（ステータスバー下から開始）
     ============================================================ */
  .app-header {
    flex: none;
    padding-top: env(safe-area-inset-top);
    padding-left: 16px; padding-right: 16px;
    height: calc(44px + env(safe-area-inset-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(9,13,20,.72);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(187,207,235,.12);
    position: relative;
    z-index: 50;
  }
  .app-header-title {
    font-size: 17px; font-weight: 700;
    letter-spacing: .01em;
    position: absolute;
    left: 50%; transform: translateX(-50%);
  }
  .header-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08);
    color: var(--accent);
    font-size: 18px;
    display: grid; place-items: center;
  }

  /* ============================================================
     楽譜エリア
     ============================================================ */
  .score-area {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
    padding: 12px 16px;
  }
  .score-container {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 16px;
    min-height: 200px;
  }
  .staff-row {
    height: var(--row-h);
    border-bottom: 1px solid rgba(255,255,255,.10);
    display: flex; align-items: center;
    padding: 0 8px;
    font-size: 13px; color: var(--muted);
  }
  .staff-row:last-child { border-bottom: none; }
  .note {
    display: inline-block;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent);
    margin-right: 4px;
    box-shadow: 0 0 8px rgba(83,215,255,.4);
  }
  .rest {
    display: inline-block;
    width: 12px; height: 4px; border-radius: 2px;
    background: var(--muted);
    margin-right: 4px;
  }

  /* ============================================================
     キーボードエリア
     ============================================================ */
  .keyboard-area {
    flex: none;
    padding: 8px 12px;
    background: rgba(9,13,20,.60);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(187,207,235,.10);
  }
  .keyboard-row {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .key {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.12);
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    color: var(--ink);
    font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
    touch-action: manipulation;
    transition: transform .1s, background .1s;
  }
  .key:active {
    transform: scale(.92);
    background: linear-gradient(180deg, var(--accent), #3bbde0);
    color: #04141a;
  }

  /* ============================================================
     タブバー（元の3項目・元のスタイル + safe-bottom対応）
     ============================================================ */
  .bottom-tabs {
    flex: none;
    z-index: 60;
    min-height: var(--tab-h);
    /* 元: margin: 8px 10px 0; */
    margin: 8px 10px env(safe-area-inset-bottom);
    padding: 4px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: rgba(15,23,34,.78);
    -webkit-backdrop-filter: blur(22px);
    backdrop-filter: blur(22px);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.05);
  }
  .tab-btn {
    min-width: 0; border: 0; border-radius: 14px;
    background: transparent; color: #8fa0b5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px; font-size: 10px; font-weight: 700;
    touch-action: manipulation;
    transition: transform .18s ease, background .2s ease, color .2s ease;
    padding: 4px 0;
  }
  .tab-btn:active { transform: scale(.93); }
  .tab-btn.is-active {
    color: #04141a;
    background: linear-gradient(145deg, #aaf2ff, #53d7ff 55%, #3bbde0);
    box-shadow: 0 6px 18px rgba(83,215,255,.38), inset 0 1px rgba(255,255,255,.55);
  }
  .tab-ico { font-size: 20px; line-height: 1; }
  .tab-label { font-size: 10px; letter-spacing: .03em; }

  /* ============================================================
     可視化レイヤー（確認用）
     ============================================================ */
  .layer-safe-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    height: env(safe-area-inset-top);
    background: rgba(255,85,115,.35);
    border-bottom: 2px dashed var(--danger);
    pointer-events: none;
    display: flex; align-items: flex-end; justify-content: center;
    font-size: 10px; font-weight: 800; color: #fff;
    opacity: 0; transition: opacity .2s;
  }
  .layer-safe-bottom {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    height: env(safe-area-inset-bottom);
    background: rgba(83,215,255,.25);
    border-top: 2px dashed var(--accent);
    pointer-events: none;
    display: flex; align-items: flex-start; justify-content: center;
    font-size: 10px; font-weight: 800; color: #fff;
    opacity: 0; transition: opacity .2s;
  }
  .layer-black-detector {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9998;
    height: env(safe-area-inset-bottom);
    background: repeating-linear-gradient(
      45deg,
      rgba(255,0,0,.45), rgba(255,0,0,.45) 5px,
      rgba(255,255,0,.45) 5px, rgba(255,255,0,.45) 10px
    );
    pointer-events: none;
    opacity: 0; transition: opacity .2s;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }
  .show-layers .layer-safe-top,
  .show-layers .layer-safe-bottom,
  .show-layers .layer-black-detector { opacity: 1; }

  /* ============================================================
     デバッグパネル
     ============================================================ */
  .debug-btn {
    position: fixed;
    right: 14px;
    top: calc(14px + env(safe-area-inset-top));
    z-index: 9500;
    width: 44px; height: 44px; border-radius: 50%;
    border: 0;
    background: linear-gradient(180deg, #85e8ff, var(--accent));
    color: #06151b; font-size: 20px; font-weight: 900;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    display: grid; place-items: center;
    transition: transform .2s;
  }
  .debug-btn:active { transform: scale(.9); }

  .debug-panel {
    position: fixed;
    left: 10px; right: 10px;
    top: calc(env(safe-area-inset-top) + 60px);
    z-index: 9000;
    background: rgba(17,24,36,.96);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.6);
    backdrop-filter: blur(20px) saturate(1.2);
    max-height: 40vh;
    overflow-y: auto;
    transition: transform .35s ease, opacity .35s ease;
    transform: translateY(-120%);
    opacity: 0;
    pointer-events: none;
  }
  .debug-panel.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .debug-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
  .debug-row {
    display: flex; justify-content: space-between;
    padding: 6px 0; font-size: 12px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .debug-row:last-child { border-bottom: none; }
  .debug-label { color: var(--muted); }
  .debug-value { font-variant-numeric: tabular-nums; }
  .debug-close {
    position: absolute; right: 10px; top: 10px;
    width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.08); color: var(--ink);
    font-size: 14px; display: grid; place-items: center;
  }
  .debug-toggle {
    margin-top: 10px;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.06);
    color: #e2e8f0; border-radius: 10px;
    padding: 8px 12px; font-size: 12px; font-weight: 700;
    cursor: pointer; width: 100%;
  }
</style>
</head>
<body class="show-layers">

<!-- 可視化レイヤー -->
<div class="layer-safe-top">safe-top</div>
<div class="layer-safe-bottom">safe-bottom</div>
<div class="layer-black-detector">黒帯検出（見えたらNG）</div>

<div id="app">
  <!-- ヘッダー -->
  <header class="app-header">
    <button class="header-btn" type="button">&#x276E;</button>
    <div class="app-header-title">かんたん作曲</div>
    <button class="header-btn" type="button">&#x22EE;</button>
  </header>

  <!-- 楽譜エリア -->
  <section class="score-area" id="scoreArea">
    <div class="score-container" id="scoreContainer">
      <!-- ダミー楽譜行 -->
      <div class="staff-row">小節 1: <span class="note"></span><span class="note"></span><span class="rest"></span><span class="note"></span></div>
      <div class="staff-row">小節 2: <span class="rest"></span><span class="note"></span><span class="note"></span><span class="rest"></span></div>
      <div class="staff-row">小節 3: <span class="note"></span><span class="note"></span><span class="note"></span><span class="rest"></span></div>
      <div class="staff-row">小節 4: <span class="rest"></span><span class="rest"></span><span class="note"></span><span class="note"></span></div>
      <div class="staff-row">小節 5: <span class="note"></span><span class="rest"></span><span class="note"></span><span class="note"></span></div>
      <div class="staff-row">小節 6: <span class="note"></span><span class="note"></span><span class="rest"></span><span class="rest"></span></div>
      <div class="staff-row">小節 7: <span class="rest"></span><span class="note"></span><span class="note"></span><span class="note"></span></div>
      <div class="staff-row">小節 8: <span class="note"></span><span class="rest"></span><span class="rest"></span><span class="note"></span></div>
    </div>
  </section>

  <!-- キーボードエリア -->
  <section class="keyboard-area">
    <div class="keyboard-row">
      <button class="key">C</button>
      <button class="key">D</button>
      <button class="key">E</button>
      <button class="key">F</button>
      <button class="key">G</button>
      <button class="key">A</button>
      <button class="key">B</button>
      <button class="key">C</button>
    </div>
    <div class="keyboard-row">
      <button class="key">#</button>
      <button class="key">b</button>
      <button class="key">&#x266A;</button>
      <button class="key">&#x2669;</button>
      <button class="key">&#x1F50A;</button>
      <button class="key">&#x23EE;</button>
      <button class="key">&#x23EF;</button>
      <button class="key">&#x23ED;</button>
    </div>
  </section>

  <!-- タブバー -->
  <nav class="bottom-tabs" aria-label="画面切り替え">
    <button class="tab-btn is-active" type="button">
      <span class="tab-ico">&#x1F3B9;</span>
      <span class="tab-label">作曲</span>
    </button>
    <button class="tab-btn" type="button">
      <span class="tab-ico">&#x1F3B5;</span>
      <span class="tab-label">楽曲</span>
    </button>
    <button class="tab-btn" type="button">
      <span class="tab-ico">&#x2699;&#xFE0F;</span>
      <span class="tab-label">設定</span>
    </button>
  </nav>
</div>

<!-- デバッグ -->
<button class="debug-btn" id="debugBtn">&#x2699;&#xFE0F;</button>
<div class="debug-panel" id="debugPanel">
  <button class="debug-close" id="debugClose">&#x2715;</button>
  <div class="debug-title">レイアウト情報</div>
  <div class="debug-row"><span class="debug-label">safe-area-top</span><span class="debug-value" id="dTop">-</span></div>
  <div class="debug-row"><span class="debug-label">safe-area-bottom</span><span class="debug-value" id="dBottom">-</span></div>
  <div class="debug-row"><span class="debug-label">window.innerHeight</span><span class="debug-value" id="dHeight">-</span></div>
  <div class="debug-row"><span class="debug-label">100dvh</span><span class="debug-value" id="dDvh">-</span></div>
  <div class="debug-row"><span class="debug-label">#app bottom</span><span class="debug-value" id="dAppBottom">-</span></div>
  <div class="debug-row"><span class="debug-label">screen bottom</span><span class="debug-value" id="dScreen">-</span></div>
  <button class="debug-toggle" id="toggleLayers">可視化レイヤー ON/OFF</button>
</div>

<script>
(function() {
  'use strict';

  // デバッグパネル
  const debugBtn = document.getElementById('debugBtn');
  const debugPanel = document.getElementById('debugPanel');
  const debugClose = document.getElementById('debugClose');
  const toggleLayers = document.getElementById('toggleLayers');

  debugBtn.addEventListener('click', () => debugPanel.classList.add('open'));
  debugClose.addEventListener('click', () => debugPanel.classList.remove('open'));
  toggleLayers.addEventListener('click', () => document.body.classList.toggle('show-layers'));

  // タブ切り替え（見た目のみ）
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
    });
  });

  // キーボードタップで音符追加（ダミー機能）
  document.querySelectorAll('.key').forEach(key => {
    key.addEventListener('click', () => {
      const container = document.getElementById('scoreContainer');
      const lastRow = container.querySelector('.staff-row:last-child');
      if (lastRow) {
        const note = document.createElement('span');
        note.className = 'note';
        lastRow.appendChild(note);
      }
    });
  });

  // メトリクス読み取り
  function readMetrics() {
    function getEnv(name) {
      const div = document.createElement('div');
      div.style.paddingBottom = 'env(' + name + ')';
      document.body.appendChild(div);
      const val = getComputedStyle(div).paddingBottom;
      document.body.removeChild(div);
      return val;
    }
    document.getElementById('dTop').textContent = getEnv('safe-area-inset-top');
    document.getElementById('dBottom').textContent = getEnv('safe-area-inset-bottom');
    document.getElementById('dHeight').textContent = window.innerHeight + 'px';
    document.getElementById('dScreen').textContent = window.innerHeight + 'px';

    const testDvh = document.createElement('div');
    testDvh.style.height = '100dvh';
    testDvh.style.position = 'absolute';
    testDvh.style.visibility = 'hidden';
    document.body.appendChild(testDvh);
    document.getElementById('dDvh').textContent = testDvh.offsetHeight + 'px';
    document.body.removeChild(testDvh);

    const app = document.getElementById('app');
    if (app) {
      const rect = app.getBoundingClientRect();
      document.getElementById('dAppBottom').textContent = Math.round(rect.bottom) + 'px';
    }
  }
  readMetrics();
  window.addEventListener('resize', readMetrics);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', readMetrics);
})();
</script>
</body>
</html>
