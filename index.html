<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>iPhone 17 Pro PWA 端タッチ検証</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  :root {
    --bg: #0a0f1a;
    --surface: #111827;
    --ink: #f0f4f8;
    --muted: #94a3b8;
    --accent: #2563eb;
    --accent-active: #60a5fa;
    --accent-weak: rgba(37, 99, 235, 0.15);
    --line: rgba(148, 163, 184, 0.2);
    --danger: #ef4444;
    --success: #22c55e;
  }

  html, body {
    height: 100%;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    touch-action: manipulation;
  }

  /* 中央情報パネル */
  .info-panel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(86vw, 380px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    z-index: 10;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .info-panel h1 {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--ink);
    letter-spacing: 0.02em;
  }

  .log-box {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 14px;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .log-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .log-value {
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent-active);
    word-break: break-all;
  }

  .debug-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    text-align: left;
    margin-bottom: 14px;
  }

  .debug-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .debug-item.fullwidth {
    grid-column: 1 / -1;
  }

  .debug-key {
    font-size: 0.7rem;
    color: var(--muted);
    display: block;
    margin-bottom: 2px;
    letter-spacing: 0.04em;
  }

  .debug-val {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .reset-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--danger);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }

  .reset-btn:active {
    filter: brightness(1.15);
    transform: scale(0.98);
  }

  /* 端ボタン共通 */
  .edge-btn {
    position: fixed;
    width: 44vw;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 0.08s ease, transform 0.05s ease;
    z-index: 20;
    line-height: 1.3;
  }

  .edge-btn:active,
  .edge-btn.active {
    background: var(--accent-active);
    transform: scale(0.98);
  }

  .edge-btn .label {
    font-size: 0.8rem;
    opacity: 0.95;
    letter-spacing: 0.02em;
  }

  .edge-btn .count {
    font-size: 1.3rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  /* 上端ボタン */
  .btn-top-left {
    top: 0;
    left: 0;
    border-bottom-right-radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(72px + env(safe-area-inset-top, 0px));
  }

  .btn-top-right {
    top: 0;
    right: 0;
    border-bottom-left-radius: 14px;
    padding-top: env(safe-area-inset-top, 0px);
    height: calc(72px + env(safe-area-inset-top, 0px));
  }

  /* 下端ボタン: bottom:0 に完全密着、safe-area は padding で吸収 */
  .btn-bottom-left {
    bottom: 0;
    left: 0;
    border-top-right-radius: 14px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    height: calc(72px + env(safe-area-inset-bottom, 0px));
  }

  .btn-bottom-right {
    bottom: 0;
    right: 0;
    border-top-left-radius: 14px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    height: calc(72px + env(safe-area-inset-bottom, 0px));
  }

  /* 端マーカー */
  .corner-marker {
    position: fixed;
    width: 14px;
    height: 14px;
    z-index: 25;
    pointer-events: none;
    opacity: 0.6;
  }

  .corner-marker::before,
  .corner-marker::after {
    content: "";
    position: absolute;
    background: var(--success);
  }

  .marker-tl { top: 0; left: 0; }
  .marker-tl::before { top: 0; left: 0; width: 100%; height: 2px; }
  .marker-tl::after { top: 0; left: 0; width: 2px; height: 100%; }

  .marker-tr { top: 0; right: 0; }
  .marker-tr::before { top: 0; right: 0; width: 100%; height: 2px; }
  .marker-tr::after { top: 0; right: 0; width: 2px; height: 100%; }

  .marker-bl { bottom: 0; left: 0; }
  .marker-bl::before { bottom: 0; left: 0; width: 100%; height: 2px; }
  .marker-bl::after { bottom: 0; left: 0; width: 2px; height: 100%; }

  .marker-br { bottom: 0; right: 0; }
  .marker-br::before { bottom: 0; right: 0; width: 100%; height: 2px; }
  .marker-br::after { bottom: 0; right: 0; width: 2px; height: 100%; }

  /* ガイドライン */
  .guide-line {
    position: fixed;
    background: var(--line);
    z-index: 5;
    pointer-events: none;
  }

  .guide-h-top {
    top: calc(72px + env(safe-area-inset-top, 0px));
    left: 0; right: 0;
    height: 1px;
  }

  .guide-h-bottom {
    bottom: calc(72px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    height: 1px;
  }

  .guide-v-center {
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

  <!-- 端マーカー -->
  <div class="corner-marker marker-tl"></div>
  <div class="corner-marker marker-tr"></div>
  <div class="corner-marker marker-bl"></div>
  <div class="corner-marker marker-br"></div>

  <!-- ガイドライン -->
  <div class="guide-line guide-h-top"></div>
  <div class="guide-line guide-h-bottom"></div>
  <div class="guide-line guide-v-center"></div>

  <!-- 中央情報パネル -->
  <div class="info-panel">
    <h1>端タッチ検証</h1>

    <div class="log-box">
      <span class="log-label">最後の反応</span>
      <span class="log-value" id="lastLog"></span>
    </div>

    <div class="debug-grid">
      <div class="debug-item fullwidth">
        <span class="debug-key">Viewport (px)</span>
        <span class="debug-val" id="vpSize">—</span>
      </div>
      <div class="debug-item">
        <span class="debug-key">safe-area-inset-top</span>
        <span class="debug-val" id="insetTop">—</span>
      </div>
      <div class="debug-item">
        <span class="debug-key">safe-area-inset-bottom</span>
        <span class="debug-val" id="insetBottom">—</span>
      </div>
      <div class="debug-item fullwidth">
        <span class="debug-key">devicePixelRatio</span>
        <span class="debug-val" id="dpr">—</span>
      </div>
    </div>

    <button class="reset-btn" id="resetBtn" type="button">カウントリセット</button>
  </div>

  <!-- 上左 -->
  <button class="edge-btn btn-top-left" id="btnTL" type="button">
    <span class="label">上左</span>
    <span class="count" id="countTL">0</span>
  </button>

  <!-- 上右 -->
  <button class="edge-btn btn-top-right" id="btnTR" type="button">
    <span class="label">上右</span>
    <span class="count" id="countTR">0</span>
  </button>

  <!-- 下左 -->
  <button class="edge-btn btn-bottom-left" id="btnBL" type="button">
    <span class="label">下左</span>
    <span class="count" id="countBL">0</span>
  </button>

  <!-- 下右 -->
  <button class="edge-btn btn-bottom-right" id="btnBR" type="button">
    <span class="label">下右</span>
    <span class="count" id="countBR">0</span>
  </button>

<script>
(function() {
  "use strict";

  const counts = {
    TL: 0,
    TR: 0,
    BL: 0,
    BR: 0
  };

  const labels = {
    TL: "上左",
    TR: "上右",
    BL: "下左",
    BR: "下右"
  };

  const els = {
    TL: document.getElementById("btnTL"),
    TR: document.getElementById("btnTR"),
    BL: document.getElementById("btnBL"),
    BR: document.getElementById("btnBR"),
    countTL: document.getElementById("countTL"),
    countTR: document.getElementById("countTR"),
    countBL: document.getElementById("countBL"),
    countBR: document.getElementById("countBR"),
    lastLog: document.getElementById("lastLog"),
    vpSize: document.getElementById("vpSize"),
    insetTop: document.getElementById("insetTop"),
    insetBottom: document.getElementById("insetBottom"),
    dpr: document.getElementById("dpr"),
    resetBtn: document.getElementById("resetBtn")
  };

  function vibrate() {
    if (navigator.vibrate) {
      navigator.vibrate(12);
    }
  }

  function readEnv(name) {
    const probe = document.createElement("div");
    probe.style.position = "fixed";
    probe.style.left = "0";
    probe.style.top = "0";
    probe.style.visibility = "hidden";
    probe.style.paddingTop = "env(" + name + ", 0px)";
    document.body.appendChild(probe);
    const val = getComputedStyle(probe).paddingTop;
    document.body.removeChild(probe);
    return val;
  }

  function updateDebug() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    els.vpSize.textContent = w + " x " + h;
    els.dpr.textContent = window.devicePixelRatio || 1;

    els.insetTop.textContent = readEnv("safe-area-inset-top");
    els.insetBottom.textContent = readEnv("safe-area-inset-bottom");
  }

  function log(key) {
    const now = new Date();
    const timeStr = now.toLocaleTimeString("ja-JP", { hour12: false }) +
                    "." + String(now.getMilliseconds()).padStart(3, "0");
    els.lastLog.textContent = labels[key] + " （" + timeStr + "）";
  }

  function flash(btn) {
    btn.classList.add("active");
    setTimeout(() => btn.classList.remove("active"), 120);
  }

  function handleTap(key) {
    counts[key]++;
    document.getElementById("count" + key).textContent = counts[key];
    log(key);
    vibrate();
    flash(els[key]);
  }

  ["TL", "TR", "BL", "BR"].forEach(function(key) {
    const btn = els[key];
    btn.addEventListener("touchstart", function(e) {
      e.preventDefault();
      handleTap(key);
    }, { passive: false });
    btn.addEventListener("click", function() {
      handleTap(key);
    });
  });

  els.resetBtn.addEventListener("click", function() {
    ["TL", "TR", "BL", "BR"].forEach(function(k) {
      counts[k] = 0;
    });
    els.countTL.textContent = "0";
    els.countTR.textContent = "0";
    els.countBL.textContent = "0";
    els.countBR.textContent = "0";
    els.lastLog.textContent = "—";
    vibrate();
  });

  window.addEventListener("resize", updateDebug);
  window.addEventListener("orientationchange", updateDebug);
  updateDebug();
})();
</script>
</body>
</html>
