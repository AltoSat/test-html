<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Multi PWA Previewer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --surface:#0c0c0e;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --line:#38383c;
  --radius:14px;
  --radius-lg:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Noto Sans JP","Helvetica Neue",sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:var(--panel2);border-radius:var(--radius);min-height:44px;padding:0 14px;font-weight:600;cursor:pointer}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button:active{transform:scale(.97);opacity:.85}

.app{height:100%;display:flex;flex-direction:column}

header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
  background:linear-gradient(180deg,rgba(28,28,30,.6),rgba(28,28,30,.2) 60%,rgba(0,0,0,0))
}
h1{font-size:18px;margin:0;font-weight:700}

.layout{flex:1;display:flex;overflow:hidden}

/* Sidebar */
.sidebar{
  width:270px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden
}
.sidebar-header{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex:0 0 auto
}
.sidebar-search{
  flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:10px;
  background:#111113;padding:0 10px;color:var(--text);outline:none;font-size:13px
}
.sidebar-search:focus{border-color:var(--accent)}
.sidebar .new-btn{
  min-height:36px;padding:0 12px;font-size:13px;white-space:nowrap;background:var(--accent)
}
.file-list{
  flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px
}
.file-item{
  position:relative;background:var(--panel);border:1px solid transparent;border-radius:var(--radius);
  padding:10px 12px;cursor:pointer;transition:background .15s,border-color .15s
}
.file-item:hover,.file-item.active{background:var(--panel2)}
.file-item.active{border-color:var(--accent)}
.file-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px}
.file-meta{font-size:11px;color:var(--muted);margin-top:2px}
.file-delete{
  position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:0;
  background:var(--danger);color:#fff;font-size:12px;padding:0;display:none;align-items:center;
  justify-content:center;min-height:auto;cursor:pointer
}
.file-item:hover .file-delete,.file-item.active .file-delete{display:flex}
.empty-state{text-align:center;color:var(--muted);padding:30px 14px;font-size:13px}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.main-toolbar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  flex:0 0 auto;flex-wrap:wrap
}
.file-name-input{
  flex:1 1 160px;min-width:0;background:transparent;border:1px solid transparent;border-radius:10px;
  padding:6px 10px;font-size:16px;font-weight:700;color:var(--text);outline:none
}
.file-name-input:focus{background:#111113;border-color:var(--accent)}
.seg-control{
  display:inline-flex;background:var(--panel);border-radius:10px;padding:2px;flex:0 0 auto
}
.seg-btn{
  border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap
}
.seg-btn.active{background:#3a3a3c;color:#fff}
.main-actions{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
.main-actions button{min-height:36px;padding:0 12px;font-size:13px}

/* Tab panels */
.main-body{flex:1;overflow:hidden;position:relative}
.tab-panel{
  position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden
}
.tab-panel.active{display:flex}

/* Editor */
.editor-tools{
  display:flex;align-items:center;gap:8px;padding:10px 14px 0;flex:0 0 auto;flex-wrap:wrap
}
#charCount{font-size:13px;color:var(--muted);white-space:nowrap;min-width:70px}
.search-box{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.search-box input{
  flex:1;height:36px;border:1px solid var(--line);border-radius:10px;background:#111113;
  color:var(--text);padding:0 10px;outline:none;font-size:13px;min-width:0
}
.search-box input:focus{border-color:var(--accent)}
#searchResult{font-size:11px;color:var(--muted);white-space:nowrap}
.editor-tools button{min-height:36px;padding:0 12px;font-size:13px}
.status{font-size:12px;color:var(--muted);padding:2px 14px 6px;min-height:18px;flex:0 0 auto}
textarea{
  flex:1;width:100%;resize:none;background:#111113;color:var(--text);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:14px;outline:none;
  font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;margin:0 14px 14px;width:calc(100% - 28px)
}
textarea:focus{border-color:var(--accent)}

/* Preview */
.preview-toolbar{
  display:flex;align-items:center;gap:8px;padding:10px 14px;flex:0 0 auto
}
.preview-stage{
  flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:10px 14px 20px
}
.device-scaler{
  transform-origin:top center;display:inline-block;line-height:0;position:relative
}

/* iPhone 17 Pro */
.iphone-device{
  position:relative;width:413px;height:872px;background:#000;border-radius:48px;
  padding:10px;box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06)
}
.iphone-screen-wrap{width:100%;height:100%;background:#000;border-radius:38px;overflow:hidden;position:relative}
.iphone-device iframe{width:100%;height:100%;border:0;background:#000}
.island{
  position:absolute;z-index:10;top:11px;left:50%;transform:translateX(-50%);
  width:126px;height:37px;background:#000;border-radius:22px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.04)
}
.homebar{
  position:absolute;z-index:10;bottom:10px;left:50%;transform:translateX(-50%);
  width:125px;height:5px;border-radius:5px;background:#fff;pointer-events:none;opacity:.92
}

/* iPad 7th gen landscape */
.ipad-device{
  position:relative;width:1128px;height:858px;background:#000;border-radius:32px;
  padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.06)
}
.ipad-screen-wrap{width:100%;height:100%;background:#000;border-radius:6px;overflow:hidden;position:relative}
.ipad-device iframe{width:100%;height:100%;border:0;background:#000}
.ipad-camera{
  position:absolute;z-index:10;top:11px;left:50%;transform:translateX(-50%);
  width:9px;height:9px;background:#1a1a1a;border:1px solid #333;border-radius:50%;pointer-events:none
}
.ipad-home{
  position:absolute;z-index:10;bottom:11px;left:50%;transform:translateX(-50%);
  width:36px;height:36px;border:2px solid #333;border-radius:50%;pointer-events:none
}

.phone-label{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}

/* Fullscreen */
.fullscreen{
  position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column
}
.fullscreen.show{display:flex}
.fullscreen iframe{flex:1;width:100%;border:0;background:#000}
.fullscreen .exit{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));right:14px;
  width:44px;height:44px;padding:0;border-radius:50%;background:rgba(60,60,65,.6);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:20px
}
.fullscreen .fs-label{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));left:14px;
  background:rgba(60,60,65,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600
}

/* Responsive */
@media (max-width:800px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;max-height:38vh;border-right:none;border-bottom:1px solid var(--line)}
  .file-list{flex-direction:row;overflow-x:auto;gap:8px;padding:10px}
  .file-item{flex:0 0 auto;width:160px}
  .main-actions{margin-left:0}
  .main-toolbar{padding:8px}
  textarea{margin:0 8px 8px;width:calc(100% - 16px)}
}
@media (max-width:560px){
  h1{font-size:16px}
  .seg-btn{padding:6px 10px;font-size:12px}
  .main-actions button{padding:0 10px;font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Multi PWA Previewer</h1>
    <span style="font-size:12px;color:var(--muted)">iPhone 17 Pro / iPad 第7世代</span>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <input id="listSearch" class="sidebar-search" type="search" placeholder="ファイルを検索" autocomplete="off" autocorrect="off">
        <button id="addFileBtn" class="new-btn">＋ 新規</button>
      </div>
      <div id="fileList" class="file-list"></div>
    </aside>

    <main class="main">
      <div class="main-toolbar">
        <input id="fileName" class="file-name-input" type="text" placeholder="ファイル名" autocomplete="off">
        <div class="seg-control">
          <button class="seg-btn active" data-tab="edit">編集</button>
          <button class="seg-btn" data-tab="iphone">iPhone</button>
          <button class="seg-btn" data-tab="ipad">iPad</button>
        </div>
        <div class="main-actions">
          <button id="dupFileBtn">複製</button>
          <button id="delFileBtn" class="danger">削除</button>
        </div>
      </div>

      <div class="main-body">
        <!-- Edit -->
        <div id="editPanel" class="tab-panel active">
          <div class="editor-tools">
            <span id="charCount">0文字</span>
            <div class="search-box">
              <input id="search" type="search" placeholder="検索" autocomplete="off" autocorrect="off">
              <span id="searchResult"></span>
            </div>
            <button id="clearBtn">クリア</button>
            <button id="updatePreviewBtn" class="primary">プレビュー更新</button>
          </div>
          <div class="status">HTML・CSS・JavaScriptをそのまま貼り付けてください。タブ切り替えで即時プレビューされます。</div>
          <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
        </div>

        <!-- iPhone -->
        <div id="iphonePanel" class="tab-panel">
          <div class="preview-toolbar">
            <button id="refreshIphone">更新</button>
            <button id="fullIphone" class="primary">全画面</button>
          </div>
          <div class="preview-stage">
            <div>
              <div class="device-scaler" id="iphoneScaler">
                <div class="iphone-device">
                  <div class="island"></div>
                  <div class="iphone-screen-wrap">
                    <iframe id="iphoneFrame" title="iPhone preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
                  </div>
                  <div class="homebar"></div>
                </div>
              </div>
              <div class="phone-label">iPhone 17 Pro（393×852）</div>
            </div>
          </div>
        </div>

        <!-- iPad -->
        <div id="ipadPanel" class="tab-panel">
          <div class="preview-toolbar">
            <button id="refreshIpad">更新</button>
            <button id="fullIpad" class="primary">全画面</button>
          </div>
          <div class="preview-stage">
            <div>
              <div class="device-scaler" id="ipadScaler">
                <div class="ipad-device">
                  <div class="ipad-camera"></div>
                  <div class="ipad-screen-wrap">
                    <iframe id="ipadFrame" title="iPad preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
                  </div>
                  <div class="ipad-home"></div>
                </div>
              </div>
              <div class="phone-label">iPad 第7世代・横固定（1080×810）</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="fullscreen" class="fullscreen">
  <div class="fs-label" id="fsLabel">プレビュー</div>
  <button class="exit" id="exitFull">×</button>
  <iframe id="fullFrame" title="Fullscreen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<script>
const STORAGE_KEY='multi-pwa-previewer-v1';

// Default HTML template
function getDefaultHtml(){
  return `<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample</title>
<style>
body{
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  display:grid;
  place-items:center;
  height:100vh;
  margin:0;
  padding:20px;
  text-align:center
}
h1{font-size:28px;margin:0 0 8px}
p{color:#aaa;margin:0}
</style>
</head>
<body>
<h1>Hello PWA</h1>
<p>iPhone / iPad で確認してください</p>
</body>
</html>`;
}

// Data
function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {activeFileId:null,files:[]};
}
function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
let data=loadData();
let currentTab='edit';
let debounceTimer=null;

// Elements
const els={
  fileName:document.getElementById('fileName'),
  fileList:document.getElementById('fileList'),
  source:document.getElementById('source'),
  charCount:document.getElementById('charCount'),
  search:document.getElementById('search'),
  searchResult:document.getElementById('searchResult'),
  listSearch:document.getElementById('listSearch'),
  iphoneFrame:document.getElementById('iphoneFrame'),
  ipadFrame:document.getElementById('ipadFrame'),
  fullFrame:document.getElementById('fullFrame'),
  fullscreen:document.getElementById('fullscreen'),
  fsLabel:document.getElementById('fsLabel'),
  tabPanels:{
    edit:document.getElementById('editPanel'),
    iphone:document.getElementById('iphonePanel'),
    ipad:document.getElementById('ipadPanel')
  },
  tabButtons:document.querySelectorAll('[data-tab]')
};

// Init
function init(){
  if(!data.files.length){
    data.files.push({id:'f_'+Date.now(),name:'サンプル',html:getDefaultHtml(),updated:Date.now()});
    data.activeFileId=data.files[0].id;
    saveData();
  }
  if(!data.activeFileId||!data.files.find(f=>f.id===data.activeFileId)){
    data.activeFileId=data.files[0].id;
    saveData();
  }
  renderFileList();
  renderMain();
  setupEvents();
  window.addEventListener('resize',fitScales);
  window.addEventListener('beforeunload',saveData);
}

// CRUD
function addFile(name,html){
  const id='f_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const file={id,name,html,updated:Date.now()};
  data.files.push(file);
  data.activeFileId=id;
  saveData();
  renderFileList();
  renderMain();
}
function duplicateFile(id){
  const file=data.files.find(f=>f.id===id);
  if(!file)return;
  addFile(file.name+' のコピー',file.html);
}
function deleteFile(id){
  if(!confirm('このファイルを削除しますか？'))return;
  data.files=data.files.filter(f=>f.id!==id);
  if(data.activeFileId===id){
    data.activeFileId=data.files.length?data.files[0].id:null;
  }
  saveData();
  renderFileList();
  renderMain();
}
function updateActiveFile(updates){
  const file=data.files.find(f=>f.id===data.activeFileId);
  if(!file)return;
  Object.assign(file,updates,{updated:Date.now()});
  saveData();
  renderFileList();
}
function getActiveFile(){
  return data.files.find(f=>f.id===data.activeFileId)||null;
}

// Rendering
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderFileList(){
  const q=els.listSearch.value.trim().toLowerCase();
  els.fileList.innerHTML='';
  const items=data.files
    .filter(f=>f.name.toLowerCase().includes(q))
    .sort((a,b)=>b.updated-a.updated);
  if(!items.length){
    els.fileList.innerHTML='<div class="empty-state">ファイルがありません。<br>「＋ 新規」で作成してください。</div>';
    return;
  }
  items.forEach(file=>{
    const div=document.createElement('div');
    div.className='file-item'+(file.id===data.activeFileId?' active':'');
    div.innerHTML=
      '<div class="file-name">'+escapeHtml(file.name)+'</div>'+
      '<div class="file-meta">'+file.html.length.toLocaleString()+'文字 · '+formatDate(file.updated)+'</div>'+
      '<button class="file-delete" aria-label="削除">×</button>';
    div.addEventListener('click',(e)=>{
      if(e.target.closest('.file-delete')){
        e.stopPropagation();
        deleteFile(file.id);
      }else{
        selectFile(file.id);
      }
    });
    els.fileList.appendChild(div);
  });
}
function renderMain(){
  const file=getActiveFile();
  if(!file){
    els.fileName.value='';
    els.source.value='';
    updateCount();
    Object.values(els.tabPanels).forEach(p=>p.classList.remove('active'));
    els.tabPanels.edit.classList.add('active');
    currentTab='edit';
    syncTabButtons();
    return;
  }
  els.fileName.value=file.name;
  els.source.value=file.html;
  updateCount();
  syncTabButtons();
  Object.entries(els.tabPanels).forEach(([key,panel])=>{
    panel.classList.toggle('active',key===currentTab);
  });
  fitScales();
  if(currentTab!=='edit'){
    updatePreview(currentTab);
  }
}
function syncTabButtons(){
  els.tabButtons.forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===currentTab));
}
function selectFile(id){
  data.activeFileId=id;
  saveData();
  renderFileList();
  renderMain();
}
function switchTab(tab){
  currentTab=tab;
  renderMain();
}
function updatePreview(device){
  const file=getActiveFile();
  if(!file)return;
  if(device==='iphone') els.iphoneFrame.srcdoc=file.html;
  if(device==='ipad') els.ipadFrame.srcdoc=file.html;
}
function updateCount(){
  els.charCount.textContent=els.source.value.length.toLocaleString()+'文字';
}

// Scale devices to fit
function fitScales(){
  requestAnimationFrame(()=>{
    const iphonePanel=els.tabPanels.iphone;
    const iphoneScaler=document.getElementById('iphoneScaler');
    if(iphonePanel&&iphonePanel.classList.contains('active')&&iphoneScaler){
      const pw=iphonePanel.clientWidth-28;
      const scale=Math.min(1,Math.max(0.35,pw/413));
      iphoneScaler.style.transform='scale('+scale+')';
      iphoneScaler.parentElement.style.height=(872*scale+40)+'px';
    }
    const ipadPanel=els.tabPanels.ipad;
    const ipadScaler=document.getElementById('ipadScaler');
    if(ipadPanel&&ipadPanel.classList.contains('active')&&ipadScaler){
      const pw=ipadPanel.clientWidth-28;
      const scale=Math.min(1,Math.max(0.25,pw/1128));
      ipadScaler.style.transform='scale('+scale+')';
      ipadScaler.parentElement.style.height=(858*scale+40)+'px';
    }
  });
}

// Events
function setupEvents(){
  // Tabs
  els.tabButtons.forEach(btn=>{
    btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
  });

  // File name
  els.fileName.addEventListener('input',()=>{
    updateActiveFile({name:els.fileName.value});
  });

  // Textarea
  els.source.addEventListener('input',()=>{
    updateCount();
    updateActiveFile({html:els.source.value});
    clearTimeout(debounceTimer);
    debounceTimer=setTimeout(()=>{
      if(currentTab!=='edit') updatePreview(currentTab);
    },500);
  });

  // Search in editor
  els.search.addEventListener('input',()=>{
    const q=els.search.value;
    if(!q){els.searchResult.textContent='';return}
    let n=0,pos=0;
    while((pos=els.source.value.indexOf(q,pos))!==-1){n++;pos+=Math.max(q.length,1)}
    els.searchResult.textContent=n+'件';
  });

  // Clear
  document.getElementById('clearBtn').addEventListener('click',()=>{
    els.source.value='';
    updateActiveFile({html:''});
    updateCount();
    els.search.value='';
    els.searchResult.textContent='';
    els.source.focus();
  });

  // Update preview manually
  document.getElementById('updatePreviewBtn').addEventListener('click',()=>{
    if(currentTab!=='edit') updatePreview(currentTab);
    else switchTab('iphone');
  });

  // Add / Dup / Del
  document.getElementById('addFileBtn').addEventListener('click',()=>{
    const name=prompt('新規ファイルの名前','新規ファイル');
    if(!name)return;
    addFile(name.trim()||'新規ファイル',getDefaultHtml());
  });
  document.getElementById('dupFileBtn').addEventListener('click',()=>{
    duplicateFile(data.activeFileId);
  });
  document.getElementById('delFileBtn').addEventListener('click',()=>{
    deleteFile(data.activeFileId);
  });

  // Refresh previews
  document.getElementById('refreshIphone').addEventListener('click',()=>updatePreview('iphone'));
  document.getElementById('refreshIpad').addEventListener('click',()=>updatePreview('ipad'));

  // Fullscreen
  document.getElementById('fullIphone').addEventListener('click',()=>openFullscreen('iPhone 17 Pro'));
  document.getElementById('fullIpad').addEventListener('click',()=>openFullscreen('iPad 第7世代'));
  document.getElementById('exitFull').addEventListener('click',closeFullscreen);

  // List search
  els.listSearch.addEventListener('input',renderFileList);
}

function openFullscreen(label){
  const file=getActiveFile();
  if(!file)return;
  els.fsLabel.textContent=label+' · '+file.name;
  els.fullFrame.srcdoc=file.html;
  els.fullscreen.classList.add('show');
}
function closeFullscreen(){
  els.fullscreen.classList.remove('show');
  els.fullFrame.srcdoc='';
}

function formatDate(ts){
  const d=new Date(ts);
  const mo=(d.getMonth()+1).toString().padStart(2,'0');
  const da=d.getDate().toString().padStart(2,'0');
  const h=d.getHours().toString().padStart(2,'0');
  const m=d.getMinutes().toString().padStart(2,'0');
  return mo+'/'+da+' '+h+':'+m;
}
