<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Previewer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button,textarea,input{font:inherit}
button{border:0;color:var(--text);background:var(--panel2);border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #38383c}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}
.app{max-width:1200px;margin:auto}

/* card list */
.card-list{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:10px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.card-list::-webkit-scrollbar{height:6px}
.card-list::-webkit-scrollbar-thumb{background:#3a3a3c;border-radius:3px}
.card{
  flex:0 0 auto;width:150px;background:var(--panel);border-radius:16px;padding:14px;border:2px solid transparent;
  cursor:pointer;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:border-color .15s,background .15s,transform .1s;
}
.card:active{transform:scale(.96);opacity:.85}
.card.active{border-color:var(--accent);background:#0a84ff18}
.card-name{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:11px;color:var(--muted);margin-top:auto}
.card.new-card{align-items:center;justify-content:center;min-height:96px;border-style:dashed;border-color:#38383c;color:var(--muted);font-weight:600;font-size:15px}
.card-hint{text-align:center;color:var(--muted);padding:18px 0 4px;font-size:13px}

/* preview actions */
.preview-actions{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.preview-actions button{min-height:38px;font-size:13px}

/* device previews */
.devices{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;padding:4px 0 24px}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.device-label{font-size:12px;color:var(--muted);font-weight:500}

.phone{
  position:relative;width:min(380px,52vw);aspect-ratio:393/852;
  background:#000;border:6px solid #202023;border-radius:48px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.phone-inner{position:absolute;top:0;left:0;width:393px;height:852px;transform-origin:top left}
.phone iframe{position:absolute;top:0;left:0;width:393px;height:852px;border:0;background:#000;color-scheme:dark}
.island{
  position:absolute;z-index:5;top:11px;left:50%;transform:translateX(-50%);
  width:126px;height:37px;background:#000;border-radius:20px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.04);
}
.homebar{
  position:absolute;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:3px;background:#fff;pointer-events:none;opacity:.9;
}

.ipad{
  position:relative;width:min(600px,82vw);aspect-ratio:1080/810;
  background:#000;border:8px solid #2a2a2e;border-radius:20px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.ipad-inner{position:absolute;top:0;left:0;width:1080px;height:810px;transform-origin:top left}
.ipad iframe{position:absolute;top:0;left:0;width:1080px;height:810px;border:0;background:#000;color-scheme:dark}
.ipad-bezel{
  position:absolute;z-index:5;top:50%;left:8px;transform:translateY(-50%);
  width:4px;height:32px;background:#1a1a1c;border-radius:2px;pointer-events:none;
}

/* editor */
#mainView{}
#mainView.hidden{display:none}
.editor-panel{display:none}
.editor-panel.show{display:block}
.editor-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.editor-tools .name-input{
  flex:1;min-width:120px;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 12px;outline:none;
}
.editor-tools .name-input:focus{border-color:var(--accent)}
#count{font-size:13px;color:var(--muted);white-space:nowrap}
.search-box{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.search-box input{
  width:100%;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 11px;outline:none;
}
#searchResult{font-size:11px;color:var(--muted);white-space:nowrap}
textarea{
  width:100%;height:min(58vh,520px);resize:vertical;
  background:#111113;color:#f5f5f7;border:1px solid #38383c;border-radius:14px;
  padding:14px;outline:none;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;
}
textarea:focus{border-color:var(--accent)}
.status{font-size:12px;color:var(--muted);padding:2px 4px 8px}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.editor-actions button{flex:1;min-width:100px}

/* fullscreen */
.fullscreen{position:fixed;inset:0;z-index:100;background:#000;padding:0;display:none}
.fullscreen.show{display:block}
.fullscreen iframe{width:100%;height:100%;border:0}
.fullscreen .exit{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));right:14px;
  width:44px;height:44px;padding:0;border-radius:50%;
  background:rgba(60,60,65,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font-size:20px;
}

@media(max-width:640px){
  .card{width:130px;padding:12px}
  .phone{width:min(340px,58vw);border-radius:44px;border-width:5px}
  .ipad{width:min(480px,90vw)}
  textarea{height:min(54vh,420px)}
}
@media(min-width:900px){
  .phone{width:min(420px,44vw)}
  .ipad{width:min(640px,56vw)}
  textarea{height:min(62vh,580px)}
}
</style>
</head>
<body>
<div class="app">
  <div id="mainView">
    <div id="cardList" class="card-list"></div>
    <div id="emptyHint" class="card-hint" style="display:none">カードを長押しで編集できます</div>

    <div class="preview-actions">
      <button id="btnFull" class="primary">全画面</button>
    </div>

    <div class="devices">
      <div class="device-wrap">
        <div class="device-label">iPhone 17 Pro</div>
        <div class="phone" id="phone">
          <div class="phone-inner" id="phoneInner">
            <div class="island"></div>
            <iframe id="framePhone" title="iPhone preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
            <div class="homebar"></div>
          </div>
        </div>
      </div>
      <div class="device-wrap">
        <div class="device-label">iPad 第7世代（横）</div>
        <div class="ipad" id="ipad">
          <div class="ipad-inner" id="ipadInner">
            <div class="ipad-bezel"></div>
            <iframe id="frameIpad" title="iPad preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- EDITOR -->
  <section id="editorPanel" class="editor-panel">
    <div class="editor-tools">
      <input id="nameInput" class="name-input" type="text" placeholder="名前を入力" maxlength="80" autocomplete="off">
      <span id="count">0文字</span>
      <div class="search-box">
        <input id="search" type="search" placeholder="検索" autocomplete="off">
        <button id="btnSearchNext" class="ghost" style="min-height:36px;padding:0 12px;font-size:13px;">次へ</button>
        <span id="searchResult"></span>
      </div>
    </div>
    <div class="status">HTML・CSS・JavaScriptをそのまま貼り付けてください。保存すると一覧に反映さます。</div>
    <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
    <div class="editor-actions">
      <button id="btnSave" class="primary">保存して一覧へ</button>
      <button id="btnDeleteEditor" class="danger">削除</button>
      <button id="btnClear" class="ghost">クリア</button>
      <button id="btnCancel" class="ghost">キャンセル</button>
    </div>
  </section>
</div>

<div id="fullscreen" class="fullscreen">
  <button class="exit" id="exit">×</button>
  <iframe id="fullFrame" title="Full screen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "pwa-previewer-items-v3";
  const OLD_KEY = "pwa-previewer-items-v2";
  const OLD_KEY2 = "iphone17pro-pwa-preview-html-v1";

  let items = [];
  let selectedId = null;
  let editingId = null;
  let searchMatches = [];
  let currentMatchIndex = -1;
  let longPressTimer = null;
  let lastLongPressTime = 0;

  const source = $("source");
  const nameInput = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad = $("frameIpad");
  const fullFrame = $("fullFrame");
  const phoneInner = $("phoneInner");
  const ipadInner = $("ipadInner");

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        const old = localStorage.getItem(OLD_KEY) || localStorage.getItem(OLD_KEY2);
        if (old) {
          try {
            const parsed = JSON.parse(old);
            if (Array.isArray(parsed)) {
              items = parsed;
            } else if (typeof parsed === "string") {
              items = [{ id: uid(), name: "移行したHTML", html: parsed, updated: Date.now() }];
            }
          } catch (e) {
            items = [{ id: uid(), name: "移行したHTML", html: old, updated: Date.now() }];
          }
          persist();
        }
      }
    } catch (e) {
      items = [];
    }
    if (items.length && !selectedId) selectedId = items[0].id;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const h = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `${m}/${day} ${h}:${min}`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function clearPreviews() {
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  function updatePreview() {
    const it = items.find(x => x.id === selectedId);
    if (!it) {
      clearPreviews();
      return;
    }
    const html = it.html || "";
    framePhone.srcdoc = html;
    frameIpad.srcdoc = html;
  }

  function updateScales() {
    const phoneW = $("phone").clientWidth;
    const ipadW = $("ipad").clientWidth;
    phoneInner.style.transform = `scale(${phoneW / 393})`;
    ipadInner.style.transform = `scale(${ipadW / 1080})`;
  }

  function renderList() {
    const list = $("cardList");
    const hint = $("emptyHint");
    if (!items.length) {
      hint.style.display = "";
    } else {
      hint.style.display = "none";
    }

    let html = items
      .slice()
      .sort((a, b) => b.updated - a.updated)
      .map(it => `
        <div class="card ${it.id === selectedId ? "active" : ""}" data-id="${it.id}">
          <div class="card-name">${escapeHtml(it.name || "無題")}</div>
          <div class="card-meta">${formatDate(it.updated)} · ${(it.html || "").length.toLocaleString()}字</div>
        </div>
      `).join("");

    html += `<div class="card new-card" data-action="new"><div>＋ 新規</div></div>`;
    list.innerHTML = html;

    list.querySelectorAll(".card").forEach(el => {
      const action = el.dataset.action;
      const id = el.dataset.id;

      // long press
      let startX = 0, startY = 0;
      const start = (e) => {
        const point = e.touches ? e.touches[0] : e;
        startX = point.clientX;
        startY = point.clientY;
        longPressTimer = setTimeout(() => {
          longPressTimer = null;
          lastLongPressTime = Date.now();
          if (action === "new") {
            showEditor(true);
          } else {
            selectedId = id;
            showEditor(false);
          }
        }, 600);
      };
      const cancel = () => {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };
      const move = (e) => {
        const point = e.touches ? e.touches[0] : e;
        const dx = point.clientX - startX;
        const dy = point.clientY - startY;
        if (Math.sqrt(dx * dx + dy * dy) > 10) cancel();
      };

      el.addEventListener("touchstart", start, { passive: true });
      el.addEventListener("touchend", cancel);
      el.addEventListener("touchmove", move, { passive: true });
      el.addEventListener("touchcancel", cancel);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", cancel);
      el.addEventListener("mouseleave", cancel);
      el.addEventListener("mousemove", move);
      el.addEventListener("contextmenu", e => e.preventDefault());

      el.addEventListener("click", () => {
        if (Date.now() - lastLongPressTime < 500) return;
        if (action === "new") {
          showEditor(true);
        } else {
          selectedId = id;
          renderList();
          updatePreview();
        }
      });
    });
  }

  function showList() {
    $("mainView").classList.remove("hidden");
    $("editorPanel").classList.remove("show");
    renderList();
    updatePreview();
    requestAnimationFrame(updateScales);
  }

  function showEditor(isNew) {
    $("mainView").classList.add("hidden");
    $("editorPanel").classList.add("show");
    $("search").value = "";
    $("searchResult").textContent = "";
    searchMatches = [];
    currentMatchIndex = -1;

    if (isNew) {
      editingId = null;
      nameInput.value = "";
      source.value = "";
      $("btnDeleteEditor").textContent = "クリア";
    } else {
      const it = items.find(x => x.id === selectedId);
      if (!it) {
        editingId = null;
        nameInput.value = "";
        source.value = "";
        $("btnDeleteEditor").textContent = "クリア";
      } else {
        editingId = it.id;
        nameInput.value = it.name || "";
        source.value = it.html || "";
        $("btnDeleteEditor").textContent = "削除";
      }
    }
    updateCount();
    nameInput.focus();
  }

  function updateCount() {
    $("count").textContent = source.value.length.toLocaleString() + "文字";
  }

  function saveCurrent() {
    const name = (nameInput.value || "").trim() || "無題";
    const html = source.value;
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) {
        it.name = name;
        it.html = html;
        it.updated = Date.now();
      }
      selectedId = editingId;
    } else {
      const id = uid();
      items.push({ id, name, html, updated: Date.now() });
      selectedId = id;
    }
    persist();
    showList();
  }

  function deleteCurrent() {
    if (!editingId) {
      if (confirm("内容をクリアしますか？")) {
        source.value = "";
        updateCount();
      }
      return;
    }
    const it = items.find(x => x.id === editingId);
    if (!it) return;
    if (!confirm(`「${it.name || "無題"}」を削除しますか？`)) return;
    items = items.filter(x => x.id !== editingId);
    selectedId = items.length ? items[0].id : null;
    editingId = null;
    persist();
    showList();
  }

  function updateSearch() {
    const q = $("search").value;
    if (!q) {
      searchMatches = [];
      currentMatchIndex = -1;
      $("searchResult").textContent = "";
      return;
    }
    searchMatches = [];
    let pos = 0;
    const text = source.value;
    while ((pos = text.indexOf(q, pos)) !== -1) {
      searchMatches.push({ start: pos, end: pos + q.length });
      pos += Math.max(q.length, 1);
    }
    if (searchMatches.length) {
      currentMatchIndex = 0;
      goToMatch(0);
    } else {
      currentMatchIndex = -1;
      $("searchResult").textContent = "0件";
    }
  }

  function goToMatch(idx) {
    if (!searchMatches.length) return;
    currentMatchIndex = ((idx % searchMatches.length) + searchMatches.length) % searchMatches.length;
    const m = searchMatches[currentMatchIndex];
    source.focus();
    source.setSelectionRange(m.start, m.end);
    $("searchResult").textContent = `${currentMatchIndex + 1}/${searchMatches.length}件`;
  }

  // events
  $("btnSave").onclick = saveCurrent;
  $("btnCancel").onclick = showList;
  $("btnClear").onclick = () => {
    source.value = "";
    updateCount();
    $("search").value = "";
    $("searchResult").textContent = "";
    searchMatches = [];
    currentMatchIndex = -1;
    source.focus();
  };
  $("btnDeleteEditor").onclick = deleteCurrent;

  $("btnFull").onclick = () => {
    const it = items.find(x => x.id === selectedId);
    if (!it) return;
    fullFrame.srcdoc = it.html || "";
    $("fullscreen").classList.add("show");
  };
  $("exit").onclick = () => {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
  };

  source.addEventListener("input", updateCount);

  $("search").addEventListener("input", updateSearch);
  $("btnSearchNext").addEventListener("click", () => {
    if (!searchMatches.length) updateSearch();
    else goToMatch(currentMatchIndex + 1);
  });
  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (!searchMatches.length) updateSearch();
      else goToMatch(currentMatchIndex + 1);
    }
  });

  window.addEventListener("resize", updateScales);

  // init
  load();
  showList();
})();
</script>
</body>
</html>
