<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>iPhone 17 Pro PWAプレビューア</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #05060a;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* Layout */
    .app-shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
    }
    .app-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .segmented {
      display: inline-flex;
      background: #111218;
      border-radius: 999px;
      padding: 2px;
      border: 1px solid #262738;
    }
    .segmented button {
      flex: 1;
      min-width: 72px;
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #c7c7cc;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .segmented button.active {
      background: #2f3244;
      color: #f5f5f7;
    }

    .primary-button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background: #0a84ff;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      min-width: 110px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 0 0 1px rgba(10,132,255,0.35);
    }
    .primary-button span.icon {
      font-size: 14px;
    }

    .primary-button:active {
      transform: scale(0.98);
    }

    .app-main {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      gap: 12px;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 800px) {
      .app-main {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .panel {
      background: #0b0c12;
      border-radius: 18px;
      border: 1px solid #1c1d27;
      padding: 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px 8px;
    }
    .panel-title {
      font-size: 13px;
      font-weight: 500;
      color: #9fa0a6;
    }
    .panel-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .sub-button {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      background: #151623;
      color: #d1d1d6;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 80px;
      justify-content: center;
    }
    .sub-button:active {
      transform: scale(0.98);
    }

    .editor-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .editor-input {
      flex: 1;
      min-height: 0;
      border-radius: 12px;
      border: 1px solid #262738;
      background: #05060a;
      padding: 10px;
      color: #f5f5f7;
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      resize: none;
      outline: none;
      line-height: 1.4;
    }
    .editor-input::placeholder {
      color: #5c5d66;
    }

    /* iPhone 17 Pro frame */
    .phone-panel {
      align-items: center;
      justify-content: center;
    }
    .phone-shell {
      position: relative;
      aspect-ratio: 19.5 / 9;
      max-width: 420px;
      width: 100%;
      margin: 4px auto 0;
      padding: 10px;
      border-radius: 40px;
      background: radial-gradient(circle at 20% 0%, #1b1c26 0, #05060a 55%, #000 100%);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 18px 40px rgba(0,0,0,0.85);
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .phone-screen {
      position: relative;
      flex: 1;
      border-radius: 32px;
      background: #000;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      max-width: 180px;
      height: 32px;
      background: #000;
      border-radius: 999px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 10px 18px rgba(0,0,0,0.9);
      z-index: 20;
    }

    .screen-inner {
      position: absolute;
      inset: 0;
      padding: 10px 10px 10px;
      display: flex;
      flex-direction: column;
    }

    /* Safe areas (simulated) */
    .safe-top {
      flex: 0 0 44px;
    }
    .safe-bottom {
      flex: 0 0 34px;
    }

    .pwa-viewport {
      position: relative;
      flex: 1 1 auto;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04);
    }

    .pwa-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.75);
      opacity: 0.9;
      pointer-events: none;
    }

    .phone-shell::before {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.06);
      pointer-events: none;
    }

    /* Fullscreen mode */
    body.fullscreen-mode .app-shell {
      max-width: none;
      width: 100%;
      height: 100vh;
      padding: 8px 8px 12px;
    }
    body.fullscreen-mode .app-main {
      grid-template-columns: minmax(0, 1fr);
    }
    body.fullscreen-mode .editor-panel {
      display: none;
    }
    body.fullscreen-mode .phone-shell {
      max-width: none;
      height: calc(100vh - 52px);
      aspect-ratio: auto;
      margin: 0 auto;
    }
    body.fullscreen-mode .app-header {
      padding-inline: 4px;
    }

    /* Utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-title">iPhone 17 Pro PWAプレビューア</div>
      <div class="header-actions">
        <div class="segmented" id="modeToggle">
          <button type="button" data-mode="editor" class="active">HTML入力</button>
          <button type="button" data-mode="preview">プレビュー</button>
        </div>
        <button class="primary-button" id="fullscreenToggle" type="button">
          <span class="icon">⤢</span><span id="fullscreenLabel">全画面</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <!-- Editor panel -->
      <section class="panel editor-panel" id="editorPanel">
        <div class="panel-header">
          <div class="panel-title">HTML / CSS / JavaScript</div>
          <div class="panel-actions">
            <button class="sub-button" type="button" id="sampleButton">サンプルHTML</button>
            <button class="sub-button" type="button" id="clearButton">クリア</button>
            <button class="sub-button" type="button" id="previewButton">プレビュー</button>
          </div>
        </div>
        <div class="editor-wrapper">
          <textarea id="htmlInput" class="editor-input" spellcheck="false" placeholder="ここにPWAのHTMLを貼り付けてください"></textarea>
        </div>
      </section>

      <!-- Phone preview panel -->
      <section class="panel phone-panel" id="previewPanel">
        <div class="panel-header">
          <div class="panel-title">iPhone 17 Pro PWAプレビュー</div>
          <div class="panel-actions">
            <button class="sub-button" type="button" id="previewButtonTop">プレビュー</button>
          </div>
        </div>
        <div class="phone-shell">
          <div class="phone-screen">
            <div class="dynamic-island"></div>
            <div class="screen-inner">
              <div class="safe-top"></div>
              <div class="pwa-viewport">
                <iframe id="previewFrame"
                        title="PWA Preview"
                        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock">
                </iframe>
                <div class="home-indicator"></div>
              </div>
              <div class="safe-bottom"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "pwaPreviewHtml";
      const htmlInput = document.getElementById("htmlInput");
      const previewFrame = document.getElementById("previewFrame");
      const previewButton = document.getElementById("previewButton");
      const previewButtonTop = document.getElementById("previewButtonTop");
      const clearButton = document.getElementById("clearButton");
      const sampleButton = document.getElementById("sampleButton");
      const modeToggle = document.getElementById("modeToggle");
      const editorPanel = document.getElementById("editorPanel");
      const previewPanel = document.getElementById("previewPanel");
      const fullscreenToggle = document.getElementById("fullscreenToggle");
      const fullscreenLabel = document.getElementById("fullscreenLabel");

      function loadFromStorage() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved && saved.trim()) {
            htmlInput.value = saved;
          } else {
            setSampleHtml();
          }
        } catch (e) {
          setSampleHtml();
        }
      }

      function saveToStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, htmlInput.value || "");
        } catch (e) {
          // ignore
        }
      }

      function preprocessHtml(source) {
        let html = source || "";
        // env(safe-area-inset-*) を var(--safe-area-inset-*) に置換して擬似的に再現
        html = html.replace(/env`\(\s*safe-area-inset-top\s*\)`/gi, "var(--safe-area-inset-top)");
        html = html.replace(/env`\(\s*safe-area-inset-bottom\s*\)`/gi, "var(--safe-area-inset-bottom)");
        html = html.replace(/env`\(\s*safe-area-inset-left\s*\)`/gi, "var(--safe-area-inset-left)");
        html = html.replace(/env`\(\s*safe-area-inset-right\s*\)`/gi, "var(--safe-area-inset-right)");
        return html;
      }

      function renderPreview() {
        const userHtml = htmlInput.value || "";
        saveToStorage();

        const processed = preprocessHtml(userHtml);

        const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
        const skeleton = [
          "<!DOCTYPE html>",
          "<html lang=\"ja\">",
          "<head>",
          "<meta charset=\"utf-8\">",
          "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">",
          "<style>",
          "  :root {",
          "    color-scheme: dark;",
          "    --safe-area-inset-top: 44px;",
          "    --safe-area-inset-bottom: 34px;",
          "    --safe-area-inset-left: 0px;",
          "    --safe-area-inset-right: 0px;",
          "  }",
          "  html, body {",
          "    margin: 0;",
          "    padding: 0;",
          "    background: #000;",
          "    color: #f5f5f7;",
          "    font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", system-ui, sans-serif;",
          "    overscroll-behavior: contain;",
          "  }",
          "  body {",
          "    min-height: 100vh;",
          "  }",
          "  ::-webkit-scrollbar {",
          "    width: 0;",
          "    height: 0;",
          "  }",
          "</style>",
          "</head>",
          "<body>",
          processed,
          "</body>",
          "</html>"
        ].join("\n");

        doc.open();
        doc.write(skeleton);
        doc.close();
      }

      function clearInput() {
        htmlInput.value = "";
        saveToStorage();
      }

      function setSampleHtml() {
        const sample = [
          "<!-- サンプルPWAレイアウト (iPhone 17 Pro Safe Area / タブバー / 固定ヘッダー) -->",
          "<style>",
          "  :root {",
          "    --bg: #000000;",
          "    --fg: #f5f5f7;",
          "    --accent: #0a84ff;",
          "    --surface: #111118;",
          "    --border: #262738;",
          "  }",
          "  body {",
          "    background: var(--bg);",
          "    color: var(--fg);",
          "  }",
          "  .app {",
          "    position: fixed;",
          "    inset: 0;",
          "    display: flex;",
          "    flex-direction: column;",
          "    background: radial-gradient(circle at 0 0, #151522 0, #000 55%, #000 100%);",
          "  }",
          "  .status-bar-space {",
          "    height: var(--safe-area-inset-top);",
          "  }",
          "  .header {",
          "    position: sticky;",
          "    top: 0;",
          "    z-index: 10;",
          "    padding: 10px 16px;",
          "    padding-top: calc(10px + var(--safe-area-inset-top));",
          "    background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.6));",
          "    backdrop-filter: blur(18px);",
          "    display: flex;",
          "    align-items: center;",
          "    justify-content: space-between;",
          "  }",
          "  .header-title {",
          "    font-size: 16px;",
          "    font-weight: 600;",
          "  }",
          "  .header-sub {",
          "    font-size: 11px;",
          "    color: #9fa0a6;",
          "  }",
          "  .header-actions {",
          "    display: flex;",
          "    gap: 8px;",
          "  }",
          "  .pill {",
          "    padding: 6px 10px;",
          "    border-radius: 999px;",
          "    border: 1px solid rgba(255,255,255,0.12);",
          "    font-size: 11px;",
          "  }",
          "  .pill-accent {",
          "    background: var(--accent);",
          "    border-color: rgba(10,132,255,0.6);",
          "  }",
          "  .content {",
          "    flex: 1 1 auto;",
          "    overflow-y: auto;",
          "    padding: 12px 16px 80px;",
          "  }",
          "  .card {",
          "    background: var(--surface);",
          "    border-radius: 16px;",
          "    border: 1px solid var(--border);",
          "    padding: 12px 12px 12px;",
          "    margin-bottom: 10px;",
          "  }",
          "  .card-title {",
          "    font-size: 13px;",
          "    font-weight: 500;",
          "    margin-bottom: 4px;",
          "  }",
          "  .card-body {",
          "    font-size: 12px;",
          "    color: #d1d1d6;",
          "  }",
          "  .tab-bar {",
          "    position: fixed;",
          "    left: 0;",
          "    right: 0;",
          "    bottom: 0;",
          "    padding-bottom: var(--safe-area-inset-bottom);",
          "    padding-top: 6px;",
          "    background: rgba(0,0,0,0.9);",
          "    backdrop-filter: blur(20px);",
          "    border-top: 1px solid rgba(255,255,255,0.08);",
          "    display: flex;",
          "    justify-content: space-around;",
          "    align-items: center;",
          "  }",
          "  .tab-item {",
          "    flex: 1;",
          "    text-align: center;",
          "    font-size: 10px;",
          "    color: #9fa0a6;",
          "  }",
          "  .tab-item span.icon {",
          "    display: block;",
          "    font-size: 18px;",
          "    margin-bottom: 2px;",
          "  }",
          "  .tab-item.active {",
          "    color: var(--accent);",
          "  }",
          "  .corner-test {",
          "    position: fixed;",
          "    top: 0;",
          "    left: 0;",
          "    width: 40px;",
          "    height: 40px;",
          "    background: rgba(255,0,0,0.4);",
          "    pointer-events: none;",
          "  }",
          "  .vh-test {",
          "    margin-top: 12px;",
          "    padding: 10px;",
          "    border-radius: 12px;",
          "    border: 1px dashed #3a3b4a;",
          "    font-size: 11px;",
          "  }",
          "  .vh-box {",
          "    background: rgba(10,132,255,0.18);",
          "    border-radius: 10px;",
          "    padding: 6px;",
          "    margin-top: 6px;",
          "  }",
          "</style>",
          "<div class=\"app\">",
          "  <div class=\"header\">",
          "    <div>",
          "      <div class=\"header-title\">PWA Safe Areaテスト</div>",
          "      <div class=\"header-sub\">Dynamic Island / Homeインジケータ / タブバー</div>",
          "    </div>",
          "    <div class=\"header-actions\">",
          "      <div class=\"pill\">100vh / 100dvh</div>",
          "      <div class=\"pill pill-accent\">position: fixed</div>",
          "    </div>",
          "  </div>",
          "  <div class=\"content\">",
          "    <div class=\"card\">",
          "      <div class=\"card-title\">スクロールテスト</div>",
          "      <div class=\"card-body\">",
          "        下方向にスクロールして、タブバーとの重なりや不要な余白を確認してください。",
          "      </div>",
          "    </div>",
          "    <div class=\"card\">",
          "      <div class=\"card-title\">Dynamic Island付近</div>",
          "      <div class=\"card-body\">",
          "        ステータスバーやDynamic Island付近にコンテンツが入り込んでいないかを確認します。",
          "      </div>",
          "    </div>",
          "    <div class=\"card vh-test\">",
          "      <div>100vh / 100dvhの違いによるレイアウト崩れを確認するための領域です。</div>",
          "      <div class=\"vh-box\" style=\"height: 40vh;\">height: 40vh のボックス</div>",
          "      <div class=\"vh-box\" style=\"height: 40dvh; margin-top: 6px;\">height: 40dvh のボックス</div>",
          "    </div>",
          "    <div class=\"card\">",
          "      <div class=\"card-title\">入力テスト</div>",
          "      <div class=\"card-body\">",
          "        <input type=\"text\" placeholder=\"テキスト入力\" style=\"width:100%;padding:8px;border-radius:10px;border:1px solid #3a3b4a;background:#05060a;color:#f5f5f7;\">",
          "        <button style=\"margin-top:8px;width:100%;padding:10px;border-radius:999px;border:none;background:#0a84ff;color:#fff;font-size:13px;\">ボタン操作テスト</button>",
          "      </div>",
          "    </div>",
          "    <div class=\"card\">",
          "      <div class=\"card-title\">長押し / タップ / スワイプ</div>",
          "      <div class=\"card-body\">",
          "        この領域でタップ・長押し・スワイプなどのジェスチャーを試してください。",
          "      </div>",
          "    </div>",
          "  </div>",
          "  <div class=\"tab-bar\">",
          "    <div class=\"tab-item active\">",
          "      <span class=\"icon\">●</span>",
          "      Home",
          "    </div>",
          "    <div class=\"tab-item\">",
          "      <span class=\"icon\">★</span>",
          "      Test",
          "    </div>",
          "    <div class=\"tab-item\">",
          "      <span class=\"icon\">☰</span>",
          "      Menu",
          "    </div>",
          "  </div>",
          "  <div class=\"corner-test\"></div>",
          "</div>"
        ].join("\n");
        htmlInput.value = sample;
      }

      function setMode(mode) {
        if (mode === "editor") {
          editorPanel.classList.remove("hidden");
          previewPanel.classList.remove("hidden");
        } else if (mode === "preview") {
          editorPanel.classList.add("hidden");
          previewPanel.classList.remove("hidden");
        }
        Array.prototype.forEach.call(modeToggle.querySelectorAll("button"), function (btn) {
          btn.classList.toggle("active", btn.dataset.mode === mode);
        });
      }

      function toggleFullscreen() {
        const isFull = document.body.classList.toggle("fullscreen-mode");
        fullscreenLabel.textContent = isFull ? "終了" : "全画面";
      }

      // Event bindings
      previewButton.addEventListener("click", renderPreview);
      previewButtonTop.addEventListener("click", renderPreview);
      clearButton.addEventListener("click", clearInput);
      sampleButton.addEventListener("click", function () {
        setSampleHtml();
        saveToStorage();
      });
      htmlInput.addEventListener("input", saveToStorage);

      modeToggle.addEventListener("click", function (e) {
        const btn = e.target.closest("button");
        if (!btn) return;
        setMode(btn.dataset.mode);
      });

      fullscreenToggle.addEventListener("click", toggleFullscreen);

      // Init
      loadFromStorage();
      renderPreview();
    })();
  </script>
</body>
</html>
