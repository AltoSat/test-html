<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>アルトサックス専用チューナー</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --surface2: #0f3460;
            --accent: #e94560;
            --accent2: #4ecdc4;
            --text: #f5f5f7;
            --text-dim: #a0a0b8;
            --good: #2ecc71;
            --warn: #f39c12;
            --bad: #e74c3c;
            --needle: #ff6b6b;
            --dial-bg: #0d1b2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 16px 20px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        header {
            text-align: center;
            margin-bottom: 2px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, var(--accent2), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header .subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 0.2em;
            margin-top: 2px;
            font-weight: 400;
        }

        .note-display {
            text-align: center;
            padding: 10px 0 4px;
        }
        .note-display .sax-note {
            font-size: 4.8rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 0.02em;
            transition: color 0.15s ease;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.25);
        }
        .note-display .sax-note .octave {
            font-size: 2rem;
            font-weight: 500;
            opacity: 0.7;
            vertical-align: super;
            margin-left: 2px;
        }
        .note-display .concert-pitch {
            font-size: 1rem;
            color: var(--text-dim);
            margin-top: 2px;
            letter-spacing: 0.05em;
            font-weight: 400;
        }
        .note-display .concert-pitch span {
            color: var(--accent2);
            font-weight: 600;
        }

        .frequency-display {
            font-size: 1.05rem;
            color: var(--text-dim);
            letter-spacing: 0.03em;
            font-variant-numeric: tabular-nums;
        }
        .frequency-display .freq-value {
            color: var(--text);
            font-weight: 600;
            font-size: 1.2rem;
        }

        .meter-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 2.1 / 1;
            margin: 0 auto;
        }
        .meter-container canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 14px;
        }

        .cents-readout {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.04em;
            transition: color 0.2s ease;
            min-height: 2.2rem;
            line-height: 1.3;
        }
        .cents-readout .unit {
            font-size: 1rem;
            font-weight: 400;
            opacity: 0.65;
            margin-left: 2px;
        }
        .cents-readout.good {
            color: var(--good);
        }
        .cents-readout.warn {
            color: var(--warn);
        }
        .cents-readout.bad {
            color: var(--bad);
        }
        .cents-readout.idle {
            color: var(--text-dim);
            font-weight: 400;
            font-size: 1.1rem;
        }

        .target-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 2px;
        }
        .target-btn {
            padding: 8px 14px;
            border-radius: 22px;
            border: 2px solid var(--surface2);
            background: var(--surface);
            color: var(--text);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.04em;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .target-btn:hover {
            border-color: var(--accent2);
            background: var(--surface2);
        }
        .target-btn.active {
            border-color: var(--accent2);
            background: var(--accent2);
            color: #0d1b2a;
            box-shadow: 0 0 18px rgba(78, 205, 196, 0.45);
        }
        .target-btn .concert-label {
            font-size: 0.65rem;
            opacity: 0.7;
            display: block;
            font-weight: 400;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--surface);
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-dim);
            flex-shrink: 0;
            transition: background 0.3s ease;
        }
        .status-dot.listening {
            background: var(--good);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
            animation: pulse 1.2s ease-in-out infinite;
        }
        .status-dot.idle-dot {
            background: var(--text-dim);
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 6px rgba(46, 204, 113, 0.4);
            }
            50% {
                box-shadow: 0 0 16px rgba(46, 204, 113, 0.8);
            }
        }

        .start-btn {
            padding: 14px 36px;
            border-radius: 32px;
            border: none;
            background: linear-gradient(135deg, var(--accent2), #2a9d8f);
            color: #0d1b2a;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.1em;
            font-family: inherit;
            transition: all 0.25s ease;
            box-shadow: 0 6px 24px rgba(78, 205, 196, 0.35);
            -webkit-tap-highlight-color: transparent;
        }
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(78, 205, 196, 0.5);
        }
        .start-btn:active {
            transform: translateY(1px);
            box-shadow: 0 3px 14px rgba(78, 205, 196, 0.3);
        }
        .start-btn.running {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 6px 24px rgba(231, 76, 60, 0.35);
        }

        .volume-bar-container {
            width: 100%;
            max-width: 400px;
            height: 4px;
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
            opacity: 0.7;
        }
        .volume-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent2), var(--good));
            border-radius: 4px;
            transition: width 0.06s ease;
        }

        @media (max-width: 420px) {
            .container {
                padding: 10px 12px 20px;
                gap: 8px;
            }
            .note-display .sax-note {
                font-size: 3.4rem;
            }
            .note-display .sax-note .octave {
                font-size: 1.4rem;
            }
            .target-btn {
                padding: 6px 10px;
                font-size: 0.72rem;
            }
            .cents-readout {
                font-size: 1.3rem;
                min-height: 1.8rem;
            }
            header h1 {
                font-size: 1.2rem;
            }
            .start-btn {
                padding: 12px 28px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎷 アルトサックス・チューナー</h1>
            <div class="subtitle">E♭ ALTO SAXOPHONE TUNER</div>
        </header>

        <button class="start-btn" id="startBtn">🎤 開始する</button>

        <div class="note-display">
            <div class="sax-note" id="saxNoteDisplay">--<span class="octave" id="saxOctave"></span></div>
            <div class="concert-pitch">Concert: <span id="concertNoteDisplay">--</span></div>
        </div>

        <div class="frequency-display">
            <span class="freq-value" id="freqDisplay">---.-</span> Hz
        </div>

        <div class="meter-container">
            <canvas id="meterCanvas"></canvas>
        </div>

        <div class="cents-readout idle" id="centsDisplay">音を検出しています...</div>

        <div class="target-buttons" id="targetButtons">
            <button class="target-btn" data-target="-1">自動
                <span class="concert-label">Auto</span>
            </button>
            <button class="target-btn" data-target="67">サックスG
                <span class="concert-label">Concert B♭</span>
            </button>
            <button class="target-btn" data-target="66">サックスF#
                <span class="concert-label">Concert A</span>
            </button>
            <button class="target-btn" data-target="62">サックスD
                <span class="concert-label">Concert F</span>
            </button>
            <button class="target-btn" data-target="60">サックスC
                <span class="concert-label">Concert E♭</span>
            </button>
        </div>

        <div class="volume-bar-container">
            <div class="volume-bar" id="volumeBar"></div>
        </div>

        <div class="status-bar">
            <span class="status-dot idle-dot" id="statusDot"></span>
            <span id="statusText">マイクの許可が必要です。「開始する」を押してください</span>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 定数とユーティリティ ====================
            const NOTE_NAMES_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const NOTE_NAMES_FLAT = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
            const A4_FREQ = 440.0;
            const A4_MIDI = 69;
            const SAX_TRANSPOSE = 9; // アルトサックス: concert音 + 9半音 = サックス記譜音

            // 中音萨克斯音域 (concert pitch) 约 D♭3 (138.59Hz) 到 A5 (880Hz)
            const MIN_FREQ = 110;
            const MAX_FREQ = 1000;
            const MIN_LAG = Math.floor(44100 / MAX_FREQ); // 约44
            const MAX_LAG = Math.floor(44100 / MIN_FREQ); // 约400

            const BUFFER_SIZE = 2048;
            const RMS_THRESHOLD = 0.008;
            const AUTOCORR_THRESHOLD = 0.55;
            const SMOOTHING_ALPHA = 0.35;

            let audioContext = null;
            let analyser = null;
            let mediaStream = null;
            let isRunning = false;
            let animationId = null;
            let audioBuffer = null;
            let detectedFrequency = null;
            let smoothedFrequency = null;
            let currentCents = 0;
            let currentConcertMidi = -1;
            let currentSaxMidi = -1;
            let currentVolume = 0;
            let targetMidi = -1; // -1 = 自動
            let lastStableNote = -1;
            let frameCount = 0;

            // DOM要素
            const startBtn = document.getElementById('startBtn');
            const saxNoteDisplay = document.getElementById('saxNoteDisplay');
            const saxOctave = document.getElementById('saxOctave');
            const concertNoteDisplay = document.getElementById('concertNoteDisplay');
            const freqDisplay = document.getElementById('freqDisplay');
            const centsDisplay = document.getElementById('centsDisplay');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const volumeBar = document.getElementById('volumeBar');
            const meterCanvas = document.getElementById('meterCanvas');
            const meterCtx = meterCanvas.getContext('2d');
            const targetButtons = document.querySelectorAll('.target-btn');

            // ==================== 音符ユーティリティ ====================
            function midiToFreq(midi) {
                return A4_FREQ * Math.pow(2, (midi - A4_MIDI) / 12);
            }

            function freqToMidi(freq) {
                return 12 * Math.log2(freq / A4_FREQ) + A4_MIDI;
            }

            function midiToNoteName(midi, useFlat = false) {
                const names = useFlat ? NOTE_NAMES_FLAT : NOTE_NAMES_SHARP;
                const noteIndex = ((midi % 12) + 12) % 12;
                const octave = Math.floor(midi / 12) - 1;
                return { name: names[noteIndex], octave: octave, noteIndex: noteIndex };
            }

            function centsFromFreq(freq, referenceMidi) {
                const refFreq = midiToFreq(referenceMidi);
                return 1200 * Math.log2(freq / refFreq);
            }

            // サックス記譜音のMIDIを取得 (concert MIDI + 9)
            function saxMidiFromConcert(concertMidi) {
                return concertMidi + SAX_TRANSPOSE;
            }

            function formatNoteDisplay(midi, useFlat = false) {
                const info = midiToNoteName(midi, useFlat);
                return { name: info.name, octave: info.octave, noteIndex: info.noteIndex };
            }

            // ==================== オーディオ処理 ====================
            async function startAudio() {
                if (isRunning) return;
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            channelCount: 1,
                            sampleRate: 44100,
                        }
                    });
                    audioContext = new(window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
                    await audioContext.resume();

                    const source = audioContext.createMediaStreamSource(mediaStream);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = BUFFER_SIZE * 2;
                    analyser.smoothingTimeConstant = 0;
                    source.connect(analyser);

                    audioBuffer = new Float32Array(BUFFER_SIZE);
                    isRunning = true;
                    startBtn.textContent = '⏹ 停止する';
                    startBtn.classList.add('running');
                    statusDot.className = 'status-dot listening';
                    statusText.textContent = '音を検出中... サックスを吹いてください';
                    updateTargetButtons();

                    if (!animationId) {
                        animationId = requestAnimationFrame(processLoop);
                    }
                } catch (err) {
                    console.error('マイクアクセスエラー:', err);
                    statusDot.className = 'status-dot idle-dot';
                    statusText.textContent = '⚠️ マイクへのアクセスが拒否されました。ブラウザの設定を確認してください。';
                    startBtn.textContent = '🎤 再試行する';
                }
            }

            function stopAudio() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                if (audioContext) {
                    audioContext.close().catch(() => {});
                    audioContext = null;
                }
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                isRunning = false;
                startBtn.textContent = '🎤 開始する';
                startBtn.classList.remove('running');
                statusDot.className = 'status-dot idle-dot';
                statusText.textContent = '停止しました。「開始する」で再開できます';
                centsDisplay.textContent = '音を検出しています...';
                centsDisplay.className = 'cents-readout idle';
                saxNoteDisplay.textContent = '--';
                saxOctave.textContent = '';
                concertNoteDisplay.textContent = '--';
                freqDisplay.textContent = '---.-';
                volumeBar.style.width = '0%';
                detectedFrequency = null;
                smoothedFrequency = null;
                currentCents = 0;
                currentConcertMidi = -1;
                currentSaxMidi = -1;
                drawMeter(0, false);
            }

            // ==================== 音高検出 (自己相関法) ====================
            function autoCorrelate(buf, sampleRate) {
                const n = buf.length;
                let mean = 0;
                for (let i = 0; i < n; i++) mean += buf[i];
                mean /= n;

                // 去直流
                let rms = 0;
                for (let i = 0; i < n; i++) {
                    const v = buf[i] - mean;
                    buf[i] = v;
                    rms += v * v;
                }
                rms = Math.sqrt(rms / n);
                if (rms < RMS_THRESHOLD) return { freq: null, rms: rms, confidence: 0 };

                const minLag = MIN_LAG;
                const maxLag = Math.min(MAX_LAG, Math.floor(n / 2));

                let bestLag = -1;
                let bestCorr = -Infinity;
                let bestNormCorr = -Infinity;

                // エネルギー計算
                let energy0 = 0;
                for (let i = 0; i < n - minLag; i++) {
                    energy0 += buf[i] * buf[i];
                }
                if (energy0 < 1e-10) return { freq: null, rms: rms, confidence: 0 };

                // 自己相関計算（正規化つき）
                for (let lag = minLag; lag <= maxLag; lag++) {
                    let corr = 0;
                    const len = n - lag;
                    for (let i = 0; i < len; i++) {
                        corr += buf[i] * buf[i + lag];
                    }
                    let energy1 = 0;
                    for (let i = lag; i < n; i++) {
                        energy1 += buf[i] * buf[i];
                    }
                    const normCorr = corr / Math.sqrt(energy0 * energy1 + 1e-12);
                    if (normCorr > bestNormCorr) {
                        bestNormCorr = normCorr;
                        bestCorr = corr;
                        bestLag = lag;
                    }
                }

                if (bestNormCorr < AUTOCORR_THRESHOLD) {
                    return { freq: null, rms: rms, confidence: bestNormCorr };
                }

                // 放物線補間で精度向上
                let refinedLag = bestLag;
                if (bestLag > minLag && bestLag < maxLag) {
                    const c0 = bestNormCorr;
                    let corrL = 0,
                        corrR = 0;
                    const lenL = n - (bestLag - 1);
                    for (let i = 0; i < lenL; i++) corrL += buf[i] * buf[i + bestLag - 1];
                    const lenR = n - (bestLag + 1);
                    for (let i = 0; i < lenR; i++) corrR += buf[i] * buf[i + bestLag + 1];
                    let energyL = 0,
                        energyR = 0;
                    for (let i = bestLag - 1; i < n; i++) energyL += buf[i] * buf[i];
                    for (let i = bestLag + 1; i < n; i++) energyR += buf[i] * buf[i];
                    const cL = corrL / Math.sqrt(energy0 * energyL + 1e-12);
                    const cR = corrR / Math.sqrt(energy0 * energyR + 1e-12);
                    const denom = cL - 2 * c0 + cR;
                    if (Math.abs(denom) > 1e-12) {
                        const delta = 0.5 * (cL - cR) / denom;
                        if (delta > -1 && delta < 1) {
                            refinedLag = bestLag + delta;
                        }
                    }
                }

                const freq = sampleRate / refinedLag;
                return { freq: freq, rms: rms, confidence: bestNormCorr };
            }

            // ==================== メイン処理ループ ====================
            function processLoop() {
                if (!isRunning) return;

                if (analyser && audioBuffer) {
                    analyser.getFloatTimeDomainData(audioBuffer);
                    const result = autoCorrelate(audioBuffer, audioContext ? audioContext.sampleRate : 44100);

                    currentVolume = result.rms;
                    volumeBar.style.width = Math.min(100, result.rms * 120) + '%';

                    if (result.freq !== null && result.freq >= MIN_FREQ && result.freq <= MAX_FREQ) {
                        if (smoothedFrequency === null || Math.abs(result.freq - smoothedFrequency) > 30) {
                            smoothedFrequency = result.freq;
                        } else {
                            smoothedFrequency = SMOOTHING_ALPHA * result.freq + (1 - SMOOTHING_ALPHA) *
                                smoothedFrequency;
                        }
                        detectedFrequency = smoothedFrequency;

                        const midiFloat = freqToMidi(detectedFrequency);
                        currentConcertMidi = Math.round(midiFloat);
                        currentSaxMidi = saxMidiFromConcert(currentConcertMidi);
                        currentCents = (midiFloat - currentConcertMidi) * 100;

                        // 安定検出
                        if (currentConcertMidi === lastStableNote) {
                            frameCount++;
                        } else {
                            lastStableNote = currentConcertMidi;
                            frameCount = 0;
                        }
                        const isStable = frameCount > 6;

                        updateDisplay(detectedFrequency, currentConcertMidi, currentSaxMidi, currentCents,
                            isStable);
                        drawMeter(currentCents, isStable);
                    } else {
                        if (result.rms >= RMS_THRESHOLD && result.confidence > 0.4) {
                            // 有信号但音高检测不可靠
                            drawMeter(currentCents, false);
                            if (currentConcertMidi === -1) {
                                centsDisplay.textContent = '音を検出中...';
                                centsDisplay.className = 'cents-readout idle';
                            }
                        } else {
                            // 無信号
                            drawMeter(0, false);
                            if (smoothedFrequency !== null) {
                                smoothedFrequency = null;
                            }
                            if (currentConcertMidi === -1) {
                                centsDisplay.textContent = '音を検出しています...';
                                centsDisplay.className = 'cents-readout idle';
                            }
                        }
                    }
                }

                animationId = requestAnimationFrame(processLoop);
            }

            // ==================== 表示更新 ====================
            function updateDisplay(freq, concertMidi, saxMidi, cents, isStable) {
                // 周波数表示
                freqDisplay.textContent = freq.toFixed(1);

                // サックス記譜音
                const saxInfo = formatNoteDisplay(saxMidi, false);
                saxNoteDisplay.textContent = saxInfo.name;
                saxOctave.textContent = saxInfo.octave;

                // Concert pitch
                const concertInfo = formatNoteDisplay(concertMidi, false);
                concertNoteDisplay.textContent = concertInfo.name + concertInfo.octave;

                // 音分偏差表示
                const absCents = Math.abs(cents);
                const centsStr = (cents > 0 ? '+' : '') + cents.toFixed(1);
                const formattedCents = centsStr + ' セント';

                if (absCents < 5) {
                    centsDisplay.textContent = '✓ ' + formattedCents;
                    centsDisplay.className = 'cents-readout good';
                } else if (absCents < 12) {
                    centsDisplay.textContent = (cents > 0 ? '▲ ' : '▼ ') + formattedCents;
                    centsDisplay.className = 'cents-readout warn';
                } else {
                    centsDisplay.textContent = (cents > 0 ? '▲▲ ' : '▼▼ ') + formattedCents;
                    centsDisplay.className = 'cents-readout bad';
                }

                // 目标音符匹配检查
                if (targetMidi >= 0) {
                    const targetSaxMidi = saxMidiFromConcert(targetMidi);
                    if (saxMidi === targetSaxMidi && absCents < 8) {
                        centsDisplay.textContent = '🎯 目標に一致！ ' + formattedCents;
                        centsDisplay.className = 'cents-readout good';
                    }
                }

                if (isStable && absCents < 5) {
                    statusText.textContent = '✓ 安定しています - 音程良好';
                } else if (isStable) {
                    statusText.textContent = '音は安定 - ピッチを調整してください';
                } else {
                    statusText.textContent = '音を検出中... サックスを吹いてください';
                }
            }

            // ==================== メーター描画 ====================
            function drawMeter(cents, isStable) {
                const canvas = meterCanvas;
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                const w = rect.width;
                const h = rect.height;

                if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
                    canvas.width = w * dpr;
                    canvas.height = h * dpr;
                    meterCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }

                const ctx = meterCtx;
                ctx.clearRect(0, 0, w, h);

                const cx = w / 2;
                const cy = h * 0.88;
                const radius = Math.min(w * 0.42, h * 0.75);
                const startAngle = Math.PI;
                const endAngle = 0;
                const totalAngle = Math.PI; // 180度
                const minCents = -50;
                const maxCents = 50;
                const centsRange = maxCents - minCents;

                // 背景弧
                ctx.beginPath();
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.lineCap = 'round';
                ctx.lineWidth = radius * 0.28;
                ctx.strokeStyle = '#1e2a3a';
                ctx.stroke();

                // 色域（绿色区域 ±5音分）
                const greenStartAngle = startAngle + (5 - minCents) / centsRange * totalAngle;
                const greenEndAngle = startAngle + (55 - minCents) / centsRange * totalAngle;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, greenStartAngle, greenEndAngle);
                ctx.lineWidth = radius * 0.28;
                ctx.strokeStyle = 'rgba(46, 204, 113, 0.65)';
                ctx.lineCap = 'butt';
                ctx.stroke();

                // 黄色区域 ±5〜±12音分
                const yellowStartAngle1 = startAngle + (12 - minCents) / centsRange * totalAngle;
                const yellowEndAngle1 = greenStartAngle;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, yellowStartAngle1, yellowEndAngle1);
                ctx.lineWidth = radius * 0.28;
                ctx.strokeStyle = 'rgba(243, 156, 18, 0.55)';
                ctx.lineCap = 'butt';
                ctx.stroke();

                const yellowStartAngle2 = greenEndAngle;
                const yellowEndAngle2 = startAngle + (88 - minCents) / centsRange * totalAngle;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, yellowStartAngle2, yellowEndAngle2);
                ctx.lineWidth = radius * 0.28;
                ctx.strokeStyle = 'rgba(243, 156, 18, 0.55)';
                ctx.lineCap = 'butt';
                ctx.stroke();

                // 刻度标记
                const tickMarks = [-40, -30, -20, -10, 0, 10, 20, 30, 40];
                for (const tick of tickMarks) {
                    const angle = startAngle + (tick - minCents) / centsRange * totalAngle;
                    const innerR = radius - radius * 0.22;
                    const outerR = radius + radius * 0.18;
                    const innerX = cx + Math.cos(angle) * innerR;
                    const innerY = cy - Math.sin(angle) * innerR;
                    const outerX = cx + Math.cos(angle) * outerR;
                    const outerY = cy - Math.sin(angle) * outerR;
                    ctx.beginPath();
                    ctx.moveTo(innerX, innerY);
                    ctx.lineTo(outerX, outerY);
                    ctx.lineWidth = tick === 0 ? 3 : 1.5;
                    ctx.strokeStyle = tick === 0 ? '#ffffff' : 'rgba(200, 210, 230, 0.6)';
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // 标签
                    const labelR = radius + radius * 0.32;
                    const labelX = cx + Math.cos(angle) * labelR;
                    const labelY = cy - Math.sin(angle) * labelR;
                    ctx.fillStyle = tick === 0 ? '#ffffff' : 'rgba(180, 190, 210, 0.7)';
                    ctx.font = `${Math.max(9, radius * 0.12)}px 'Segoe UI', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(Math.abs(tick).toString(), labelX, labelY);
                }

                // 中央标签 "0"
                const centerAngle = startAngle + (0 - minCents) / centsRange * totalAngle;
                const centerLabelX = cx + Math.cos(centerAngle) * (radius + radius * 0.5);
                const centerLabelY = cy - Math.sin(centerAngle) * (radius + radius * 0.5);
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.max(11, radius * 0.16)}px 'Segoe UI', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('0', centerLabelX, centerLabelY);

                // 指针
                const clampedCents = Math.max(minCents, Math.min(maxCents, cents));
                const needleAngle = startAngle + (clampedCents - minCents) / centsRange * totalAngle;
                const needleLength = radius * 0.82;
                const needleX = cx + Math.cos(needleAngle) * needleLength;
                const needleY = cy - Math.sin(needleAngle) * needleLength;

                ctx.beginPath();
                ctx.moveTo(cx - Math.cos(needleAngle) * radius * 0.1, cy + Math.sin(needleAngle) * radius * 0.1);
                ctx.lineTo(needleX, needleY);
                ctx.lineTo(cx + Math.cos(needleAngle) * radius * 0.1, cy - Math.sin(needleAngle) * radius * 0.1);
                ctx.closePath();
                const needleColor = isStable ? (Math.abs(cents) < 5 ? '#2ecc71' : Math.abs(cents) < 12 ? '#f39c12' :
                    '#e74c3c') : '#ff6b6b';
                ctx.fillStyle = needleColor;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 中心圆点
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 0.09, 0, Math.PI * 2);
                ctx.fillStyle = '#e0e0e8';
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 中央音分数字
                const displayCents = Math.abs(cents);
                const centsStr = (cents > 0 ? '+' : '') + cents.toFixed(1);
                ctx.fillStyle = Math.abs(cents) < 5 ? '#2ecc71' : Math.abs(cents) < 12 ? '#f39c12' : '#e74c3c';
                ctx.font = `bold ${Math.max(16, radius * 0.22)}px 'Segoe UI', monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(centsStr, cx, cy - radius * 0.25);
                ctx.font = `${Math.max(8, radius * 0.1)}px 'Segoe UI', sans-serif`;
                ctx.fillStyle = 'rgba(180,190,210,0.7)';
                ctx.fillText('セント', cx, cy - radius * 0.08);

                // "FLAT" / "SHARP" 标签
                ctx.font = `${Math.max(9, radius * 0.11)}px 'Segoe UI', sans-serif`;
                ctx.fillStyle = 'rgba(180,190,210,0.7)';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('♭ FLAT', cx - radius * 0.95, cy + radius * 0.55);
                ctx.textAlign = 'right';
                ctx.fillText('SHARP ♯', cx + radius * 0.95, cy + radius * 0.55);
            }

            // ==================== 目标音符按钮 ====================
            function updateTargetButtons() {
                targetButtons.forEach(btn => {
                    const target = parseInt(btn.dataset.target, 10);
                    if (target === targetMidi) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            targetButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    targetMidi = parseInt(btn.dataset.target, 10);
                    updateTargetButtons();
                    if (targetMidi >= 0) {
                        const targetSaxMidi = saxMidiFromConcert(targetMidi);
                        const saxInfo = formatNoteDisplay(targetSaxMidi, false);
                        statusText.textContent =
                            `目標: サックス${saxInfo.name}${saxInfo.octave} (Concert ${midiToNoteName(targetMidi,false).name}${midiToNoteName(targetMidi,false).octave}) に合わせてください`;
                    } else {
                        statusText.textContent = '自動モード: 検出した音を表示します';
                    }
                });
            });

            // ==================== 開始/停止ボタン ====================
            startBtn.addEventListener('click', async () => {
                if (isRunning) {
                    stopAudio();
                } else {
                    await startAudio();
                }
            });

            // ==================== 初期描画 ====================
            function initMeter() {
                drawMeter(0, false);
                statusDot.className = 'status-dot idle-dot';
                statusText.textContent = 'マイクの許可が必要です。「開始する」を押してください';
            }

            // ウィンドウリサイズでメーター再描画
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    drawMeter(currentCents, frameCount > 6);
                }, 100);
            });

            // ==================== 初期化 ====================
            initMeter();
            updateTargetButtons();

            // 初期の音符表示
            saxNoteDisplay.textContent = '--';
            saxOctave.textContent = '';
            concertNoteDisplay.textContent = '--';
            freqDisplay.textContent = '---.-';
            centsDisplay.textContent = '音を検出しています...';
            centsDisplay.className = 'cents-readout idle';
            volumeBar.style.width = '0%';

            console.log('🎷 アルトサックス専用チューナーを読み込みました');
            console.log('   - Concert音 + 9半音 = サックス記譜音');
            console.log('   - 周波数範囲: ' + MIN_FREQ + '〜' + MAX_FREQ + ' Hz');
            console.log('   - 自己相関法によるピッチ検出');
            console.log('   - A4 = ' + A4_FREQ + ' Hz 基準');
        })();
    </script>
</body>
