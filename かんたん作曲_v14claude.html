<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PWA Previewer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --danger:#ff453a;
  --ok:#30d158;
  --mark:#ffd60a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);min-height:100%}
body.lock-scroll{position:fixed;inset:0;overflow:hidden;width:100%}
button,textarea,input{font:inherit}
button{border:0;color:var(--text);background:var(--panel2);border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
button.primary{background:var(--accent)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #38383c}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.4;pointer-events:none}
.app{max-width:1100px;margin:auto;padding-top:0}

/* card row (horizontal scroll) */
.card-row{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
  padding:0 4px 14px;margin:0 -4px 6px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.card-row::-webkit-scrollbar{height:0}
.card{
  scroll-snap-align:start;
  flex:0 0 auto;width:132px;height:96px;
  background:var(--panel);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;justify-content:space-between;
  border:2px solid transparent;cursor:pointer;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;transition:border-color .15s,background .15s;
  position:relative;
}
.card:active{background:var(--panel2)}
.card.active{border-color:var(--accent);background:#0a84ff18}
.card-name{font-weight:600;font-size:14px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.card-meta{font-size:10.5px;color:var(--muted);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.card-new{
  align-items:center;justify-content:center;color:var(--muted);
  border:2px dashed #3a3a3c;background:transparent;
}
.card-new .plus{font-size:26px;font-weight:300;color:var(--muted);line-height:1}
.card-new .label{font-size:12px;margin-top:4px}
.card-empty-hint{font-size:12.5px;color:var(--muted);padding:2px 4px 10px}

/* tap-hint toast: "長押しで編集" */
.tap-hint{
  position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));
  transform:translate(-50%,8px);
  background:rgba(60,60,65,.92);color:#fff;font-size:13px;font-weight:500;
  padding:9px 16px;border-radius:14px;z-index:200;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.tap-hint.show{opacity:1;transform:translate(-50%,0)}

/* device previews */
.devices{position:relative;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start;padding:4px 0 24px}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.device-label{font-size:12px;color:var(--muted);font-weight:500}

/* fullscreen trigger: icon button, docked to the right of the iPhone,
   iPhone itself stays horizontally centered in .devices */
.phone-col{position:relative;display:flex;flex-direction:column;align-items:center}
.btn-fullscreen{
  position:absolute;top:50%;left:100%;transform:translateY(-50%);
  margin-left:10px;
  width:38px;height:38px;min-height:0;padding:0;border-radius:50%;
  background:var(--panel2);display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.btn-fullscreen svg{width:18px;height:18px;display:block}
@media(max-width:420px){
  .btn-fullscreen{
    position:static;transform:none;margin-left:0;margin-top:8px;
  }
  .phone-col{flex-direction:column}
}

/* iPhone 17 Pro: 402x874 CSS pt @3x (real device point size) */
.phone{
  position:relative;
  width:min(300px,86vw);
  aspect-ratio:402/874;
  background:#000;border:6px solid #202023;border-radius:52px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.phone-viewport{position:absolute;inset:0;overflow:hidden;border-radius:46px}
.phone-viewport iframe{
  position:absolute;top:0;left:0;
  width:402px;height:874px;border:0;background:#000;color-scheme:dark;
  transform-origin:top left;
}
.island{
  position:absolute;z-index:5;top:11px;left:50%;transform:translateX(-50%);
  width:33.5%;height:7.125%;max-height:25.5px;background:#000;border-radius:100px;pointer-events:none;
}
.homebar{
  position:absolute;z-index:6;bottom:8px;left:50%;transform:translateX(-50%);
  width:36%;height:4px;border-radius:4px;background:#fff;pointer-events:none;opacity:.9;
}

/* iPad 7th gen: 810x1080 CSS pt landscape */
.ipad{
  position:relative;
  width:min(460px,92vw);
  aspect-ratio:1080/810;
  background:#000;border:10px solid #2a2a2e;border-radius:22px;overflow:hidden;
  box-shadow:0 14px 40px #000,0 0 0 1px #444;
}
.ipad-viewport{position:absolute;inset:0;overflow:hidden;border-radius:0}
.ipad-viewport iframe{
  position:absolute;top:0;left:0;
  width:1080px;height:810px;border:0;background:#000;color-scheme:dark;
  transform-origin:top left;
}

/* editor (opened via long-press) */
.editor-overlay{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);
  display:none;align-items:flex-end;justify-content:center;overscroll-behavior:none;
}
.editor-overlay.show{display:flex}
.editor-sheet{
  width:100%;max-width:900px;max-height:92vh;overflow:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px #000;
  -webkit-overflow-scrolling:touch;
}
.sheet-handle{width:36px;height:5px;border-radius:3px;background:#48484a;margin:0 auto 12px}
.editor-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.editor-tools .name-input{
  flex:1;min-width:120px;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 12px;outline:none;
}
.editor-tools .name-input:focus{border-color:var(--accent)}
#count{font-size:13px;color:var(--muted);white-space:nowrap}
.search-box{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.search-box input{
  width:100%;height:40px;border:1px solid #38383c;border-radius:12px;
  background:#111113;color:#fff;padding:0 11px;outline:none;
}
.search-box button{min-height:40px;padding:0 12px;font-size:13px}
#searchResult{font-size:11px;color:var(--muted);white-space:nowrap}
.editor-textwrap{position:relative;background:#111113;border:1px solid #38383c;border-radius:14px}
.editor-textwrap:focus-within{border-color:var(--accent)}
.editor-textwrap textarea,
.editor-textwrap .highlight-layer{
  width:100%;height:min(42vh,360px);
  padding:14px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;
  white-space:pre-wrap;word-break:break-all;
  box-sizing:border-box;margin:0;border:0;
}
textarea{
  resize:vertical;
  background:transparent;color:#f5f5f7;
  outline:none;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  position:relative;z-index:1;
  border-radius:14px;
}
.highlight-layer{
  position:absolute;top:0;left:0;z-index:0;
  overflow:hidden;
  color:transparent;
  pointer-events:none;
  border-radius:14px;
}
.highlight-layer mark.hit{background:var(--mark);color:transparent;border-radius:2px}
.highlight-layer mark.hit.current{background:var(--accent);color:transparent}
.status{font-size:12px;color:var(--muted);padding:2px 4px 8px}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.editor-actions button{flex:1;min-width:100px}
.editor-actions .row2{display:flex;gap:8px;width:100%}
.editor-actions .row2 button{flex:1}

/* fullscreen */
.fullscreen{position:fixed;inset:0;z-index:100;background:#000;padding:0;display:none;overscroll-behavior:none}
.fullscreen.show{display:block}
.fullscreen-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fullscreen iframe{border:0;background:#000;color-scheme:dark}
.fullscreen .exit{
  position:absolute;z-index:10;top:max(12px,env(safe-area-inset-top));right:14px;
  width:40px;height:40px;padding:0;border-radius:50%;
  background:rgba(0,0,0,.28);color:#fff;font-size:19px;
  display:flex;align-items:center;justify-content:center;line-height:1;
}

@media(min-width:800px){
  .phone{width:min(330px,32vw)}
  .ipad{width:min(520px,46vw)}
}
</style>
</head>
<body>
<div class="app">

  <div id="cardRow" class="card-row"></div>
  <div id="emptyHint" class="card-empty-hint" style="display:none">まだHTMLがありません。右端の「＋」から追加してください。長押しで編集・削除できます。</div>
  <div id="tapHint" class="tap-hint">長押しで編集</div>

  <div class="devices">
    <div class="device-wrap phone-col">
      <div class="phone" id="phone">
        <div class="island"></div>
        <div class="phone-viewport">
          <iframe id="framePhone" title="iPhone preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
        </div>
        <div class="homebar"></div>
      </div>
      <button id="btnFullscreen" class="btn-fullscreen" aria-label="全画面プレビュー" title="全画面プレビュー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="8 3 3 3 3 8"></polyline>
          <polyline points="16 3 21 3 21 8"></polyline>
          <polyline points="3 16 3 21 8 21"></polyline>
          <polyline points="21 16 21 21 16 21"></polyline>
        </svg>
      </button>
    </div>
    <div class="device-wrap">
      <div class="ipad" id="ipad">
        <div class="ipad-viewport">
          <iframe id="frameIpad" title="iPad preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- EDITOR SHEET (opened by long-press on a card) -->
<div id="editorOverlay" class="editor-overlay">
  <div class="editor-sheet">
    <div class="sheet-handle"></div>
    <div class="editor-tools">
      <input id="nameInput" class="name-input" type="text" placeholder="名前を入力" maxlength="80" autocomplete="off">
      <span id="count">0文字</span>
    </div>
    <div class="editor-tools">
      <div class="search-box">
        <input id="search" type="search" placeholder="検索" autocomplete="off">
        <button id="btnSearchNext" class="ghost">次へ</button>
        <span id="searchResult"></span>
      </div>
    </div>
    <div class="status">HTML・CSS・JavaScriptをそのまま貼り付けてください。保存すると一覧に反映されます。</div>
    <div class="editor-textwrap">
      <div id="highlightLayer" class="highlight-layer" aria-hidden="true"></div>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="<!doctype html> ..."></textarea>
    </div>
    <div class="editor-actions">
      <div class="row2">
        <button id="btnSave" class="primary">保存</button>
        <button id="btnCancel" class="ghost">キャンセル</button>
      </div>
      <div class="row2">
        <button id="btnClear" class="ghost">クリア</button>
        <button id="btnDelete" class="danger">削除</button>
      </div>
    </div>
  </div>
</div>

<!-- FULLSCREEN PREVIEW (single button, device switch inside) -->
<div id="fullscreen" class="fullscreen">
  <button class="exit" id="exit">×</button>
  <div class="fullscreen-stage" id="fsStage">
    <iframe id="fullFrame" title="Full screen preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "pwa-previewer-items-v2";
  const OLD_KEY = "iphone17pro-pwa-preview-html-v1";

  // real device CSS-point sizes
  const PHONE_W = 402, PHONE_H = 874;   // iPhone 17 Pro (portrait)
  const IPAD_W = 1080, IPAD_H = 810;    // iPad 7th gen (landscape)

  let items = [];
  let selectedId = null;
  let editingId = null; // null = new (only meaningful while sheet open)

  const source = $("source");
  const nameInput = $("nameInput");
  const framePhone = $("framePhone");
  const frameIpad = $("frameIpad");
  const fullFrame = $("fullFrame");

  // ---------- storage ----------
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        items = JSON.parse(raw);
        if (!Array.isArray(items)) items = [];
      } else {
        const old = localStorage.getItem(OLD_KEY);
        if (old) {
          items = [{ id: uid(), name: "移行したHTML", html: old, updated: Date.now() }];
          persist();
        }
      }
    } catch (e) {
      items = [];
    }
    if (items.length && !selectedId) selectedId = items[0].id;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ---------- device scaling ----------
  function fitIframe(iframe, wrapEl, deviceW, deviceH) {
    const rect = wrapEl.getBoundingClientRect();
    // Use max of width/height ratio so the iframe always fully covers the
    // viewport (no leftover black strip from rounding/aspect mismatch).
    const scale = Math.max(rect.width / deviceW, rect.height / deviceH);
    iframe.style.width = deviceW + "px";
    iframe.style.height = deviceH + "px";
    iframe.style.transform = `scale(${scale})`;
  }

  function resizeAllPreviews() {
    fitIframe(framePhone, document.querySelector(".phone-viewport"), PHONE_W, PHONE_H);
    fitIframe(frameIpad, document.querySelector(".ipad-viewport"), IPAD_W, IPAD_H);
  }

  function resizeFullscreen() {
    if (!$("fullscreen").classList.contains("show")) return;
    const stage = $("fsStage");
    const dW = PHONE_W;
    const dH = PHONE_H;
    const availW = stage.clientWidth;
    const availH = stage.clientHeight;
    const scale = Math.min(availW / dW, availH / dH);
    fullFrame.style.width = dW + "px";
    fullFrame.style.height = dH + "px";
    fullFrame.style.transform = `scale(${scale})`;
    fullFrame.style.transformOrigin = "center center";
  }

  window.addEventListener("resize", () => { resizeAllPreviews(); resizeFullscreen(); });

  // ---------- list rendering ----------
  function renderCards() {
    const row = $("cardRow");
    const sorted = items.slice().sort((a, b) => b.updated - a.updated);
    $("emptyHint").style.display = items.length ? "none" : "block";

    const cardsHtml = sorted.map(it => `
      <div class="card ${it.id === selectedId ? "active" : ""}" data-id="${it.id}">
        <div class="card-name">${escapeHtml(it.name || "無題")}</div>
        <div class="card-meta">${formatDate(it.updated)} · ${(it.html || "").length.toLocaleString()}字</div>
      </div>
    `).join("");

    const newCard = `<div class="card card-new" id="cardNew"><div class="plus">＋</div><div class="label">新規</div></div>`;

    row.innerHTML = cardsHtml + newCard;

    row.querySelectorAll(".card[data-id]").forEach(el => {
      let pressTimer = null;
      let longPressed = false;

      const startPress = () => {
        longPressed = false;
        pressTimer = setTimeout(() => {
          longPressed = true;
          openEditor(el.dataset.id, false);
        }, 480);
      };
      const cancelPress = () => { clearTimeout(pressTimer); };

      el.addEventListener("pointerdown", startPress);
      el.addEventListener("pointerup", cancelPress);
      el.addEventListener("pointerleave", cancelPress);
      el.addEventListener("pointercancel", cancelPress);
      el.addEventListener("click", () => {
        if (longPressed) return; // long-press already handled it
        selectedId = el.dataset.id;
        renderCards();
        updatePreview();
        showTapHint();
      });
      el.addEventListener("contextmenu", e => e.preventDefault());
    });

    $("cardNew").onclick = () => openEditor(null, true);
  }

  let tapHintTimer = null;
  function showTapHint() {
    const el = $("tapHint");
    el.classList.add("show");
    clearTimeout(tapHintTimer);
    tapHintTimer = setTimeout(() => el.classList.remove("show"), 1400);
  }

  function clearPreviews() {
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  function updatePreview() {
    const it = items.find(x => x.id === selectedId);
    if (!it) { clearPreviews(); return; }
    const html = it.html || "";
    framePhone.srcdoc = html;
    frameIpad.srcdoc = html;
    requestAnimationFrame(resizeAllPreviews);
  }

  // ---------- editor sheet ----------
  let searchMatches = [];
  let searchIndex = -1;

  function openEditor(id, isNew) {
    editingId = isNew ? null : id;
    if (isNew) {
      nameInput.value = "";
      source.value = "";
    } else {
      const it = items.find(x => x.id === id);
      nameInput.value = it ? (it.name || "") : "";
      source.value = it ? (it.html || "") : "";
    }
    $("btnDelete").style.display = isNew ? "none" : "flex";
    updateCount();
    $("search").value = "";
    $("searchResult").textContent = "";
    clearSearchHighlight();
    $("editorOverlay").classList.add("show");
    document.body.classList.add("lock-scroll");
    setTimeout(() => nameInput.focus(), 50);
  }

  function closeEditor() {
    $("editorOverlay").classList.remove("show");
    document.body.classList.remove("lock-scroll");
  }

  function updateCount() {
    $("count").textContent = source.value.length.toLocaleString() + "文字";
  }

  function saveCurrent() {
    const name = (nameInput.value || "").trim() || "無題";
    const html = source.value;
    if (editingId) {
      const it = items.find(x => x.id === editingId);
      if (it) { it.name = name; it.html = html; it.updated = Date.now(); }
      selectedId = editingId;
    } else {
      const id = uid();
      items.push({ id, name, html, updated: Date.now() });
      selectedId = id;
    }
    persist();
    closeEditor();
    renderCards();
    updatePreview();
  }

  function deleteCurrent() {
    if (!editingId) return;
    const it = items.find(x => x.id === editingId);
    if (!it) return;
    if (!confirm(`「${it.name || "無題"}」を削除しますか？`)) return;
    items = items.filter(x => x.id !== editingId);
    if (selectedId === editingId) selectedId = items.length ? items[0].id : null;
    persist();
    closeEditor();
    renderCards();
    updatePreview();
  }

  // textarea search with a synced highlight-layer (mark.hit) behind the
  // text, so matches are visibly highlighted, plus accurate scroll-to-match.
  const highlightLayer = $("highlightLayer");

  function clearSearchHighlight() {
    searchMatches = [];
    searchIndex = -1;
    highlightLayer.innerHTML = "";
  }

  function escapeHtmlForHighlight(s) {
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderHighlightLayer(text, matches, qLen, currentIdx) {
    if (!matches.length) { highlightLayer.innerHTML = ""; return; }
    let html = "";
    let pos = 0;
    matches.forEach((start, i) => {
      html += escapeHtmlForHighlight(text.slice(pos, start));
      const matchText = escapeHtmlForHighlight(text.slice(start, start + qLen));
      const cls = i === currentIdx ? "hit current" : "hit";
      html += `<mark class="${cls}">${matchText}</mark>`;
      pos = start + qLen;
    });
    html += escapeHtmlForHighlight(text.slice(pos));
    // trailing newline needs a filler so layer height matches textarea
    highlightLayer.innerHTML = html + "\n";
  }

  function syncHighlightScroll() {
    highlightLayer.scrollTop = source.scrollTop;
    highlightLayer.scrollLeft = source.scrollLeft;
  }

  function runSearch(advance) {
    const q = $("search").value;
    const text = source.value;

    if (!q) {
      $("searchResult").textContent = "";
      clearSearchHighlight();
      return;
    }

    const matches = [];
    let pos = 0;
    while (true) {
      const idx = text.indexOf(q, pos);
      if (idx === -1) break;
      matches.push(idx);
      pos = idx + Math.max(q.length, 1);
    }
    searchMatches = matches;

    if (!matches.length) {
      $("searchResult").textContent = "0件";
      searchIndex = -1;
      renderHighlightLayer(text, [], q.length, -1);
      return;
    }

    if (advance) {
      searchIndex = (searchIndex + 1) % matches.length;
    } else if (searchIndex === -1 || searchIndex >= matches.length) {
      searchIndex = 0;
    }

    renderHighlightLayer(text, matches, q.length, searchIndex);

    const start = matches[searchIndex];
    const end = start + q.length;
    source.setSelectionRange(start, end);
    scrollTextareaToSelection(start);
    syncHighlightScroll();
    $("searchResult").textContent = `${searchIndex + 1}/${matches.length}件`;
  }

  // scroll a plain textarea so the given char offset is roughly centered,
  // using a hidden mirror div so wrapped lines are measured accurately.
  function scrollTextareaToSelection(charIndex) {
    const mirror = document.createElement("div");
    const cs = getComputedStyle(source);
    ["fontFamily","fontSize","fontWeight","lineHeight","letterSpacing",
     "paddingTop","paddingRight","paddingBottom","paddingLeft",
     "borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth",
     "boxSizing","whiteSpace","wordBreak"].forEach(p => { mirror.style[p] = cs[p]; });
    mirror.style.position = "absolute";
    mirror.style.visibility = "hidden";
    mirror.style.height = "auto";
    mirror.style.width = source.clientWidth + "px";
    mirror.style.top = "0";
    mirror.style.left = "-9999px";

    const before = document.createTextNode(source.value.slice(0, charIndex));
    const marker = document.createElement("span");
    marker.textContent = "\u200b";
    mirror.appendChild(before);
    mirror.appendChild(marker);
    document.body.appendChild(mirror);

    const targetTop = marker.offsetTop;
    document.body.removeChild(mirror);

    source.scrollTop = Math.max(0, targetTop - source.clientHeight / 2);
  }

  $("search").addEventListener("focus", () => { source.blur(); });
  $("search").addEventListener("input", () => { searchIndex = -1; runSearch(false); });
  $("search").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); runSearch(true); }
  });
  $("btnSearchNext").onclick = () => runSearch(true);
  source.addEventListener("scroll", syncHighlightScroll);

  // ---------- fullscreen ----------
  function openFullscreen() {
    const it = items.find(x => x.id === selectedId);
    if (!it) { alert("表示する項目を一覧から選んでください"); return; }
    fullFrame.srcdoc = it.html || "";
    $("fullscreen").classList.add("show");
    document.body.classList.add("lock-scroll");
    requestAnimationFrame(resizeFullscreen);
  }

  $("btnFullscreen").onclick = openFullscreen;
  $("exit").onclick = () => {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
    document.body.classList.remove("lock-scroll");
  };

  // ---------- editor events ----------
  $("btnSave").onclick = saveCurrent;
  $("btnCancel").onclick = closeEditor;
  $("btnDelete").onclick = deleteCurrent;
  $("btnClear").onclick = () => {
    source.value = "";
    updateCount();
    $("search").value = "";
    $("searchResult").textContent = "";
    clearSearchHighlight();
    source.focus();
  };
  source.addEventListener("input", () => {
    updateCount();
    // text changed — re-run search against new content if one is active
    if ($("search").value) { runSearch(false); } else { clearSearchHighlight(); }
  });
  $("editorOverlay").addEventListener("click", (e) => {
    if (e.target === $("editorOverlay")) closeEditor();
  });

  // ---------- init ----------
  load();
  renderCards();
  updatePreview();
  requestAnimationFrame(resizeAllPreviews);
})();
</script>
</body>
