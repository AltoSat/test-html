<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PWA Preview">
  <title>iPhone 17 Pro PWAプレビューア</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #000000;
      --surface: rgba(28, 28, 30, 0.92);
      --surface-2: rgba(44, 44, 46, 0.92);
      --line: rgba(255, 255, 255, 0.12);
      --line-soft: rgba(255, 255, 255, 0.07);
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --blue: #0a84ff;
      --blue-pressed: #0070d8;
      --red: #ff453a;
      --green: #30d158;

      --page-safe-top: max(14px, env(safe-area-inset-top));
      --page-safe-bottom: max(16px, env(safe-area-inset-bottom));

      --device-width: min(100%, 393px);
      --screen-aspect: 393 / 852;
      --device-radius: 54px;
      --screen-radius: 46px;

      --mock-safe-top: 62px;
      --mock-safe-bottom: 34px;
      --mock-island-width: 126px;
      --mock-island-height: 37px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        sans-serif;
    }

    body {
      overscroll-behavior-y: none;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .app {
      width: 100%;
      min-height: 100dvh;
      padding:
        var(--page-safe-top)
        max(16px, env(safe-area-inset-right))
        var(--page-safe-bottom)
        max(16px, env(safe-area-inset-left));
    }

    .shell {
      width: min(100%, 1100px);
      min-height: calc(100dvh - var(--page-safe-top) - var(--page-safe-bottom));
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
    }

    .title-wrap {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .segmented {
      flex: 0 0 auto;
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .segment {
      min-height: 38px;
      padding: 0 15px;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .segment.active {
      background: rgba(255, 255, 255, 0.16);
      color: var(--text);
    }

    .editor-panel,
    .preview-panel {
      display: none;
      min-height: 0;
    }

    .editor-panel.active,
    .preview-panel.active {
      display: flex;
    }

    .editor-panel {
      flex-direction: column;
      gap: 12px;
    }

    .editor-tools {
      display: grid;
      grid-template-columns: 1fr 1fr 1.35fr;
      gap: 8px;
    }

    .action {
      min-height: 47px;
      padding: 0 14px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      color: var(--text);
      font-size: 14px;
      font-weight: 680;
      transition: transform 0.14s ease, background 0.14s ease;
    }

    .action:active {
      transform: scale(0.98);
    }

    .action.primary {
      background: var(--blue);
      border-color: transparent;
    }

    .action.primary:active {
      background: var(--blue-pressed);
    }

    .action.danger {
      color: #ff9f98;
    }

    .editor-card {
      min-height: 0;
      display: flex;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 12px 42px rgba(0, 0, 0, 0.2);
    }

    #htmlInput {
      width: 100%;
      min-height: clamp(430px, 61dvh, 730px);
      resize: vertical;
      padding: 16px;
      border: 0;
      background: #101011;
      color: #f4f4f5;
      caret-color: var(--blue);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 13px;
      line-height: 1.55;
      tab-size: 2;
    }

    #htmlInput::placeholder {
      color: #6e6e73;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .preview-panel {
      position: relative;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: min(760px, 78dvh);
      padding: 12px 0;
    }

    .preview-tools {
      width: min(100%, 520px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .preview-status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .preview-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .small-action {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
    }

    .small-action.primary {
      background: var(--blue);
      border-color: transparent;
    }

    .device-scale {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    .iphone {
      position: relative;
      width: var(--device-width);
      aspect-ratio: var(--screen-aspect);
      padding: 6px;
      border-radius: var(--device-radius);
      background:
        linear-gradient(145deg, #3a3a3c 0%, #151516 24%, #060606 65%, #28282a 100%);
      box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.13);
      overflow: hidden;
      isolation: isolate;
    }

    .iphone::before {
      content: "";
      position: absolute;
      z-index: 10;
      top: 18%;
      right: -3px;
      width: 3px;
      height: 17%;
      border-radius: 3px 0 0 3px;
      background: #2e2e30;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08),
        0 142px 0 #2e2e30;
    }

    .iphone::after {
      content: "";
      position: absolute;
      z-index: 10;
      top: 20%;
      left: -3px;
      width: 3px;
      height: 9%;
      border-radius: 0 3px 3px 0;
      background: #2e2e30;
      box-shadow:
        0 72px 0 #2e2e30,
        0 124px 0 #2e2e30;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: var(--screen-radius);
      background: #000;
      isolation: isolate;
    }

    .preview-frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #000;
    }

    .screen-gloss {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }

    .status-area {
      position: absolute;
      z-index: 5;
      top: 0;
      right: 0;
      left: 0;
      height: var(--mock-safe-top);
      pointer-events: none;
    }

    .status-time {
      position: absolute;
      top: 16px;
      left: 25px;
      color: #fff;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: -0.02em;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }

    .status-icons {
      position: absolute;
      top: 18px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.48));
    }

    .signal {
      display: inline-flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 11px;
    }

    .signal i {
      display: block;
      width: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }

    .wifi {
      width: 14px;
      height: 10px;
      position: relative;
      overflow: hidden;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      border: 1.8px solid currentColor;
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      transform: translateX(-50%);
    }

    .wifi::before {
      top: 0;
      width: 14px;
      height: 8px;
    }

    .wifi::after {
      top: 4px;
      width: 7px;
      height: 4px;
    }

    .battery {
      position: relative;
      width: 20px;
      height: 10px;
      border: 1.3px solid currentColor;
      border-radius: 3px;
    }

    .battery::before {
      content: "";
      position: absolute;
      top: 2px;
      right: -3px;
      width: 2px;
      height: 4px;
      border-radius: 0 1px 1px 0;
      background: currentColor;
    }

    .battery::after {
      content: "";
      position: absolute;
      top: 1.5px;
      left: 1.5px;
      width: 13px;
      height: 5px;
      border-radius: 1px;
      background: currentColor;
    }

    .dynamic-island {
      position: absolute;
      z-index: 6;
      top: 10px;
      left: 50%;
      width: var(--mock-island-width);
      height: var(--mock-island-height);
      transform: translateX(-50%);
      border-radius: 21px;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 2px 4px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .dynamic-island::before {
      content: "";
      position: absolute;
      top: 50%;
      right: 12px;
      width: 9px;
      height: 9px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: #171719;
      box-shadow: 0 0 0 1px rgba(110, 87, 176, 0.22);
    }

    .dynamic-island::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 26px;
      width: 18px;
      height: 8px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: #080809;
    }

    .home-zone {
      position: absolute;
      z-index: 6;
      right: 0;
      bottom: 0;
      left: 0;
      height: var(--mock-safe-bottom);
      pointer-events: none;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.14), transparent);
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      width: 134px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .full-preview {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: none;
      place-items: center;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      background: #000;
    }

    .full-preview.active {
      display: grid;
    }

    .full-preview .preview-tools {
      position: fixed;
      z-index: 1010;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      width: min(calc(100% - 24px), 520px);
      transform: translateX(-50%);
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(28, 28, 30, 0.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .full-preview .device-scale {
      width: min(
        calc((100dvh - 72px) * var(--screen-aspect)),
        calc(100vw - 24px)
      );
    }

    .full-preview .iphone {
      width: 100%;
    }

    .full-preview .preview-status {
      padding-left: 5px;
    }

    @media (min-width: 760px) {
      .app {
        padding-top: 28px;
        padding-bottom: 28px;
      }

      .shell {
        grid-template-columns: minmax(370px, 1fr) minmax(390px, 460px);
        grid-template-rows: auto 1fr;
        align-items: stretch;
      }

      .topbar {
        grid-column: 1 / -1;
      }

      .editor-panel,
      .preview-panel {
        display: flex !important;
      }

      .preview-panel {
        min-height: 0;
        padding: 0;
      }

      .segmented {
        display: none;
      }

      .editor-card {
        min-height: 0;
      }

      #htmlInput {
        min-height: 0;
        height: 100%;
      }

      .device-scale {
        width: 100%;
      }

      .iphone {
        width: min(100%, 393px);
      }
    }

    @media (max-width: 380px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .segmented {
        width: 100%;
      }

      .segment {
        flex: 1;
      }

      .editor-tools {
        grid-template-columns: 1fr 1fr;
      }

      .editor-tools .primary {
        grid-column: 1 / -1;
      }

      .preview-tools {
        align-items: flex-start;
        flex-direction: column;
      }

      .preview-actions {
        width: 100%;
      }

      .small-action {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="shell" aria-label="iPhone 17 Pro PWAプレビューア">
      <header class="topbar">
        <div class="title-wrap">
          <h1 class="title">PWAプレビューア</h1>
          <p class="subtitle">iPhone 17 Pro・PWA起動状態を模擬</p>
        </div>

        <nav class="segmented" aria-label="表示モード">
          <button class="segment active" type="button" data-view="editor">HTML</button>
          <button class="segment" type="button" data-view="preview">プレビュー</button>
        </nav>
      </header>

      <section class="editor-panel active" id="editorPanel" aria-label="HTML入力">
        <div class="editor-tools">
          <button class="action primary" id="previewButton" type="button">プレビュー</button>
          <button class="action" id="sampleButton" type="button">サンプルHTML</button>
          <button class="action danger" id="clearButton" type="button">クリア</button>
        </div>

        <div class="editor-card">
          <textarea
            id="htmlInput"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
            aria-label="プレビューするHTMLコード"
            placeholder="ここにHTML、CSS、JavaScriptをまとめて貼り付けてください。"
          ></textarea>
        </div>

        <p class="hint">
          入力内容はこの端末のLocalStorageに自動保存されます。実行コードはsandbox付きiframeで隔離されます。
        </p>
      </section>

      <section class="preview-panel" id="previewPanel" aria-label="PWAプレビュー">
        <div class="preview-tools">
          <span class="preview-status" id="previewStatus">プレビューを準備しています</span>
          <div class="preview-actions">
            <button class="small-action primary" id="refreshButton" type="button">更新</button>
            <button class="small-action" id="fullscreenButton" type="button">全画面</button>
          </div>
        </div>

        <div class="device-scale">
          <div class="iphone" id="deviceFrame">
            <div class="screen">
              <iframe
                id="previewFrame"
                class="preview-frame"
                title="PWAプレビュー"
                sandbox="allow-scripts allow-forms allow-modals allow-popups"
                referrerpolicy="no-referrer"
              ></iframe>

              <div class="status-area" aria-hidden="true">
                <span class="status-time" id="statusTime">9:41</span>
                <div class="status-icons">
                  <span class="signal"><i></i><i></i><i></i><i></i></span>
                  <span class="wifi"></span>
                  <span class="battery"></span>
                </div>
              </div>

              <div class="dynamic-island" aria-hidden="true"></div>
              <div class="home-zone" aria-hidden="true">
                <div class="home-indicator"></div>
              </div>
              <div class="screen-gloss" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <section class="full-preview" id="fullscreenPreview" aria-label="全画面プレビュー">
    <div class="preview-tools">
      <span class="preview-status" id="fullscreenStatus">全画面プレビュー</span>
      <div class="preview-actions">
        <button class="small-action primary" id="fullscreenRefreshButton" type="button">更新</button>
        <button class="small-action" id="exitFullscreenButton" type="button">閉じる</button>
      </div>
    </div>

    <div class="device-scale">
      <div class="iphone">
        <div class="screen">
          <iframe
            id="fullscreenFrame"
            class="preview-frame"
            title="全画面PWAプレビュー"
            sandbox="allow-scripts allow-forms allow-modals allow-popups"
            referrerpolicy="no-referrer"
          ></iframe>

          <div class="status-area" aria-hidden="true">
            <span class="status-time fullscreen-time">9:41</span>
            <div class="status-icons">
              <span class="signal"><i></i><i></i><i></i><i></i></span>
              <span class="wifi"></span>
              <span class="battery"></span>
            </div>
          </div>

          <div class="dynamic-island" aria-hidden="true"></div>

          <div class="home-zone" aria-hidden="true">
            <div class="home-indicator"></div>
          </div>

          <div class="screen-gloss" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "iphone17pro-pwa-preview-html-v1";

      const htmlInput = document.getElementById("htmlInput");
      const previewFrame = document.getElementById("previewFrame");
      const fullscreenFrame = document.getElementById("fullscreenFrame");

      const editorPanel = document.getElementById("editorPanel");
      const previewPanel = document.getElementById("previewPanel");
      const previewStatus = document.getElementById("previewStatus");
      const fullscreenStatus = document.getElementById("fullscreenStatus");
      const fullscreenPreview = document.getElementById("fullscreenPreview");

      const segmentButtons = [...document.querySelectorAll(".segment")];

      const sampleHTML = String.raw`<!doctype html>

      padding: 0 13px;
      border: 1px solid var(--line);
      background: #2c2c2e;
      color: #fff;
    }

    button {
      width: 100%;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    button:active {
      transform: scale(.98);
      opacity: .85;
    }

    #message {
      min-height: 24px;
      margin: 10px 0 0;
      color: #30d158;
      font-size: 14px;
    }

    .list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .item {
      padding: 16px;
      border-radius: 16px;
      background: #1c1c1e;
      border: 1px solid var(--line);
    }

    .item strong {
      display: block;
      margin-bottom: 4px;
    }

    .item span {
      color: #a1a1aa;
      font-size: 14px;
    }

    nav {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      height: calc(var(--safe-bottom) + 58px);
      padding: 10px 16px calc(var(--safe-bottom) + 8px);
      background: rgba(28,28,30,.92);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    nav button {
      min-height: 40px;
      background: transparent;
      color: #a1a1aa;
      font-size: 12px;
    }

    nav button.active {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>My PWA</h1>
  </header>

  <main>
    <section class="hero">
      <strong>iPhone PWA Preview</strong>
      <p>固定ヘッダー、下部タブバー、Safe Area、スクロール、フォーム操作を確認できます。</p>
    </section>

    <section class="card">
      <h2>入力テスト</h2>
      <input id="name" placeholder="名前を入力">
      <button id="helloButton">メッセージを表示</button>
      <p id="message"></p>
    </section>

    <section class="list" id="list"></section>
  </main>

  <nav>
    <button class="active">ホーム</button>
    <button>検索</button>
    <button>設定</button>
  </nav>

  <script>
    const list = document.getElementById("list");
    for (let i = 1; i <= 18; i++) {
      const item = document.createElement("article");
      item.className = "item";
      item.innerHTML = "<strong>スクロール項目 " + i + "</strong><span>Safe Areaと固定要素の重なりを確認してください。</span>";
      list.appendChild(item);
    }

    document.getElementById("helloButton").addEventListener("click", () => {
      const name = document.getElementById("name").value.trim() || "ゲスト";
      document.getElementById("message").textContent = name + " さん、ボタン操作は正常です。";
    });

    document.querySelectorAll("nav button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
      });
    });
  <\/script>
</body>
</html>`;

      function getStoredHTML() {
        try {
          return localStorage.getItem(STORAGE_KEY) || "";
        } catch {
          return "";
        }
      }

      function saveHTML(value) {
        try {
          localStorage.setItem(STORAGE_KEY, value);
        } catch {
          /* LocalStorageが使えない環境では何もしない */
        }
      }

      function escapeClosingScript(html) {
        return html.replace(/<\/script/gi, "<\\/script");
      }

      function buildPreviewDocument(source) {
        const safeSource = source.trim() || sampleHTML;

        const bridgeStyle = `
          <style id="pwa-preview-bridge-style">
            :root {
              --pwa-preview-safe-top: 62px;
              --pwa-preview-safe-bottom: 34px;
              --pwa-preview-safe-left: 0px;
              --pwa-preview-safe-right: 0px;
            }

            html {
              min-height: 100%;
              background: #000;
            }

            body {
              min-height: 100dvh;
            }
          </style>
        `;

        const bridgeScript = `
          <script>
            (() => {
              const TOP = 62;
              const BOTTOM = 34;
              const LEFT = 0;
              const RIGHT = 0;

              const originalGetComputedStyle = window.getComputedStyle.bind(window);

              function replaceSafeAreaTokens(value) {
                if (typeof value !== "string") return value;

                return value
                  .replace(
                    /env\\\(safe-area-inset-top(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    TOP + "px"
                  )
                  .replace(
                    /constant\\\(safe-area-inset-top(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    TOP + "px"
                  )
                  .replace(
                    /env\\\(safe-area-inset-bottom(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    BOTTOM + "px"
                  )
                  .replace(
                    /constant\\\(safe-area-inset-bottom(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    BOTTOM + "px"
                  )
                  .replace(
                    /env\\\(safe-area-inset-left(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    LEFT + "px"
                  )
                  .replace(
                    /constant\\\(safe-area-inset-left(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    LEFT + "px"
                  )
                  .replace(
                    /env\\\(safe-area-inset-right(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    RIGHT + "px"
                  )
                  .replace(
                    /constant\\\(safe-area-inset-right(?:\\\\s\*,\\\\s\*[^)]\*)?\\\\)/gi,
                    RIGHT + "px"
                  );
              }

              function patchStyleText(root) {
                const styleElements = root.querySelectorAll ? root.querySelectorAll("style") : [];
                styleElements.forEach(style => {
                  if (style.dataset.pwaPreviewPatched === "true") return;
                  style.dataset.pwaPreviewPatched = "true";
                  style.textContent = replaceSafeAreaTokens(style.textContent);
                });

                const inlineStyleElements = root.querySelectorAll ? root.querySelectorAll("[style]") : [];
                inlineStyleElements.forEach(element => {
                  const current = element.getAttribute("style");
                  const replaced = replaceSafeAreaTokens(current);
                  if (current !== replaced) element.setAttribute("style", replaced);
                });
              }

              function patchCSSRules(sheet) {
                try {
                  const rules = sheet.cssRules;
                  if (!rules) return;

                  for (const rule of rules) {
                    if (rule.style) {
                      for (let i = 0; i < rule.style.length; i++) {
                        const property = rule.style[i];
                        const value = rule.style.getPropertyValue(property);
                        const replaced = replaceSafeAreaTokens(value);

                        if (value !== replaced) {
                          rule.style.setProperty(
                            property,
                            replaced,
                            rule.style.getPropertyPriority(property)
                          );
                        }
                      }
                    }

                    if (rule.cssRules) {
                      patchCSSRules({ cssRules: rule.cssRules });
                    }
                  }
                } catch {
                  /* クロスオリジンのスタイルシートにはアクセスしない */
                }
              }

              function applyPatches() {
                patchStyleText(document);

                for (const sheet of document.styleSheets) {
                  patchCSSRules(sheet);
                }

                document.documentElement.style.setProperty("--pwa-preview-safe-top", TOP + "px");
                document.documentElement.style.setProperty("--pwa-preview-safe-bottom", BOTTOM + "px");
                document.documentElement.style.setProperty("--pwa-preview-safe-left", LEFT + "px");
                document.documentElement.style.setProperty("--pwa-preview-safe-right", RIGHT + "px");
              }

              window.addEventListener("DOMContentLoaded", () => {
                applyPatches();

                const observer = new MutationObserver(() => {
                  requestAnimationFrame(applyPatches);
                });

                observer.observe(document.documentElement, {
                  subtree: true,
                  childList: true,
                  attributes: true,
                  attributeFilter: ["style"]
                });
              });

              window.addEventListener("load", applyPatches);

              window.getComputedStyle = function(element, pseudoElement) {
                const computed = originalGetComputedStyle(element, pseudoElement);

                return new Proxy(computed, {
                  get(target, property, receiver) {
                    if (property === "getPropertyValue") {
                      return function(name) {
                        const value = target.getPropertyValue(name);
                        return replaceSafeAreaTokens(value);
                      };
                    }

                    const value = Reflect.get(target, property, receiver);
                    return replaceSafeAreaTokens(value);
                  }
                });
              };
            })();
          <\/script>
        `;

        const viewportMeta = `
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="color-scheme" content="dark">
        `;

        let documentHTML = safeSource;

        if (!/<head[\s>]/i.test(documentHTML)) {
          documentHTML = `<!doctype html><html lang="ja"><head>${viewportMeta}${bridgeStyle}</head><body>${documentHTML}${bridgeScript}</body></html>`;
        } else {
          documentHTML = documentHTML.replace(
            /<head([^>]*)>/i,
            `<head$1>${viewportMeta}${bridgeStyle}`
          );

          if (/<\/body\s*>/i.test(documentHTML)) {
            documentHTML = documentHTML.replace(/<\/body\s*>/i, `${bridgeScript}</body>`);
          } else {
            documentHTML += bridgeScript;
          }
        }

        return escapeClosingScript(documentHTML);
      }

      function renderPreview() {
        const source = htmlInput.value;
        saveHTML(source);

        const previewDocument = buildPreviewDocument(source);
        const blob = new Blob([previewDocument], { type: "text/html" });
        const objectURL = URL.createObjectURL(blob);

        const frames = [previewFrame, fullscreenFrame];

        frames.forEach(frame => {
          const previousURL = frame.dataset.objectUrl;
          frame.src = objectURL;
          frame.dataset.objectUrl = objectURL;

          if (previousURL) {
            setTimeout(() => URL.revokeObjectURL(previousURL), 500);
          }
        });

        const label = source.trim() ? "プレビューを更新しました" : "サンプルHTMLを表示しています";
        previewStatus.textContent = label;
        fullscreenStatus.textContent = label;
      }

      function setView(view) {
        const isEditor = view === "editor";

        editorPanel.classList.toggle("active", isEditor);
        previewPanel.classList.toggle("active", !isEditor);

        segmentButtons.forEach(button => {
          const active = button.dataset.view === view;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }

      function updateClock() {
        const now = new Date();
        const formatted = now.toLocaleTimeString("ja-JP", {
          hour: "numeric",
          minute: "2-digit",
          hour12: false
        });

        document.getElementById("statusTime").textContent = formatted;
        document.querySelectorAll(".fullscreen-time").forEach(element => {
          element.textContent = formatted;
        });
      }

      document.getElementById("previewButton").addEventListener("click", () => {
        renderPreview();
        setView("preview");
      });

      document.getElementById("refreshButton").addEventListener("click", renderPreview);
      document.getElementById("fullscreenRefreshButton").addEventListener("click", renderPreview);

      document.getElementById("sampleButton").addEventListener("click", () => {
        htmlInput.value = sampleHTML;
        saveHTML(sampleHTML);
        renderPreview();
      });

      document.getElementById("clearButton").addEventListener("click", () => {
        htmlInput.value = "";
        saveHTML("");
        renderPreview();
        htmlInput.focus();
      });

      document.getElementById("fullscreenButton").addEventListener("click", () => {
        renderPreview();
        fullscreenPreview.classList.add("active");
        document.body.style.overflow = "hidden";
      });

      document.getElementById("exitFullscreenButton").addEventListener("click", () => {
        fullscreenPreview.classList.remove("active");
        document.body.style.overflow = "";
      });

      segmentButtons.forEach(button => {
        button.addEventListener("click", () => setView(button.dataset.view));
      });

      htmlInput.addEventListener("input", () => {
        saveHTML(htmlInput.value);
      });

      document.addEventListener("keydown", event => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
          event.preventDefault();
          renderPreview();
          setView("preview");
        }

        if (event.key === "Escape" && fullscreenPreview.classList.contains("active")) {
          fullscreenPreview.classList.remove("active");
          document.body.style.overflow = "";
        }
      });

      const savedHTML = getStoredHTML();
      htmlInput.value = savedHTML;
      renderPreview();
      updateClock();
      setInterval(updateClock, 30000);
    })();
  </script>
</body>
</html>
