<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1018">
<title>かんたん作曲</title>
<style>
:root {
  --bg: #090d14;
  --surface: #111824;
  --surface-2: #172131;
  --surface-3: #202d40;
  --ink: #f5f8ff;
  --muted: #98a8bd;
  --line: rgba(187, 207, 235, .16);
  --grid: rgba(183, 205, 235, .12);
  --grid-strong: rgba(183, 205, 235, .26);
  --accent: #53d7ff;
  --record: #ff5573;
  --record-soft: rgba(255, 85, 115, .18);
  --rest: #f6c45b;
  --row-h: 36px;
  --ruler-h: 0px;
  --shadow: 0 12px 30px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.22);
  --white-key-w: 44px;
  --white-key-h: 146px;
  --black-key-w: 27px;
  --black-key-h: 92px;
  --glass-bg: rgba(28,38,54,.5);
  --glass-bg-strong: rgba(18,26,38,.66);
  --glass-border: rgba(255,255,255,.16);
  --glass-highlight: inset 0 1px rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.04);
  --glass-blur: blur(26px) saturate(180%);
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
}
html, body { width: 100%; height: 100%; height: 100dvh; margin: 0; overflow: hidden; background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  touch-action: manipulation;
}
button, input { font: inherit; }
button { -webkit-appearance: none; appearance: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  height: var(--app-height, 100dvh);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% -20%, rgba(83,215,255,.13), transparent 34%),
    var(--bg);
}
.control {
  min-height: 38px;
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 0 10px;
  color: var(--ink);
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.015)), var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  box-shadow: var(--glass-highlight), 0 3px 9px rgba(0,0,0,.22);
  font-weight: 750;
  font-size: 12px;
  white-space: nowrap;
  touch-action: manipulation;
}
.control:active { transform: translateY(1px); filter: brightness(.92); }
.control.play { color: #06151b; background: linear-gradient(180deg, #85e8ff, var(--accent)); border-color: #8eeaff; }
.control.play.is-playing { color: #fff; background: linear-gradient(180deg, #ff7189, #d92d52); border-color: #ff8197; }
.control.record { min-width: 76px; }
.control.record.is-on {
  color: #fff;
  background: linear-gradient(180deg, #d93657, #a91f3b);
  border-color: rgba(255,145,164,.8);
  box-shadow: 0 0 0 3px var(--record-soft), inset 0 1px rgba(255,255,255,.16);
}
.rec-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 4px;
  border-radius: 50%;
  background: var(--muted);
  box-shadow: 0 0 0 2px rgba(255,255,255,.08);
}
.record.is-on .rec-dot { background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.85); }

.control-deck .control.play { height: 31px; }

.control:disabled { opacity: .42; filter: saturate(.4); }
.composer {
  position: relative;
  min-height: 0;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.score-viewport {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  background: #0d141e;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  touch-action: pan-x pan-y;
  scrollbar-color: var(--surface-3) transparent;
  scrollbar-width: thin;
  transition: background-color .4s ease;
}
.score-viewport::-webkit-scrollbar { width: 5px; height: 5px; }
.score-viewport::-webkit-scrollbar-thumb { background: #35455c; border-radius: 9px; }
.score-content {
  position: relative;
  min-height: 100%;
  background-color: #0d141e;
  background-image: linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size: 100% var(--row-h);
  background-position: 0 var(--ruler-h);
  isolation: isolate;
  transform-origin: 0 0;
}
.score-content::before {
  content: "";
  position: absolute;
  inset: var(--ruler-h) 0 0;
  z-index: 0;
  pointer-events: none;
  background-image: linear-gradient(to bottom, var(--grid-strong) 2px, transparent 2px);
  background-size: 100% calc(4 * var(--row-h));
}
.pitch-lane {
  position: absolute;
  top: var(--ruler-h);
  bottom: 0;
  z-index: 0;
  pointer-events: none;
  border-left: 1px solid rgba(183,205,235,.12);
  border-right: 1px solid rgba(183,205,235,.08);
  background: rgba(255,255,255,.012);
}
.pitch-lane.is-black {
  z-index: 1;
  background: rgba(0,0,0,.28);
  border-color: rgba(183,205,235,.2);
}
.time-label {
  position: absolute;
  z-index: 1;
  left: 4px;
  height: 16px;
  padding: 1px 5px 0;
  color: #71839a;
  background: rgba(9,13,20,.78);
  border-radius: 5px;
  font-size: 9px;
  line-height: 14px;
  pointer-events: none;
}
.note-block {
  position: absolute;
  z-index: 4;
  min-height: 12px;
  border: 1px solid rgba(164,235,255,.72);
  border-radius: 7px;
  color: #05202a;
  background:
    linear-gradient(135deg, rgba(255,255,255,.5), transparent 38%),
    linear-gradient(180deg, #68ddfa, #31afd5);
  box-shadow: inset 0 1px rgba(255,255,255,.48), 0 4px 11px rgba(0,0,0,.28);
  overflow: hidden;
  touch-action: pan-x pan-y;
}
.note-block::after {
  content: "";
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 3px;
  height: 2px;
  border-radius: 2px;
  background: rgba(2,49,66,.32);
}
.note-label {
  position: sticky;
  top: 3px;
  display: block;
  padding: 3px 2px 0;
  font-size: 13px;
  line-height: 1;
  font-weight: 900;
  text-align: center;
  text-shadow: 0 1px rgba(255,255,255,.28);
}
.note-block.is-selected {
  z-index: 7;
  border: 2px solid #fff;
  box-shadow: 0 0 0 3px rgba(83,215,255,.65), 0 0 25px rgba(83,215,255,.5), inset 0 1px rgba(255,255,255,.6);
}
.note-block.is-playing {
  z-index: 8;
  background: linear-gradient(180deg, #fff5a8, #f6bf46);
  border-color: #fff8ce;
  box-shadow: 0 0 0 3px rgba(246,196,91,.35), 0 0 28px rgba(246,196,91,.72);
}
.rest-block {
  position: absolute;
  left: 0;
  z-index: 3;
  width: 100%;
  min-height: 12px;
  border-top: 1px solid rgba(246,196,91,.58);
  border-bottom: 1px solid rgba(246,196,91,.58);
  background:
    repeating-linear-gradient(135deg, rgba(246,196,91,.12) 0 8px, rgba(246,196,91,.035) 8px 16px),
    rgba(48,42,25,.25);
  color: var(--rest);
  touch-action: pan-x pan-y;
}
.rest-block.is-selected {
  z-index: 6;
  border: 2px solid #ffe49c;
  box-shadow: inset 0 0 0 2px rgba(246,196,91,.28), 0 0 20px rgba(246,196,91,.24);
}
.rest-block.is-playing { background-color: rgba(246,196,91,.2); }
.rest-label {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  min-width: 54px;
  padding: 2px 7px;
  border: 1px solid rgba(246,196,91,.35);
  border-radius: 999px;
  background: rgba(20,18,12,.78);
  font-size: 10px;
  font-weight: 850;
  text-align: center;
}
.playhead {
  position: absolute;
  z-index: 11;
  left: 0;
  width: 100%;
  height: 2px;
  pointer-events: none;
  display: none;
  background: #ff5573;
  box-shadow: 0 0 12px #ff5573, 0 0 3px #fff;
}
.playhead::before {
  content: "";
  position: sticky;
  left: 5px;
  display: block;
  width: 10px;
  height: 10px;
  transform: translateY(-4px) rotate(45deg);
  border-radius: 2px;
  background: #ff5573;
  box-shadow: 0 0 10px rgba(255,85,115,.8);
}
.toast {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: var(--toast-bottom, 14px);
  max-width: calc(100% - 24px);
  transform: translate(-50%, 16px);
  padding: 8px 12px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px;
  color: #fff;
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.01)), rgba(27,38,53,.78);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 10px 28px rgba(0,0,0,.42);
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 12px;
  font-weight: 750;
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes controlShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
.control.is-shaking { animation: controlShake .38s ease; }

.keyboard-viewport {
  order: 1;
  height: var(--white-key-h);
  overflow: hidden;
  position: relative;
  touch-action: none;
  background: #080b10;
  display: flex;
  align-items: flex-end;
}
.keyboard-inner {
  position: relative;
  height: var(--white-key-h);
  transform: translateZ(0);
  flex: 0 0 auto;
  transform-origin: 0 100%;
}
.piano-key {
  position: absolute;
  top: 0;
  padding: 0;
  border: 0;
  border-radius: 0 0 7px 7px;
  overflow: hidden;
}
.white-key {
  z-index: 1;
  width: var(--white-key-w);
  height: var(--white-key-h);
  border-right: 1px solid #7d8490;
  border-bottom: 5px solid #9da5b0;
  background: linear-gradient(90deg, #d6d9df 0, #fff 12%, #f8f9fb 76%, #bdc2ca 100%);
  box-shadow: inset 0 -8px 10px rgba(60,67,77,.12), inset 0 1px #fff;
}
.white-key:first-child { border-left: 1px solid #7d8490; }
.black-key {
  z-index: 3;
  width: var(--black-key-w);
  height: var(--black-key-h);
  border: 1px solid #020305;
  border-bottom: 7px solid #020305;
  background: linear-gradient(90deg, #06080b, #303640 45%, #0b0e13 78%, #020304);
  box-shadow: inset 0 -5px 4px rgba(255,255,255,.06), 0 5px 7px rgba(0,0,0,.5);
}
.piano
