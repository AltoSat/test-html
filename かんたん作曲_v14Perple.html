<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HTML Previewer</title>

<style>
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#1c1c1e;
  --panel2:#2c2c2e;
  --panel3:#3a3a3c;
  --text:#f5f5f7;
  --muted:#98989f;
  --accent:#0a84ff;
  --accent-soft:rgba(10,132,255,.16);
  --danger:#ff453a;
  --line:#38383c;
  --code:#111113;
}

*{box-sizing:border-box}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}

body{
  padding:
    max(10px, env(safe-area-inset-top))
    12px
    max(12px, env(safe-area-inset-bottom));
}

button,
textarea,
input{
  font:inherit;
}

button{
  border:0;
  min-height:40px;
  padding:0 14px;
  border-radius:12px;
  color:var(--text);
  background:var(--panel2);
  font-weight:650;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button.primary{
  background:var(--accent);
}

button.danger{
  background:var(--danger);
}

button.ghost{
  background:transparent;
  border:1px solid var(--line);
}

button:active{
  transform:scale(.97);
  opacity:.86;
}

button:disabled{
  opacity:.42;
  pointer-events:none;
}

.app{
  width:100%;
  max-width:1280px;
  margin:0 auto;
}

/* ===== 一覧 ===== */

.list-panel{
  display:block;
}

.item-list{
  display:flex;
  gap:10px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:2px 2px 10px;
  margin:0 0 8px;
  scrollbar-width:thin;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}

.item-list::-webkit-scrollbar{
  height:6px;
}

.item-list::-webkit-scrollbar-thumb{
  background:#4a4a4e;
  border-radius:99px;
}

.item-card{
  position:relative;
  flex:0 0 164px;
  min-height:100px;
  padding:14px;
  border:2px solid transparent;
  border-radius:16px;
  background:var(--panel);
  overflow:hidden;
  cursor:pointer;
  scroll-snap-align:start;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  transition:background .15s,border-color .15s,transform .15s;
}

.item-card:active{
  background:var(--panel2);
  transform:scale(.98);
}

.item-card.active{
  border-color:var(--accent);
  background:var(--accent-soft);
}

.item-card-name{
  overflow:hidden;
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.item-card-meta{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

.item-card-hint{
  position:absolute;
  right:10px;
  bottom:9px;
  color:#77777d;
  font-size:10px;
}

.new-card{
  display:flex;
  flex:0 0 128px;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:100px;
  border:2px dashed #55555b;
  border-radius:16px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  scroll-snap-align:start;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.new-card:active{
  border-color:var(--accent);
  color:#fff;
  transform:scale(.98);
}

.new-card-plus{
  font-size:28px;
  font-weight:300;
  line-height:1;
}

.new-card-text{
  font-size:13px;
  font-weight:650;
}

.item-empty{
  display:flex;
  flex:0 0 calc(100% - 140px);
  align-items:center;
  justify-content:center;
  min-height:100px;
  padding:12px;
  border:1px dashed #444449;
  border-radius:16px;
  color:var(--muted);
  text-align:center;
  font-size:13px;
}

/* ===== プレビュー ===== */

.preview-actions{
  display:flex;
  justify-content:center;
  margin:0 0 10px;
}

.preview-actions button{
  min-height:38px;
  padding:0 16px;
  font-size:13px;
}

.devices{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  justify-content:center;
  gap:18px 24px;
  padding:0 0 18px;
}

.device-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.device-label{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

/*
  iPhone 17 Pro:
  画面比率 1206 × 2622 = 約 0.460
  iPad 第7世代（横）:
  2160 × 1620 = 4:3
*/
.phone{
  position:relative;
  width:min(360px, 66vw);
  aspect-ratio:1206 / 2622;
  overflow:hidden;
  border:7px solid #202023;
  border-radius:47px;
  background:#000;
  box-shadow:0 16px 42px rgba(0,0,0,.9),0 0 0 1px #4b4b50;
}

.phone iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  color-scheme:light dark;
}

.island{
  position:absolute;
  z-index:5;
  top:6px;
  left:50%;
  width:31%;
  height:3.1%;
  min-width:82px;
  max-width:118px;
  min-height:22px;
  max-height:31px;
  border-radius:999px;
  background:#000;
  pointer-events:none;
  transform:translateX(-50%);
  box-shadow:0 0 0 1px rgba(255,255,255,.04);
}

.homebar{
  position:absolute;
  z-index:6;
  bottom:6px;
  left:50%;
  width:28%;
  min-width:74px;
  max-width:104px;
  height:3px;
  border-radius:99px;
  background:#fff;
  opacity:.9;
  pointer-events:none;
  transform:translateX(-50%);
}

.ipad{
  position:relative;
  width:min(490px, 94vw);
  aspect-ratio:4 / 3;
  overflow:hidden;
  border:8px solid #29292d;
  border-radius:18px;
  background:#000;
  box-shadow:0 16px 42px rgba(0,0,0,.9),0 0 0 1px #4b4b50;
}

.ipad iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  color-scheme:light dark;
}

.ipad-camera{
  position:absolute;
  z-index:5;
  top:50%;
  left:5px;
  width:4px;
  height:22px;
  border-radius:99px;
  background:#151518;
  pointer-events:none;
  transform:translateY(-50%);
}

/* ===== 編集画面 ===== */

.editor-panel{
  display:none;
}

.editor-panel.show{
  display:block;
}

.editor-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:0 0 10px;
}

.editor-title{
  margin:0;
  font-size:17px;
  font-weight:750;
  letter-spacing:-.02em;
}

.editor-header-actions{
  display:flex;
  gap:7px;
}

.editor-header-actions button{
  min-height:36px;
  padding:0 12px;
  font-size:13px;
}

.editor-tools{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:8px;
}

.name-input,
.search-box input{
  height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:var(--code);
  color:#fff;
  padding:0 12px;
}

.name-input{
  flex:1 1 180px;
  min-width:140px;
}

.search-box{
  display:flex;
  flex:1 1 240px;
  gap:6px;
  min-width:0;
}

.search-box input{
  flex:1;
  width:100%;
  min-width:0;
}

.name-input:focus,
.search-box input:focus,
textarea:focus{
  border-color:var(--accent);
}

.search-box button{
  flex:none;
  min-height:40px;
  padding:0 12px;
  font-size:13px;
}

#count,
#searchResult{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.status{
  margin:0 0 8px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}

/* 検索強調表示用 */
.code-area{
  position:relative;
  height:min(52vh, 500px);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--code);
}

.code-highlight,
textarea{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  margin:0;
  padding:14px;
  overflow:auto;
  border:0;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  letter-spacing:normal;
  tab-size:2;
  white-space:pre-wrap;
  overflow-wrap:break-word;
}

.code-highlight{
  z-index:1;
  color:#f5f5f7;
  pointer-events:none;
  scrollbar-width:none;
}

.code-highlight::-webkit-scrollbar{
  display:none;
}

.code-highlight mark{
  border-radius:2px;
  background:#ffd60a;
  color:#111;
}

.code-highlight mark.current{
  outline:2px solid #ff9f0a;
  background:#ff9f0a;
  color:#111;
}

textarea{
  z-index:2;
  resize:none;
  outline:none;
  background:transparent;
  color:transparent;
  caret-color:#fff;
  -webkit-text-fill-color:transparent;
}

textarea::selection{
  background:rgba(10,132,255,.55);
}

textarea::placeholder{
  color:#77777d;
  -webkit-text-fill-color:#77777d;
}

.editor-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.editor-actions button{
  flex:1;
  min-width:105px;
}

/* ===== 全画面 ===== */

.fullscreen{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  background:#000;
}

.fullscreen.show{
  display:block;
}

.fullscreen iframe{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.fullscreen .exit{
  position:absolute;
  z-index:10;
  top:max(12px, env(safe-area-inset-top));
  right:14px;
  width:44px;
  height:44px;
  min-height:44px;
  padding:0;
  border-radius:50%;
  background:rgba(60,60,65,.64);
  color:#fff;
  font-size:22px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

@media (min-width:800px){
  .phone{
    width:min(400px, 37vw);
  }

  .ipad{
    width:min(570px, 49vw);
  }

  .devices{
    gap:24px 34px;
  }

  .code-area{
    height:min(58vh, 570px);
  }
}

@media (max-width:460px){
  .phone{
    width:min(350px, 78vw);
  }

  .ipad{
    width:94vw;
  }

  .item-card{
    flex-basis:150px;
  }

  .editor-header{
    align-items:flex-start;
  }
}
</style>
</head>

<body>
<div class="app">

  <!-- 一覧・プレビュー -->
  <section id="listPanel" class="list-panel">
    <div id="itemList" class="item-list" aria-label="HTML一覧"></div>

    <div class="preview-actions">
      <button id="btnFullscreen" class="primary">全画面プレビュー</button>
    </div>

    <div class="devices">
      <div class="device-wrap">
        <div class="device-label">iPhone 17 Pro</div>
        <div id="phone" class="phone">
          <div class="island"></div>
          <iframe
            id="framePhone"
            title="iPhone 17 Pro preview"
            sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads">
          </iframe>
          <div class="homebar"></div>
        </div>
      </div>

      <div class="device-wrap">
        <div class="device-label">iPad 第7世代（横）</div>
        <div id="ipad" class="ipad">
          <div class="ipad-camera"></div>
          <iframe
            id="frameIpad"
            title="iPad 第7世代 preview"
            sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads">
          </iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- 編集 -->
  <section id="editorPanel" class="editor-panel">
    <div class="editor-header">
      <h1 id="editorTitle" class="editor-title">HTMLを編集</h1>

      <div class="editor-header-actions">
        <button id="btnBack" class="ghost">戻る</button>
        <button id="btnDelete" class="danger">削除</button>
      </div>
    </div>

    <div class="editor-tools">
      <input
        id="nameInput"
        class="name-input"
        type="text"
        placeholder="名前を入力"
        maxlength="80"
        autocomplete="off">

      <span id="count">0文字</span>

      <div class="search-box">
        <input
          id="search"
          type="search"
          placeholder="検索"
          autocomplete="off">

        <button id="btnSearch" class="ghost" type="button">次へ</button>
        <span id="searchResult"></span>
      </div>
    </div>

    <p class="status">
      HTML・CSS・JavaScriptをそのまま貼り付けてください。検索欄で一致箇所を強調表示し、「次へ」またはEnterで次の結果へ移動できます。
    </p>

    <div class="code-area">
      <pre id="highlight" class="code-highlight" aria-hidden="true"></pre>
      <textarea
        id="source"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
        placeholder="<!doctype html> ..."></textarea>
    </div>

    <div class="editor-actions">
      <button id="btnSave" class="primary">保存</button>
      <button id="btnClear" class="ghost">クリア</button>
      <button id="btnCancel" class="ghost">キャンセル</button>
    </div>
  </section>
</div>

<div id="fullscreen" class="fullscreen">
  <button id="exit" class="exit" aria-label="全画面を閉じる">×</button>
  <iframe
    id="fullFrame"
    title="Full screen preview"
    sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads">
  </iframe>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const STORAGE_KEY = "pwa-previewer-items-v3";
  const PREVIOUS_KEY = "pwa-previewer-items-v2";
  const OLD_KEY = "iphone17pro-pwa-preview-html-v1";
  const LONG_PRESS_MS = 550;

  let items = [];
  let selectedId = null;
  let editingId = null;
  let draftBeforeEditing = null;
  let searchMatches = [];
  let currentSearchIndex = -1;
  let longPressTimer = null;
  let longPressStarted = false;

  const source = $("source");
  const nameInput = $("nameInput");
  const searchInput = $("search");
  const highlight = $("highlight");
  const framePhone = $("framePhone");
  const frameIpad = $("frameIpad");
  const fullFrame = $("fullFrame");

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function formatDate(timestamp) {
    const date = new Date(timestamp);
    const month = date.getMonth() + 1;
    const day = date.getDate();
    const hour = String(date.getHours()).padStart(2, "0");
    const minute = String(date.getMinutes()).padStart(2, "0");
    return `${month}/${day} ${hour}:${minute}`;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function normalizeItems(value) {
    if (!Array.isArray(value)) return [];

    return value
      .filter(item => item && typeof item === "object")
      .map(item => ({
        id: String(item.id || uid()),
        name: typeof item.name === "string" ? item.name : "無題",
        html: typeof item.html === "string" ? item.html : "",
        updated: Number(item.updated) || Date.now()
      }));
  }

  function load() {
    try {
      const current = localStorage.getItem(STORAGE_KEY);
      const previous = localStorage.getItem(PREVIOUS_KEY);

      if (current) {
        items = normalizeItems(JSON.parse(current));
      } else if (previous) {
        items = normalizeItems(JSON.parse(previous));
        persist();
      } else {
        const oldHtml = localStorage.getItem(OLD_KEY);

        if (oldHtml) {
          items = [{
            id: uid(),
            name: "移行したHTML",
            html: oldHtml,
            updated: Date.now()
          }];
          persist();
        }
      }
    } catch (error) {
      items = [];
    }

    if (items.length) {
      selectedId = items
        .slice()
        .sort((a, b) => b.updated - a.updated)[0].id;
    }
  }

  function selectedItem() {
    return items.find(item => item.id === selectedId) || null;
  }

  function clearPreviews() {
    framePhone.srcdoc = "";
    frameIpad.srcdoc = "";
  }

  function updatePreview() {
    const item = selectedItem();

    if (!item) {
      clearPreviews();
      $("btnFullscreen").disabled = true;
      return;
    }

    $("btnFullscreen").disabled = false;

    framePhone.srcdoc = item.html || "";
    frameIpad.srcdoc = item.html || "";
  }

  function renderList() {
    const list = $("itemList");
    const sortedItems = items.slice().sort((a, b) => b.updated - a.updated);

    const cards = sortedItems.map(item => `
      <article
        class="item-card ${item.id === selectedId ? "active" : ""}"
        data-id="${escapeHtml(item.id)}"
        tabindex="0"
        role="button"
        aria-label="${escapeHtml(item.name || "無題")}。長押しで編集">
        <div class="item-card-name">${escapeHtml(item.name || "無題")}</div>
        <div class="item-card-meta">
          ${formatDate(item.updated)}<br>
          ${(item.html || "").length.toLocaleString()}文字
        </div>
        <div class="item-card-hint">長押しで編集</div>
      </article>
    `).join("");

    const empty = !items.length
      ? `<div class="item-empty">HTMLがまだありません。<br>右のカードから作成できます。</div>`
      : "";

    const newCard = `
      <button id="newCard" class="new-card" type="button" aria-label="新しいHTMLを作成">
        <span class="new-card-plus">＋</span>
        <span class="new-card-text">新規作成</span>
      </button>
    `;

    list.innerHTML = empty + cards + newCard;

    $("newCard").onclick = () => showEditor(true);

    list.querySelectorAll(".item-card").forEach(card => {
      bindCardEvents(card);
    });
  }

  function bindCardEvents(card) {
    const id = card.dataset.id;

    const selectCard = () => {
      if (longPressStarted) return;

      selectedId = id;
      renderList();
      updatePreview();
    };

    const startLongPress = event => {
      if (event.pointerType === "mouse" && event.button !== 0) return;

      longPressStarted = false;
      clearTimeout(longPressTimer);

      longPressTimer = setTimeout(() => {
        longPressStarted = true;

        if (navigator.vibrate) {
          navigator.vibrate(18);
        }

        selectedId = id;
        showEditor(false);
      }, LONG_PRESS_MS);
    };

    const stopLongPress = () => {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    };

    card.addEventListener("pointerdown", startLongPress);
    card.addEventListener("pointerup", stopLongPress);
    card.addEventListener("pointerleave", stopLongPress);
    card.addEventListener("pointercancel", stopLongPress);

    card.addEventListener("click", event => {
      event.preventDefault();
      selectCard();

      window.setTimeout(() => {
        longPressStarted = false;
      }, 0);
    });

    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        selectedId = id;
        renderList();
        updatePreview();
      }
    });
  }

  function showList() {
    $("editorPanel").classList.remove("show");
    $("listPanel").style.display = "block";

    editingId = null;
    draftBeforeEditing = null;

    renderList();
    updatePreview();
  }

  function showEditor(isNew) {
    $("listPanel").style.display = "none";
    $("editorPanel").classList.add("show");

    searchInput.value = "";
    searchMatches = [];
    currentSearchIndex = -1;

    if (isNew) {
      editingId = null;
      $("editorTitle").textContent = "新しいHTML";
      nameInput.value = "";
      source.value = "";
      $("btnDelete").style.display = "none";
      draftBeforeEditing = {
        name: "",
        html: ""
      };
    } else {
      const item = selectedItem();

      if (!item) {
        showEditor(true);
        return;
      }

      editingId = item.id;
      $("editorTitle").textContent = "HTMLを編集";
      nameInput.value = item.name || "";
      source.value = item.html || "";
      $("btnDelete").style.display = "inline-flex";

      draftBeforeEditing = {
        name: item.name || "",
        html: item.html || ""
      };
    }

    updateCount();
    updateHighlight();
    updateSearchInfo();
    nameInput.focus();
  }

  function updateCount() {
    $("count").textContent = `${source.value.length.toLocaleString()}文字`;
  }

  function getSearchMatches() {
    const query = searchInput.value;

    if (!query) return [];

    const text = source.value;
    const matches = [];
    let position = 0;

    while (position <= text.length) {
      const found = text.indexOf(query, position);

      if (found === -1) break;

      matches.push({
        start: found,
        end: found + query.length
      });

      position = found + Math.max(query.length, 1);
    }

    return matches;
  }

  function updateSearchInfo() {
    searchMatches = getSearchMatches();

    if (!searchInput.value) {
      $("searchResult").textContent = "";
      currentSearchIndex = -1;
      return;
    }

    if (!searchMatches.length) {
      $("searchResult").textContent = "0件";
      currentSearchIndex = -1;
      return;
    }

    if (currentSearchIndex >= searchMatches.length) {
      currentSearchIndex = 0;
    }

    if (currentSearchIndex < 0) {
      $("searchResult").textContent = `${searchMatches.length}件`;
    } else {
      $("searchResult").textContent =
        `${currentSearchIndex + 1}/${searchMatches.length}`;
    }
  }

  function updateHighlight() {
    const text = source.value;
    const query = searchInput.value;

    if (!query) {
      highlight.innerHTML = escapeHtml(text) + "\n";
      syncHighlightScroll();
      return;
    }

    const matches = getSearchMatches();

    if (!matches.length) {
      highlight.innerHTML = escapeHtml(text) + "\n";
      syncHighlightScroll();
      return;
    }

    let output = "";
    let position = 0;

    matches.forEach((match, index) => {
      output += escapeHtml(text.slice(position, match.start));

      const className = index === currentSearchIndex ? "current" : "";
      output += `<mark class="${className}">${escapeHtml(text.slice(match.start, match.end))}</mark>`;

      position = match.end;
    });

    output += escapeHtml(text.slice(position)) + "\n";

    highlight.innerHTML = output;
    syncHighlightScroll();
  }

  function syncHighlightScroll() {
    highlight.scrollTop = source.scrollTop;
    highlight.scrollLeft = source.scrollLeft;
  }

  function goToNextSearchResult() {
    updateSearchInfo();

    if (!searchMatches.length) {
      updateHighlight();
      return;
    }

    currentSearchIndex = (currentSearchIndex + 1) % searchMatches.length;

    updateSearchInfo();
    updateHighlight();

    const current = searchMatches[currentSearchIndex];

    source.focus();
    source.setSelectionRange(current.start, current.end);

    const lineHeight = 19.5;
    const before = source.value.slice(0, current.start);
    const lineNumber = before.split("\n").length - 1;
    const targetTop = Math.max(0, lineNumber * lineHeight - source.clientHeight * 0.35);

    source.scrollTop = targetTop;
    syncHighlightScroll();
  }

  function saveCurrent() {
    const name = (nameInput.value || "").trim() || "無題";
    const html = source.value;

    if (editingId) {
      const item = items.find(value => value.id === editingId);

      if (item) {
        item.name = name;
        item.html = html;
        item.updated = Date.now();
        selectedId = item.id;
      }
    } else {
      const id = uid();

      items.push({
        id,
        name,
        html,
        updated: Date.now()
      });

      selectedId = id;
    }

    persist();
    showList();
  }

  function deleteCurrent() {
    if (!editingId) return;

    const item = items.find(value => value.id === editingId);

    if (!item) {
      showList();
      return;
    }

    if (!confirm(`「${item.name || "無題"}」を削除しますか？`)) {
      return;
    }

    items = items.filter(value => value.id !== editingId);

    const newest = items
      .slice()
      .sort((a, b) => b.updated - a.updated)[0];

    selectedId = newest ? newest.id : null;

    persist();
    showList();
  }

  function cancelEdit() {
    if (!draftBeforeEditing) {
      showList();
      return;
    }

    const changed =
      nameInput.value !== draftBeforeEditing.name ||
      source.value !== draftBeforeEditing.html;

    if (changed && !confirm("変更を保存せずに戻りますか？")) {
      return;
    }

    showList();
  }

  function openFullscreen() {
    const item = selectedItem();

    if (!item) return;

    fullFrame.srcdoc = item.html || "";
    $("fullscreen").classList.add("show");
  }

  function closeFullscreen() {
    $("fullscreen").classList.remove("show");
    fullFrame.srcdoc = "";
  }

  $("btnFullscreen").onclick = openFullscreen;
  $("exit").onclick = closeFullscreen;

  $("btnBack").onclick = cancelEdit;
  $("btnCancel").onclick = cancelEdit;
  $("btnSave").onclick = saveCurrent;
  $("btnDelete").onclick = deleteCurrent;

  $("btnClear").onclick = () => {
    if (!source.value) return;

    if (!confirm("入力中のHTMLをクリアしますか？")) {
      return;
    }

    source.value = "";
    updateCount();
    updateSearchInfo();
    updateHighlight();
    source.focus();
  };

  source.addEventListener("input", () => {
    updateCount();
    currentSearchIndex = -1;
    updateSearchInfo();
    updateHighlight();
  });

  source.addEventListener("scroll", syncHighlightScroll);

  searchInput.addEventListener("input", () => {
    currentSearchIndex = -1;
    updateSearchInfo();
    updateHighlight();
  });

  searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      goToNextSearchResult();
    }
  });

  $("btnSearch").onclick = goToNextSearchResult;

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && $("fullscreen").classList.contains("show")) {
      closeFullscreen();
    }
  });

  load();
  showList();
})();
</script>
</body>
</html>
