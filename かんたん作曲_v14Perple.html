<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#0b1020">
  <title>HTML Device Previewer</title>

  <style>
    :root {
      --bg: #f4f6fb;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-solid: #ffffff;
      --text: #192033;
      --muted: #727b90;
      --line: #e2e6ef;
      --accent: #4263eb;
      --accent-soft: #edf1ff;
      --danger: #e03131;
      --shadow: 0 14px 36px rgba(30, 42, 74, 0.10);
      --sidebar-width: 292px;
      --header-height: 62px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--panel-solid);
      border-right: 1px solid var(--line);
    }

    .sidebar-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .app-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      transition:
        background 160ms ease,
        color 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .button:active {
      transform: scale(0.97);
    }

    .button-primary {
      color: #fff;
      background: var(--accent);
    }

    .button-primary:hover {
      background: #3451d6;
    }

    .button-secondary {
      color: var(--text);
      background: #fff;
      border-color: var(--line);
    }

    .button-secondary:hover {
      background: #f8f9fc;
      border-color: #cfd6e4;
    }

    .button-danger {
      color: var(--danger);
      background: #fff;
      border-color: #f2c2c2;
    }

    .button-danger:hover {
      background: #fff5f5;
    }

    .button-icon {
      width: 36px;
      min-width: 36px;
      padding: 0;
    }

    .document-list {
      flex: 1;
      min-height: 0;
      padding: 10px;
      overflow-y: auto;
    }

    .document-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 6px;
      text-align: left;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
    }

    .document-item:hover {
      background: #f7f8fc;
    }

    .document-item.is-active {
      color: #2949cf;
      background: var(--accent-soft);
      border-color: #d9e0ff;
    }

    .document-icon {
      flex: 0 0 auto;
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      color: var(--accent);
      background: #fff;
      border: 1px solid #dfe5ff;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 900;
    }

    .document-item.is-active .document-icon {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .document-meta {
      min-width: 0;
    }

    .document-name {
      overflow: hidden;
      font-size: 14px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .document-subtext {
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-footer {
      padding: 12px 16px 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .main {
      min-width: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .selected-title {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 14px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .device-switcher {
      display: flex;
      align-items: center;
      padding: 3px;
      background: #eef1f7;
      border-radius: 10px;
    }

    .device-button {
      min-height: 31px;
      padding: 5px 10px;
      color: #6c7588;
      background: transparent;
      border: 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 750;
    }

    .device-button.is-active {
      color: var(--text);
      background: #fff;
      box-shadow: 0 1px 4px rgba(24, 32, 56, 0.12);
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(300px, 0.85fr) minmax(420px, 1.15fr);
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .editor-panel,
    .preview-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-heading {
      min-height: 51px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-heading-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
    }

    .character-count {
      color: var(--muted);
      font-size: 11px;
    }

    .editor-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      color: #4d5669;
      font-size: 12px;
      font-weight: 750;
    }

    .name-input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      color: var(--text);
      background: #fff;
      border: 1px solid #dce1eb;
      border-radius: 10px;
      outline: none;
    }

    .name-input:focus,
    .html-editor:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(66, 99, 235, 0.14);
    }

    .editor-wrap {
      flex: 1;
      min-height: 200px;
      display: flex;
      flex-direction: column;
    }

    .html-editor {
      width: 100%;
      height: 100%;
      min-height: 250px;
      flex: 1;
      padding: 13px;
      resize: none;
      color: #24304a;
      background: #fbfcff;
      border: 1px solid #dce1eb;
      border-radius: 10px;
      outline: none;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 12px;
      line-height: 1.65;
      tab-size: 2;
    }

    .editor-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }

    .editor-actions-right {
      display: flex;
      gap: 8px;
    }

    .preview-panel {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.95), rgba(242, 244, 250, 0.96));
    }

    .preview-tools {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .device-label {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .preview-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      overflow: auto;
    }

    .device-shell {
      position: relative;
      flex: 0 0 auto;
      background: #111521;
      border: 7px solid #161b28;
      border-radius: 34px;
      box-shadow:
        0 25px 50px rgba(20, 28, 52, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.16);
      overflow: hidden;
    }

    .device-shell::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 8px;
      left: 50%;
      width: 92px;
      height: 22px;
      transform: translateX(-50%);
      background: #0c0f17;
      border-radius: 16px;
      pointer-events: none;
    }

    .device-shell.ipad::before {
      top: 50%;
      left: auto;
      right: 8px;
      width: 10px;
      height: 10px;
      transform: translateY(-50%);
      background: #2a3140;
      border: 1px solid #45506a;
      border-radius: 50%;
    }

    .preview-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .empty-state {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 18px;
    }

    .empty-state p {
      max-width: 300px;
      margin: 0 0 18px;
      font-size: 13px;
      line-height: 1.7;
    }

    dialog {
      width: min(460px, calc(100vw - 32px));
      padding: 0;
      color: var(--text);
      background: #fff;
      border: 0;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(16, 23, 46, 0.28);
    }

    dialog::backdrop {
      background: rgba(14, 19, 34, 0.42);
      backdrop-filter: blur(3px);
    }

    .dialog-content {
      padding: 22px;
    }

    .dialog-title {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .dialog-description {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .mobile-only {
      display: none;
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: minmax(280px, 0.9fr) minmax(350px, 1.1fr);
      }

      .preview-stage {
        padding: 14px;
      }
    }

    @media (max-width: 760px) {
      :root {
        --header-height: 56px;
      }

      .app {
        display: block;
      }

      .sidebar {
        position: fixed;
        z-index: 20;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(310px, 85vw);
        min-height: 100dvh;
        transform: translateX(-104%);
        transition: transform 200ms ease;
        box-shadow: 14px 0 35px rgba(24, 33, 58, 0.16);
      }

      .sidebar.is-open {
        transform: translateX(0);
      }

      .sidebar-backdrop {
        position: fixed;
        z-index: 15;
        inset: 0;
        display: none;
        background: rgba(11, 16, 32, 0.35);
      }

      .sidebar-backdrop.is-open {
        display: block;
      }

      .mobile-only {
        display: inline-flex;
      }

      .toolbar {
        padding: 8px 12px;
      }

      .selected-title {
        font-size: 13px;
      }

      .device-switcher {
        margin-left: auto;
      }

      .device-button {
        padding: 5px 8px;
        font-size: 11px;
      }

      .workspace {
        display: flex;
        min-height: calc(100dvh - var(--header-height));
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        overflow: auto;
      }

      .editor-panel {
        min-height: 460px;
      }

      .preview-panel {
        min-height: 510px;
      }

      .editor-actions {
        flex-direction: column-reverse;
      }

      .editor-actions-right {
        width: 100%;
      }

      .editor-actions-right .button {
        flex: 1;
      }

      .button-danger {
        width: 100%;
      }

      .preview-stage {
        min-height: 430px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h1 class="app-title">HTML Previewer</h1>
        <button id="addDocumentButton" class="button button-primary" type="button">
          ＋ 追加
        </button>
      </div>

      <nav id="documentList" class="document-list" aria-label="HTML一覧"></nav>

      <div class="sidebar-footer">
        HTMLはこの端末のブラウザ内に保存されます。<br>
        一覧を選ぶとプレビューがすぐに切り替わります。
      </div>
    </aside>

    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <main class="main">
      <header class="toolbar">
        <button
          id="menuButton"
          class="button button-secondary button-icon mobile-only"
          type="button"
          aria-label="HTML一覧を開く"
        >
          ☰
        </button>

        <div id="selectedTitle" class="selected-title">HTMLを選択してください</div>

        <div class="device-switcher" aria-label="プレビュー端末">
          <button
            class="device-button is-active"
            type="button"
            data-device="iphone17pro"
          >
            iPhone 17 Pro
          </button>
          <button
            class="device-button"
            type="button"
            data-device="ipad7"
          >
            iPad 第7世代
          </button>
        </div>
      </header>

      <section id="workspace" class="workspace"></section>
    </main>
  </div>

  <dialog id="deleteDialog">
    <div class="dialog-content">
      <h2 class="dialog-title">HTMLを削除しますか？</h2>
      <p id="deleteDescription" class="dialog-description"></p>

      <div class="dialog-actions">
        <button id="cancelDeleteButton" class="button button-secondary" type="button">
          キャンセル
        </button>
        <button id="confirmDeleteButton" class="button button-danger" type="button">
          削除する
        </button>
      </div>
    </div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "html-device-previewer-documents-v2";
      const SELECTED_DOCUMENT_KEY = "html-device-previewer-selected-document-v2";
      const DEVICE_KEY = "html-device-previewer-device-v2";

      const devices = {
        iphone17pro: {
          key: "iphone17pro",
          label: "iPhone 17 Pro",
          width: 402,
          height: 874,
          shellClass: "iphone",
          scaleLimit: 0.88
        },
        ipad7: {
          key: "ipad7",
          label: "iPad 第7世代（横向き）",
          width: 1080,
          height: 810,
          shellClass: "ipad",
          scaleLimit: 0.90
        }
      };

      const defaultHtml = `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>サンプルページ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #1d2740;
      background: linear-gradient(145deg, #eff3ff, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }
    main {
      width: min(88%, 520px);
      padding: 36px 28px;
      text-align: center;
      background: rgba(255, 255, 255, .92);
      border: 1px solid #e0e6f5;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(45, 67, 120, .13);
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 7vw, 42px); }
    p { margin: 0; color: #68728a; line-height: 1.8; }
    button {
      margin-top: 24px;
      padding: 13px 20px;
      color: white;
      background: #4263eb;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello!</h1>
    <p>このHTMLは端末プレビュー用のサンプルです。<br>左の編集欄で内容を自由に変更できます。</p>
    <button onclick="alert('プレビュー内のボタンです')">タップする</button>
  </main>
</body>
</html>`;

      const state = {
        documents: [],
        selectedId: null,
        deviceKey: "iphone17pro",
        deleteTargetId: null,
        renderTimer: null
      };

      const elements = {
        sidebar: document.getElementById("sidebar"),
        sidebarBackdrop: document.getElementById("sidebarBackdrop"),
        menuButton: document.getElementById("menuButton"),
        addDocumentButton: document.getElementById("addDocumentButton"),
        documentList: document.getElementById("documentList"),
        selectedTitle: document.getElementById("selectedTitle"),
        workspace: document.getElementById("workspace"),
        deleteDialog: document.getElementById("deleteDialog"),
        deleteDescription: document.getElementById("deleteDescription"),
        cancelDeleteButton: document.getElementById("cancelDeleteButton"),
        confirmDeleteButton: document.getElementById("confirmDeleteButton")
      };

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }

        return `html-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatUpdatedAt(timestamp) {
        if (!timestamp) return "未保存";

        const date = new Date(timestamp);
        return new Intl.DateTimeFormat("ja-JP", {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function getSelectedDocument() {
        return state.documents.find((documentItem) => documentItem.id === state.selectedId) || null;
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.documents));
        localStorage.setItem(SELECTED_DOCUMENT_KEY, state.selectedId || "");
        localStorage.setItem(DEVICE_KEY, state.deviceKey);
      }

      function loadState() {
        try {
          const savedDocuments = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

          if (Array.isArray(savedDocuments) && savedDocuments.length > 0) {
            state.documents = savedDocuments
              .filter((item) => item && typeof item === "object")
              .map((item) => ({
                id: item.id || createId(),
                name: typeof item.name === "string" ? item.name : "名称未設定",
                content: typeof item.content === "string" ? item.content : "",
                createdAt: Number(item.createdAt) || Date.now(),
                updatedAt: Number(item.updatedAt) || Date.now()
              }));
          } else {
            const now = Date.now();
            state.documents = [{
              id: createId(),
              name: "サンプルページ",
              content: defaultHtml,
              createdAt: now,
              updatedAt: now
            }];
          }

          const savedSelectedId = localStorage.getItem(SELECTED_DOCUMENT_KEY);
          state.selectedId = state.documents.some((item) => item.id === savedSelectedId)
            ? savedSelectedId
            : state.documents[0]?.id || null;

          const savedDevice = localStorage.getItem(DEVICE_KEY);
          state.deviceKey = devices[savedDevice] ? savedDevice : "iphone17pro";
        } catch {
          const now = Date.now();
          state.documents = [{
            id: createId(),
            name: "サンプルページ",
            content: defaultHtml,
            createdAt: now,
            updatedAt: now
          }];
          state.selectedId = state.documents[0].id;
          state.deviceKey = "iphone17pro";
        }

        saveState();
      }

      function closeSidebar() {
        elements.sidebar.classList.remove("is-open");
        elements.sidebarBackdrop.classList.remove("is-open");
      }

      function openSidebar() {
        elements.sidebar.classList.add("is-open");
        elements.sidebarBackdrop.classList.add("is-open");
      }

      function renderDocumentList() {
        if (state.documents.length === 0) {
          elements.documentList.innerHTML = `
            <div class="empty-state">
              <div>
                <h2>HTMLがありません</h2>
                <p>「追加」からHTMLを作成してください。</p>
              </div>
            </div>
          `;
          return;
        }

        elements.documentList.innerHTML = state.documents.map((documentItem) => {
          const isActive = documentItem.id === state.selectedId;

          return `
            <button
              class="document-item ${isActive ? "is-active" : ""}"
              type="button"
              data-document-id="${escapeHtml(documentItem.id)}"
              aria-current="${isActive ? "page" : "false"}"
            >
              <span class="document-icon">&lt;/&gt;</span>
              <span class="document-meta">
                <span class="document-name">${escapeHtml(documentItem.name || "名称未設定")}</span>
                <span class="document-subtext">更新 ${escapeHtml(formatUpdatedAt(documentItem.updatedAt))}</span>
              </span>
            </button>
          `;
        }).join("");

        elements.documentList.querySelectorAll("[data-document-id]").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedId = button.dataset.documentId;
            saveState();
            render();
            closeSidebar();
          });
        });
      }

      function getPreviewScale(device) {
        const stage = document.querySelector(".preview-stage");

        if (!stage) return 0.5;

        const stageWidth = Math.max(stage.clientWidth - 40, 180);
        const stageHeight = Math.max(stage.clientHeight - 40, 180);
        const shellBorder = 14;

        const widthScale = stageWidth / (device.width + shellBorder);
        const heightScale = stageHeight / (device.height + shellBorder);

        return Math.min(widthScale, heightScale, device.scaleLimit);
      }

      function renderWorkspace() {
        const selected = getSelectedDocument();

        if (!selected) {
          elements.selectedTitle.textContent = "HTMLを選択してください";
          elements.workspace.innerHTML = `
            <section class="editor-panel">
              <div class="empty-state">
                <div>
                  <h2>HTMLを作成しましょう</h2>
                  <p>左上の「追加」から、新しいHTMLを登録できます。</p>
                  <button id="emptyAddButton" class="button button-primary" type="button">＋ HTMLを追加</button>
                </div>
              </div>
            </section>
            <section class="preview-panel">
              <div class="empty-state">
                <div>
                  <h2>プレビュー</h2>
                  <p>HTMLを選択すると、ここで端末サイズごとに確認できます。</p>
                </div>
              </div>
            </section>
          `;

          document.getElementById("emptyAddButton")?.addEventListener("click", addDocument);
          return;
        }

        const device = devices[state.deviceKey];

        elements.selectedTitle.textContent = selected.name || "名称未設定";

        elements.workspace.innerHTML = `
          <section class="editor-panel">
            <div class="panel-heading">
              <h2 class="panel-heading-title">編集</h2>
              <span id="characterCount" class="character-count">${selected.content.length.toLocaleString("ja-JP")}文字</span>
            </div>

            <div class="editor-body">
              <div>
                <label class="field-label" for="documentName">HTML名</label>
                <input
                  id="documentName"
                  class="name-input"
                  type="text"
                  value="${escapeHtml(selected.name)}"
                  placeholder="例：ホーム画面"
                  maxlength="80"
                >
              </div>

              <div class="editor-wrap">
                <label class="field-label" for="htmlEditor">HTML</label>
                <textarea
                  id="htmlEditor"
                  class="html-editor"
                  spellcheck="false"
                  placeholder="HTML・CSS・JavaScriptを入力してください"
                >${escapeHtml(selected.content)}</textarea>
              </div>

              <div class="editor-actions">
                <button id="deleteButton" class="button button-danger" type="button">
                  削除
                </button>

                <div class="editor-actions-right">
                  <button id="duplicateButton" class="button button-secondary" type="button">
                    複製
                  </button>
                  <button id="saveButton" class="button button-primary" type="button">
                    保存
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="preview-panel">
            <div class="panel-heading">
              <h2 class="panel-heading-title">プレビュー</h2>
              <div class="preview-tools">
                <span id="deviceLabel" class="device-label">${device.label}</span>
                <button id="fullscreenButton" class="button button-secondary button-icon" type="button" aria-label="全画面プレビュー">
                  ⛶
                </button>
              </div>
            </div>

            <div class="preview-stage">
              <div
                id="deviceShell"
                class="device-shell ${device.shellClass}"
                aria-label="${device.label}プレビュー"
              >
                <iframe
                  id="previewFrame"
                  class="preview-frame"
                  title="HTMLプレビュー"
                  sandbox="allow-scripts allow-forms allow-modals allow-popups"
                ></iframe>
              </div>
            </div>
          </section>
        `;

        const nameInput = document.getElementById("documentName");
        const htmlEditor = document.getElementById("htmlEditor");
        const saveButton = document.getElementById("saveButton");
        const duplicateButton = document.getElementById("duplicateButton");
        const deleteButton = document.getElementById("deleteButton");
        const fullscreenButton = document.getElementById("fullscreenButton");
        const frame = document.getElementById("previewFrame");
        const shell = document.getElementById("deviceShell");
        const characterCount = document.getElementById("characterCount");

        function applyPreview() {
          const latestDocument = getSelectedDocument();
          if (!latestDocument) return;

          frame.srcdoc = latestDocument.content || `
            <!DOCTYPE html>
            <html lang="ja">
              <body style="margin:0;display:grid;min-height:100vh;place-items:center;color:#75809a;font-family:sans-serif;">
                HTMLを入力してください
              </body>
            </html>
          `;
        }

        function resizePreview() {
          const currentDevice = devices[state.deviceKey];
          const scale = getPreviewScale(currentDevice);

          shell.style.width = `${currentDevice.width}px`;
          shell.style.height = `${currentDevice.height}px`;
          shell.style.transform = `scale(${scale})`;
          shell.style.margin = `${-(currentDevice.height * (1 - scale)) / 2}px ${-(currentDevice.width * (1 - scale)) / 2}px`;
        }

        function updateDocument({ shouldRenderList = true } = {}) {
          const documentItem = getSelectedDocument();

          if (!documentItem) return;

          documentItem.name = nameInput.value.trim() || "名称未設定";
          documentItem.content = htmlEditor.value;
          documentItem.updatedAt = Date.now();

          characterCount.textContent = `${documentItem.content.length.toLocaleString("ja-JP")}文字`;
          elements.selectedTitle.textContent = documentItem.name;

          saveState();

          if (shouldRenderList) {
            renderDocumentList();
          }

          clearTimeout(state.renderTimer);
          state.renderTimer = setTimeout(applyPreview, 120);
        }

        nameInput.addEventListener("input", () => updateDocument());
        htmlEditor.addEventListener("input", () => updateDocument());
        saveButton.addEventListener("click", () => {
          updateDocument();
          saveButton.textContent = "保存しました";

          setTimeout(() => {
            saveButton.textContent = "保存";
          }, 1100);
        });

        htmlEditor.addEventListener("keydown", (event) => {
          if (event.key === "Tab") {
            event.preventDefault();

            const start = htmlEditor.selectionStart;
            const end = htmlEditor.selectionEnd;
            const value = htmlEditor.value;

            htmlEditor.value = `${value.slice(0, start)}  ${value.slice(end)}`;
            htmlEditor.selectionStart = htmlEditor.selectionEnd = start + 2;
            htmlEditor.dispatchEvent(new Event("input"));
          }
        });

        duplicateButton.addEventListener("click", () => {
          const original = getSelectedDocument();

          if (!original) return;

          const now = Date.now();
          const copy = {
            id: createId(),
            name: `${original.name || "名称未設定"} のコピー`,
            content: original.content,
            createdAt: now,
            updatedAt: now
          };

          state.documents.push(copy);
          state.selectedId = copy.id;
          saveState();
          render();
        });

        deleteButton.addEventListener("click", () => {
          state.deleteTargetId = selected.id;
          elements.deleteDescription.textContent = `「${selected.name || "名称未設定"}」を削除します。この操作は元に戻せません。`;
          elements.deleteDialog.showModal();
        });

        fullscreenButton.addEventListener("click", () => {
          const previewPanel = document.querySelector(".preview-panel");

          if (!document.fullscreenElement) {
            previewPanel?.requestFullscreen?.();
          } else {
            document.exitFullscreen?.();
          }
        });

        applyPreview();
        resizePreview();

        window.requestAnimationFrame(resizePreview);
      }

      function renderDeviceButtons() {
        document.querySelectorAll("[data-device]").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.device === state.deviceKey);
        });
      }

      function render() {
        renderDocumentList();
        renderWorkspace();
        renderDeviceButtons();
      }

      function addDocument() {
        const now = Date.now();

        const newDocument = {
          id: createId(),
          name: `新しいHTML ${state.documents.length + 1}`,
          content: `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新しいHTML</title>
</head>
<body>
  <h1>新しいHTML</h1>
  <p>ここにHTMLを入力してください。</p>
</body>
</html>`,
          createdAt: now,
          updatedAt: now
        };

        state.documents.push(newDocument);
        state.selectedId = newDocument.id;
        saveState();
        render();
        closeSidebar();

        setTimeout(() => {
          document.getElementById("documentName")?.focus();
          document.getElementById("documentName")?.select();
        }, 0);
      }

      function deleteSelectedDocument() {
        const targetId = state.deleteTargetId;

        if (!targetId) return;

        const index = state.documents.findIndex((documentItem) => documentItem.id === targetId);

        if (index === -1) return;

        state.documents.splice(index, 1);

        const nextDocument = state.documents[index] || state.documents[index - 1] || null;
        state.selectedId = nextDocument?.id || null;
        state.deleteTargetId = null;

        saveState();
        render();
      }

      elements.addDocumentButton.addEventListener("click", addDocument);

      elements.menuButton.addEventListener("click", () => {
        if (elements.sidebar.classList.contains("is-open")) {
          closeSidebar();
        } else {
          openSidebar();
        }
      });

      elements.sidebarBackdrop.addEventListener("click", closeSidebar);

      elements.cancelDeleteButton.addEventListener("click", () => {
        state.deleteTargetId = null;
        elements.deleteDialog.close();
      });

      elements.confirmDeleteButton.addEventListener("click", () => {
        elements.deleteDialog.close();
        deleteSelectedDocument();
      });

      document.querySelectorAll("[data-device]").forEach((button) => {
        button.addEventListener("click", () => {
          const deviceKey = button.dataset.device;

          if (!devices[deviceKey]) return;

          state.deviceKey = deviceKey;
          saveState();
          render();
        });
      });

      window.addEventListener("resize", () => {
        const selected = getSelectedDocument();

        if (!selected) return;

        const shell = document.getElementById("deviceShell");
        const stage = document.querySelector(".preview-stage");

        if (!shell || !stage) return;

        const device = devices[state.deviceKey];
        const scale = getPreviewScale(device);

        shell.style.width = `${device.width}px`;
        shell.style.height = `${device.height}px`;
        shell.style.transform = `scale(${scale})`;
        shell.style.margin = `${-(device.height * (1 - scale)) / 2}px ${-(device.width * (1 - scale)) / 2}px`;
      });

      loadState();
      render();
    })();
  </script>
</body>
</html>
