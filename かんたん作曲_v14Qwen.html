<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWA Previewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #eee;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Search Bar */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #16213e;
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
}
.search-bar input {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #0f3460;
  background: #1a1a2e;
  color: #eee;
  font-size: 14px;
  outline: none;
}
.search-bar input:focus { border-color: #e94560; }
.search-bar button {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  background: #e94560;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.search-bar button:hover { background: #c73e54; }
.search-count {
  font-size: 12px;
  color: #888;
  white-space: nowrap;
}

/* Preview Area */
.preview-area {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  padding: 10px;
  overflow: hidden;
  position: relative;
}

/* iPhone Frame */
.iphone-frame {
  width: 280px;
  height: 606px;
  background: #000;
  border-radius: 44px;
  border: 3px solid #333;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  flex-shrink: 0;
}
.iphone-screen {
  position: absolute;
  top: 0; left: 0;
  width: 402px;
  height: 874px;
  transform-origin: top left;
  overflow: hidden;
  border-radius: 41px;
}
.iphone-screen iframe {
  width: 402px;
  height: 874px;
  border: none;
}
/* Dynamic Island - real proportions */
.dynamic-island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 126px;
  height: 37px;
  background: #000;
  border-radius: 20px;
  z-index: 10;
  pointer-events: none;
}
/* Home Bar - real proportions */
.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 5px;
  background: rgba(255,255,255,0.3);
  border-radius: 3px;
  z-index: 10;
  pointer-events: none;
}

/* iPad Frame */
.ipad-frame {
  width: 420px;
  height: 315px;
  background: #000;
  border-radius: 18px;
  border: 3px solid #333;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  flex-shrink: 0;
}
.ipad-screen {
  position: absolute;
  top: 0; left: 0;
  width: 1024px;
  height: 768px;
  transform-origin: top left;
  overflow: hidden;
  border-radius: 15px;
}
.ipad-screen iframe {
  width: 1024px;
  height: 768px;
  border: none;
}

/* Fullscreen Button */
.fullscreen-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: #0f3460;
  color: #eee;
  font-size: 13px;
  cursor: pointer;
  z-index: 100;
}
.fullscreen-btn:hover { background: #e94560; }

/* Card List */
.card-list-wrapper {
  flex-shrink: 0;
  background: #16213e;
  border-top: 1px solid #0f3460;
  padding: 10px 0;
}
.card-list {
  display: flex;
  gap: 12px;
  padding: 0 12px;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.card-list::-webkit-scrollbar { height: 6px; }
.card-list::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 3px; }
.card-list::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

.card {
  min-width: 160px;
  max-width: 160px;
  height: 100px;
  background: #1a1a2e;
  border: 2px solid #0f3460;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.card:hover { border-color: #e94560; transform: translateY(-2px); }
.card.active { border-color: #e94560; background: #1e2a4a; }
.card-title {
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  padding: 0 8px;
  word-break: break-all;
  line-height: 1.3;
}
.card-preview {
  font-size: 10px;
  color: #888;
  margin-top: 4px;
  padding: 0 8px;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}
.card-new {
  border-style: dashed;
  border-color: #0f3460;
}
.card-new:hover { border-color: #e94560; border-style: dashed; }
.card-new .card-title { color: #e94560; font-size: 28px; }

/* Highlight for search */
.highlight {
  background: #e94560;
  color: #fff;
  border-radius: 2px;
  padding: 0 2px;
}
.highlight-current {
  background: #ffdd57;
  color: #000;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #16213e;
  border-radius: 16px;
  padding: 20px;
  width: 90%;
  max-width: 600px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-header h3 { font-size: 16px; }
.modal-close {
  background: none;
  border: none;
  color: #eee;
  font-size: 24px;
  cursor: pointer;
}
.modal input[type="text"] {
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #0f3460;
  background: #1a1a2e;
  color: #eee;
  font-size: 14px;
  outline: none;
}
.modal textarea {
  flex: 1;
  min-height: 200px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #0f3460;
  background: #1a1a2e;
  color: #eee;
  font-size: 13px;
  font-family: 'SF Mono', monospace;
  resize: vertical;
  outline: none;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.modal-buttons button {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  cursor: pointer;
}
.btn-save { background: #e94560; color: #fff; }
.btn-save:hover { background: #c73e54; }
.btn-delete { background: #dc3545; color: #fff; }
.btn-delete:hover { background: #b02a37; }
.btn-cancel { background: #0f3460; color: #eee; }
.btn-cancel:hover { background: #1a4a8a; }

/* Long press indicator */
.long-press-indicator {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(233, 69, 96, 0.2);
  border-radius: 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.card.pressing .long-press-indicator { opacity: 1; }
</style>
</head>
<body>

<!-- Search Bar -->
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="検索...">
  <button id="searchBtn">検索</button>
  <span class="search-count" id="searchCount"></span>
</div>

<!-- Preview Area -->
<div class="preview-area" id="previewArea">
  <button class="fullscreen-btn" id="fullscreenBtn">全画面</button>
  
  <!-- iPhone 17 Pro -->
  <div class="iphone-frame" id="iphoneFrame">
    <div class="dynamic-island"></div>
    <div class="iphone-screen" id="iphoneScreen">
      <iframe id="iphoneIframe"></iframe>
    </div>
    <div class="home-bar"></div>
  </div>
  
  <!-- iPad 7th Gen -->
  <div class="ipad-frame" id="ipadFrame">
    <div class="ipad-screen" id="ipadScreen">
      <iframe id="ipadIframe"></iframe>
    </div>
  </div>
</div>

<!-- Card List -->
<div class="card-list-wrapper">
  <div class="card-list" id="cardList"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">編集</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <input type="text" id="editName" placeholder="タイトル">
    <textarea id="editCode" placeholder="HTML・CSS・JavaScriptをそのまま貼り付けてください。"></textarea>
    <div class="modal-buttons">
      <button class="btn-delete" id="btnDelete">削除</button>
      <button class="btn-cancel" id="btnCancel">キャンセル</button>
      <button class="btn-save" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
// Data
let items = JSON.parse(localStorage.getItem('pwa_previewer_items') || '[]');
let activeId = null;
let editingId = null;
let searchMatches = [];
let currentMatchIndex = -1;

// Scale calculation
function updateScales() {
  const iphoneScreen = document.getElementById('iphoneScreen');
  const ipadScreen = document.getElementById('ipadScreen');
  const iphoneFrame = document.getElementById('iphoneFrame');
  const ipadFrame = document.getElementById('ipadFrame');
  
  // iPhone 17 Pro: 402x874 -> fit in frame
  const iphoneFrameW = iphoneFrame.clientWidth - 6; // border
  const iphoneFrameH = iphoneFrame.clientHeight - 6;
  const iphoneScale = Math.min(iphoneFrameW / 402, iphoneFrameH / 874);
  iphoneScreen.style.transform = `scale(${iphoneScale})`;
  
  // iPad 7: 1024x768 -> fit in frame
  const ipadFrameW = ipadFrame.clientWidth - 6;
  const ipadFrameH = ipadFrame.clientHeight - 6;
  const ipadScale = Math.min(ipadFrameW / 1024, ipadFrameH / 768);
  ipadScreen.style.transform = `scale(${ipadScale})`;
}

// Render card list
function renderCards() {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  
  items.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'card' + (item.id === activeId ? ' active' : '');
    card.dataset.id = item.id;
    
    const preview = item.code.replace(/<[^>]*>/g, '').substring(0, 30);
    card.innerHTML = `
      <div class="long-press-indicator"></div>
      <div class="card-title">${escapeHtml(item.name)}</div>
      <div class="card-preview">${escapeHtml(preview)}</div>
    `;
    
    // Click to select
    card.addEventListener('click', (e) => {
      if (!card.classList.contains('pressing')) {
        selectItem(item.id);
      }
    });
    
    // Long press to edit
    let pressTimer = null;
    card.addEventListener('mousedown', startPress);
    card.addEventListener('touchstart', startPress);
    card.addEventListener('mouseup', cancelPress);
    card.addEventListener('mouseleave', cancelPress);
    card.addEventListener('touchend', cancelPress);
    card.addEventListener('touchcancel', cancelPress);
    
    function startPress(e) {
      e.preventDefault();
      card.classList.add('pressing');
      pressTimer = setTimeout(() => {
        card.classList.remove('pressing');
        openEditModal(item.id);
      }, 500);
    }
    function cancelPress() {
      clearTimeout(pressTimer);
      card.classList.remove('pressing');
    }
    
    list.appendChild(card);
  });
  
  // New card
  const newCard = document.createElement('div');
  newCard.className = 'card card-new';
  newCard.innerHTML = `<div class="card-title">＋</div><div class="card-preview">新規作成</div>`;
  newCard.addEventListener('click', () => {
    openEditModal(null);
  });
  list.appendChild(newCard);
  
  // Scroll active card into view
  if (activeId) {
    const activeCard = list.querySelector(`.card[data-id="${activeId}"]`);
    if (activeCard) {
      activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectItem(id) {
  activeId = id;
  renderCards();
  updatePreview();
}

function updatePreview() {
  const item = items.find(i => i.id === activeId);
  const iphoneIframe = document.getElementById('iphoneIframe');
  const ipadIframe = document.getElementById('ipadIframe');
  
  if (item) {
    const blob = new Blob([item.code], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    iphoneIframe.src = url;
    ipadIframe.src = url;
  } else {
    iphoneIframe.src = 'about:blank';
    ipadIframe.src = 'about:blank';
  }
}

function openEditModal(id) {
  editingId = id;
  const modal = document.getElementById('modalOverlay');
  const nameInput = document.getElementById('editName');
  const codeInput = document.getElementById('editCode');
  const deleteBtn = document.getElementById('btnDelete');
  const titleEl = document.getElementById('modalTitle');
  
  if (id) {
    const item = items.find(i => i.id === id);
    nameInput.value = item.name;
    codeInput.value = item.code;
    deleteBtn.style.display = 'inline-block';
    titleEl.textContent = '編集';
  } else {
    nameInput.value = '';
    codeInput.value = '';
    deleteBtn.style.display = 'none';
    titleEl.textContent = '新規作成';
  }
  
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
}

function saveItem() {
  const name = document.getElementById('editName').value.trim() || '無題';
  const code = document.getElementById('editCode').value;
  
  if (editingId) {
    const item = items.find(i => i.id === editingId);
    item.name = name;
    item.code = code;
  } else {
    const newItem = {
      id: Date.now().toString(),
      name: name,
      code: code
    };
    items.push(newItem);
    activeId = newItem.id;
  }
  
  localStorage.setItem('pwa_previewer_items', JSON.stringify(items));
  closeModal();
  renderCards();
  updatePreview();
}

function deleteItem() {
  if (editingId && confirm('削除しますか？')) {
    items = items.filter(i => i.id !== editingId);
    if (activeId === editingId) activeId = items.length > 0 ? items[0].id : null;
    localStorage.setItem('pwa_previewer_items', JSON.stringify(items));
    closeModal();
    renderCards();
    updatePreview();
  }
}

// Search functionality
function performSearch() {
  const query = document.getElementById('searchInput').value.trim();
  const countEl = document.getElementById('searchCount');
  
  // Clear previous highlights
  clearHighlights();
  searchMatches = [];
  currentMatchIndex = -1;
  
  if (!query) {
    countEl.textContent = '';
    return;
  }
  
  // Search in card titles and previews
  const cards = document.querySelectorAll('.card:not(.card-new)');
  cards.forEach(card => {
    const titleEl = card.querySelector('.card-title');
    const previewEl = card.querySelector('.card-preview');
    const titleText = titleEl.textContent;
    const previewText = previewEl.textContent;
    
    if (titleText.toLowerCase().includes(query.toLowerCase()) || 
        previewText.toLowerCase().includes(query.toLowerCase())) {
      searchMatches.push(card);
      
      // Highlight in title
      if (titleText.toLowerCase().includes(query.toLowerCase())) {
        titleEl.innerHTML = highlightText(titleText, query);
      }
      // Highlight in preview
      if (previewText.toLowerCase().includes(query.toLowerCase())) {
        previewEl.innerHTML = highlightText(previewText, query);
      }
    }
  });
  
  if (searchMatches.length > 0) {
    currentMatchIndex = 0;
    scrollToMatch();
    countEl.textContent = `${currentMatchIndex + 1}/${searchMatches.length}`;
  } else {
    countEl.textContent = '0件';
  }
}

function highlightText(text, query) {
  const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
  return text.replace(regex, '<span class="highlight">$1</span>');
}

function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function scrollToMatch() {
  // Remove current highlight
  document.querySelectorAll('.highlight-current').forEach(el => {
    el.classList.remove('highlight-current');
  });
  
  if (searchMatches.length === 0) return;
  
  const card = searchMatches[currentMatchIndex];
  card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  
  // Mark current
  const highlights = card.querySelectorAll('.highlight');
  highlights.forEach(h => h.classList.add('highlight-current'));
}

function nextSearchMatch() {
  if (searchMatches.length === 0) return;
  currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
  scrollToMatch();
  document.getElementById('searchCount').textContent = `${currentMatchIndex + 1}/${searchMatches.length}`;
}

function clearHighlights() {
  document.querySelectorAll('.card-title, .card-preview').forEach(el => {
    // Restore original text
    const spans = el.querySelectorAll('.highlight, .highlight-current');
    spans.forEach(span => {
      span.replaceWith(span.textContent);
    });
  });
}

// Event listeners
document.getElementById('searchBtn').addEventListener('click', () => {
  const query = document.getElementById('searchInput').value.trim();
  if (query && searchMatches.length > 0) {
    nextSearchMatch();
  } else {
    performSearch();
  }
});

document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const query = e.target.value.trim();
    if (query && searchMatches.length > 0) {
      nextSearchMatch();
    } else {
      performSearch();
    }
  }
});

document.getElementById('searchInput').addEventListener('input', () => {
  clearHighlights();
  searchMatches = [];
  currentMatchIndex = -1;
  document.getElementById('searchCount').textContent = '';
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('btnCancel').addEventListener('click', closeModal);
document.getElementById('btnSave').addEventListener('click', saveItem);
document.getElementById('btnDelete').addEventListener('click', deleteItem);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// Fullscreen
document.getElementById('fullscreenBtn').addEventListener('click', () => {
  const area = document.getElementById('previewArea');
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    area.requestFullscreen();
  }
});

// Resize handler
window.addEventListener('resize', updateScales);

// Init
function init() {
  if (items.length > 0 && !activeId) {
    activeId = items[0].id;
  }
  renderCards();
  updatePreview();
  setTimeout(updateScales, 100);
}

init();
</script>
</body>
</html>
