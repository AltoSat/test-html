<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>PWA Previewer — iPhone 17 Pro</title>
<style>
  :root{
    --bg:#000;
    --panel:#1c1c1e;
    --panel-2:#2c2c2e;
    --border:#3a3a3c;
    --text:#f2f2f7;
    --text-dim:#8e8e93;
    --accent:#0a84ff;
    --accent-2:#64d2ff;
    --danger:#ff453a;
    --ok:#30d158;
    --radius:18px;
    --radius-sm:12px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    min-height:100dvh;overscroll-behavior:none;
    padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  textarea{font-family:inherit}

  .app{
    max-width:720px;margin:0 auto;padding:16px;
    display:flex;flex-direction:column;gap:14px;min-height:100dvh;
  }
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 4px 10px;
  }
  .title{
    display:flex;align-items:center;gap:10px;
    font-size:20px;font-weight:700;letter-spacing:-.02em;
  }
  .title .dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 0 10px rgba(10,132,255,.6);
  }
  .subtitle{font-size:11px;color:var(--text-dim);margin-top:2px;letter-spacing:.02em}
  .iconbtn{
    width:40px;height:40px;border-radius:50%;
    background:var(--panel);display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);transition:transform .15s,background .15s;
  }
  .iconbtn:active{transform:scale(.92);background:var(--panel-2)}
  .iconbtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .tabs{
    display:flex;background:var(--panel);border-radius:14px;padding:4px;
    border:1px solid var(--border);
  }
  .tab{
    flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;
    color:var(--text-dim);transition:all .2s;
  }
  .tab.active{background:var(--panel-2);color:var(--text)}

  .panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;
  }
  .editor-wrap{display:flex;flex-direction:column;gap:10px}
  .editor{
    width:100%;min-height:260px;max-height:50vh;
    background:#0a0a0c;color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px;font-size:13px;line-height:1.5;
    font-family:"SF Mono",Menlo,Consolas,monospace;
    resize:vertical;outline:none;
    tab-size:2;
  }
  .editor:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:90px;
    padding:12px 14px;border-radius:12px;
    font-size:14px;font-weight:600;
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);
    transition:transform .1s,background .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--danger)}

  .status{
    font-size:12px;color:var(--text-dim);
    display:flex;align-items:center;gap:6px;
  }
  .status .led{width:6px;height:6px;border-radius:50%;background:var(--text-dim)}
  .status.ok .led{background:var(--ok)}
  .status.err .led{background:var(--danger)}

  /* Device frame */
  .device-stage{
    display:flex;justify-content:center;align-items:center;
    padding:10px 0 20px;
  }
  .device{
    position:relative;
    width:393px;height:852px;
    max-width:100%;
    aspect-ratio:393/852;
    background:#0b0b0d;
    border-radius:55px;
    padding:4px;
    background-clip:padding-box;
    box-shadow:
      0 0 0 2px #2a2a2d,
      0 0 0 4px #0a0a0c,
      0 30px 60px -20px rgba(0,0,0,.8),
      0 0 40px rgba(10,132,255,.08);
  }
  .device::before{
    /* titanium side highlight */
    content:"";position:absolute;inset:-1px;border-radius:56px;
    background:linear-gradient(145deg,rgba(255,255,255,.08),transparent 30%,transparent 70%,rgba(255,255,255,.04));
    pointer-events:none;z-index:3;
  }
  .screen{
    position:relative;width:100%;height:100%;
    border-radius:51px;overflow:hidden;
    background:#000;
  }
  .screen iframe{
    position:absolute;inset:0;width:100%;height:100%;
    border:0;background:#000;
  }
  .dynamic-island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:124px;height:37px;background:#000;border-radius:20px;
    z-index:10;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .home-indicator{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:134px;height:5px;background:rgba(255,255,255,.85);
    border-radius:3px;z-index:10;
  }
  .device-label{
    position:absolute;top:-28px;left:0;right:0;
    text-align:center;font-size:11px;color:var(--text-dim);
    letter-spacing:.08em;text-transform:uppercase;
  }

  /* Fullscreen mode */
  body.fullscreen .app > :not(.device-stage){display:none}
  body.fullscreen .app{padding:0;max-width:none}
  body.fullscreen .device{
    width:100vw;height:100dvh;max-width:none;
    border-radius:0;box-shadow:none;padding:0;
  }
  body.fullscreen .device::before{display:none}
  body.fullscreen .screen{border-radius:0}
  body.fullscreen .dynamic-island,body.fullscreen .home-indicator{display:none}
  body.fullscreen .device-label{display:none}
  .fs-exit{
    position:fixed;top:calc(12px + var(--safe-top));right:12px;z-index:999;
    background:rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;
    display:none;border:1px solid rgba(255,255,255,.15);
  }
  body.fullscreen .fs-exit{display:block}

  /* Responsive: smaller devices scale the phone */
  @media (max-width:430px){
    .device{width:calc(100vw - 32px);height:auto;aspect-ratio:393/852}
  }
  @media (max-height:700px){
    .device{height:calc(100vh - 260px);width:auto;aspect-ratio:393/852}
  }

  .hint{
    font-size:11px;color:var(--text-dim);line-height:1.5;
    padding:8px 12px;background:rgba(255,255,255,.03);
    border-radius:10px;border:1px dashed var(--border);
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="title"><span class="dot"></span>PWA Previewer</div>
      <div class="subtitle">iPhone 17 Pro · Standalone · Dark</div>
    </div>
    <button class="iconbtn" id="fsBtn" aria-label="全画面">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="edit">コード</button>
    <button class="tab" data-tab="preview">プレビュー</button>
  </div>

  <section class="panel" id="editPanel">
    <div class="editor-wrap">
      <textarea class="editor" id="code" spellcheck="false" placeholder="ここにHTMLを貼り付け..."></textarea>
      <div class="row">
        <button class="btn primary" id="runBtn">▶ プレビュー</button>
        <button class="btn" id="sampleBtn">サンプル</button>
        <button class="btn danger" id="clearBtn">クリア</button>
      </div>
      <div class="status" id="status"><span class="led"></span><span id="statusText">準備完了</span></div>
      <div class="hint">
        env(safe-area-inset-*)、100dvh、position:fixed、Dynamic Island下の重なりなどを実際の挙動で確認できます。
      </div>
    </div>
  </section>

  <section class="panel" id="previewPanel" style="display:none">
    <div class="device-stage">
      <div class="device">
        <div class="device-label">iPhone 17 Pro</div>
        <div class="screen">
          <div class="dynamic-island"></div>
          <iframe id="frame" title="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<button class="fs-exit" id="fsExit">✕ 閉じる</button>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const code = $('#code');
  const frame = $('#frame');
  const statusEl = $('#status');
  const statusText = $('#statusText');
  const editPanel = $('#editPanel');
  const previewPanel = $('#previewPanel');
  const STORAGE_KEY = 'pwa-previewer-html-v1';

  const SAMPLE = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo PWA</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,sans-serif}
  body{
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky;top:0;z-index:10;
    padding:14px 18px;
    background:rgba(28,28,30,.85);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:17px;font-weight:700;
  }
  main{flex:1;overflow-y:auto;padding:18px;padding-bottom:100px}
  .card{
    background:#1c1c1e;border-radius:16px;padding:16px;margin-bottom:12px;
    border:1px solid rgba(255,255,255,.06);
  }
  .card h3{font-size:15px;margin-bottom:6px}
  .card p{font-size:13px;color:#8e8e93;line-height:1.5}
  .btn{
    display:block;width:100%;padding:14px;margin-top:10px;
    background:#0a84ff;color:#fff;border:0;border-radius:12px;
    font-size:15px;font-weight:600;
  }
  nav.tabbar{
    position:fixed;left:0;right:0;bottom:0;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:rgba(28,28,30,.9);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.08);
    display:flex;justify-content:space-around;
  }
  nav.tabbar button{
    background:none;border:0;color:#8e8e93;font-size:10px;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;
  }
  nav.tabbar button.active{color:#0a84ff}
  nav.tabbar .ic{width:22px;height:22px;border-radius:6px;background:currentColor;opacity:.8}
  input{
    width:100%;padding:12px;background:#2c2c2e;border:1px solid #3a3a3c;
    border-radius:10px;color:#fff;font-size:15px;outline:none;
  }
</style>
</head>
<body>
  <header>ようこそ 👋</header>
  <main>
    <div class="card">
      <h3>Safe Area テスト</h3>
      <p>上部・下部の余白が正しく確保されているか確認してください。</p>
    </div>
    <div class="card">
      <h3>入力テスト</h3>
      <input type="text" placeholder="テキスト入力...">
      <button class="btn" onclick="alert('タップ成功!')">タップ</button>
    </div>
    <div class="card"><h3>スクロール</h3><p>この画面をスクロールして、下部タブバーとの重なりやfixed要素の挙動を確認してください。</p></div>
    <div class="card"><h3>カード 4</h3><p>100dvh の動作確認用。</p></div>
    <div class="card"><h3>カード 5</h3><p>Dynamic Island 下にコンテンツが入り込まないか確認。</p></div>
  </main>
  <nav class="tabbar">
    <button class="active"><div class="ic"></div>ホーム</button>
    <button><div class="ic"></div>検索</button>
    <button><div class="ic"></div>保存</button>
    <button><div class="ic"></div>設定</button>
  </nav>
</body>
</html>`;

  function setStatus(msg, type){
    statusText.textContent = msg;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  function loadSaved(){
    try{
      const saved = localStorage.getItem(STORAGE_KEY);
      if(saved){ code.value = saved; setStatus('前回のコードを復元','ok'); }
      else { setStatus('準備完了'); }
    }catch(e){ setStatus('保存データの読込に失敗'); }
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, code.value); }catch(e){}
  }

  function buildDoc(html){
    // Ensure viewport-fit=cover for safe-area testing
    let doc = html;
    if(!/<meta[^>]*viewport[^>]*>/i.test(doc)){
      doc = doc.replace(/<head([^>]*)>/i,
        '<head$1><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">');
    } else {
      doc = doc.replace(/<meta([^>]*)viewport([^>]*)>/i, (m,a,b)=>{
        if(!/viewport-fit/i.test(m)) return m.replace('>',',viewport-fit=cover>');
        return m;
      });
    }
    // Force dark color-scheme if not set
    if(!/color-scheme/i.test(doc)){
      doc = doc.replace(/<style([^>]*)>/i, '<style$1>:root{color-scheme:dark}\n');
    }
    return doc;
  }

  function run(){
    const html = code.value.trim();
    if(!html){ setStatus('HTMLが空です','err'); return; }
    save();
    try{
      const doc = buildDoc(html);
      frame.srcdoc = doc;
      switchTab('preview');
      setStatus('描画完了','ok');
    }catch(e){
      setStatus('エラー: ' + e.message,'err');
    }
  }

  function switchTab(name){
    document.querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active', t.dataset.tab===name);
    });
    editPanel.style.display = name==='edit' ? '' : 'none';
    previewPanel.style.display = name==='preview' ? '' : 'none';
  }

  // Events
  $('#runBtn').addEventListener('click', run);
  $('#clearBtn').addEventListener('click', ()=>{
    if(confirm('コードをクリアしますか?')){
      code.value=''; save(); frame.srcdoc='';
      setStatus('クリアしました');
    }
  });
  $('#sampleBtn').addEventListener('click', ()=>{
    code.value = SAMPLE; save(); setStatus('サンプルを挿入','ok');
  });
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> switchTab(t.dataset.tab));
  });
  code.addEventListener('input', save);

  // Tab key in textarea
  code.addEventListener('keydown', e=>{
    if(e.key==='Tab'){
      e.preventDefault();
      const s=code.selectionStart, en=code.selectionEnd;
      code.value = code.value.slice(0,s)+'  '+code.value.slice(en);
      code.selectionStart = code.selectionEnd = s+2;
    }
  });

  // Fullscreen
  const fsBtn = $('#fsBtn');
  const fsExit = $('#fsExit');
  fsBtn.addEventListener('click', ()=>{
    run();
    document.body.classList.add('fullscreen');
  });
  fsExit.addEventListener('click', ()=>{
    document.body.classList.remove('fullscreen');
  });

  // Init
  loadSaved();
})();
</script>
</body>
</html>
