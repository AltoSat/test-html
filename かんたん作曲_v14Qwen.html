<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6c5ce7">
<title>かんたん作曲</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/m-plus-rounded-1c@5.0.8/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/m-plus-rounded-1c@5.0.8/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/m-plus-rounded-1c@5.0.8/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/m-plus-rounded-1c@5.0.8/800.css">
<style>
:root{
  --acc:#6c5ce7; --acc2:#a29bfe; --orange:#ff8f3d;
  --bg:#f4f2fb; --card:#ffffff; --ink:#3d3a50; --sub:#8b87a0;
  --line:#e6e3f0; --red:#d93025; --blue:#1a73e8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  font-family:'M PLUS Rounded 1c',system-ui,-apple-system,'Hiragino Sans',sans-serif;
  background:#d9d5e8;color:var(--ink);display:flex;justify-content:center;overflow:hidden;
}
#app{width:100%;max-width:540px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 44px rgba(40,30,90,.22);}

/* ===== header ===== */
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,#6c5ce7,#8f7ae5);color:#fff;flex-shrink:0;}
header .logo{font-size:19px;}
header h1{font-size:17px;font-weight:800;letter-spacing:.5px;}
header .sub{margin-left:auto;font-size:10.5px;opacity:.9;font-weight:700;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ===== main / tabs ===== */
main{flex:1;min-height:0;position:relative;}
.tabpane{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;}
.tabpane.on{display:flex;animation:paneIn .18s ease;}
@keyframes paneIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ===== compose ===== */
#tab_compose{padding:10px 10px 8px;gap:8px;}
.toolbar{display:flex;gap:6px;align-items:stretch;flex-shrink:0;}
.rangegrp{flex:1;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px;}
.rmid{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;}
.rmid label{font-size:9px;color:var(--sub);text-align:center;letter-spacing:2px;font-weight:700;}
.rbtn{width:32px;height:36px;border:none;border-radius:9px;background:#f0eef8;color:var(--ink);font-size:12px;font-weight:800;touch-action:none;user-select:none;}
.rbtn:active{background:#e2ddf5;transform:scale(.94);}
input[type=range]{width:100%;accent-color:var(--acc);height:18px;}
input[type=range]:disabled{opacity:.4;}
.tbtn{border:none;border-radius:12px;background:var(--card);border:1px solid var(--line);font-family:inherit;font-size:12px;font-weight:800;color:var(--ink);padding:0 10px;touch-action:none;user-select:none;}
.tbtn:active{background:#efecfa;transform:scale(.96);}

.scorebox{flex:1;min-height:132px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;}
#scoreScroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;}
#scoreInner{position:relative;height:100%;}
#scoreSvg{display:block;}
#playhead{position:absolute;top:10px;bottom:10px;width:3px;background:var(--orange);border-radius:2px;display:none;box-shadow:0 0 7px rgba(255,143,61,.9);}
.playon ellipse{fill:var(--orange)!important;}
.playon line{stroke:var(--orange)!important;}
.playon text{fill:var(--orange)!important;}
.playon path{stroke:var(--orange)!important;}

.arrowpad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;flex-shrink:0;}
.arrowpad button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;color:var(--ink);font-weight:800;font-family:inherit;touch-action:none;user-select:none;}
.arrowpad button:active{background:#efecfa;transform:scale(.94);}
.arrowpad button.accentb{background:var(--acc);color:#fff;border-color:transparent;}
.arrowpad button.accentb:active{background:#5a4bd0;}

.mainbtns{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;flex-shrink:0;}
.bigbtn{height:48px;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:800;color:#fff;box-shadow:0 3px 9px rgba(60,50,120,.18);touch-action:none;user-select:none;transition:transform .08s;}
.bigbtn:active{transform:scale(.95);}
.bigbtn.held{transform:scale(.92);filter:brightness(1.12);}
#playBtn{background:linear-gradient(135deg,#00b894,#00a381);}
#playBtn.playing{background:linear-gradient(135deg,#ff8f3d,#f0703a);}
#recBtn{background:linear-gradient(135deg,#ff7675,#e0524f);}
#randBtn{background:linear-gradient(135deg,#74b9ff,#4a90d9);}

/* ===== piano ===== */
#pianoWrap{height:148px;transition:height .25s ease;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;flex-shrink:0;}
#pianoWrap.compact{height:86px;}
.pianohead{position:absolute;top:0;left:0;right:0;height:18px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--sub);background:#faf9ff;z-index:3;letter-spacing:2px;border-bottom:1px solid var(--line);font-weight:700;}
#pianoScroll{position:absolute;left:0;right:0;top:18px;bottom:0;overflow-x:auto;overflow-y:hidden;}
#pianoInner{position:relative;height:100%;touch-action:none;user-select:none;}
.pkey{position:absolute;top:0;bottom:0;}
.kw{background:linear-gradient(#fff,#f1eef8);border:1px solid #cfc9de;border-radius:0 0 7px 7px;}
.kw.on{background:linear-gradient(#dccfff,#c3aef8);}
.kb{height:60%;width:26px;background:linear-gradient(#4a4462,#2f2a44);border-radius:0 0 5px 5px;z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.28);}
.kb.on{background:linear-gradient(#9c86ec,#6c5ce7);}
.klab{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:#a89fc4;pointer-events:none;font-weight:700;}
#pianoScroll::-webkit-scrollbar,#scoreScroll::-webkit-scrollbar{height:6px;}
#pianoScroll::-webkit-scrollbar-thumb,#scoreScroll::-webkit-scrollbar-thumb{background:#cfcaе0;background:#cfc9e0;border-radius:3px;}

/* ===== tabbar ===== */
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 8px calc(6px + env(safe-area-inset-bottom));flex-shrink:0;}
.tabbtn{flex:1;background:none;border:none;font-family:inherit;font-size:11px;color:var(--sub);padding:5px 0 6px;border-radius:12px;font-weight:800;}
.tabbtn .ic{display:block;font-size:19px;margin-bottom:1px;}
.tabbtn.on{color:var(--acc);background:#efecff;}

/* ===== songs ===== */
#tab_songs{padding:10px 10px 16px;overflow-y:auto;}
.paneTitle{font-size:13px;font-weight:800;color:var(--sub);margin:2px 4px 8px;display:flex;justify-content:space-between;align-items:center;}
.hintchip{font-size:10px;background:#efecff;color:var(--acc);padding:3px 9px;border-radius:99px;font-weight:700;}
.songrow{position:relative;margin-bottom:8px;border-radius:14px;overflow:hidden;touch-action:pan-y;user-select:none;}
.rowbg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;background:#eceaf5;transition:background .15s;}
.rowbg.editing{background:var(--blue);}
.rowbg.deleting{background:var(--red);}
.act{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;color:#fff;opacity:0;transform:scale(.7);will-change:opacity,transform;}
.a-edit{margin-left:20px;transform-origin:left center;}
.a-del{margin-right:20px;transform-origin:right center;}
.act svg{width:17px;height:17px;fill:#fff;}
.rowfg{position:relative;display:flex;align-items:center;background:#fff;padding:12px 14px;will-change:transform;box-shadow:0 1px 3px rgba(60,50,120,.08);}
.stitle{font-size:14px;font-weight:800;}
.smeta{font-size:10.5px;color:var(--sub);margin-top:2px;font-weight:500;}
.go{margin-left:auto;color:var(--acc2);font-size:15px;padding-left:10px;}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:2.1;padding:64px 0;font-weight:700;}

/* ===== settings ===== */
#tab_settings{padding:12px 12px 20px;overflow-y:auto;gap:10px;}
.scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;flex-shrink:0;}
.scard h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;}
.valLabel{font-size:12px;font-weight:800;color:var(--acc);margin-left:auto;}
.scard .desc{font-size:11px;color:var(--sub);line-height:1.65;margin-top:7px;}
.radioRow{display:flex;gap:8px;margin-top:9px;}
.radioRow label{flex:1;display:flex;align-items:center;gap:7px;background:#f5f3fc;border:1.5px solid transparent;border-radius:11px;padding:9px 10px;font-size:12.5px;font-weight:800;cursor:pointer;}
.radioRow label:has(input:checked){border-color:var(--acc);background:#efecff;color:var(--acc);}
.radioRow input{accent-color:var(--acc);}
.srange{width:100%;margin-top:9px;}
.exportbtn,.importbtn{width:100%;height:43px;border-radius:11px;font-family:inherit;font-weight:800;font-size:13px;margin-top:9px;cursor:pointer;}
.exportbtn{border:none;background:var(--acc);color:#fff;}
.importbtn{background:#fff;border:1.5px solid var(--acc);color:var(--acc);}
.exportbtn:active,.importbtn:active{transform:scale(.98);}

/* ===== toast ===== */
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);background:rgba(44,39,70,.93);color:#fff;font-size:12.5px;font-weight:700;padding:8px 17px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.22);}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== dialog ===== */
#overlay{position:absolute;inset:0;background:rgba(30,25,50,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;z-index:80;}
#overlay.show{opacity:1;pointer-events:auto;}
#dlgBox{width:min(86%,340px);background:#fff;border-radius:18px;padding:18px 16px 15px;transform:scale(.92);transition:transform .18s;box-shadow:0 12px 40px rgba(0,0,0,.28);}
#overlay.show #dlgBox{transform:scale(1);}
#dlgTitle{font-size:15px;font-weight:800;margin-bottom:8px;}
#dlgBody{font-size:13px;color:#55506b;line-height:1.7;}
#dlgBtns{display:flex;gap:8px;margin-top:15px;}
.btn{flex:1;height:42px;border:none;border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:#f0eef8;color:var(--ink);}
.btn.primary{background:var(--acc);color:#fff;}
.btn.danger{background:var(--red);color:#fff;}
.fld{display:block;font-size:11px;color:var(--sub);margin-top:6px;font-weight:700;}
.fld input{width:100%;margin-top:4px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);}
.fld input:focus{outline:none;border-color:var(--acc);}
.dlg-note{font-size:11px;color:var(--sub);}
.tempoVal{font-size:24px;font-weight:800;text-align:center;color:var(--acc);margin-bottom:4px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">🎼</span><h1>かんたん作曲</h1><span class="sub" id="workTitle"></span>
  </header>

  <main>
    <!-- 🎹 作曲 -->
    <section class="tabpane" id="tab_compose">
      <div class="toolbar">
        <div class="rangegrp">
          <button class="rbtn" id="rangeL">◀</button>
          <div class="rmid"><label>音域</label><input type="range" id="rangeSlider" min="0" max="800" value="0" step="1"></div>
          <button class="rbtn" id="rangeR">▶</button>
        </div>
        <button class="tbtn" id="tempoBtn">♩=110</button>
        <button class="tbtn" id="restBtn">休符</button>
        <button class="tbtn" id="delBtn">削除</button>
      </div>

      <div class="scorebox"><div id="scoreScroll"><div id="scoreInner"></div></div></div>

      <div class="arrowpad">
        <button data-act="up"    title="音を上げる">▲</button>
        <button data-act="left"  title="前へ">◀</button>
        <button data-act="sel"   title="選択 切替">◎</button>
        <button data-act="right" title="次へ">▶</button>
        <button data-act="down"  title="音を下げる">▼</button>
        <button data-act="fromhere" class="accentb" title="カーソルから再生">▶</button>
      </div>

      <div class="mainbtns">
        <button class="bigbtn" id="playBtn">▶ 再生</button>
        <button class="bigbtn" id="recBtn">⏺ 記録</button>
        <button class="bigbtn" id="randBtn">🎲 ランダム</button>
      </div>

      <div id="pianoWrap">
        <div class="pianohead">🎹 KEYBOARD</div>
        <div id="pianoScroll"><div id="pianoInner"></div></div>
      </div>
    </section>

    <!-- 🎵 楽曲 -->
    <section class="tabpane" id="tab_songs">
      <div class="paneTitle">保存した楽曲 <span class="hintchip">→スワイプ:編集 ／ ←スワイプ:削除</span></div>
      <div id="songList"></div>
    </section>

    <!-- ⚙️ 設定 -->
    <section class="tabpane" id="tab_settings">
      <div class="scard">
        <h3>ピアノ左右スワイプ</h3>
        <div class="radioRow">
          <label><input type="radio" name="swipeMode" value="trace">音をたどる</label>
          <label><input type="radio" name="swipeMode" value="range">音域を移動</label>
        </div>
        <p class="desc">「音域を移動」でも、最初に触れた鍵盤は鳴ります。そのまま指を離さず左右へ動かすと、楽譜とピアノをスクロールします。</p>
      </div>
      <div class="scard">
        <h3>音量 <span class="valLabel" id="volVal">72%</span></h3>
        <input type="range" class="srange" id="volRange" min="0" max="100" value="72">
        <p class="desc">再生や鍵盤の音量を変更します。</p>
      </div>
      <div class="scard">
        <h3>ランダム生成の長さ <span class="valLabel" id="lenVal">12音</span></h3>
        <input type="range" class="srange" id="lenRange" min="4" max="32" value="12">
        <p class="desc">ランダムボタンで生成するフレーズの長さ（音符・休符の合計数）を指定します。</p>
      </div>
      <div class="scard">
        <h3>バックアップ</h3>
        <p class="desc">保存したすべての楽曲と、現在作曲中の内容をJSONファイルとして書き出します。バックアップや別端末への保管に利用できます。</p>
        <button class="exportbtn" id="exportBtn">すべての楽曲をエクスポート</button>
        <button class="importbtn" id="importBtn">楽曲をインポート</button>
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </div>
    </section>
  </main>

  <nav>
    <button class="tabbtn" data-tab="compose"><span class="ic">🎹</span>作曲</button>
    <button class="tabbtn" data-tab="songs"><span class="ic">🎵</span>楽曲</button>
    <button class="tabbtn" data-tab="settings"><span class="ic">⚙️</span>設定</button>
  </nav>

  <div id="toast"></div>

  <div id="overlay">
    <div id="dlgBox">
      <div id="dlgTitle"></div>
      <div id="dlgBody"></div>
      <div id="dlgBtns"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= util ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());};

/* ================= state ================= */
const LSKEY='kantan_sakkyoku_v17';
const LOW=48,HIGH=84,WK=44,SLOTW=44,PADL=60;
const PC_SHARP=[1,3,6,8,10];
let settings={volume:72,randLen:12,swipeMode:'trace'};
let songs=[];
let notes=[];            // {midi:number|null, len:int(8分音符=1)}
let tempo=110, cur=0, sel=false;
let curSongId=null, curTitle='無題';
let playing=false;

const totLen=()=>notes.reduce((a,n)=>a+n.len,0);
const cumBefore=i=>notes.slice(0,i).reduce((a,n)=>a+n.len,0);

/* ================= data ================= */
const mk=(midi,len=2)=>({midi,len});
function twinkle(){
  const C=60,D=62,E=64,F=65,G=67,A=69;
  return [mk(C),mk(C),mk(G),mk(G),mk(A),mk(A),mk(G,4),mk(F),mk(F),mk(E),mk(E),mk(D),mk(D),mk(C,4),
          mk(null,2),mk(G),mk(G),mk(F),mk(F),mk(E),mk(E),mk(D,4),mk(G),mk(G),mk(F),mk(F),mk(E),mk(E),mk(D,4)];
}
function genRandom(n){
  const scale=[60,62,64,67,69,72,74,76,79];
  let idx=2+Math.floor(Math.random()*3);
  const out=[];
  for(let i=0;i<n;i++){
    if(i>0&&i<n-1&&Math.random()<0.14){out.push({midi:null,len:Math.random()<0.3?2:1});continue;}
    idx=clamp(idx+Math.floor(Math.random()*5)-2,0,scale.length-1);
    out.push({midi:scale[idx],len:Math.random()<0.35?2:1});
  }
  return out;
}

function persist(){try{localStorage.setItem(LSKEY,JSON.stringify({settings,songs,work:{notes,tempo,title:curTitle,id:curSongId}}));}catch(e){}}
function restore(){
  try{
    const d=JSON.parse(localStorage.getItem(LSKEY)||'null');
    if(d){
      if(d.settings)settings=Object.assign(settings,d.settings);
      if(Array.isArray(d.songs))songs=d.songs;
      if(d.work){notes=d.work.notes||[];tempo=d.work.tempo||110;curTitle=d.work.title||'無題';curSongId=d.work.id||null;}
    }
  }catch(e){}
  if(!notes.length)notes=twinkle();
  if(!songs.length){
    songs=[
      {id:uid(),title:'サンプル：きらきら星',tempo:110,notes:twinkle(),updated:Date.now()},
      {id:uid(),title:'サンプル：ランダムフレーズ',tempo:120,notes:genRandom(12),updated:Date.now()-86400000}
    ];
  }
  cur=clamp(cur,0,notes.length);
}

/* ================= elements ================= */
const scoreScroll=$('#scoreScroll'),scoreInner=$('#scoreInner');
const pianoWrap=$('#pianoWrap'),pianoScroll=$('#pianoScroll'),pianoInner=$('#pianoInner');
const rangeSlider=$('#rangeSlider'),tempoBtn=$('#tempoBtn');
const playBtn=$('#playBtn'),recBtn=$('#recBtn'),randBtn=$('#randBtn');
const toastEl=$('#toast'),overlay=$('#overlay'),workTitle=$('#workTitle');

/* ================= audio ================= */
let AC=null,master=null,live=[];
function audio(){
  if(!AC){const Ctx=window.AudioContext||window.webkitAudioContext;AC=new Ctx();master=AC.createGain();master.connect(AC.destination);}
  if(AC.state==='suspended')AC.resume();
  master.gain.value=settings.volume/100;
  return AC;
}
function tone(m,when,dur,vel){
  const f=440*Math.pow(2,(m-69)/12);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=f;
  const v=Math.max((settings.volume/100)*0.5*(vel||1),0.0002);
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(v,when+0.012);
  g.gain.setValueAtTime(v,when+Math.max(dur*0.5,0.02));
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g);g.connect(master);
  o.start(when);o.stop(when+dur+0.05);
  live.push(o);o.onended=()=>{live=live.filter(x=>x!==o);};
}
function killTones(){if(!AC)return;const t=AC.currentTime;live.forEach(o=>{try{o.stop(t+0.03);}catch(e){}});live=[];}
function playKey(m){const a=audio();tone(m,a.currentTime+0.001,0.55,1);}

/* ================= piano build ================= */
function buildPiano(){
  pianoInner.innerHTML='';
  const whites=[],blacks=[];
  for(let m=LOW;m<=HIGH;m++)(PC_SHARP.includes(m%12)?blacks:whites).push(m);
  pianoInner.style.width=(PADL+whites.length*WK)+'px';
  whites.forEach((m,i)=>{
    const k=document.createElement('div');
    k.className='pkey kw';k.dataset.midi=m;
    k.style.left=(PADL+i*WK)+'px';k.style.width=WK+'px';
    if(m%12===0){const lb=document.createElement('span');lb.className='klab';lb.textContent='C'+(Math.floor(m/12)-1);k.appendChild(lb);}
    pianoInner.appendChild(k);
  });
  blacks.forEach(m=>{
    const i=whites.findIndex(w=>w>m);
    const k=document.createElement('div');
    k.className='pkey kb';k.dataset.midi=m;
    k.style.left=(PADL+i*WK-13)+'px';
    pianoInner.appendChild(k);
  });
}
function keyEl(m){return pianoInner.querySelector('.pkey[data-midi="'+m+'"]');}
function pressVis(m,on){const k=keyEl(m);if(k)k.classList.toggle('on',!!on);}

/* ================= score draw ================= */
function midiY(m){
  const oct=Math.floor(m/12)-1,pc=m%12;
  const stepMap=[0,0,1,1,2,3,3,4,4,5,5,6];
  const d=oct*7+stepMap[pc];
  return {y:74-(d-30)*5,d,sharp:PC_SHARP.includes(pc)};
}
function restGlyph(cx,isSel){
  const col=isSel?'#ff8f3d':'#4a4462';
  let s='<path d="M '+(cx-3)+' 42 l 7 8 -7 8 7 8 c -8 3 -6 11 1 14" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  if(isSel)s+='<circle cx="'+cx+'" cy="58" r="13" fill="none" stroke="#ff8f3d" stroke-width="2" stroke-dasharray="4 3"/>';
  return s;
}
function drawScore(){
  const total=Math.max(1,totLen());
  const W=PADL+total*SLOTW+SLOTW+80;
  let s='<svg id="scoreSvg" width="'+W+'" height="132" viewBox="0 0 '+W+' 132" xmlns="http://www.w3.org/2000/svg">';
  for(let i=0;i<5;i++){const y=34+i*10;s+='<line x1="8" y1="'+y+'" x2="'+(W-8)+'" y2="'+y+'" stroke="#bcb6cd" stroke-width="1.5"/>';}
  let c=0;
  for(let i=0;i<notes.length;i++){c+=notes[i].len;if(c%8===0){const x=PADL+c*SLOTW;s+='<line x1="'+x+'" y1="34" x2="'+x+'" y2="74" stroke="#d6d1e4" stroke-width="1"/>';}}
  s+='<text x="12" y="73" font-size="52" fill="#4a4462" font-family="serif">𝄞</text>';
  let cum=0;
  notes.forEach((n,i)=>{
    const cx=PADL+(cum+n.len/2)*SLOTW;
    const isSelN=(sel&&i===cur);
    const col=isSelN?'#ff8f3d':'#4a4462';
    s+='<g id="ng'+i+'">';
    if(n.midi==null){s+=restGlyph(cx,isSelN);}
    else{
      const inf=midiY(n.midi),y=inf.y,d=inf.d;
      for(let dl=28;dl>=d&&dl>=20;dl-=2){const ly=74-(dl-30)*5;s+='<line x1="'+(cx-12)+'" y1="'+ly+'" x2="'+(cx+12)+'" y2="'+ly+'" stroke="#8f89a3" stroke-width="1.5"/>';}
      for(let dl=42;dl<=d&&dl<=44;dl+=2){const ly=74-(dl-30)*5;s+='<line x1="'+(cx-12)+'" y1="'+ly+'" x2="'+(cx+12)+'" y2="'+ly+'" stroke="#8f89a3" stroke-width="1.5"/>';}
      if(d>=34)s+='<line x1="'+(cx-7.6)+'" y1="'+y+'" x2="'+(cx-7.6)+'" y2="'+(y+30)+'" stroke="'+col+'" stroke-width="2"/>';
      else s+='<line x1="'+(cx+7.6)+'" y1="'+y+'" x2="'+(cx+7.6)+'" y2="'+(y-30)+'" stroke="'+col+'" stroke-width="2"/>';
      if(inf.sharp)s+='<text x="'+(cx-21)+'" y="'+(y+5)+'" font-size="15" fill="'+col+'">♯</text>';
      const hollow=n.len>=4;
      s+='<ellipse cx="'+cx+'" cy="'+y+'" rx="8" ry="5.6" transform="rotate(-16 '+cx+' '+y+')" fill="'+(hollow?'none':col)+'" stroke="'+col+'" stroke-width="'+(hollow?2.4:1)+'"/>';
      if(isSelN)s+='<circle cx="'+cx+'" cy="'+y+'" r="13" fill="none" stroke="#ff8f3d" stroke-width="2" stroke-dasharray="4 3"/>';
    }
    s+='</g>';cum+=n.len;
  });
  const cxr=PADL+cumBefore(cur)*SLOTW;
  s+='<line x1="'+cxr+'" y1="16" x2="'+cxr+'" y2="112" stroke="#ff8f3d" stroke-width="2.5" stroke-dasharray="6 4"/>';
  s+='<path d="M '+(cxr-6)+' 10 L '+(cxr+6)+' 10 L '+cxr+' 19 Z" fill="#ff8f3d"/>';
  s+='</svg>';
  scoreInner.innerHTML=s+'<div id="playhead"></div>';
  scoreInner.style.width=W+'px';
}

/* ================= scroll sync（音域スライダー） ================= */
let gMaxScroll=0,syncing=false;
function updateRangeSlider(){
  const m=Math.max(0,Math.max(pianoScroll.scrollWidth-pianoScroll.clientWidth,scoreScroll.scrollWidth-scoreScroll.clientWidth));
  gMaxScroll=m;rangeSlider.max=m;rangeSlider.disabled=m<=0;
  rangeSlider.value=clamp(pianoScroll.scrollLeft,0,m);
}
function setScrollX(v){
  v=clamp(v,0,gMaxScroll);syncing=true;
  pianoScroll.scrollLeft=v;scoreScroll.scrollLeft=v;rangeSlider.value=v;
  requestAnimationFrame(()=>{syncing=false;});
}
rangeSlider.addEventListener('input',()=>setScrollX(+rangeSlider.value));
pianoScroll.addEventListener('scroll',()=>{if(syncing)return;scoreScroll.scrollLeft=pianoScroll.scrollLeft;rangeSlider.value=pianoScroll.scrollLeft;});
scoreScroll.addEventListener('scroll',()=>{if(syncing)return;pianoScroll.scrollLeft=scoreScroll.scrollLeft;rangeSlider.value=scoreScroll.scrollLeft;});
const robs=new ResizeObserver(updateRangeSlider);
robs.observe(pianoScroll);robs.observe(scoreScroll);

function bindRepeat(el,fn){
  let iv=0,to=0;const stop=()=>{clearInterval(iv);clearTimeout(to);};
  el.addEventListener('pointerdown',e=>{e.preventDefault();fn();to=setTimeout(()=>{iv=setInterval(fn,70);},380);});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,stop));
}

bindRepeat($('#rangeR'),()=>setScrollX(pianoScroll.scrollLeft+WK*2));
function centerOnC4(){updateRangeSlider();setScrollX(clamp(PADL+7*WK-pianoScroll.clientWidth/2+WK,0,gMaxScroll));}
function ensureCursorVisible(){

/* ================= piano pointer（重複登録の防止済み） ================= */
let pSt=null;
pianoInner.addEventListener('pointerdown',e=>{
  const k=e.target.closest('.pkey');
  if(!k||pSt)return;
  e.preventDefault();
  pSt={id:e.pointerId,midi:+k.dataset.midi,x0:e.clientX,y0:e.clientY,moved:false,mode:settings.swipeMode,scroll0:pianoScroll.scrollLeft};
  try{pianoInner.setPointerCapture(e.pointerId);}catch(_){}
  pressVis(pSt.midi,true);
  playKey(pSt.midi);
});
pianoInner.addEventListener('pointermove',e=>{
  if(!pSt||e.pointerId!==pSt.id)return;
  const dx=e.clientX-pSt.x0,dy=e.clientY-pSt.y0;
  if(!pSt.moved&&Math.hypot(dx,dy)>10)pSt.moved=true;
  if(!pSt.moved)return;
  if(pSt.mode==='trace'){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const k=el&&el.closest?el.closest('.pkey'):null;
    if(k){const m=+k.dataset.midi;if(m!==pSt.midi){pressVis(pSt.midi,false);pSt.midi=m;pressVis(m,true);playKey(m);}}
  }else{
    setScrollX(pSt.scroll0-dx);
  }
});
function pianoUp(e){
  if(!pSt||e.pointerId!==pSt.id)return;
  if(!pSt.moved)addNoteAtCursor(pSt.midi); // タップ時のみ1回だけ音符を追加
  pressVis(pSt.midi,false);
  pSt=null;
}
pianoInner.addEventListener('pointerup',pianoUp);
pianoInner.addEventListener('pointercancel',pianoUp);

/* ================= editing ================= */
function addNoteAtCursor(midi){
  if(sel&&cur<notes.length){
    notes[cur].midi=midi;
    if(cur<notes.length-1)cur++;else{sel=false;cur=notes.length;}
  }else{
    notes.splice(cur,0,{midi,len:2});cur++;sel=false;
  }
  afterEdit(true);
}
function restTap(){
  notes.splice(cur,0,{midi:null,len:2});cur++;sel=false;
  afterEdit(true);
  showToast('長押し：休符を伸ばす'); // タップ時に表示（修正済み）
}
function restHold(){
  let i=-1;
  if(cur<notes.length&&notes[cur].midi==null)i=cur;
  else if(cur>0&&notes[cur-1].midi==null)i=cur-1;
  if(i<0){showToast('伸ばせる休符がありません');return;}
  notes[i].len=Math.min(8,notes[i].len+1);
  afterEdit(false);showToast('休符を伸ばしました');
}
function doDelete(){
  if(!notes.length){showToast('音符がありません');return;}
  if(sel){notes.splice(cur,1);if(cur>=notes.length){cur=Math.max(0,notes.length);sel=false;}}
  else if(cur<notes.length){notes.splice(cur,1);if(cur>notes.length)cur=notes.length;}
  else{notes.pop();cur=notes.length;}
  afterEdit(false);
}
function moveCur(d){
  if(sel)cur=clamp(cur+d,0,Math.max(0,notes.length-1));
  else cur=clamp(cur+d,0,notes.length);
  afterEdit(true);
}
function pitchCur(d){
  if(cur>=notes.length)return;
  const n=notes[cur];
  if(n.midi==null){showToast('休符です');return;}
  n.midi=clamp(n.midi+d,LOW,HIGH);
  playKey(n.midi);afterEdit(false);
}
function toggleSel(){
  if(sel){sel=false;}
  else if(cur<notes.length){sel=true;}
  else{showToast('音符がありません');return;}
  afterEdit(false);
}
$('#restBtn')&&0;
$('#delBtn').addEventListener('click',doDelete);
tempoBtn.addEventListener('click',openTempo);
$$('.arrowpad button').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.act;
  if(a==='up')pitchCur(1);else if(a==='down')pitchCur(-1);
  else if(a==='left')moveCur(-1);else if(a==='right')moveCur(1);
  else if(a==='sel')toggleSel();
  else if(a==='fromhere')startPlayback(cur<notes.length?cur:0);
}));

/* ================= playback ================= */
let raf=0,marks=[],endAt=0,phIdx=0,lastHi=-1,lastKey=null;
function setPlayBtn(){
  playBtn.textContent=playing?'■ 停止':'▶ 再生';
  playBtn.classList.toggle('playing',playing);
}
function startPlayback(fromIdx){
  stopPlayback(false);
  if(!notes.length){showToast('音符がありません');return;}
  fromIdx=clamp(fromIdx||0,0,notes.length-1);
  const a=audio(),slot=60/tempo/2,t0=a.currentTime+0.15;
  marks=[];let t=t0,cum=cumBefore(fromIdx);
  for(let i=fromIdx;i<notes.length;i++){
    const n=notes[i];
    marks.push({i,at:t,cum,midi:n.midi});
    if(n.midi!=null)tone(n.midi,t,n.len*slot*0.92,0.9);
    t+=n.len*slot;cum+=n.len;
  }
  endAt=t+0.1;phIdx=0;lastHi=-1;lastKey=null;playing=true;
  setPlayBtn();
  pianoWrap.classList.add('compact'); // 再生中は鍵盤を縮小
  raf=requestAnimationFrame(tick);
  showToast(fromIdx>0?'カーソル位置から再生中':'再生中');
}
function tick(){
  if(!playing)return;
  const now=AC.currentTime;
  while(phIdx+1<marks.length&&marks[phIdx+1].at<=now)phIdx++;
  const mkm=marks[phIdx];
  if(mkm){
    if(mkm.i>=0&&mkm.i!==lastHi){
      if(lastHi>=0){const p=$('#ng'+lastHi);if(p)p.classList.remove('playon');}
      const el=$('#ng'+mkm.i);if(el)el.classList.add('playon');
      lastHi=mkm.i;
    }
    if(mkm.midi!=null){if(mkm.midi!==lastKey){if(lastKey!=null)pressVis(lastKey,false);pressVis(mkm.midi,true);lastKey=mkm.midi;}}
    else if(lastKey!=null){pressVis(lastKey,false);lastKey=null;}
    const ph=$('#playhead');
    if(ph){ph.style.display='block';ph.style.left=(PADL+mkm.cum*SLOTW)+'px';}
  }
  if(now>=endAt){stopPlayback(true);return;}
  raf=requestAnimationFrame(tick);
}
function stopPlayback(){
  if(raf)cancelAnimationFrame(raf);raf=0;
  killTones();
  if(lastHi>=0){const p=$('#ng'+lastHi);if(p)p.classList.remove('playon');lastHi=-1;}
  if(lastKey!=null){pressVis(lastKey,false);lastKey=null;}
  const ph=$('#playhead');if(ph)ph.style.display='none';
  pianoWrap.classList.remove('compact');
  playing=false;marks=[];setPlayBtn();
}

/* ================= long-press helper ================= */
function bindHold(el,onTap,onHold,ms){
  let timer=0,fired=false,down=false;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();down=true;fired=false;
    timer=setTimeout(()=>{if(down){fired=true;el.classList.add('held');if(onHold)onHold();}},ms||450);
  });
  const rel=()=>{
    clearTimeout(timer);
    const f=fired;down=false;fired=false;el.classList.remove('held');
    if(!f&&onTap)onTap();
  };
  el.addEventListener('pointerup',rel);
  el.addEventListener('pointercancel',()=>{clearTimeout(timer);down=false;fired=false;el.classList.remove('held');});
  el.addEventListener('pointerleave',()=>{clearTimeout(timer);down=false;el.classList.remove('held');});
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bindHold(playBtn,
  ()=>{playing?stopPlayback():startPlayback(0);},
  ()=>{if(playing)stopPlayback();startPlayback(cur<notes.length?cur:0);},450);
bindHold(randBtn,
  ()=>{
    const ph=genRandom(settings.randLen);

  },
  ()=>{previewRandom(genRandom(settings.randLen));},500);
bindHold($('#restBtn'),restTap,restHold,450);

function previewRandom(ph){
  stopPlayback();
  const a=audio(),slot=60/tempo/2,t0=a.currentTime+0.12;
  marks=[];let t=t0,cum=cumBefore(cur);
  ph.forEach(n=>{
    marks.push({i:-1,at:t,cum,midi:n.midi});
    if(n.midi!=null)tone(n.midi,t,n.len*slot*0.92,0.9);
    t+=n.len*slot;cum+=n.len;
  });
  endAt=t+0.1;phIdx=0;lastHi=-1;lastKey=null;playing=true;
  setPlayBtn();
  pianoWrap.classList.add('compact'); // ランダム長押し中も鍵盤を縮小
  raf=requestAnimationFrame(tick);
  showToast('ランダムプレビュー再生中');
}

/* ================= songs list + Gmail風スワイプ ================= */
const icEdit='<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
const icDel='<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';

function renderSongs(){
  const box=$('#songList');
  if(!songs.length){box.innerHTML='<div class="empty">🎵<br>楽曲がありません。<br>作曲タブの「記録」で保存してください。</div>';return;}
  box.innerHTML=songs.map(s=>
    '<div class="songrow" data-id="'+s.id+'">'+
      '<div class="rowbg">'+
        '<div class="act a-edit">'+icEdit+'編集</div>'+
        '<div class="act a-del">削除'+icDel+'</div>'+
      '</div>'+
      '<div class="rowfg"><div class="sinfo">'+
        '<div class="stitle">'+esc(s.title)+'</div>'+
        '<div class="smeta">♩='+(s.tempo||110)+' ・ '+(s.notes||[]).length+'音符 ・ '+fmtDate(s.updated)+'</div>'+
      '</div><div class="go">▶</div></div>'+
    '</div>').join('');
  $$('.songrow',box).forEach(attachSwipe);
}
function attachSwipe(row){
  const fg=$('.rowfg',row),bg=$('.rowbg',row),aE=$('.a-edit',row),aD=$('.a-del',row);
  let sx=0,sy=0,dx=0,drag=false,axis=null,t0=0;
  const W=()=>row.clientWidth;
  row.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    drag=true;axis=null;sx=e.clientX;sy=e.clientY;dx=0;t0=Date.now();
    fg.style.transition='none';
    try{row.setPointerCapture(e.pointerId);}catch(_){}
  });
  row.addEventListener('pointermove',e=>{
    if(!drag)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(!axis&&(Math.abs(mx)>8||Math.abs(my)>8))axis=Math.abs(mx)>Math.abs(my)?'x':'y';
    if(axis!=='x')return;
    dx=clamp(mx,-W()*0.72,W()*0.72);
    fg.style.transform='translateX('+dx+'px)';
    if(dx>0){
      const p=Math.min(1,dx/(W()*0.3));
      aE.style.opacity=p;aE.style.transform='scale('+(0.7+0.3*p)+')';aD.style.opacity=0;
      bg.classList.toggle('editing',p>0.05);bg.classList.remove('deleting');
    }else if(dx<0){
      const p=Math.min(1,-dx/(W()*0.3));
      aD.style.opacity=p;aD.style.transform='scale('+(0.7+0.3*p)+')';aE.style.opacity=0;
      bg.classList.toggle('deleting',p>0.05);bg.classList.remove('editing');
    }else{aE.style.opacity=0;aD.style.opacity=0;}
  });
  const end=()=>{
    if(!drag)return;drag=false;
    fg.style.transition='transform .22s cubic-bezier(.2,.7,.3,1)';
    const th=W()*0.33,dt=Date.now()-t0;
    if(dx>=th){fg.style.transform='translateX('+W()+'px)';setTimeout(()=>loadSong(row.dataset.id),210);}
    else if(dx<=-th){fg.style.transform='translateX('+(-W())+'px)';setTimeout(()=>confirmDelete(row.dataset.id),210);}
    else{
      fg.style.transform='translateX(0)';
      if(Math.abs(dx)<6&&dt<450)loadSong(row.dataset.id);
      setTimeout(()=>{bg.classList.remove('editing','deleting');},230);
    }
    setTimeout(()=>{aE.style.opacity=0;aD.style.opacity=0;aE.style.transform='';aD.style.transform='';},240);
  };
  row.addEventListener('pointerup',end);
  row.addEventListener('pointercancel',end);
}
function loadSong(id){
  const s=songs.find(x=>x.id===id);if(!s)return;
  stopPlayback();
  notes=JSON.parse(JSON.stringify(s.notes||[]));
  tempo=s.tempo||110;cur=0;sel=false;curSongId=s.id;curTitle=s.title;
  workTitle.textContent='♪ '+s.title;
  tempoBtn.textContent='♩='+tempo;
  drawScore();updateRangeSlider();persist();
  switchTab('compose');
  showToast('「'+s.title+'」を読み込みました');
}
function confirmDelete(id){
  const s=songs.find(x=>x.id===id);
  if(!s){renderSongs();return;}
  showModal('確認','<p>「'+esc(s.title)+'」を削除しますか？<br><span class="dlg-note">この操作は取り消せません。</span></p>',
    [['キャンセル','btn ghost',null],
     ['実行','btn danger',()=>{
        songs=songs.filter(x=>x.id!==id);
        if(curSongId===id)curSongId=null;
        persist();renderSongs();showToast('楽曲を削除しました');
     }]]);
}

/* ================= settings ================= */
function applySettingsUI(){
  $('#volRange').value=settings.volume;
  $('#volVal').textContent=settings.volume+'%';
  $('#lenRange').value=settings.randLen;
  $('#lenVal').textContent=settings.randLen+'音';
  $$('input[name=swipeMode]').forEach(r=>{r.checked=r.value===settings.swipeMode;});
}
$('#volRange').addEventListener('input',e=>{
  settings.volume=+e.target.value;
  $('#volVal').textContent=settings.volume+'%';
  if(master)master.gain.value=settings.volume/100;
  persist();
});
$('#lenRange').addEventListener('input',e=>{
  settings.randLen=+e.target.value;
  $('#lenVal').textContent=settings.randLen+'音';
  persist();
});
$$('input[name=swipeMode]').forEach(r=>r.addEventListener('change',e=>{settings.swipeMode=e.target.value;persist();}));

/* ================= export / import ================= */
$('#exportBtn').addEventListener('click',()=>{
  const data={app:'kantan_sakkyoku',version:17,exported:new Date().toISOString(),settings,songs,current:{title:curTitle,tempo,notes}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  a.download='kantan-sakkyoku-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  showToast('すべての楽曲をエクスポートしました');
});
$('#importBtn').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',function(){
  const f=this.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      const list=Array.isArray(d)?d:(d.songs||[]);
      let n=0;
      list.forEach(s=>{
        if(!s||!Array.isArray(s.notes))return;
        const id=s.id||uid();
        const item={
          id,title:String(s.title||'インポート曲').slice(0,30),
          tempo:clamp(+s.tempo||110,60,200),
          notes:s.notes.filter(x=>x&&typeof x.len==='number').map(x=>({midi:x.midi==null?null:clamp(+x.midi,LOW,HIGH),len:clamp(Math.round(x.len),1,8)})),
          updated:s.updated||Date.now()
        };
        const ex=songs.find(x=>x.id===id);
        if(ex)Object.assign(ex,item);else songs.push(item);
        n++;
      });
      if(d&&d.current&&Array.isArray(d.current.notes)&&d.current.notes.length){
        notes=d.current.notes.filter(x=>x&&typeof x.len==='number').map(x=>({midi:x.midi==null?null:clamp(+x.midi,LOW,HIGH),len:clamp(Math.round(x.len),1,8)}));
        tempo=clamp(+d.current.tempo||110,60,200);
        cur=0;sel=false;curTitle=d.current.title||curTitle;
        tempoBtn.textContent='♩='+tempo;workTitle.textContent='♪ '+curTitle;
        drawScore();
      }
      persist();renderSongs();updateRangeSlider();
      showToast(n+'曲をインポートしました');
    }catch(err){showToast('インポートに失敗しました');}
    $('#fileInput').value='';
  };
  rd.readAsText(f);
});

/* ================= tabs ================= */
$$('.tabbtn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
function switchTab(name){
  stopPlayback();
  $$('.tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  $$('.tabpane').forEach(p=>p.classList.toggle('on',p.id==='tab_'+name));
  if(name==='compose')requestAnimationFrame(()=>{updateRangeSlider();});
  if(name==='songs')renderSongs();
}

/* ================= misc ================= */
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('button,.pkey,.songrow'))e.preventDefault();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&playing)stopPlayback();
});

/* ================= init ================= */
restore();
buildPiano();
drawScore();
renderSongs();
applySettingsUI();
tempoBtn.textContent='♩='+tempo;
workTitle.textContent='♪ '+curTitle;
switchTab('compose');
requestAnimationFrame(centerOnC4);
</script>
</body>
</html>
