<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Device PWA Previewer</title>
    <style>
        :root {
            --bg-color: #121212;
            --sidebar-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #0a84ff;
            --border-color: #333;
            --hover-bg: #2a2a2a;
            --active-bg: #0a84ff33;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .device-selector {
            width: 100%;
            padding: 8px 12px;
            background: #2c2c2e;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .project-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .project-controls h3 {
            font-size: 14px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-add {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-add:hover { opacity: 0.8; }

        .project-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 8px;
        }

        .project-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s;
            position: relative;
        }

        .project-item:hover { background: var(--hover-bg); }
        .project-item.active { background: var(--active-bg); border-left: 3px solid var(--accent-color); }

        .project-name {
            flex: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .project-actions {
            display: none;
            gap: 8px;
        }
        .project-item:hover .project-actions { display: flex; }

        .icon-btn {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .icon-btn:hover { color: #fff; background: #444; }
        .icon-btn.delete:hover { color: #ff453a; }

        /* Main Preview Area */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .device-frame {
            position: relative;
            background: #1a1a1a;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, width 0.3s ease, height 0.3s ease;
            transform-origin: center center;
        }

        .device-screen {
            width: 100%;
            height: 100%;
            background: #fff;
            overflow: hidden;
            position: relative;
        }

        /* iPhone 17 Pro Specifics */
        .device-frame.iphone17 {
            width: 393px;
            height: 852px;
            border-radius: 55px;
            border: 10px solid #2c2c2e;
            background: #000;
        }
        .device-frame.iphone17::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }
        .device-frame.iphone17 .device-screen {
            border-radius: 45px;
        }

        /* iPad 7th Gen Landscape Specifics */
        .device-frame.ipad7 {
            width: 1024px;
            height: 768px;
            border-radius: 24px;
            border: 18px solid #d1d1d6; /* Silver */
            background: #000;
        }
        .device-frame.ipad7::before {
            content: "";
            position: absolute;
            top: 9px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
            z-index: 10;
        }
        .device-frame.ipad7 .device-screen {
            border-radius: 6px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Modal Editor */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #2c2c2e;
            width: 90%;
            max-width: 800px;
            height: 80vh;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .modal-header input {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
        }

        .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
        }

        .modal-body textarea {
            flex: 1;
            background: #1c1c1e;
            color: #f8f8f2;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            font-family: "SF Mono", Monaco, Consolas, monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }
        .modal-body textarea:focus {
            border-color: var(--accent-color);
        }

        .modal-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background: var(--accent-color); color: white; }
        .btn-secondary { background: #444; color: white; }
        .btn:hover { opacity: 0.9; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <select id="deviceSelect" class="device-selector">
                <option value="iphone17">iPhone 17 Pro (縦)</option>
                <option value="ipad7">iPad 第7世代 (横固定)</option>
            </select>
        </div>
        <div class="project-controls">
            <h3>プロジェクト</h3>
            <button class="btn-add" id="btnAdd">+ 新規</button>
        </div>
        <ul class="project-list" id="projectList"></ul>
    </aside>

    <!-- Main Preview -->
    <main class="preview-area" id="previewArea">
        <div class="device-frame iphone17" id="deviceFrame">
            <div class="device-screen">
                <iframe id="previewIframe" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
            </div>
        </div>
    </main>

    <!-- Editor Modal -->
    <div class="modal-overlay" id="editorModal">
        <div class="modal-content">
            <div class="modal-header">
                <input type="text" id="inputProjectName" placeholder="プロジェクト名を入力">
                <button class="icon-btn" id="btnCloseModal">✕</button>
            </div>
            <div class="modal-body">
                <textarea id="inputCode" placeholder="HTML, CSS, JavaScriptをそのまま貼り付けてください..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCancel">キャンセル</button>
                <button class="btn btn-primary" id="btnSave">保存してプレビュー</button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const STORAGE_KEY = 'pwa_previewer_projects_v2';
        let projects = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let activeProjectId = null;
        let editingProjectId = null;

        const defaultHTML = `<!DOCTYPE html>
<html>
<head>
<style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: linear-gradient(135deg, #0a84ff, #5e5ce6); color: white; }
    h1 { font-size: 2rem; text-align: center; }
</style>
</head>
<body>
    <h1>ようこそ！<br>新しいプロジェクトを作成してください</h1>
</body>
</html>`;

        if (projects.length === 0) {
            projects.push({ id: Date.now().toString(), name: 'デフォルト', code: defaultHTML });
            saveProjects();
        }

        // --- DOM Elements ---
        const deviceSelect = document.getElementById('deviceSelect');
        const deviceFrame = document.getElementById('deviceFrame');
        const previewArea = document.getElementById('previewArea');
        const previewIframe = document.getElementById('previewIframe');
        const projectList = document.getElementById('projectList');
        const btnAdd = document.getElementById('btnAdd');
        
        const editorModal = document.getElementById('editorModal');
        const inputProjectName = document.getElementById('inputProjectName');
        const inputCode = document.getElementById('inputCode');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const btnCancel = document.getElementById('btnCancel');
        const btnSave = document.getElementById('btnSave');

        // --- Device Configuration ---
        const devices = {
            iphone17: { width: 393, height: 852, class: 'iphone17' },
            ipad7: { width: 1024, height: 768, class: 'ipad7' }
        };

        // --- Core Functions ---
        function saveProjects() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
        }

        function renderList() {
            projectList.innerHTML = '';
            projects.forEach(p => {
                const li = document.createElement('li');
                li.className = `project-item ${p.id === activeProjectId ? 'active' : ''}`;
                li.innerHTML = `
                    <span class="project-name">${escapeHTML(p.name)}</span>
                    <div class="project-actions">
                        <button class="icon-btn edit-btn" data-id="${p.id}" title="編集">✎</button>
                        <button class="icon-btn delete-btn" data-id="${p.id}" title="削除">🗑</button>
                    </div>
                `;
                
                // Click to preview
                li.addEventListener('click', (e) => {
                    if (e.target.closest('.icon-btn')) return;
                    setActiveProject(p.id);
                });

                projectList.appendChild(li);
            });

            // Bind action buttons
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditor(btn.dataset.id);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteProject(btn.dataset.id);
                });
            });
        }

        function setActiveProject(id) {
            activeProjectId = id;
            const project = projects.find(p => p.id === id);
            if (project) {
                // Use srcdoc for instant, sandboxed rendering without blob URLs
                previewIframe.srcdoc = project.code;
            }
            renderList();
        }

        function openEditor(id = null) {
            editingProjectId = id;
            if (id) {
                const p = projects.find(proj => proj.id === id);
                inputProjectName.value = p.name;
                inputCode.value = p.code;
            } else {
                inputProjectName.value = '';
                inputCode.value = '';
            }
            editorModal.classList.add('active');
            setTimeout(() => inputProjectName.focus(), 100);
        }

        function closeEditor() {
            editorModal.classList.remove('active');
            editingProjectId = null;
        }

        function saveProject() {
            const name = inputProjectName.value.trim() || '無題のプロジェクト';
            const code = inputCode.value;

            if (editingProjectId) {
                const p = projects.find(proj => proj.id === editingProjectId);
                p.name = name;
                p.code = code;
                activeProjectId = editingProjectId;
            } else {
                const newProject = { id: Date.now().toString(), name, code };
                projects.unshift(newProject);
                activeProjectId = newProject.id;
            }

            saveProjects();
            renderList();
            setActiveProject(activeProjectId);
            closeEditor();
        }

        function deleteProject(id) {
            if (!confirm('このプロジェクトを削除しますか？')) return;
            projects = projects.filter(p => p.id !== id);
            saveProjects();
            
            if (activeProjectId === id) {
                activeProjectId = projects.length > 0 ? projects[0].id : null;
                if (activeProjectId) {
                    setActiveProject(activeProjectId);
                } else {
                    previewIframe.srcdoc = '';
                }
            }
            renderList();
        }

        function updateDeviceFrame() {
            const deviceKey = deviceSelect.value;
            const device = devices[deviceKey];
            
            // Remove old classes, add new
            deviceFrame.className = `device-frame ${device.class}`;
            
            // Calculate scale to fit preview area
            const areaW = previewArea.clientWidth;
            const areaH = previewArea.clientHeight;
            const scale = Math.min((areaW - 60) / device.width, (areaH - 60) / device.height);
            
            deviceFrame.style.transform = `scale(${scale})`;
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // --- Event Listeners ---
        btnAdd.addEventListener('click', () => openEditor());
        btnCloseModal.addEventListener('click', closeEditor);
        btnCancel.addEventListener('click', closeEditor);
        btnSave.addEventListener('click', saveProject);
        
        deviceSelect.addEventListener('change', updateDeviceFrame);
        window.addEventListener('resize', updateDeviceFrame);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && editorModal.classList.contains('active')) {
                closeEditor();
            }
            if (e.ctrlKey && e.key === 's' && editorModal.classList.contains('active')) {
                e.preventDefault();
                saveProject();
            }
        });

        // --- Initialization ---
        renderList();
        if (projects.length > 0) {
            setActiveProject(projects[0].id);
        }
        updateDeviceFrame();

    </script>
</body>
</html>
